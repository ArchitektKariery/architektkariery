name: Patch QRyby Life Dragon

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch-life-dragon.py'
      - 'tools/smok_zycia_sprite.b64'
      - '.github/workflows/patch-life-dragon.yml'

concurrency:
  group: qryby-life-dragon-patch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate Life Dragon
        run: python tools/patch-life-dragon.py
      - name: Commit production HTML
        run: |
          git config user.name "QRyby Builder"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add Smok Życia legendary event to QRyby [skip ci]"
          git push
