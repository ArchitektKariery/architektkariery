name: QRyby one-shot paper toast redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qryby-paper-toast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace all transient messages with compact paper notes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("qryby.html")
          s = p.read_text(encoding="utf-8")

          pattern = re.compile(
              r"#toast\{position:absolute;z-index:8;left:50%;.*?"
              r"#toast\.zielony\{border-color:#2F6B44;color:#1E4A2E;\s*"
              r"box-shadow:0 6px 0 -3px rgba\(47,107,68,\.45\),0 16px 34px rgba\(0,0,0,\.45\)\}",
              re.S
          )

          replacement = """#toast{position:absolute;z-index:8;left:50%;
  top:calc(112px + env(safe-area-inset-top));
  transform:translate(-50%,-8px) rotate(-.6deg);
  width:max-content;max-width:min(64vw,220px);
  padding:10px 12px 8px;border-radius:2px;pointer-events:none;
  box-sizing:border-box;text-align:center;white-space:normal;
  background:linear-gradient(180deg,rgba(247,239,214,.98),rgba(223,209,170,.98));
  border:1px solid rgba(104,74,40,.82);color:#3B2D1D;
  box-shadow:0 2px 0 rgba(53,36,20,.28),0 8px 18px rgba(0,0,0,.32),
             inset 0 1px 0 rgba(255,255,255,.50);
  font:inherit;font-size:8.5px;line-height:1.3;letter-spacing:.12em;font-weight:800;
  opacity:0;
  transition:opacity .18s var(--wyj),transform .30s var(--spr)}
#toast::before{content:'';position:absolute;left:50%;top:3px;
  width:4px;height:4px;margin-left:-2px;border-radius:50%;
  background:#765631;opacity:.72;
  box-shadow:0 1px 1px rgba(0,0,0,.30)}
#toast.on{transform:translate(-50%,0) rotate(-.6deg);opacity:1}
#toast.zielony{border-color:rgba(104,74,40,.82);color:#3B2D1D;
  box-shadow:0 2px 0 rgba(53,36,20,.28),0 8px 18px rgba(0,0,0,.32),
             inset 0 1px 0 rgba(255,255,255,.50)}
@keyframes toast-note-pop{
  0%{transform:translate(-50%,-8px) scale(.84) rotate(-2deg)}
  62%{transform:translate(-50%,1px) scale(1.025) rotate(.3deg)}
  100%{transform:translate(-50%,0) scale(1) rotate(-.6deg)}
}
#toast.rozkwita{animation:toast-note-pop .38s var(--spr)}"""

          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f"Expected one toast style block, replaced {n}")

          old_timeout = "toastT = setTimeout(() => toast.classList.remove('on'), 10400);"
          new_timeout = "toastT = setTimeout(() => toast.classList.remove('on'), 3000);"
          if s2.count(old_timeout) != 1:
              raise SystemExit(f"Expected one toast timeout, found {s2.count(old_timeout)}")
          s2 = s2.replace(old_timeout, new_timeout)

          p.write_text(s2, encoding="utf-8")

      - name: Commit redesign
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qryby.html
          git diff --cached --quiet && exit 0
          git commit -m "QRyby: replace transient banners with compact paper notes"
          git push origin HEAD:main
