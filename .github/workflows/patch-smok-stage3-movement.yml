name: Patch QRyby Smok Zycia Stage 3 Movement

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch-smok-stage3-movement.py'
      - '.github/workflows/patch-smok-stage3-movement.yml'

concurrency:
  group: qryby-smok-stage3-movement
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate movement-only patch
        run: python tools/patch-smok-stage3-movement.py
      - name: Commit production HTML
        run: |
          git config user.name "QRyby Builder"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "QRyby: Smok Życia stage 3 movement [skip ci]"
          git push
