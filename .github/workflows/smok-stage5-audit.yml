name: Audit QRyby Smok Zycia Stage 5 Fight

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'qryby.html'
      - 'src/**'
      - 'css/**'
      - 'assets/sprites/**'
      - 'tools/qryby_source.py'
      - 'tools/smok-stage5-audit.py'
      - '.github/workflows/smok-stage5-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run stage 5 audit
        run: python tools/smok-stage5-audit.py || true
      - name: Commit audit report
        run: |
          bash tools/ci_commit_reports.sh "QRyby: record Smok Życia stage 5 fight audit [skip ci]" tests/smok-stage5-audit.json
      - name: Require passing audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("tests/smok-stage5-audit.json").read_text(encoding="utf-8"))
          assert r["pass"], r["checks"]
          print("SMOK_STAGE5_FIGHT_AUDIT_OK", r["perf_model"])
          PY
