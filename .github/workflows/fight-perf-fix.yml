name: Fight performance fix
on:
  push:
    branches: [main]
    paths: ['tools/fight_perf_patch.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/fight_perf_patch.py
      - name: Validate
        run: |
          git diff --check
          grep -F "PERFORMANCE — HOL RYBY" qryby.html
          grep -F "rybBuf.__holFrame" qryby.html
          grep -F "2026-09-26-fight-perf-v1" qryby.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('qryby.html').read_text(encoding='utf-8')
          assert s.count('rybBuf.__holFrame') >= 2
          assert 'holStride = fpsNow < 45 ? 3 : 2' in s
          assert s.rstrip().endswith('</html>')
          print('fight perf validation OK')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- qryby.html; then exit 0; fi
          git config user.name "qryby-fight-perf"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html
          git commit -m "QRyby: cache hooked-fish render during fight [skip ci]"
          git push origin HEAD:main
