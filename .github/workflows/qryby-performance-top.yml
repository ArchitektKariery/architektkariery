name: QRyby performance top
on:
  push:
    branches: [main]
    paths: ['tools/qryby_performance_top.py']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/qryby_performance_top.py
      - run: |
          git config user.name "qryby-perf-audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/qryby-performance-top.txt
          git commit -m "Summarize QRyby performance hotspots [skip ci]"
          git push origin HEAD:main
