name: Patch QRyby Smok Zycia Motion V3

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch-life-dragon-motion-v3.py'
      - '.github/workflows/patch-life-dragon-motion-v3.yml'

concurrency:
  group: qryby-smok-zycia-motion-v3
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and test Smok motion v3
        run: python tools/patch-life-dragon-motion-v3.py
      - name: Commit production HTML
        run: |
          git config user.name "QRyby Builder"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "QRyby: polish Smok Zycia movement and departure [skip ci]"
          git push
