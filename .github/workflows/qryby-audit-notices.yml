name: QRyby audit notice styles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qryby-audit-notices.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit green-white notice messages
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("qryby.html")
          s = p.read_text(encoding="utf-8", errors="replace")

          needles = [
              "ZADANIE WYKONANE",
              "TARŁO W WIADERKU",
              "TARLO W WIADERKU",
              "tarło w wiaderku",
              "tarlo w wiaderku",
              "zadanie wykonane",
          ]

          blocks = []
          for needle in needles:
              start = 0
              while True:
                  i = s.lower().find(needle.lower(), start)
                  if i < 0:
                      break
                  a = max(0, i - 1200)
                  b = min(len(s), i + 1200)
                  blocks.append(f"\n===== MATCH: {needle} @ {i} =====\n" + s[a:b])
                  start = i + 1

          # Also capture likely CSS/JS around notification-ish identifiers
          pattern = re.compile(r'(?i)(toast|notice|notif|message|alert|task|quest|spawn|tar[lł]|status)')
          for m in list(pattern.finditer(s))[:250]:
              a = max(0, m.start() - 350)
              b = min(len(s), m.start() + 550)
              frag = s[a:b]
              if any(x in frag.lower() for x in ["background", "border", "class=", "style", "textcontent", "innerhtml", "appendchild"]):
                  blocks.append(f"\n===== CONTEXT: {m.group(0)} @ {m.start()} =====\n" + frag)

          # Deduplicate chunks while preserving order
          seen = set()
          out = []
          for block in blocks:
              key = block[:500]
              if key not in seen:
                  seen.add(key)
                  out.append(block)

          report = "\n".join(out[:120])
          Path("qryby_notice_audit.txt").write_text(report or "NO MATCHES", encoding="utf-8")

      - name: Commit audit report
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qryby_notice_audit.txt
          git diff --cached --quiet && exit 0
          git commit -m "Audit QRyby notice styles"
          git push origin HEAD:main
