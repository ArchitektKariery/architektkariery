name: Hotfix QRyby Life Dragon Eko

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/hotfix-life-dragon-eko.py'
      - '.github/workflows/hotfix-life-dragon-eko.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hide Life Dragon from Eko UI
        run: python tools/hotfix-life-dragon-eko.py
      - name: Commit production HTML
        run: |
          git config user.name "QRyby Builder"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Hide Smok Życia from Eko UI [skip ci]"
          git push
