name: QRyby Smok Zycia Stage 6 Final Regression

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'qryby.html'
      - 'src/**'
      - 'css/**'
      - 'assets/sprites/**'
      - 'tools/qryby_source.py'
      - 'tests/test_smok_stage4_bite.py'
      - 'tools/smok-stage5-audit.py'
      - 'tools/smok-stage6-final-regression.py'
      - '.github/workflows/smok-stage6-final.yml'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage 4 - exact 50 percent bite
        run: python tests/test_smok_stage4_bite.py

      - name: Stage 5 - hook line bobber fight performance
        run: python tools/smok-stage5-audit.py

      - name: Stage 6 - full final regression
        run: python tools/smok-stage6-final-regression.py

      - name: Commit final regression report
        run: |
          bash tools/ci_commit_reports.sh "QRyby: Smok Życia final regression pass [skip ci]" tests/smok-stage5-audit.json tests/smok-stage6-final.json
