name: Patch QRyby Smok Zycia Rework V2

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch-life-dragon-rework-v2.py'
      - '.github/workflows/patch-life-dragon-rework-v2.yml'

concurrency:
  group: qryby-smok-zycia-rework-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate Smok Zycia rework
        run: python tools/patch-life-dragon-rework-v2.py
      - name: Commit production HTML
        run: |
          git config user.name "QRyby Builder"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "QRyby: rework Smok Zycia sprite movement and 50pct bite [skip ci]"
          git push
