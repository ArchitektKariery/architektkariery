name: Lucjan LIVE cache-buster
on:
  push:
    branches: [main]
    paths: ['tools/lucjan_live_cache_patch.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/lucjan_live_cache_patch.py
      - run: |
          git diff --check
          grep -F 'community-restoration-live.js?v=20260926-live2' qryby.html
      - run: |
          if git diff --quiet -- qryby.html; then exit 0; fi
          git config user.name "qryby-live-fix"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html
          git commit -m "QRyby: bust Lucjan LIVE client cache [skip ci]"
          git push origin HEAD:main
