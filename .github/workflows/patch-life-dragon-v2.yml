name: Patch QRyby Life Dragon v2

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch-life-dragon-v2.py'
      - 'tools/smok_zycia_rework_v2.b64'
      - '.github/workflows/patch-life-dragon-v2.yml'

concurrency:
  group: qryby-life-dragon-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate Life Dragon rework v2
        run: python tools/patch-life-dragon-v2.py
      - name: Commit production HTML
        run: |
          git config user.name "QRyby Builder"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "QRyby: rework Smok Życia sprite, movement and 50% bite [skip ci]"
          git push
