name: Lucjan performance cache
on:
  push:
    branches: [main]
    paths: ['tools/lucjan_perf_cache.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/lucjan_perf_cache.py
      - run: |
          node --check src/lucjanek/community-restoration-live.js
          git diff --check
          grep -F 'community-restoration-live.js?v=20260926-live5' qryby.html
      - run: |
          if git diff --quiet -- qryby.html; then exit 0; fi
          git config user.name "qryby-perf"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html
          git commit -m "QRyby: load Lucjan performance fix [skip ci]"
          git push origin HEAD:main
