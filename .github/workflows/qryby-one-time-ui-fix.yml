name: One-time QRyby HUD fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qryby-one-time-ui-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only requested QRyby HUD values
        shell: python
        run: |
          from pathlib import Path

          p = Path("qryby.html")
          s = p.read_text(encoding="utf-8")

          replacements = [
              ("width:118px;height:118px;opacity:.78;box-shadow:",
               "width:118px;height:118px;opacity:.68;box-shadow:"),
              ("#reset:hover,#reset:focus-visible{opacity:.92}",
               "#reset:hover,#reset:focus-visible{opacity:.86}"),
              ("#tarla{top:calc(82px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:auto;width:80px;",
               "#tarla{top:calc(90px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:auto;width:80px;"),
              ("body.z-paskiem #tarla{top:calc(109px + env(safe-area-inset-top))}",
               "body.z-paskiem #tarla{top:calc(117px + env(safe-area-inset-top))}"),
              ("body.bez-konta #tarla{top:calc(110px + env(safe-area-inset-top))}",
               "body.bez-konta #tarla{top:calc(118px + env(safe-area-inset-top))}"),
              ("body.bez-konta.z-paskiem #tarla{top:calc(137px + env(safe-area-inset-top))}",
               "body.bez-konta.z-paskiem #tarla{top:calc(145px + env(safe-area-inset-top))}"),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"ABORT: expected exactly 1 match, got {count}: {old[:90]}")
              s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")

      - name: Commit HTML and remove this one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/qryby-one-time-ui-fix.yml
          git config user.name "QRyby Builder"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html .github/workflows/qryby-one-time-ui-fix.yml
          git commit -m "Adjust QRyby spawning panel and shoal transparency [skip ci]"
          git push origin HEAD:main
