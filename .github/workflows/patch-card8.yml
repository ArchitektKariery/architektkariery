name: Patch QRyby Pasmo 8

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch-card8.py'
      - 'tools/card8.part*'
      - '.github/workflows/patch-card8.yml'

concurrency:
  group: qryby-pasmo8-patch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate Pasmo 8
        run: python tools/patch-card8.py
      - name: Commit production HTML
        run: |
          git config user.name "QRyby Builder"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add Pasmo 8 Smok Życia card to QRyby [skip ci]"
          git push
