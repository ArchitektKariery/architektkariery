name: Lucjanek Stage 7 audit

on:
  push:
    branches: [main]
    paths:
      - 'tools/lucjanek_stage7_audit.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/lucjanek_stage7_audit.py
      - run: |
          git config user.name "qryby-audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/lucjanek-stage7-audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit Lucjanek Stage 7 EKO hooks [skip ci]"
          git push origin HEAD:main
