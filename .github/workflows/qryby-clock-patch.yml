name: QRyby one-shot clock patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qryby-clock-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move and scale lake clock
        shell: python
        run: |
          from pathlib import Path
          p = Path("qryby.html")
          s = p.read_text(encoding="utf-8")

          old = "#lakeClock{left:50%;top:calc(50px + env(safe-area-inset-top));min-width:96px;padding:6px 10px 5px;border-radius:11px}"
          new = "#lakeClock{left:auto;right:calc(12px + env(safe-area-inset-right));top:auto;bottom:calc(88px + env(safe-area-inset-bottom));min-width:96px;padding:6px 10px 5px;border-radius:11px;transform:scale(.5);transform-origin:bottom right}"

          if s.count(old) != 1:
              raise SystemExit(f"Expected exactly one lakeClock rule, found {s.count(old)}")

          s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")

      - name: Commit patch
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qryby.html
          git diff --cached --quiet && exit 0
          git commit -m "QRyby: move clock bottom-right and scale to 50 percent"
          git push origin HEAD:main
