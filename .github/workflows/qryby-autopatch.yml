name: QRyby autopatch

on:
  push:
    branches: [main]
    paths:
      - 'tools/qryby_patch.py'

permissions:
  contents: write

concurrency:
  group: qryby-autopatch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 tools/qryby_patch.py

      - name: Validate diff
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('qryby.html').read_text(encoding='utf-8')
          required=[
            "ODNOWA GATUNKOW — etap 2",
            "assets/lucjanek/lucjanek-128.png",
            "odn-milestones",
            "WPŁATY JESZCZE WYŁĄCZONE",
            "2026-09-26-lucjanek-stage2-v1"
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("Missing stage-2 markers: "+", ".join(missing))
          asset=Path('assets/lucjanek/lucjanek-128.png')
          if not asset.exists() or asset.stat().st_size < 1000:
              raise SystemExit('Lucjanek asset missing or invalid')
          if not Path('docs/lucjanek-community-event.md').exists():
              raise SystemExit('Stage status doc missing')
          if not s.rstrip().endswith('</html>'):
              raise SystemExit('qryby.html lost closing </html>')
          print('Stage 2 validation OK')
          PY

      - name: Commit patched game
        run: |
          if git diff --quiet -- qryby.html assets/lucjanek/lucjanek-128.png docs/lucjanek-community-event.md; then
            echo "No Stage 2 game change needed."
            exit 0
          fi
          git config user.name "qryby-autopatch"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html assets/lucjanek/lucjanek-128.png docs/lucjanek-community-event.md
          git commit -m "QRyby: etap 2 odnowy Lucjanka — grafiki i animacje [skip ci]"
          git push origin HEAD:main
