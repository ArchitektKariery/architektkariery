name: Cleanup QRyby onboarding patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-qryby-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep only the onboarding change
        run: |
          set -euo pipefail
          BASE=6fa6eccabfb15833bfc720e857aeab7130ff3bde

          # Restore the two shell files exactly as they were before this task.
          git show "$BASE:qryby.html" > qryby.html
          git show "$BASE:qryby/index.html" > qryby/index.html

          # Restore unrelated build metadata; keep the Onboarding logic itself.
          python - <<'PY'
          from pathlib import Path
          p = Path("qryby-game.html")
          s = p.read_text(encoding="utf-8")
          old = "window.QRYBY_BUILD = '2026-09-21-stage15.8-onboarding-guests-only';"
          new = "window.QRYBY_BUILD = '2026-09-20-stage15.7-clock-persistent-ui';"
          if old not in s:
              raise SystemExit("Expected build marker not found")
          s = s.replace(old, new, 1)

          required = [
              "function maKonto()",
              "Chmura.zalogowany && Chmura.zalogowany()",
              "if (!FORCE && maKonto())",
              "aktywny: () => (FORCE || !maKonto()) && step >= 0 && step !== 99",
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit("Missing onboarding guard: " + needle)

          p.write_text(s, encoding="utf-8")
          PY

          # The temporary workflow must not remain in the product repo.
          rm -f .github/workflows/patch-qryby-onboarding.yml

      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          html = Path("qryby-game.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          for i, code in enumerate(scripts, 1):
              q = Path("/tmp") / f"qryby_{i}.js"
              q.write_text(code, encoding="utf-8")
              r = subprocess.run(["node", "--check", str(q)], capture_output=True, text=True)
              if r.returncode:
                  raise SystemExit(f"JS syntax failed in script {i}:\n{r.stderr}")
          print(f"{len(scripts)}/{len(scripts)} inline scripts PASS")
          PY

      - name: Verify scope and commit
        run: |
          set -euo pipefail
          git config user.name "QRyby Builder"
          git config user.email "actions@users.noreply.github.com"

          echo "Final diff versus pre-task baseline:"
          git diff 6fa6eccabfb15833bfc720e857aeab7130ff3bde -- qryby-game.html qryby.html qryby/index.html .github/workflows/patch-qryby-onboarding.yml

          git add -A
          git commit -m "Isolate tutorial visibility change"
          git push
