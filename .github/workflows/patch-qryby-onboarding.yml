name: Patch QRyby onboarding

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-qryby-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make onboarding logged-out only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("qryby-game.html")
          s = p.read_text(encoding="utf-8")
          old = "    if (!FORCE && !mozeLowic()) return false;"
          new = """    /* Samouczek tylko dla niezalogowanych.
               Zalogowane, potwierdzone konto pomija onboarding niezaleznie od localStorage.
               ?onboarding=1 nadal wymusza tryb testowy. */
            if (!FORCE && mozeLowic()) {
              booted = true;
              step = 99;
              hide(guide); hide(karta); clearTarget();
              return true;
            }"""
          if old not in s:
              raise SystemExit("Onboarding gate line not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "QRyby Builder"
          git config user.email "actions@users.noreply.github.com"
          git add qryby-game.html
          git commit -m "Show tutorial only to logged-out players"
          git push
