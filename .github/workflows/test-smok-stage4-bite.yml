name: Test QRyby Smok Zycia Stage 4 Bite

on:
  push:
    branches: [ main ]
    paths:
      - 'qryby.html'
      - 'tests/test_smok_stage4_bite.py'
      - '.github/workflows/test-smok-stage4-bite.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Smok Zycia 50 percent bite regression
        run: python tests/test_smok_stage4_bite.py
      - name: Record passing commit
        run: |
          printf "SMOK_STAGE4_BITE_OK\ntested_commit=%s\n" "$GITHUB_SHA" > tests/.smok-stage4-last-pass
          git config user.name "QRyby Builder"
          git config user.email "actions@users.noreply.github.com"
          git add tests/.smok-stage4-last-pass
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "QRyby: Smok Życia stage 4 bite tests pass [skip ci]"
          git push
