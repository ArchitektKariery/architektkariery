name: Lucjanek Stage 7 patch

on:
  push:
    branches: [main]
    paths:
      - 'tools/lucjanek_stage7_patch.py'

permissions:
  contents: write

concurrency:
  group: lucjanek-stage7-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded Stage 7 patch
        run: python3 tools/lucjanek_stage7_patch.py
      - name: Validate
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('qryby.html').read_text(encoding='utf-8')
          req=[
            'LUCJAN CZERWONY — community restoration Stage 7',
            'GATUNKI.lucjan_czerwony',
            'KLASA.lucjan_czerwony = 4',
            'if (G2.odnowa) return 0',
            'QRYBY_COMMUNITY_EKO.pokolenia()',
            '2026-09-26-lucjanek-stage7-v1'
          ]
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Missing: '+', '.join(miss))
          if not s.rstrip().endswith('</html>'): raise SystemExit('HTML closing tag missing')
          print('Stage 7 validation OK')
          PY
      - name: Commit game
        run: |
          if git diff --quiet -- qryby.html; then exit 0; fi
          git config user.name "qryby-stage7"
          git config user.email "actions@users.noreply.github.com"
          git add qryby.html
          git commit -m "QRyby: etap 7 Lucjan czerwony w EKO [skip ci]"
          git push origin HEAD:main
