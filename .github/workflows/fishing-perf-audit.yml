name: Fishing performance audit
on:
  push:
    branches: [main]
    paths: ['tools/fishing_perf_audit.py']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/fishing_perf_audit.py
      - run: |
          git config user.name "qryby-perf-audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/fishing-perf-audit-current.txt docs/fishing-perf-audit-pre-lucjan.txt
          git commit -m "Audit fishing performance [skip ci]"
          git push origin HEAD:main
