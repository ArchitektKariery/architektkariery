name: Diagnose Smok Zycia Render

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'qryby.html'
      - 'src/**'
      - 'css/**'
      - 'assets/sprites/**'
      - 'tools/qryby_source.py'
      - 'tools/smok-render-diag.py'
      - 'tools/smok-render-diag-run.js'
      - '.github/workflows/smok-render-diag.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build diagnostic page
        run: python tools/smok-render-diag.py
      - name: Run headless Chrome
        run: |
          python3 -m http.server 8765 >/tmp/smok-http.log 2>&1 &
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "chrome=$CHROME"
          # Prawdziwy czas zamiast --virtual-time-budget: wirtualny czas kazal
          # przeliczyc kazda klatke gry i na wolnym runnerze job trwal od 80 s
          # do ponad 5 minut. Opis w tools/smok-render-diag-run.js.
          npm install --prefix /tmp/pw --no-audit --no-fund --silent playwright-core@1.56.0
          CHROME="$CHROME" NODE_PATH=/tmp/pw/node_modules timeout 300 \
            node tools/smok-render-diag-run.js http://127.0.0.1:8765/tests/smok-render-diag.html > /tmp/smok-dom.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/smok-dom.txt').read_text(encoding='utf-8',errors='replace')
          m=re.search(r'<pre id="smok-render-diag">(.*?)</pre>',s,re.S)
          if not m:
              print(s[-5000:])
              raise SystemExit("SMOK_DIAG_RESULT_NOT_FOUND")
          import json
          data=json.loads(m.group(1))
          print("SMOK_DIAG_RESULT="+json.dumps(data,ensure_ascii=False))
          assert data.get("fishAtlasReady") is True, data
          assert data.get("schoolLength")==1, data
          assert data.get("gat")=="smok_zycia", data
          assert data.get("imgComplete") is True, data
          assert data.get("naturalWidth")==192 and data.get("naturalHeight")==62, data
          assert data.get("zepsuty") is False, data
          assert data.get("kontur") is True, data
          assert data.get("directDrawAlphaPixels",0) > 500, data
          assert data.get("schoolDrawAlphaPixels",0) > 500, data
          print("SMOK_BROWSER_RENDER_OK")
          PY
