name: QRyby runtime perf map
on:
  push:
    branches: [main]
    paths: ['tools/qryby_runtime_perf.py']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/qryby_runtime_perf.py
      - run: |
          git config user.name "qryby-perf-audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/qryby-performance-runtime.json
          git commit -m "Map QRyby runtime performance calls [skip ci]"
          git push origin HEAD:main
