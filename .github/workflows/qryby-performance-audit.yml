name: QRyby performance audit
on:
  push:
    branches: [main]
    paths: ['tools/qryby_performance_audit.py']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/qryby_performance_audit.py
      - run: |
          git config user.name "qryby-perf-audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/qryby-performance-audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit QRyby performance hotspots [skip ci]"
          git push origin HEAD:main
