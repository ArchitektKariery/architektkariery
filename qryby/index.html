<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#231838">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>QRyby</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B0714}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0B0714}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#E8C765;background:#0B0714;font:800 12px/1.4 ui-monospace,monospace;letter-spacing:.18em;z-index:2}
body.ready #loading{display:none}
</style>
</head>
<body>
<div id="loading">QRyby · ŁADOWANIE</div>
<iframe id="game" src="/qryby.html" title="QRyby" allow="fullscreen; autoplay" referrerpolicy="same-origin"></iframe>
<script>
const game=document.getElementById('game');
game.addEventListener('load',()=>document.body.classList.add('ready'));
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
}
</script>
</body>
</html>
