plugins {
    id 'com.android.application'
}

android {
    namespace 'com.architektkariery.qryby'
    compileSdk 35

    defaultConfig {
        applicationId 'com.architektkariery.qryby'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-beta'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register('syncGame', Copy) {
    from("${rootDir}/../qryby.html")
    into("src/main/assets")
    rename { 'index.html' }
}

preBuild.dependsOn syncGame
