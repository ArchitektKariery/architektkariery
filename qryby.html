<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#231838">
<title>QRyby</title>
<link rel="icon" type="image/png" sizes="192x192" href="/qryby-icon-192.png">
<link rel="apple-touch-icon" href="/qryby-icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B0714}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0B0714}
#loading{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:#0B0714;color:#E8C765;font:800 12px/1.4 ui-monospace,monospace;letter-spacing:.18em}
body.ready #loading{display:none}
#downloadApp{
  position:fixed;z-index:50;right:calc(10px + env(safe-area-inset-right));
  bottom:calc(10px + env(safe-area-inset-bottom));height:44px;padding:0 16px;
  display:flex;align-items:center;justify-content:center;text-decoration:none;
  border-radius:24px;border:1px solid rgba(232,199,101,.82);
  background:rgba(23,16,42,.97);color:#F3D985;
  font:900 10px/1 ui-monospace,monospace;letter-spacing:.08em;
  box-shadow:0 6px 22px rgba(0,0,0,.42);backdrop-filter:blur(4px)
}
#downloadApp small{margin-left:7px;opacity:.65;font-size:7px;letter-spacing:.05em}
</style>
</head>
<body>
<div id="loading">QRyby · ŁADOWANIE</div>
<iframe id="game" src="/qryby-game.html" title="QRyby" allow="fullscreen; autoplay" referrerpolicy="same-origin"></iframe>
<a id="downloadApp" href="/downloads/QRyby.apk" download="QRyby.apk">⬇ POBIERZ QRyby <small>ANDROID APK</small></a>
<script>
const game=document.getElementById('game');
game.addEventListener('load',()=>document.body.classList.add('ready'));

/* PWA było etapem przejściowym. Czyścimy stary service worker/cache,
   żeby przeglądarka nie przywracała poprzedniego instalatora. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(list=>{
    list.forEach(r=>{ try{ if((r.scope||'').includes('/qryby')) r.unregister(); }catch(_){} });
  }).catch(()=>{});
}
if('caches' in window){
  caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('qryby-pwa-')).map(k=>caches.delete(k)))).catch(()=>{});
}
</script>
</body>
</html>
