<!-- ============================================================
     USTAWIENIA SERWERA. To jedyne miejsce w calym pliku, ktore
     wypelnia sie recznie, i robi to WYLACZNIE autor gry, jeden raz.

     Gracze nie wpisuja tu niczego i nie musza wiedziec, ze to istnieje.
     Dostaja gotowy plik, klikaja ZALOZ KONTO i to cala ich robota.

     Skad wziac te dwie wartosci: qryby-serwer-instrukcja.md, czesc 4.
     Klucz anon jest jawny z zalozenia, dostepu pilnuja reguly w bazie.
     Klucza service_role NIE WOLNO tu wkleic, on omija wszystkie reguly.

     Puste wartosci znacza "gra bez serwera": wszystko dziala jak dotad,
     tylko konta i turnieje sa wylaczone.
     ============================================================ -->
