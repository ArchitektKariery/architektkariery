window.RaptorLove = RaptorLove;

/* ============================================================
   CHMURA. Konto, logowanie i kopia zapisu na serwerze.

   ZASADA NADRZEDNA: DLA ZALOGOWANEGO KONTA SERWER JEST ZRODLEM PRAWDY.
   Lokalny zapis jest cachem i pozwala grac bez sieci, ale po odzyskaniu
   polaczenia nie moze nadpisac stanu serwera, dopoki klient nie pobierze
   aktualnego zapisu konta. Bez konta gra nadal dziala lokalnie.

   Bez SDK. Supabase to zwykle HTTP, wiec cztery adresy i fetch wystarcza.
   Doklejanie biblioteki z CDN zlamaloby najwazniejsza wlasnosc tego pliku:
   ze jest jeden i dziala z dysku telefonu.

   TRZY DROGI DO KONTA:
     1. anonimowe   jeden przycisk, konto bez maila, dziala od razu
     2. dopiecie    do konta anonimowego dokladasz mail i haslo
     3. logowanie   mailem na drugim telefonie, zapis sciaga sie z serwera

   KLUCZ ANONIMOWY JEST JAWNY z zalozenia. Bezpieczenstwa pilnuje RLS
   po stronie bazy: kazdy wiersz widzi i zmienia wylacznie jego wlasciciel.
   Schemat i polityki leza w pliku qryby-baza.sql.
   ============================================================ */
const Chmura = (() => {
  const K_KONF = 'chmura.konf', K_SESJA = 'chmura.sesja';
  const LIMIT_MS = 9000;          /* zadne zadanie nie wisi dluzej */
  const ZWLOKA_WYSYL = 4000;      /* skleja serie zapisow w jedno wyslanie */

  let konf = null, sesja = null, blad = '', timer = 0;
  let wLocie = false, zaleglosc = false, ostatniaKopia = 0;
  /* Dla zalogowanego konta zapis lokalny nie moze nic wyslac, dopoki
     nie pobierzemy aktualnego stanu serwera. */
  let autorytetGotowy = false, autorytetPromise = null;
  /* CAS: zapamietujemy DOKLADNA wersje wiersza pobrana z serwera.
     Kazdy pozniejszy upload moze przejsc tylko, jesli serwer nadal ma
     te sama wartosc zmieniono. Inaczej serwer wygrywa i robimy pull. */
  let autorytetZmieniono = '', autorytetMaWiersz = false;
  const sluchacze = [];
  function powiadom() { for (const f of sluchacze) { try { f(); } catch (e) {} } }

  /* ---------- konfiguracja ---------- */
  /* Ustawienia wpisane w naglowku pliku maja pierwszenstwo i sa NIEZMIENNE
     z poziomu gry. Gracz, ktory dostal gotowy plik, nie moze ich zepsuc ani
     przypadkiem odlaczyc. Pola w panelu sa awaryjna sciezka dla autora,
     zanim wklei wartosci do naglowka. */
  let zNaglowka = false;
  function wczytajKonf() {
    const n = window.QRYBY_CHMURA;
    if (n && String(n.url || '').trim() && String(n.klucz || '').trim()) {
      konf = { url: String(n.url).trim().replace(/\/+$/, ''), klucz: String(n.klucz).trim() };
      zNaglowka = true;
      return;
    }
    try {
      const t = Magazyn.czytaj(K_KONF);
      if (t) { const d = JSON.parse(t); if (d && d.url && d.klucz) konf = d; }
    } catch (e) {}
  }
  function ustawKonf(url, klucz) {
    url = String(url || '').trim().replace(/\/+$/, '');
    klucz = String(klucz || '').trim();
    if (!/^https:\/\/[\w.-]+$/.test(url) || klucz.length < 20) return false;
    konf = { url, klucz };
    Magazyn.pisz(K_KONF, JSON.stringify(konf));
    blad = ''; powiadom();
    return true;
  }
  function zapomnijKonf() {
    if (zNaglowka) return false;      /* wpisane na stale, gra tego nie rusza */
    konf = null; Magazyn.skasuj(K_KONF); wyloguj();
    return true;
  }

  /* ---------- sesja ---------- */
  function wczytajSesje() {
    try { const t = Magazyn.czytaj(K_SESJA); if (t) sesja = JSON.parse(t); } catch (e) {}
  }
  /* ============================================================
     IDENTYFIKATOR KONTA Z SAMEGO TOKENU.

     BLAD: uid brany byl wylacznie z pola user w odpowiedzi serwera, a przy
     niektorych odpowiedziach tego pola nie ma. Po wylogowaniu nie bylo tez
     z czego wziac zapasu, bo poprzednia sesja juz nie istniala. Konczylo sie
     pustym uid i zapytaniem "id=eq." bez wartosci, ktore PostgREST odrzuca
     bledem 400. Objaw: pierwsze logowanie po wylogowaniu wywalalo sie
     komunikatem o bledzie zamiast wpuscic.

     Token dostepu to JWT, a w jego srodkowej czesci siedzi pole sub, czyli
     identyfikator konta. Bierzemy go stamtad i mamy uid zawsze, niezaleznie
     od ksztaltu odpowiedzi.
     ============================================================ */
  function uidZTokenu(token) {
    try {
      const s = String(token).split('.')[1];
      if (!s) return '';
      const b = s.replace(/-/g, '+').replace(/_/g, '/');
      const json = decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))));
      return JSON.parse(json).sub || '';
    } catch (e) { return ''; }
  }
  function mailZTokenu(token) {
    try {
      const s = String(token).split('.')[1];
      if (!s) return '';
      const b = s.replace(/-/g, '+').replace(/_/g, '/');
      const json = decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))));
      return JSON.parse(json).email || '';
    } catch (e) { return ''; }
  }
  function potwierdzonyZUsera(u) {
    return !!(u && u.email && (u.email_confirmed_at || u.confirmed_at));
  }
  function zapiszSesje(s) {
    const staryUid = (sesja && sesja.uid) || '';
    const u = s && s.user ? s.user : null;
    sesja = s ? {
      token: s.access_token, odswiez: s.refresh_token,
      wygasa: Date.now() + (s.expires_in || 3600) * 1000,
      uid: (u && u.id) || uidZTokenu(s.access_token) || (sesja && sesja.uid) || '',
      mail: (u && u.email) || mailZTokenu(s.access_token) || '',
      /* Dostęp do połowu wymaga POTWIERDZONEGO maila, nie samego pola email.
         Przy odpowiedzi bez obiektu user zachowujemy wcześniejszy stan tylko
         dla już zweryfikowanej sesji; backend i tak sprawdza auth.users. */
      potwierdzony: u ? potwierdzonyZUsera(u) : !!(sesja && sesja.potwierdzony)
    } : null;
    const nowyUid = (sesja && sesja.uid) || '';
    if (!sesja || nowyUid != staryUid) {
      autorytetGotowy = false;
      autorytetPromise = null;
      autorytetZmieniono = '';
      autorytetMaWiersz = false;
    }
    if (sesja) Magazyn.pisz(K_SESJA, JSON.stringify(sesja));
    else Magazyn.skasuj(K_SESJA);
    powiadom();
  }
  function wyloguj() { zapiszSesje(null); blad = ''; powiadom(); }

  /* ---------- warstwa HTTP ---------- */
  async function zadanie(sciezka, opcje, zAuth) {
    if (!konf) throw new Error('Brak konfiguracji serwera.');
    const kontrola = new AbortController();
    const stoper = setTimeout(() => kontrola.abort(), LIMIT_MS);
    const naglowki = Object.assign({
      'apikey': konf.klucz,
      'Content-Type': 'application/json'
    }, (opcje && opcje.headers) || {});
    if (zAuth && sesja && sesja.token) naglowki['Authorization'] = 'Bearer ' + sesja.token;
    else naglowki['Authorization'] = 'Bearer ' + konf.klucz;
    let o;
    try {
      o = await fetch(konf.url + sciezka, Object.assign({}, opcje, {
        headers: naglowki, signal: kontrola.signal
      }));
    } catch (e) {
      clearTimeout(stoper);
      throw new Error(e.name === 'AbortError' ? 'Serwer nie odpowiada.' : 'Brak połączenia.');
    }
    clearTimeout(stoper);
    if (o.status === 204) return null;
    let tresc = null;
    try { tresc = await o.json(); } catch (e) {}
    if (!o.ok) {
      const surowy = (tresc && (tresc.msg || tresc.message || tresc.error_description || tresc.error)) || ('Błąd ' + o.status);
      const e = new Error(poLudzku(surowy));
      e.status = o.status; e.surowy = surowy;
      throw e;
    }
    return tresc;
  }

  /* Token zyje godzine. Odswiezany jest leniwie, minute przed koncem,
     przy pierwszym zadaniu, ktore go potrzebuje. */
  /* ============================================================
     ODSWIEZANIE TOKENU, JEDNO NA RAZ.

     BLAD: "Invalid Refresh Token: Already Used". Supabase ROTUJE token
     odswiezajacy, a gra pyta serwer z kilku miejsc naraz: tablica turniejow
     co trzy sekundy, rekordy swiata co kwadrans, kopia zapisu po kazdym
     zlowieniu. Gdy token dobiegal konca, kilka watkow zauwazalo to w tej
     samej sekundzie i kazdy szedl odswiezac wlasnym egzemplarzem. Pierwszy
     wygrywal, reszta dostawala odmowe, a kod kasowal wtedy sesje. Przy
     koncie anonimowym znaczylo to utrate konta bez ostrzezenia.

     Trzy warstwy: jedno odswiezanie na raz; po odmowie zagladamy do magazynu,
     czy rownolegly watek nie zapisal juz swiezego tokenu; na koncu jedna
     proba ponowna, bo serwer przez kilka sekund oddaje na zuzyty token te
     sama nowa sesje. Kasujemy dopiero, gdy wszystkie trzy zawioda.
     ============================================================ */
  let wLocieOdswiezanie = null;
  function sesjaZMagazynu() {
    try { const t = Magazyn.czytaj(K_SESJA); return t ? JSON.parse(t) : null; } catch (e) { return null; }
  }
  async function odswiezToken() {
    const stary = sesja.odswiez;
    try {
      const o = await zadanie('/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', body: JSON.stringify({ refresh_token: stary })
      }, false);
      if (!o || !o.access_token) throw new Error('Serwer nie zwrócił sesji.');
      zapiszSesje(o); return;
    } catch (e) {
      const z = sesjaZMagazynu();
      if (z && z.token && z.odswiez !== stary && Date.now() < z.wygasa - 5000) {
        sesja = z; powiadom(); return;
      }
      await new Promise(r => setTimeout(r, 1100));
      try {
        const o2 = await zadanie('/auth/v1/token?grant_type=refresh_token', {
          method: 'POST', body: JSON.stringify({ refresh_token: sesja.odswiez })
        }, false);
        if (o2 && o2.access_token) { zapiszSesje(o2); return; }
      } catch (e2) {}
      const z2 = sesjaZMagazynu();
      if (z2 && z2.token && Date.now() < z2.wygasa - 5000) { sesja = z2; powiadom(); return; }
      zapiszSesje(null);
      throw new Error('Sesja wygasła, zaloguj się ponownie.');
    }
  }
  async function pewnyToken() {
    if (!sesja) throw new Error('Nie jesteś zalogowany.');
    if (Date.now() < sesja.wygasa - 60000) return;
    if (wLocieOdswiezanie) return wLocieOdswiezanie;
    wLocieOdswiezanie = odswiezToken().finally(() => { wLocieOdswiezanie = null; });
    return wLocieOdswiezanie;
  }

  /* Serwer jest źródłem prawdy dla potwierdzenia maila.
     Stare sesje sprzed tej poprawki nie dostają praw "z rozpędu". */
  async function sprawdzPotwierdzenie() {
    if (!sesja || !sesja.token) return false;
    try {
      await pewnyToken();
      const u = await zadanie('/auth/v1/user', {}, true);
      const ok = potwierdzonyZUsera(u);
      sesja.mail = (u && u.email) || sesja.mail || '';
      sesja.potwierdzony = ok;
      Magazyn.pisz(K_SESJA, JSON.stringify(sesja));
      powiadom();
      return ok;
    } catch (e) {
      if (sesja) {
        sesja.potwierdzony = false;
        try { Magazyn.pisz(K_SESJA, JSON.stringify(sesja)); } catch (err) {}
        powiadom();
      }
      return false;
    }
  }

  /* ---------- logowanie ---------- */
  async function anonim() {
    const o = await zadanie('/auth/v1/signup', { method: 'POST', body: JSON.stringify({ data: {} }) }, false);
    if (!o || !o.access_token) throw new Error('Serwer nie zwrócił sesji. Włącz logowanie anonimowe w Supabase.');
    zapiszSesje(o);
    return o;
  }
  async function rejestracja(mail, haslo) {
    const o = await zadanie('/auth/v1/signup', {
      method: 'POST', body: JSON.stringify({ email: mail, password: haslo })
    }, false);
    if (o && o.access_token) zapiszSesje(o);
    return o;
  }
  async function logowanie(mail, haslo) {
    const o = await zadanie('/auth/v1/token?grant_type=password', {
      method: 'POST', body: JSON.stringify({ email: mail, password: haslo })
    }, false);
    if (!o || !o.access_token) throw new Error('Zły mail albo hasło.');
    zapiszSesje(o);
    return o;
  }
  /* Dopiecie maila do konta anonimowego. Konto zostaje to samo, wiec zapis,
     atlas i rekordy przezywaja operacje bez zadnego przenoszenia. */
  async function dopnijMail(mail, haslo) {
    await pewnyToken();
    const o = await zadanie('/auth/v1/user', {
      method: 'PUT', body: JSON.stringify({ email: mail, password: haslo })
    }, true);
    if (sesja) {
      sesja.mail = mail;
      sesja.potwierdzony = potwierdzonyZUsera(o);
      Magazyn.pisz(K_SESJA, JSON.stringify(sesja));
      powiadom();
    }
    return o;
  }

  /* ---------- kopia zapisu ---------- */
  const K_KONTO = 'chmura.ostatnie';
  function ostatnieKonto() { try { return Magazyn.czytaj(K_KONTO) || ''; } catch (e) { return ''; } }

  function wiersz() {
    const d = Zapis.dane();
    return {
      id: sesja.uid,
      nick: (d.profil && d.profil.nick) || '',
      stroj: (d.profil && d.profil.awatar && d.profil.awatar.stroj) || 'zielony',
      zlowien: d.stat.zlowien || 0,
      gatunkow: Object.keys(d.atlas || {}).length,
      rekord_zycia: d.stat.rekordZycia || 0,
      zapis: d,
      zmieniono: new Date().toISOString()
    };
  }

  async function zapewnijAutorytetSerwera() {
    if (!konf || !sesja) return { co: 'lokalny' };
    if (autorytetGotowy) return { co: 'gotowy' };
    if (autorytetPromise) return await autorytetPromise;

    autorytetPromise = (async () => {
      const zdalny = await pobierz();
      if (zdalny && zdalny.zapis) {
        /* SERWER WYGRYWA. Lokalny stan jest tylko cachem. */
        Zapis.wczytajObiekt(zdalny.zapis);
        Magazyn.pisz(K_KONTO, sesja.uid);
        autorytetZmieniono = String(zdalny.zmieniono || '');
        autorytetMaWiersz = true;
        autorytetGotowy = true;
        ostatniaKopia = Date.now();
        blad = '';
        powiadom();
        return { co: 'pobrano', ile: zdalny.zlowien || 0 };
      }

      /* Nowe konto bez zapisu: dopiero teraz wolno utworzyc pierwszy
         serwerowy stan z lokalnego cache. */
      autorytetZmieniono = '';
      autorytetMaWiersz = false;
      autorytetGotowy = true;
      return { co: 'brak' };
    })();

    try {
      return await autorytetPromise;
    } finally {
      autorytetPromise = null;
    }
  }

  async function wyslijTeraz() {
    if (!konf || !sesja) return false;
    if (wLocie) { zaleglosc = true; return false; }
    wLocie = true;
    try {
      await pewnyToken();

      /* Pierwszy ruch po starcie/logowaniu jest ZAWSZE serwer -> telefon.
         Jesli istnieje zdalny zapis, konczymy ten cykl bez uploadu. */
      const start = await zapewnijAutorytetSerwera();
      if (start && start.co === 'pobrano') {
        blad = '';
        return true;
      }

      const payload = wiersz();
      let zapisane = null;

      if (autorytetMaWiersz) {
        /* COMPARE-AND-SWAP.
           Nie robimy juz slepego UPSERT. Aktualizacja przejdzie tylko,
           gdy zmieniono na serwerze nadal jest wersja, ktora ten klient
           ostatnio pobral. Stara karta, drugi telefon albo zmiana admina
           nie moga zostac nadpisane lokalnym cachem. */
        const wersja = encodeURIComponent(autorytetZmieniono || '');
        zapisane = await zadanie(
          '/rest/v1/gracze?id=eq.' + sesja.uid +
          '&zmieniono=eq.' + wersja +
          '&select=zmieniono',
          {
            method: 'PATCH',
            headers: { 'Prefer': 'return=representation' },
            body: JSON.stringify(payload)
          }, true
        );

        if (!zapisane || !zapisane.length) {
          /* Serwer zmienil sie od ostatniego pull. SERWER WYGRYWA. */
          autorytetGotowy = false;
          autorytetPromise = null;
          const nowszy = await zapewnijAutorytetSerwera();
          blad = '';
          return !!(nowszy && nowszy.co === 'pobrano');
        }
      } else {
        /* Nowe konto bez wiersza: probujemy tylko INSERT. Jesli wiersz
           powstal rownolegle, niczego nie nadpisujemy i pobieramy serwer. */
        zapisane = await zadanie('/rest/v1/gracze?select=zmieniono', {
          method: 'POST',
          headers: { 'Prefer': 'resolution=ignore-duplicates,return=representation' },
          body: JSON.stringify(payload)
        }, true);

        if (!zapisane || !zapisane.length) {
          autorytetGotowy = false;
          autorytetPromise = null;
          const nowszy = await zapewnijAutorytetSerwera();
          blad = '';
          return !!(nowszy && nowszy.co === 'pobrano');
        }
        autorytetMaWiersz = true;
      }

      autorytetZmieniono = String(zapisane[0].zmieniono || payload.zmieniono || '');
      ostatniaKopia = Date.now(); blad = '';
      Magazyn.pisz(K_KONTO, sesja.uid);
    } catch (e) {
      blad = e.message || 'Nie udało się wysłać.';
    } finally {
      wLocie = false; powiadom();
      if (zaleglosc) { zaleglosc = false; zaplanujWyslanie(); }
    }
    return !blad;
  }
  function zaplanujWyslanie() {
    if (!konf || !sesja) return;
    clearTimeout(timer);
    timer = setTimeout(wyslijTeraz, ZWLOKA_WYSYL);
  }

  async function pobierz() {
    await pewnyToken();
    /* Bez identyfikatora zapytanie i tak by sie nie udalo, a blad 400
       nic nikomu nie mowi. Lepiej powiedziec wprost, co jest nie tak. */
    if (!sesja.uid) throw new Error('Sesja bez identyfikatora konta. Wyloguj się i zaloguj ponownie.');
    const o = await zadanie('/rest/v1/gracze?select=zapis,zlowien,gatunkow,nick,zmieniono&id=eq.' + sesja.uid, {}, true);
    return (o && o.length) ? o[0] : null;
  }

  /* ============================================================
     SYNCHRONIZACJA KONTA — SERWER JEST ZRODLEM PRAWDY.
     Po starcie i po logowaniu najpierw pobieramy zapis z serwera.
     Jezeli istnieje, zawsze trafia on na telefon. Lokalny stan moze
     utworzyc zapis serwera tylko dla nowego konta bez zadnego wiersza.
     ============================================================ */
  async function pierwszeSpotkanie() {
    const stan = await zapewnijAutorytetSerwera();
    if (stan && stan.co === 'pobrano') return stan;
    if (stan && (stan.co === 'gotowy' || stan.co === 'brak')) {
      const ok = await wyslijTeraz();
      return { co: ok ? 'wyslano' : 'blad' };
    }
    return { co: 'lokalny' };
  }
  function przyjmijZdalny(zapisZdalny) {
    Zapis.wczytajObiekt(zapisZdalny);
    powiadom();
  }

  /* ============================================================
     REKORDY SWIATA.
     Jedno zapytanie do widoku, ktory oddaje najlepszy wynik na gatunek
     w calej bazie razem z nickiem. Wynik ladu je w tym samym miejscu,
     z ktorego atlas czyta rekordy wklejone z kodu znajomego, wiec strona
     ryby nie wie i nie musi wiedziec, skad przyszla liczba.
     Czytane bez logowania: widok jest publiczny do odczytu.
     ============================================================ */
  /* ============================================================
     RANKING OGOLNY.

     Widok tablica jest publiczny do odczytu, wiec czyta sie go BEZ konta
     i bez logowania. Konta bez nicku do niego nie wchodza: pusty nick
     w rankingu to smiec, a nie zawodnik, i tak jest to zapisane w samym
     widoku, nie tutaj.

     Sortowanie robi baza: rekord zycia, potem gatunki, potem zlowienia.
     Klient bierze pierwsza setke i nic nie przelicza.
     ============================================================ */
  async function tablicaSwiata(ile) {
    if (!konf) throw new Error('Nie masz podłączonego serwera.');
    return await zadanie('/rest/v1/tablica?select=nick,rekord_zycia,zlowien,gatunkow&limit=' +
      Math.max(1, Math.min(200, ile || 100)), {}, false);
  }

  async function rekordySwiata() {
    if (!konf) return 0;
    const o = await zadanie('/rest/v1/rekordy_swiata?select=gatunek,cm,waga,pkt,nick', {}, false);
    if (!o || !o.length) return 0;
    let ile = 0;
    for (const r of o) if (Zapis.ustawSpoleczny(r.gatunek, r.cm, r.waga, r.pkt, r.nick || 'ANONIM')) ile++;
    if (ile) Zapis.teraz();
    return ile;
  }

  /* Procedura w bazie. Wszystko, co zmienia cudze wiersze albo pilnuje
     regul, idzie ta droga, a nie przez zwykly zapis do tabeli. */
  /* ============================================================
     TLUMACZ BLEDOW BAZY.

     PostgREST oddaje komunikaty Postgresa slowo w slowo, po angielsku
     i w jezyku schematu. "column tryb of relation zawody does not exist"
     jest precyzyjne, ale nie mowi graczowi, co ma zrobic. A mowi to
     jednoznacznie: brakuje migracji.

     Tlumaczymy tylko te kilka wzorcow, ktore faktycznie moga wystapic
     przy niedograniu schematu. Reszta idzie bez zmian, zeby nie zgubic
     tresci prawdziwego bledu.
     ============================================================ */
  const PODPOWIEDZI = [
    [/relation .*(rundy|zawodnicy|zawody|korekty|administratorzy).* does not exist/i,
     'Baza nie ma jeszcze tabel turniejowych. Uruchom w Supabase plik qryby-liga-final.sql.'],
    [/column .* of relation .* does not exist/i,
     'Baza ma starszy schemat niż gra. Uruchom w Supabase plik qryby-liga-final.sql.'],
    [/function .* does not exist/i,
     'Baza nie ma jeszcze procedur turniejowych. Uruchom w Supabase plik qryby-liga-final.sql.'],
    [/permission denied/i,
     'Baza odmawia dostępu. Sprawdź, czy uruchomiłeś całość pliku SQL, razem z sekcją uprawnień.']
  ];
  function poLudzku(tekst) {
    for (const [wz, rada] of PODPOWIEDZI) if (wz.test(tekst)) return rada;
    return tekst;
  }

  async function wolajRpc(nazwa, ciało) {
    if (!konf) throw new Error('Nie masz podłączonego serwera.');
    if (!sesja) throw new Error('Nie jesteś zalogowany.');
    await pewnyToken();
    return await zadanie('/rest/v1/rpc/' + nazwa, {
      method: 'POST', body: JSON.stringify(ciało || {})
    }, true);
  }
  async function pobierzTablice(zawodyId) {
    await pewnyToken();
    return await zadanie('/rest/v1/zawodnicy?zawody=eq.' + zawodyId +
      '&select=gracz,nick,punkty,sztuk,najlepszy_gat,najlepsze_pkt&order=punkty.desc,sztuk.asc', {}, true);
  }

  /* ============================================================
     REKORDY SWIATA SAME.

     Widok rekordow jest publiczny, wiec czyta sie go BEZ logowania i bez
     konta. Nie ma wiec powodu, zeby ktokolwiek to klikal.

     Trzy wyzwalacze, wszystkie tanie: raz przy starcie gry z opoznieniem
     szesciu sekund, zeby nie konkurowac z wczytywaniem grafiki; potem co
     pietnascie minut; i dodatkowo zaraz po zalogowaniu, bo wtedy gracz
     zwykle zaglada do ksiegi.

     Jedno zapytanie oddaje rekord kazdego gatunku naraz, wiec koszt to
     cztery zapytania na godzine niezaleznie od tego, ile ryb jest w grze.
     Brak sieci nie robi nic zlego: nastepne podejscie po prostu sie uda.
     ============================================================ */
  const AUTO_REKORDY_MS = 15 * 60 * 1000;
  let autoRekordyTimer = 0;
  function autoRekordy() {
    clearTimeout(autoRekordyTimer);
    if (!konf) return;
    rekordySwiata().catch(() => {});
    autoRekordyTimer = setTimeout(autoRekordy, AUTO_REKORDY_MS);
  }

  wczytajKonf(); wczytajSesje();
  /* Sesja zapisana przez starszą wersję nie ma wiarygodnej flagi
     potwierdzenia. Sprawdzamy ją z Supabase przy starcie. */
  if (konf && sesja) {
    /* Zalogowany klient zaczyna od PULL. Dopiero po nim wolno wysylac save. */
    setTimeout(() => { zapewnijAutorytetSerwera().catch(e => {
      blad = e.message || 'Nie udało się pobrać zapisu z serwera.';
      powiadom();
    }); }, 120);
    setTimeout(() => { sprawdzPotwierdzenie().catch(() => {}); }, 250);
  }
  if (konf) setTimeout(autoRekordy, 6000);
  sluchacze.push(() => { if (konf && sesja) rekordySwiata().catch(() => {}); });

  return {
    ustawKonf, zapomnijKonf, skonfigurowana: () => !!konf, konf: () => konf,
    autoRekordy,
    naStale: () => zNaglowka,
    anonim, rejestracja, logowanie, dopnijMail, wyloguj,
    zalogowany: () => !!(sesja && sesja.token),
    /* ============================================================
       PELNY DOSTEP = KONTO Z MAILEM (IX 2026).
       `zalogowany` mowi tylko tyle, ze jest wazna sesja -- a konto
       anonimowe tez ja ma. Przez to ktos bez maila mial pelne prawa:
       lowil mityczne, ruszal wspolna populacja i wchodzil w turnieje
       jako ANONIM. Teraz gra pyta o `pelnyDostep`, a to wymaga maila.
       Konto anonimowe zostaje wylacznie jako szkielet do DOPIECIA
       maila (Chmura.dopnijMail), zeby dotychczasowi gracze nie stracili
       postepu. `zalogowany` zostaje bez zmian, bo od niego zalezy
       wazenie sesji i odswiezanie tokena. */
    pelnyDostep: () => !!(sesja && sesja.token && sesja.mail && sesja.potwierdzony),
    potwierdzony: () => !!(sesja && sesja.potwierdzony),
    sprawdzPotwierdzenie,
    mail: () => (sesja && sesja.mail) || '',
    uid: () => (sesja && sesja.uid) || '',
    zaplanujWyslanie, wyslijTeraz, pobierz, pierwszeSpotkanie, przyjmijZdalny, rekordySwiata,
    wolajRpc, pobierzTablice, tablicaSwiata,
    blad: () => blad, ostatniaKopia: () => ostatniaKopia,
    nasluchuj: f => sluchacze.push(f)
  };
})();
window.Chmura = Chmura;

/* ============================================================
   PRODUCT STAGE 0 — TELEMETRY.
   Cel: zmierzyc pierwsze 30 minut bez ingerowania w gameplay.

   Zasady prywatnosci tego modulu:
   - nie wysyla maila, nicku, tresci wpisywanych przez gracza ani stackow;
   - konto, jezeli istnieje, jest tylko technicznym UUID Supabase;
   - install_id i session_id sa losowymi UUID;
   - payload ma twardy limit i tylko proste dane o zachowaniu w grze;
   - brak tabeli / brak sieci NIGDY nie blokuje gry — kolejka zostaje lokalnie.
   ============================================================ */
const Telemetry = (() => {
  const WL = !!(window.Features && Features.is('telemetry'));
  const BUILD = String(window.QRYBY_BUILD || 'dev');
  const K_INSTALL = 'qryby.telemetry.install';
  const K_QUEUE = 'qryby.telemetry.queue.v1';
  const MAX_QUEUE = 500;
  const BATCH = 25;
  const FLUSH_MS = 6000;
  const sessionStart = Date.now();
  const sessionId = uuid();
  const razSesja = new Set();

  /* STAGE 9 — fala testowa pochodzi wyłącznie z jawnego linku.
     Nie losujemy użytkownikow do kohort po cichu. ?wave=... zapisuje sie
     lokalnie, zeby kolejne wejscie tej samej osoby zostalo w tej samej fali. */
  const K_WAVE = 'qryby.testwave.id.v1';
  const K_VARIANT = 'qryby.testwave.variant.v1';

  function cleanTag(v, fallback) {
    v = String(v == null ? '' : v).trim().toLowerCase()
      .replace(/[^a-z0-9_-]/g, '_').replace(/_+/g, '_').slice(0, 32);
    return v || fallback;
  }

  const qs = new URLSearchParams(location.search);
  const qWave = qs.get('wave');
  const qVariant = qs.get('variant');

  let waveId = 'organic';
  let waveVariant = 'base';

  const sessionStats = {
    casts:0,catches:0,decisions:0,kept:0,released:0,
    shoals:0,bucket:0,atlas:0,ecosystem:0,quests:0,
    shares:0,gates:0,errors:0,stage1_done:false
  };

  function countEvent(name) {
    if (name === 'first_cast') sessionStats.casts = Math.max(1, sessionStats.casts);
    else if (name === 'fish_caught') sessionStats.catches++;
    else if (name === 'first_decision') sessionStats.decisions = Math.max(1, sessionStats.decisions);
    else if (name === 'fish_kept') { sessionStats.decisions++; sessionStats.kept++; }
    else if (name === 'fish_released') { sessionStats.decisions++; sessionStats.released++; }
    else if (name === 'shoal_refresh') sessionStats.shoals++;
    else if (name === 'bucket_open') sessionStats.bucket++;
    else if (name === 'atlas_open') sessionStats.atlas++;
    else if (name === 'ecosystem_open') sessionStats.ecosystem++;
    else if (name === 'quest_open') sessionStats.quests++;
    else if (name === 'share_invoked') sessionStats.shares++;
    else if (name === 'progression_gate_hit') sessionStats.gates++;
    else if (name === 'client_error') sessionStats.errors++;
    else if (name === 'onboarding_stage1_done') sessionStats.stage1_done = true;
  }

  function summaryPayload(reason) {
    return {
      reason:String(reason || 'checkpoint').slice(0,24),
      duration_s:Math.round((Date.now()-sessionStart)/1000),
      casts:sessionStats.casts,
      catches:sessionStats.catches,
      decisions:sessionStats.decisions,
      kept:sessionStats.kept,
      released:sessionStats.released,
      shoals:sessionStats.shoals,
      bucket_open:sessionStats.bucket,
      atlas_open:sessionStats.atlas,
      ecosystem_open:sessionStats.ecosystem,
      quest_open:sessionStats.quests,
      shares:sessionStats.shares,
      gates:sessionStats.gates,
      errors:sessionStats.errors,
      stage1_done:sessionStats.stage1_done
    };
  }

  let timer = 0;
  let wysylanie = false;
  let remoteBlocked = false;

  function uuid() {
    try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0, v = c === 'x' ? r : ((r & 3) | 8);
      return v.toString(16);
    });
  }

  function getLocal(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function setLocal(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  }

  if (qWave) setLocal(K_WAVE, cleanTag(qWave, 'organic'));
  if (qVariant) setLocal(K_VARIANT, cleanTag(qVariant, 'base'));
  waveId = cleanTag(getLocal(K_WAVE), 'organic');
  waveVariant = cleanTag(getLocal(K_VARIANT), 'base');

  let installId = getLocal(K_INSTALL);
  if (!installId || !/^[0-9a-f-]{30,40}$/i.test(installId)) {
    installId = uuid();
    setLocal(K_INSTALL, installId);
  }

  function loadQueue() {
    try {
      const q = JSON.parse(getLocal(K_QUEUE) || '[]');
      return Array.isArray(q) ? q.slice(-MAX_QUEUE) : [];
    } catch (e) { return []; }
  }
  let kolejka = loadQueue();

  function saveQueue() {
    if (kolejka.length > MAX_QUEUE) kolejka = kolejka.slice(-MAX_QUEUE);
    setLocal(K_QUEUE, JSON.stringify(kolejka));
  }

  function cleanPayload(p) {
    const out = {};
    if (!p || typeof p !== 'object') return out;
    for (const k of Object.keys(p).slice(0, 20)) {
      const key = String(k).replace(/[^a-zA-Z0-9_]/g, '').slice(0, 32);
      if (!key) continue;
      let v = p[k];
      if (typeof v === 'string') v = v.slice(0, 120);
      else if (typeof v === 'number') v = Number.isFinite(v) ? v : null;
      else if (typeof v === 'boolean' || v === null) {}
      else continue; /* zero obiektow, DOM, stackow, dowolnego tekstu */
      out[key] = v;
    }
    return out;
  }

  function accountId() {
    try {
      const x = window.Chmura && Chmura.uid ? String(Chmura.uid() || '') : '';
      return /^[0-9a-f-]{30,40}$/i.test(x) ? x : null;
    } catch (e) { return null; }
  }

  function event(nazwa, payload) {
    if (!WL) return false;
    nazwa = String(nazwa || '').toLowerCase().replace(/[^a-z0-9_]/g, '_').slice(0, 48);
    if (nazwa.length < 2) return false;
    if (nazwa !== 'session_summary' && nazwa !== 'session_checkpoint') countEvent(nazwa);
    kolejka.push({
      client_time: new Date().toISOString(),
      install_id: installId,
      session_id: sessionId,
      account_id: accountId(),
      event_name: nazwa,
      event_version: 1,
      build: BUILD.slice(0, 64),
      payload: Object.assign({
        elapsed_ms: Date.now() - sessionStart,
        wave_id: waveId,
        variant: waveVariant
      }, cleanPayload(payload))
    });
    saveQueue();
    planFlush();
    return true;
  }

  function onceSession(nazwa, payload) {
    if (razSesja.has(nazwa)) return false;
    razSesja.add(nazwa);
    return event(nazwa, payload);
  }

  function endpoint() {
    const k = window.QRYBY_CHMURA;
    if (!k || !k.url || !k.klucz) return null;
    return { url: String(k.url).replace(/\/+$/, '') + '/rest/v1/analytics_events', key: String(k.klucz) };
  }

  async function flush(opcje) {
    if (!WL || wysylanie || remoteBlocked || !kolejka.length || !navigator.onLine) return false;
    const ep = endpoint();
    if (!ep) return false;
    const batch = kolejka.slice(0, BATCH);
    wysylanie = true;
    try {
      const r = await fetch(ep.url, {
        method: 'POST',
        headers: {
          'apikey': ep.key,
          'Authorization': 'Bearer ' + ep.key,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(batch),
        keepalive: !!(opcje && opcje.keepalive)
      });
      if (!r.ok) {
        /* 404 = migracja jeszcze nie uruchomiona; 401/403 = polityka niegotowa.
           Nie bombardujemy backendu w tej sesji i nie gubimy kolejki. */
        if (r.status === 404 || r.status === 401 || r.status === 403) remoteBlocked = true;
        return false;
      }
      kolejka.splice(0, batch.length);
      saveQueue();
      if (kolejka.length) planFlush(250);
      return true;
    } catch (e) {
      return false;
    } finally {
      wysylanie = false;
    }
  }

  function planFlush(ms) {
    if (!WL || remoteBlocked) return;
    clearTimeout(timer);
    timer = setTimeout(() => { flush().catch(() => {}); }, ms == null ? FLUSH_MS : ms);
  }

  function stan() {
    return {
      enabled: WL, build: BUILD, install_id: installId, session_id: sessionId,
      wave_id: waveId, variant: waveVariant,
      queued: kolejka.length, remoteBlocked: remoteBlocked,
      stats: Object.assign({}, sessionStats),
      elapsed_s: Math.round((Date.now()-sessionStart)/1000)
    };
  }

  /* Klikniecia w panele mierzymy bez grzebania w ich logice. */
  document.addEventListener('click', e => {
    const b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b || !b.id) return;
    const mapa = {
      wiaderko: 'bucket_open',
      atlas: 'atlas_open',
      ekosystem: 'ecosystem_open',
      zadania: 'quest_open',
      reset: 'shoal_refresh'
    };
    if (mapa[b.id]) event(mapa[b.id]);
  }, true);

  window.addEventListener('online', () => { remoteBlocked = false; planFlush(250); });

  function checkpoint(label) {
    event('session_checkpoint', summaryPayload(label));
  }

  if (waveId !== 'organic') {
    setTimeout(() => onceSession('test_wave_joined', {
      wave_id:waveId,variant:waveVariant
    }), 20);
  }

  setTimeout(() => checkpoint('5m'), 5*60*1000);
  setTimeout(() => checkpoint('10m'), 10*60*1000);
  setTimeout(() => checkpoint('30m'), 30*60*1000);

  window.addEventListener('pagehide', () => {
    onceSession('session_summary', summaryPayload('pagehide'));
    onceSession('session_end', { duration_s: Math.round((Date.now() - sessionStart) / 1000) });
    flush({ keepalive: true }).catch(() => {});
  });

  /* Bledy: tylko nazwa/komunikat po obcieciu. Bez stacka i bez danych DOM. */
  window.addEventListener('error', e => {
    event('client_error', { kind: 'error', msg: String((e && e.message) || 'error').slice(0, 120) });
  });
  window.addEventListener('unhandledrejection', e => {
    let msg = 'promise';
    try { msg = String(e && e.reason && (e.reason.message || e.reason) || 'promise'); } catch (_) {}
    event('client_error', { kind: 'promise', msg: msg.slice(0, 120) });
  });

  setTimeout(() => {
    event('game_open', {
      screen: innerWidth <= 390 ? 'small' : (innerWidth <= 560 ? 'medium' : 'large'),
      confirmed: !!(window.Chmura && Chmura.pelnyDostep && Chmura.pelnyDostep()),
      wave_id: waveId,
      variant: waveVariant
    });
    flush().catch(() => {});
  }, 0);

  return {
    event, onceSession, flush, stan,
    wave:()=>({id:waveId,variant:waveVariant}),
    summary:()=>summaryPayload('live')
  };
})();
window.Telemetry = Telemetry;

/* ============================================================
   PRODUCT STAGE 1 — FIRST 30 MINUTES.
   Stan:
     0 pierwszy rzut
     1 pierwsza ryba
     2 decyzja karta: zatrzymaj / wypusc
     3 konsekwencja dla swiata
     4 odkrycie Wiadra
     5 odkrycie Atlasu
     6 odkrycie Ekosystemu
     7 nowa lawica
     8 maly cel: jeszcze jedna ryba
     9 domkniecie pierwszych krokow
    99 zakonczone

   MAX_ONB_STEP jest jedynym parametrem rozniacym buildy 1B..1G.
   ============================================================ */
const Onboarding = (() => {
  const WL = !!(window.Features && Features.is('onboardingV2'));
  const MAX_ONB_STEP = 9;
  const BUILD_SCOPE = '1G';
  const guide = document.getElementById('onbGuide');
  const karta = document.getElementById('onbKarta');
  const KEY = 'qryby.onboarding.stage1.v2';
  const KEY_LAST = 'qryby.onboarding.stage1.last.v2';
  const OLD_FIRST_CAST = 'qryby.onboarding.first_cast.v2';
  const FORCE = /(?:\?|&)onboarding=1(?:&|$)/.test(location.search);
  let step = -1;
  let booted = false;
  let timer = 0;
  let autoTimer = 0;
  let ostatnia = null;
  let shownKey = '';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k,v) { try { localStorage.setItem(k,String(v)); } catch (e) {} }
  function loadLast() {
    try { const x = JSON.parse(lsGet(KEY_LAST) || 'null'); return x && typeof x === 'object' ? x : null; }
    catch (e) { return null; }
  }
  function saveLast(x) {
    ostatnia = x || null;
    if (!FORCE) { try { localStorage.setItem(KEY_LAST, JSON.stringify(ostatnia)); } catch (e) {} }
  }
  function zapisz() { if (!FORCE && step >= 0) lsSet(KEY, step); }

  function statZlowien() {
    try { return Number(Zapis.dane().stat.zlowien || 0); } catch (e) { return 0; }
  }
  function mozeLowic() {
    try { return !!(window.Chmura && Chmura.pelnyDostep && Chmura.pelnyDostep()); }
    catch (e) { return false; }
  }

  function boot() {
    if (!WL || booted || !window.Zapis || !Zapis.dane) return false;
    if (!FORCE && !mozeLowic()) return false;
    booted = true;
    ostatnia = loadLast();

    if (FORCE) step = 0;
    else {
      const raw = lsGet(KEY);
      if (raw !== null && raw !== '') step = Math.max(0, Math.min(99, parseInt(raw,10) || 0));
      else if (statZlowien() > 0) step = 99;  /* stary gracz: bez tutorialu */
      else if (lsGet(OLD_FIRST_CAST) === '1') step = 1; /* migracja z 1A */
      else step = 0;
      zapisz();
    }
    render();
    return true;
  }

  function telemetry(nazwa, payload) {
    try { if (window.Telemetry) Telemetry.event(nazwa, Object.assign({ onb_step: step, scope: BUILD_SCOPE }, payload || {})); }
    catch (e) {}
  }

  function setStep(n, eventName, payload) {
    if (!WL) return;
    if (!booted && !boot()) return;
    if (n <= step && step !== 99) return;
    step = n;
    zapisz();
    shownKey = '';
    clearTimeout(autoTimer); autoTimer = 0;
    if (eventName) telemetry(eventName, payload);
    render();

    if (step === 3 && MAX_ONB_STEP >= 4) {
      autoTimer = setTimeout(() => setStep(4, 'onboarding_world_consequence_done'), 3400);
    } else if (step === 9 && MAX_ONB_STEP >= 9) {
      autoTimer = setTimeout(() => {
        step = 99; zapisz(); shownKey = ''; render();
        telemetry('onboarding_stage1_done');
      }, 3200);
    }
  }

  function target(id) {
    document.querySelectorAll('.onbCel').forEach(x => x.classList.remove('onbCel'));
    if (!id) return;
    document.querySelectorAll('[id="' + id + '"]').forEach(x => x.classList.add('onbCel'));
    if (id !== 'reset') {
      const mm = document.getElementById('menuMaster');
      if (mm) mm.classList.add('onbCel');
    }
  }
  function clearTarget() { document.querySelectorAll('.onbCel').forEach(x => x.classList.remove('onbCel')); }

  function html(el, duzy, maly) {
    if (!el) return;
    el.innerHTML = duzy + (maly ? '<small>' + maly + '</small>' : '');
    el.classList.add('on');
    el.setAttribute('aria-hidden','false');
  }
  function hide(el) {
    if (!el) return;
    el.classList.remove('on');
    el.setAttribute('aria-hidden','true');
  }
  function shown(key, evt) {
    if (shownKey === key) return;
    shownKey = key;
    if (evt) telemetry(evt);
  }

  function nazwaGat(gk) {
    try { return (GATUNKI[gk] && GATUNKI[gk].nazwa) || String(gk || '').toUpperCase(); }
    catch (e) { return String(gk || '').toUpperCase(); }
  }

  function render() {
    if (!WL) return;
    if (!booted && !boot()) return;
    hide(guide); hide(karta); clearTarget();
    if (step === 99) return;
    if (!mozeLowic() && !FORCE) return;

    if (step === 0 && MAX_ONB_STEP >= 0) {
      html(guide, 'DOTKNIJ WODY', 'zarzuć wędkę');
      shown('s0','onboarding_first_cast_shown');
      return;
    }

    if (step === 1 && MAX_ONB_STEP >= 1) {
      if (!window.G) return;
      const ph = G.phase || 'ready';
      if (ph === 'cast') {
        html(guide, 'PATRZ NA SPŁAWIK', 'zarzut leci sam');
      } else if (ph === 'drop') {
        html(guide, 'DOTKNIJ KRÓTKO', 'zatrzymaj haczyk na wybranej głębokości');
      } else if (ph === 'hang') {
        html(guide, 'CZEKAJ NA BRANIE', 'ryba podejdzie do przynęty');
      } else if (ph === 'fight' && G.hooked) {
        html(guide, 'PRZYTRZYMAJ', 'zwijaj · puść, gdy naprężenie robi się niebezpieczne');
      } else if (ph === 'fight') {
        html(guide, 'PRZYTRZYMAJ', 'zwiń zestaw i spróbuj ponownie');
      } else if (ph === 'land') {
        html(guide, 'MASZ JĄ', 'chwila…');
      } else if (!window.Card || !Card.open) {
        html(guide, 'SPRÓBUJ JESZCZE RAZ', 'dotknij wody');
      }
      shown('s1','onboarding_first_catch_guide_shown');
      return;
    }

    if (step === 2 && MAX_ONB_STEP >= 2) {
      if (window.Card && Card.open && Card.swipe && Card.czeka) {
        html(karta, '<strong>← WYPUSZCZ · ZATRZYMAJ →</strong>', 'przesuń kartę w wybraną stronę');
        shown('s2','onboarding_first_decision_shown');
      }
      return;
    }

    if (step === 3 && MAX_ONB_STEP >= 3) {
      if (window.Card && Card.open) return;
      const o = ostatnia || {};
      const g = nazwaGat(o.gat);
      if (o.kier === 'wiaderko') {
        const ile = Number.isFinite(o.pop) ? ' · zostało ' + o.pop : '';
        html(guide, 'ZABRAŁEŚ 1: ' + g, 'to zmienia wspólne jezioro' + ile);
      } else {
        const ile = Number.isFinite(o.pop) ? ' · w jeziorze ' + o.pop : '';
        html(guide, 'WYPUSZCZONA: ' + g, 'populacja nie spadła' + ile);
      }
      shown('s3','onboarding_world_consequence_shown');
      if (!autoTimer && MAX_ONB_STEP >= 4) {
        autoTimer = setTimeout(() => setStep(4, 'onboarding_world_consequence_done'), 3400);
      }
      return;
    }

    if (step === 4 && MAX_ONB_STEP >= 4) {
      html(guide, 'MENU → WIADRO', 'tu trafiają zatrzymane ryby');
      target('wiaderko');
      shown('s4','onboarding_bucket_guide_shown');
      return;
    }

    if (step === 5 && MAX_ONB_STEP >= 5) {
      html(guide, 'MENU → ATLAS', 'pierwszy złowiony gatunek już tam jest');
      target('atlas');
      shown('s5','onboarding_atlas_guide_shown');
      return;
    }

    if (step === 6 && MAX_ONB_STEP >= 6) {
      html(guide, 'MENU → EKO', 'zobacz, ile naprawdę żyje w jeziorze');
      target('ekosystem');
      shown('s6','onboarding_ecosystem_guide_shown');
      return;
    }

    if (step === 7 && MAX_ONB_STEP >= 7) {
      html(guide, 'NOWA ŁAWICA', 'sprawdź, co przypłynęło');
      target('reset');
      shown('s7','onboarding_new_shoal_guide_shown');
      return;
    }

    if (step === 8 && MAX_ONB_STEP >= 8) {
      html(guide, 'MAŁY CEL', 'złów jeszcze 1 rybę');
      shown('s8','onboarding_second_catch_goal_shown');
      return;
    }

    if (step === 9 && MAX_ONB_STEP >= 9) {
      html(guide, 'PIERWSZE KROKI GOTOWE', 'teraz odkrywaj jezioro po swojemu');
      shown('s9','onboarding_stage1_complete_shown');
      if (!autoTimer) {
        autoTimer = setTimeout(() => {
          step = 99; zapisz(); shownKey = ''; render();
          telemetry('onboarding_stage1_done');
          try { if (window.ReturnDigest) setTimeout(() => ReturnDigest.maybeShow(), 500); } catch (e) {}
        }, 3200);
      }
    }
  }

  /* Zachowujemy nazwe z 1A, zeby hook cast() nie musial wiedziec,
     ze onboarding stal sie pelnym automatem. */
  function pierwszyRzut() {
    if (!booted && !boot()) return;
    if (step === 0) setStep(1, 'onboarding_first_cast_done');
  }

  function pierwszaRyba(fish, pkt, tier) {
    if (!booted && !boot()) return;
    const gk = fish && fish.gat ? fish.gat : '';
    if (step === 1) {
      saveLast({ gat:gk, pkt:Number(pkt||0), tier:Number(tier||0) });
      setStep(2, 'onboarding_first_catch_done', { species:gk, score:Number(pkt||0) });
    } else if (step === 8) {
      saveLast({ gat:gk, pkt:Number(pkt||0), tier:Number(tier||0) });
      setStep(9, 'onboarding_second_catch_done', { species:gk, score:Number(pkt||0) });
    }
  }

  function poDecyzji(kier, C) {
    if (!booted && !boot()) return;
    if (step !== 2) return;
    let pop = null;
    try { if (window.Eko && Eko.populacja) pop = Eko.populacja(C.gk); } catch (e) {}
    saveLast({ gat:C.gk || '', kier:kier, pop:Number.isFinite(pop) ? pop : null });
    setStep(3, 'onboarding_first_decision_done', {
      decision:kier === 'wiaderko' ? 'keep' : 'release',
      species:C.gk || '',
      population:Number.isFinite(pop) ? pop : null
    });
  }

  document.addEventListener('click', e => {
    if (!WL) return;
    if (!booted && !boot()) return;
    const b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b || !b.id) return;
    if (step === 4 && b.id === 'wiaderko') setStep(5, 'onboarding_bucket_done');
    else if (step === 5 && b.id === 'atlas') setStep(6, 'onboarding_atlas_done');
    else if (step === 6 && b.id === 'ekosystem') setStep(7, 'onboarding_ecosystem_done');
    else if (step === 7 && b.id === 'reset') setStep(8, 'onboarding_new_shoal_done');
    else setTimeout(render, 0);
  }, true);

  /* UI i fazy wedki zmieniaja sie asynchronicznie. 180 ms daje natychmiastowe
     odczucie, ale nie doklada pracy do petli renderujacej gry. */
  if (WL) {
    timer = setInterval(() => {
      if (!booted) boot();
      if (booted && step <= MAX_ONB_STEP) render();
    }, 180);
    setTimeout(() => boot(), 300);
  }

  return {
    pokaz: render, schowaj: () => { hide(guide); hide(karta); clearTarget(); },
    pierwszyRzut, pierwszaRyba, poDecyzji,
    etap: () => step, zakres: () => BUILD_SCOPE,
    aktywny: () => step >= 0 && step !== 99
  };
})();
window.Onboarding = Onboarding;

/* Ciemny czy jasny znak na tarczy? Decyduje jasnosc tla liczona z wag
   percepcyjnych, nie ze sredniej kanalow: oko widzi zielen duzo jasniej
   niz blekit, wiec srednia dawalaby czarny znak na ciemnym granacie. */
function jasnoscHex(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
}
function ikonaSvg(id, barwa, px) {
  const i = IKONY.find(x => x.id === id) || IKONY[8];
  const b = BARWY.find(x => x.id === barwa);
  const s = b ? null : (window.STROJE || []).find(x => x.id === barwa);
  const tlo = b ? b.hex : (s ? s.prob : '#4E9A3A');
  const znak = jasnoscHex(tlo) > 0.62 ? 'rgba(24,18,10,.86)' : 'rgba(255,255,255,.94)';
  return '<svg viewBox="0 0 24 24" width="' + px + '" height="' + px + '" class="ikZ">' +
    '<circle cx="12" cy="12" r="12" fill="' + tlo + '"/>' +
    '<path d="' + i.d + '" fill="' + znak + '"/></svg>';
}
window.ikonaSvg = ikonaSvg;

/* ============================================================
   TURNIEJE.

   ZASADA: PO DOLACZENIU GRACZ NIE ROBI JUZ NIC.
   Zadnego zglaszania, zadnego odswiezania, zadnego wchodzenia w panel.
   Ryba wpisana do atlasu jest w tej samej chwili wpisana do kazdego
   turnieju, w ktorym gracz siedzi. Pasek u gory ekranu chodzi sam.

   JEDNO ZAPYTANIE NA WSZYSTKO. turnieje_stan() oddaje kazdy turniej
   gracza razem z pelna tablica, wiec koszt odpytywania nie rosnie
   z liczba turniejow: pieć turniejow to dalej jedno zapytanie.

   TEMPO. Panel otwarty: co 3 sekundy, bo gracz patrzy na liczby.
   Tylko pasek: co 8 sekund, bo pasek i tak przewija sie wolniej.
   Zaden turniej nie trwa: co 3 minuty, na wypadek zaproszenia.
   ============================================================ */
const Zawody = (() => {
  const TEMPO_PANEL = 3000, TEMPO_PASEK = 8000, TEMPO_SPOCZYNEK = 180000;

  let moje = [];           /* [{ id, kod, nazwa, start, koniec, gospodarz, tablica[] }] */
  let timer = 0, tempo = TEMPO_PASEK, blad = '', wLocie = false, panelOtwarty = false;
  const kolejka = [];      /* ryby zlowione bez zasiegu */
  const sluchacze = [];
  function powiadom() { for (const f of sluchacze) { try { f(); } catch (e) {} } }

  const czynne = () => moje.filter(t => Date.now() < new Date(t.koniec).getTime());
  const trwaja = () => czynne().length > 0;
  const doKonca = t => Math.max(0, new Date(t.koniec).getTime() - Date.now());

  function wizytowka() {
    const p = Zapis.profil();
    return {
      nick: (p.nick || '').trim(),
      ikona: (p.awatar && p.awatar.ikona) || 'kolo',
      barwa: (p.awatar && (p.awatar.ikonaKolor || p.awatar.stroj)) || 'granat'
    };
  }
  function wymagajNicku() {
    const w = wizytowka();
    if (!w.nick) throw new Error('Najpierw wpisz nick i wybierz ikonę, żeby znajomi wiedzieli, kto łowi.');
    return w;
  }

  async function zaloz(nazwa, minut) {
    const w = wymagajNicku();
    await Chmura.wolajRpc('zawody_sprzataj', {}).catch(() => {});
    const kod = await Chmura.wolajRpc('zawody_zaloz',
      { nazwa: nazwa, minut: minut, nick: w.nick, ikona: w.ikona, barwa: w.barwa });
    await odswiez();
    przestaw();
    return String(kod);
  }

  /* ============================================================
     ZALOZENIE LIGI.

     Liga to ciag rund, w kazdej inny gatunek. W rundzie licza sie WYLACZNIE
     ryby tego gatunku i tylko najlepsza sztuka, bo walka jest o najlepsza
     rybe, nie o ilosc. Po rundzie wynik dolicza sie do sumy: zwyciezca
     dostaje premie, kto nie zlowil nic, ten dostaje kare, a trzy rundy
     zamkniete pod kreska koncza udzial.

     Rozliczenie idzie po stronie bazy i leniwie, przy odswiezeniu tablicy.
     Gra nie musi nic pilnowac ani nic klikac o polnocy.
     ============================================================ */
  async function zalozLige(nazwa, gatunki, rundaGodzin, godzina, opcje) {
    const w = wymagajNicku();
    const o = opcje || {};
    /* BLAD: godzina startu liczyla sie w strefie SERWERA. Baza stoi na czasie
       uniwersalnym, gracz wybiera godzine ze swojego zegarka, wiec latem
       "start o 1" dawal pierwsza runde o 3. Wysylamy przesuniecie strefy
       w minutach; getTimezoneOffset ma znak odwrotny do potocznego. */
    const strefa = -new Date().getTimezoneOffset();
    await Chmura.wolajRpc('zawody_sprzataj', {}).catch(() => {});
    const kod = await Chmura.wolajRpc('liga_zaloz', {
      nazwa: nazwa, gatunki: gatunki,
      runda_godzin: rundaGodzin, godzina_startu: godzina,
      strefa_minut: strefa,
      nick: w.nick, ikona: w.ikona, barwa: w.barwa,
      bonus: o.bonus === undefined ? 100 : o.bonus,
      kara: o.kara === undefined ? -50 : o.kara,
      limit_minusow: o.limitMinusow === undefined ? 3 : o.limitMinusow,
      bonus_drugi: o.drugi || 0,
      bonus_trzeci: o.trzeci || 0,
      bonus_udzial: o.udzial || 0,
      mnoznik: o.mnoznik === undefined ? 100 : o.mnoznik
    });
    await odswiez();
    przestaw();
    return String(kod);
  }

  async function terminarz(id) {
    return await Chmura.wolajRpc('liga_terminarz', { zaw: id });
  }

  /* ============================================================
     NARZEDZIA GOSPODARZA.

     Korekta istnieje dla sytuacji, ktorej zaden automat nie przewidzi:
     gracze zaczeli liczyc punkty przed zalozeniem ligi, komus zawiesila sie
     aplikacja w polowie doby, ktos przez trzy dni byl w podrozy. Serwer
     dopuszcza ja wylacznie zalozycielowi turnieju albo administratorowi
     i zapisuje w rejestrze razem z powodem, wiec nic nie dzieje sie po cichu.
     ============================================================ */
  async function koryguj(id, kogo, delta, powod) {
    const w = await Chmura.wolajRpc('liga_koryguj',
      { zaw: id, kogo: kogo, delta: Math.round(delta), powod: powod });
    await odswiez();
    return w;
  }
  async function przywroc(id, kogo) {
    await Chmura.wolajRpc('liga_przywroc', { zaw: id, kogo: kogo });
    await odswiez();
  }
  async function korekty(id) {
    return await Chmura.wolajRpc('liga_korekty', { zaw: id });
  }

  async function dolacz(kod) {
    const w = wymagajNicku();
    const o = await Chmura.wolajRpc('zawody_dolacz',
      { kod: String(kod).toUpperCase().trim(), nick: w.nick, ikona: w.ikona, barwa: w.barwa });
    const z = Array.isArray(o) ? o[0] : o;
    if (!z || !z.id) throw new Error('Nie ma turnieju o takim kodzie.');
    await odswiez();
    przestaw();
    return z;
  }

  async function opusc(id) {
    await Chmura.wolajRpc('zawody_opusc', { zaw: id });
    moje = moje.filter(t => t.id !== id);
    powiadom();
    await odswiez();
  }

  /* ============================================================
     ZGLOSZENIE RYBY. Wolane w tej samej chwili co wpis do atlasu,
     dla KAZDEGO czynnego turnieju naraz. Brak zasiegu nie gubi wyniku:
     ryba ląduje w kolejce i idzie razem z nastepnym udanym zgloszeniem.
     ============================================================ */
  /* ============================================================
     WAGA I DLUGOSC JADA RAZEM Z PUNKTAMI (IX 2026).
     W lidze liczy sie X-Score najlepszej sztuki gatunku doby, a remis
     rozstrzyga waga, potem dlugosc. Do tej pory do bazy szly wylacznie
     punkty i gatunek, wiec remisu nie bylo CZYM rozstrzygnac -- serwer
     nie dostawal tych liczb wcale.

     Po stronie bazy oba nowe argumenty maja wartosci domyslne, wiec
     kolejnosc wgrywania nie ma znaczenia: nowa gra na starej funkcji
     i tak by dzialala, tylko bez rozstrzygania remisu.
     ============================================================ */
  function zglos(gat, pkt, waga, cm) {
    /* TURNIEJE TYLKO Z KONTEM Z MAILEM (IX 2026). Wczesniej wystarczala
       wazna sesja, czyli takze konto anonimowe -- stad zawodnik ANONIM
       w tabelach. Jeden mail to jeden gracz. */
    if (!Chmura.pelnyDostep()) return;
    const cz = czynne();
    if (!cz.length) return;
    for (const t of cz) kolejka.push({
      zaw: t.id, gat: gat, pkt: Math.round(pkt),
      waga: Math.round(waga || 0), cm: Math.round((cm || 0) * 10) / 10
    });
    wyslijKolejke();
  }
  async function wyslijKolejke() {
    if (wLocie || !kolejka.length) return;
    wLocie = true;
    try {
      while (kolejka.length) {
        const r = kolejka[0];
        await Chmura.wolajRpc('zawody_zglos', { zaw: r.zaw, pkt: r.pkt, gat: r.gat,
                                                waga: r.waga || 0, cm: r.cm || 0 });
        kolejka.shift();
      }
      blad = '';
      await odswiez();
    } catch (e) {
      blad = e.message || 'Nie udało się zgłosić ryby.';
    } finally { wLocie = false; powiadom(); }
  }

  async function odswiez() {
    if (!Chmura.pelnyDostep()) { moje = []; powiadom(); return; }
    try {
      const o = await Chmura.wolajRpc('turnieje_stan', {});
      moje = Array.isArray(o) ? o : [];
      blad = '';
    } catch (e) { blad = e.message || 'Brak połączenia.'; }
    powiadom();
  }

  function tempoDocelowe() {
    if (panelOtwarty) return TEMPO_PANEL;
    return trwaja() ? TEMPO_PASEK : TEMPO_SPOCZYNEK;
  }
  function przestaw() {
    clearTimeout(timer);
    if (!Chmura.pelnyDostep()) return;
    tempo = tempoDocelowe();
    timer = setTimeout(async () => { await odswiez(); przestaw(); }, tempo);
  }
  function tempoPanelu(otwarty) { panelOtwarty = !!otwarty; przestaw(); }

  function mojWiersz(t) {
    const uid = Chmura.uid();
    return (t.tablica || []).find(w => w.gracz === uid) || null;
  }
  function mojaPozycja(t) {
    const uid = Chmura.uid();
    const i = (t.tablica || []).findIndex(w => w.gracz === uid);
    return i < 0 ? 0 : i + 1;
  }

  /* Start dopiero po zalogowaniu, i natychmiast po nim. */
  if (typeof Chmura !== 'undefined') {
    Chmura.nasluchuj(() => { if (Chmura.pelnyDostep()) { odswiez().then(przestaw); } else { moje = []; clearTimeout(timer); powiadom(); } });
    if (Chmura.pelnyDostep()) { odswiez().then(przestaw); }
  }

  return { zaloz, zalozLige, terminarz, koryguj, przywroc, korekty,
           dolacz, opusc, zglos, odswiez, tempoPanelu,
           moje: () => moje, czynne, trwaja, doKonca,
           mojWiersz, mojaPozycja, blad: () => blad,
           nasluchuj: f => sluchacze.push(f) };
})();
window.Zawody = Zawody;

/* ============================================================
   EKONOMIA NAGROD TURNIEJOWYCH (IX 2026, zyczenie Andrzeja z konkretnymi
   liczbami: "zwyciezca turnieju dwuosobowego na 30 minut wygrywa 50 000,
   a przegrany 15 000... 3 osoby: 80 000/30 000/15 000 przy 30 minutach...
   przy godzinie: 200 000/80 000/40 000").

   Trzy oddzielne, skladane czynniki:
   1. KONSOLACJA_MIN[czas] -- podloga (nagroda za OSTATNIE miejsce),
      zalezna WYLACZNIE od dlugosci turnieju. Gra oferuje dokladnie
      cztery dlugosci w UI (18, przycisk "zawCzas": 30/60/180/1440 min),
      wiec to zamkniety, ręcznie dobrany stol, nie formula -- ale z
      formula zapasowa na wypadek innej wartosci w przyszlosci.
      Odkryte wprost z podanych liczb: podloga dla 3 graczy = podloga
      dla 2 graczy przy tym samym czasie (15 000 w obu przypadkach przy
      30 min) -- ostatnie miejsce NIE ZALEZY od liczby graczy, tylko
      od czasu.
   2. Kazde miejsce POZA pierwszym i ostatnim: PLYNNA interpolacja
      miedzy podloga (ostatni) i wygrana (pierwszy), z wykladnikiem
      2.1 -- dobranym tak, zeby przy 3 graczach/30 min dac dokladnie
      2. miejsce = 30 000 (2x podlogi, scisle jak w zyczeniu). Wybrana
      INTERPOLACJA, nie proste podwajanie kazdego kroku w gore, bo
      podwajanie eksploduje przy wiekszej liczbie graczy (juz przy N=6
      2. miejsce przescignelo by 1., co jest bez sensu) -- interpolacja
      jest z definicji ograniczona przez wygrana, nie ma jak "przekrzyczec"
      zwyciezcy niezaleznie od N.
   3. Wygrana (1. miejsce) = KONSOLACJA * mnoznikZwycTurniej(N), gdzie
      mnoznik rosnie z liczba graczy (pokonanie wiekszej grupy jest
      warte wiecej) -- kalibrowany na 30-minutowych przykladach z obu
      podanych N (2 i 3), zeby miec DWA punkty do wyznaczenia krzywej,
      nie jeden.

   Trzy konkretne podane kombinacje (2 os./30 min, 3 os./30 min,
   3 os./60 min) sa wpisane WPROST w NAGRODA_WZORCE, zeby dac dokladnie
   te liczby, ktore padly, co do zlotowki -- formula powyzej dochodzi
   do nich na kilka procent, ale "na kilka procent" to nie to samo co
   "dokladnie tyle, ile podyktowano". Formula rzadzi WSZYSTKIM innym:
   inna liczba graczy, inny z czterech czasow, dowolna kombinacja. */
const KONSOLACJA_MIN = { 30: 15000, 60: 40000, 180: 120000, 1440: 450000 };
function konsolacjaTurniejowa(minut) {
  if (KONSOLACJA_MIN[minut]) return KONSOLACJA_MIN[minut];
  /* Zapasowa dla czasu spoza czworki z UI -- ten sam ksztalt krzywej,
     co widac miedzy 30 a 60 minutami w tabeli (~2,67x za podwojenie
     czasu, wykladnik potegowy log2(2,67)=1,42). */
  return Math.round(15000 * Math.pow(minut / 30, 1.42) / 500) * 500;
}
function mnoznikZwycTurniej(N) {
  /* (10/3) przy N=2 daje dokladnie podane 50 000 (15 000*10/3). Wykladnik
     1,2 dobrany tak, zeby N=3 wyszlo bardzo blisko podanych 80 000/200 000
     (formula: ~81-85 tys., realne wartosci dla N=3 i tak ida z tabeli
     wzorcow powyzej, wiec to przyblizenie liczy sie dopiero od N=4). */
  return (10 / 3) * Math.pow(N / 2, 1.2);
}
const NAGRODA_WZORCE = {
  '2:30': [50000, 15000],
  '3:30': [80000, 30000, 15000],
  '3:60': [200000, 80000, 40000]
};
function nagrodaTurnieju(miejsce, N, minut) {
  if (!(N >= 2) || !(miejsce >= 1) || miejsce > N) return 0;
  const wzorzec = NAGRODA_WZORCE[N + ':' + minut];
  if (wzorzec) return wzorzec[miejsce - 1];
  const K = konsolacjaTurniejowa(minut);
  const W = K * mnoznikZwycTurniej(N);
  if (miejsce === 1) return Math.round(W / 500) * 500;
  if (miejsce === N) return K;
  const t = (N - miejsce) / (N - 1);         // 1 dla 2. miejsce ... ~0 dla ostatniego
  return Math.round((K + (W - K) * Math.pow(t, 2.1)) / 500) * 500;
}
window.nagrodaTurnieju = nagrodaTurnieju;
window.konsolacjaTurniejowa = konsolacjaTurniejowa;

/* ============================================================
   WYKRYCIE KONCA TURNIEJU I WYPLATA (IX 2026).

   Serwer NIE kasuje turnieju w chwili konca zegara -- sprzatanie
   (zawody_sprzataj) odpala sie dopiero przy zalozeniu NASTEPNEGO
   turnieju przez KOGOKOLWIEK. Miedzy koncem zegara a sprzataniem
   Zawody.moje() dalej zwraca ten turniej, z KOMPLETNA, juz nieruszalna
   tablica wynikow -- to jest okno, w ktorym gra moze rozpoznac koniec
   i wyplacic, korzystajac WYLACZNIE z danych, ktore juz i tak splywaly
   przez zwykle odpytywanie paska turniejowego. Zero nowych zapytan do
   serwera, zero nowego kodu integracji -- to jest klientowe czytanie
   danych, ktore juz tu byly.
   Wyplata jest taka sama jak KAZDA inna nagroda w tej grze (zadania,
   komplet pasma, atlas, rekordy): liczy sie i zapisuje lokalnie, bez
   weryfikacji serwera. To NIE jest mniej bezpieczne niz cokolwiek
   innego w Zapis -- caly ten zapis juz dzis dziala na zaufaniu do
   klienta, tak jak kazda inna gra jednoosobowa z lokalnym zapisem.
   Idempotencja: Zapis.turniejJuzWyplacony(id) sprawdza historie PRZED
   wyplata, wiec ten sam turniej zlapany w dwoch kolejnych odpytaniach
   (zanim serwer go posprzata) nie zaplaci dwa razy.
   Ligi (t.tryb === 'liga') sa POMINIETE calkowicie -- maja wlasna,
   odrebna ekonomie (bonus/kara za runde), nie ta z tego zyczenia. */
(function wyplataTurniejowa() {
  function skonczoneNiewyplacone() {
    if (typeof Zawody === 'undefined' || typeof Zapis === 'undefined') return [];
    return Zawody.moje().filter(t =>
      t.tryb !== 'liga' &&
      (t.tablica || []).length >= 2 &&
      Zawody.doKonca(t) <= 0 &&
      !Zapis.turniejJuzWyplacony(t.id));
  }
  function sprawdz() {
    for (const t of skonczoneNiewyplacone()) {
      const N = (t.tablica || []).length;
      const miejsce = Zawody.mojaPozycja(t);
      if (!miejsce) continue;              /* nie ma mnie w tej tablicy -- nic do wyplaty */
      const minut = Math.max(1, Math.round((new Date(t.koniec).getTime() - new Date(t.start).getTime()) / 60000));
      const nagroda = nagrodaTurnieju(miejsce, N, minut);
      const wpis = Zapis.zapiszTurniej({ id: t.id, nazwa: t.nazwa, minut: minut, gracze: N, miejsce: miejsce, nagroda: nagroda });
      if (typeof Ruch !== 'undefined' && Ruch.zaRekord) {
        Ruch.zaRekord(nagroda, ['TURNIEJ \u00B7 ' + miejsce + '. MIEJSCE']);
      }
      if (typeof window.pokazWynikTurnieju === 'function') {
        window.pokazWynikTurnieju(t, wpis);
      }
    }
  }
  if (typeof Zawody !== 'undefined') Zawody.nasluchuj(sprawdz);
})();

/* ============================================================
   PASEK TURNIEJOWY. Rysuje sie z dwoch zrodel: z odpowiedzi serwera
   przez nasluch modulu i co sekunde z zegara, bo czas leci takze wtedy,
   gdy nikt nic nie lowi.

   Przy kilku turniejach naraz plakietka po lewej zmienia sie co osiem
   sekund, a przewijana tresc razem z nia. Jeden pasek, kolejka turniejow,
   zero decyzji po stronie gracza.
   ============================================================ */
(function pasekTurniejowy() {
  const pas = document.getElementById('pasekTV');
  const etyk = document.getElementById('pasekTVetyk');
  const tresc = document.getElementById('pasekTVtresc');
  if (!pas || !etyk || !tresc) return;
  let ktory = 0, ostatniPodpis = '', aktywnyTurniej = null;
  let rozwiniety = false;
  const listaPelna = document.getElementById('pasekTVlista');

  function zegar(ms) {
    if (ms <= 0) return 'PO GWIZDKU';
    const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
    if (h >= 24) return Math.floor(h / 24) + ' d ' + (h % 24) + ' h';
    if (h >= 1) return h + ' h ' + String(m % 60).padStart(2, '0') + ' min';
    return m + ':' + String(s % 60).padStart(2, '0');
  }

  function zegarPaska(ms) {
    if (ms <= 0) return 'KONIEC';
    const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
    if (h >= 24) return Math.floor(h / 24) + 'd' + (h % 24) + 'h';
    if (h >= 1) return h + 'h' + String(m % 60).padStart(2, '0') + 'm';
    return m + ':' + String(s % 60).padStart(2, '0');
  }

  /* ============================================================
     TRESC PASKA.

     W turnieju otwartym jedzie jedna tabela. W lidze jada DWIE, jak na
     pasku informacyjnym w telewizji: najpierw wyniki trwajacej rundy,
     potem tabela calego sezonu, oddzielone naglowkiem. Na czele rundy
     stoi miniaturka ryby, o ktora dzisiaj idzie gra, zeby nie trzeba bylo
     czytac nazwy: rybak rozpoznaje sylwetke szybciej niz slowo.
     ============================================================ */
  function rybka(slug, px) {
    const g2 = window.GATUNKI && GATUNKI[slug];
    if (!g2 || !g2.src) return '';
    return '<img class="rb" src="' + g2.src + '" height="' + px + '" alt="">';
  }

  function wiersz(w, i, uid, wartosc, ogon, wyel) {
    return '<span class="wpis' + (w.gracz === uid ? ' mj' : '') + (wyel ? ' out' : '') + '">' +
      ikonaSvg(w.ikona, w.barwa, 16) +
      '<i>' + i + '.</i>' + String(w.nick || 'ANONIM').replace(/</g, '&lt;') +
      ' <b>' + wartosc + '</b>' + ogon + '</span><span class="sep">\u2022</span>';
  }

  function wpisy(t) {
    const uid = (typeof Chmura !== 'undefined') ? Chmura.uid() : '';
    const liga = t.tryb === 'liga';
    const tab = t.tablica || [];
    if (!tab.length) return '<span class="wpis">Jeszcze nikt nic nie złowił</span>';

    if (!liga) {
      return tab.map((w, i) => wiersz(w, i + 1, uid, w.punkty,
        ' pkt <i>' + w.sztuk + ' szt.</i>', false)).join('');
    }

    let out = '';
    if (t.runda) {
      const nazwa = (window.GATUNKI && GATUNKI[t.runda.gatunek])
        ? GATUNKI[t.runda.gatunek].nazwa : t.runda.gatunek;
      out += '<span class="dzial">' + rybka(t.runda.gatunek, 22) +
             'RUNDA ' + t.runda.nr + ': ' + nazwa + '</span><span class="sep">\u2022</span>';
      const wRundzie = tab.filter(w => !w.wyeliminowany)
        .slice().sort((a, b) => b.runda_pkt - a.runda_pkt);
      const cos = wRundzie.some(w => w.runda_pkt > 0);
      out += cos
        ? wRundzie.map((w, i) => wiersz(w, i + 1, uid, w.runda_pkt, ' pkt', false)).join('')
        : '<span class="wpis">Nikt jeszcze nie wziął tej ryby</span><span class="sep">\u2022</span>';
    }
    out += '<span class="dzial">SEZON \u00B7 ' + (t.rund || 0) + ' RUND</span><span class="sep">\u2022</span>';
    out += tab.map((w, i) => wiersz(w, i + 1, uid, w.suma,
      w.wyeliminowany ? ' <i>ODPADŁ</i>'
        : ' pkt' + (w.minusy ? ' <i>' + w.minusy + '\u2212</i>' : ''),
      w.wyeliminowany)).join('');
    return out;
  }

  function renderPelnejTabeli(t) {
    if(!listaPelna||!t)return;
    const uid=(typeof Chmura!=='undefined')?Chmura.uid():'';
    const liga=t.tryb==='liga';
    const tab=(t.tablica||[]).slice();
    let nag=liga?'SEZON · PEŁNA TABELA':'TURNIEJ · PEŁNA TABELA';
    if(liga&&t.runda)nag+=' · RUNDA '+t.runda.nr+'/'+(t.rund||'?');

    let h='<div class="tvListHead"><span>'+nag+'</span><span>TABELA NA ŻĄDANIE</span></div>';
    if(!tab.length){
      listaPelna.innerHTML=h+'<div class="tvListRow"><span class="pos">—</span><span class="nick">Jeszcze brak wyników</span><span class="pts">0</span></div>';
      return;
    }
    tab.forEach((w,i)=>{
      const pkt=liga?(Number(w.suma)||0):(Number(w.punkty)||0);
      h+='<div class="tvListRow'+(w.gracz===uid?' me':'')+(w.wyeliminowany?' out':'')+'">'
        +'<span class="pos">'+(i+1)+'.</span>'
        +'<span class="nick">'+String(w.nick||'ANONIM').replace(/[<>&]/g,'')+'</span>'
        +'<span class="pts">'+pkt+' pkt</span></div>';
    });
    listaPelna.innerHTML=h;
  }

  function ustawRozwiniecie(stan) {
    rozwiniety=!!stan;
    pas.classList.toggle('rozwiniety',rozwiniety);
    pas.setAttribute('aria-expanded',String(rozwiniety));

    /* PEŁNA TABELA LIGI nie jest zwykłym #panel. Poprzednie poprawki
       chowały MENU tylko dla paneli, więc rozwinięty ticker dalej miał
       przycisk MENU nad tabelą. Tutaj spinamy stan BEZPOŚREDNIO z tym
       konkretnym overlayem i dodatkowo ustawiamy inline display jako
       fallback dla mobilnych WebView/Chrome, żeby nie zależeć od :has(). */
    document.body.classList.toggle('liga-tabela-otwarta', rozwiniety);
    const menuMaster = document.getElementById('menuMaster');
    const lakeClock = document.getElementById('lakeClock');
    const tarla = document.getElementById('tarla');
    if (menuMaster) {
      menuMaster.style.display = rozwiniety ? 'none' : '';
      menuMaster.style.pointerEvents = rozwiniety ? 'none' : '';
    }
    if (lakeClock) lakeClock.style.display = rozwiniety ? 'none' : '';
    if (tarla) tarla.style.display = rozwiniety ? 'none' : '';

    if(rozwiniety&&aktywnyTurniej)renderPelnejTabeli(aktywnyTurniej);
  }

  pas.addEventListener('click',e=>{
    e.stopPropagation();
    ustawRozwiniecie(!rozwiniety);
    try{if(window.Telemetry)Telemetry.event('league_ticker_toggle',{open:rozwiniety});}catch(err){}
  });
  pas.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();ustawRozwiniecie(!rozwiniety);}
  });

  function rysuj() {
    const lista = (typeof Zawody === 'undefined') ? [] : Zawody.moje();
    if (!lista.length) {
      document.body.classList.remove('z-paskiem'); ostatniPodpis=''; aktywnyTurniej=null;
      ustawRozwiniecie(false); return;
    }
    document.body.classList.add('z-paskiem');
    /* Kolejka turniejow: co osiem sekund nastepny. */
    ktory = Math.floor(Date.now() / 8000) % lista.length;
    const t = lista[ktory];
    aktywnyTurniej=t;
    if(rozwiniety)renderPelnejTabeli(t);
    const liga = t.tryb === 'liga';
    /* W lidze zegar odmierza do konca RUNDY, nie do konca calej ligi:
       to koniec doby jest terminem, po ktorym punkty przepadaja. */
    const ms = liga && t.runda ? Math.max(0, new Date(t.runda.koniec).getTime() - Date.now())
                               : Zawody.doKonca(t);
    const poz = Zawody.mojaPozycja(t);
    const gat = liga && t.runda ? (window.GATUNKI && GATUNKI[t.runda.gatunek]
                                   ? GATUNKI[t.runda.gatunek].nazwa : t.runda.gatunek) : '';
    etyk.innerHTML = (liga && gat
        ? 'RUNDA ' + t.runda.nr + '/' + t.rund + ' \u00B7 ' + gat
        : String(t.nazwa).replace(/</g, '&lt;').toUpperCase()) +
      ' <b>' + zegarPaska(ms) + '</b>' + (poz ? ' \u00B7 ' + poz + '/' + (t.tablica || []).length : '');
    /* Podpis chroni przed przerysowaniem co sekunde: dopoki tablica sie
       nie zmienila, nie ruszamy DOM i animacja nie skacze od poczatku. */
    const podpis = t.id + '|' + (t.tablica || []).map(w => w.gracz + ':' + w.punkty).join(',');
    if (podpis === ostatniPodpis) return;
    ostatniPodpis = podpis;
    const jeden = wpisy(t);
    tresc.innerHTML = jeden + jeden;      /* podwojone, zeby petla domykala sie bez skoku */
    /* Czas przewijania z dlugosci tresci: stala predkosc 46 px na sekunde. */
    requestAnimationFrame(() => {
      const szer = tresc.scrollWidth / 2 || 400;
      tresc.style.animationDuration = Math.max(8, szer / 46) + 's';
    });
  }

  /* ============================================================
     WYKRYCIE NOWEJ RUNDY.

     Klucz to para "turniej i numer rundy". Zapamietujemy go w Magazynie,
     nie w pamieci, bo gra bywa zamykana miedzy dobami i baner ma sie
     pokazac takze po pierwszym otwarciu nastepnego dnia.

     Pierwsze uruchomienie po dolaczeniu NIE pokazuje banera: gracz wlasnie
     sam kliknal DOLACZ i wie, w co wchodzi. Zapisujemy wtedy stan po cichu.
     ============================================================ */
  const K_RUNDA = 'liga.ostatniaRunda';
  function znaneRundy() {
    try { return JSON.parse(Magazyn.czytaj(K_RUNDA) || '{}'); } catch (e) { return {}; }
  }
  function zapamietajRunde(mapa) { Magazyn.pisz(K_RUNDA, JSON.stringify(mapa)); }

  const baner = document.getElementById('nowaRunda');
  let banerTimer = 0, banerGas = 0;
  function pokazBaner(t, r, pierwszy) {
    if (!baner) return;
    const nazwa = (window.GATUNKI && GATUNKI[r.gatunek]) ? GATUNKI[r.gatunek].nazwa : r.gatunek;
    const g2 = window.GATUNKI && GATUNKI[r.gatunek];
    baner.innerHTML =
      '<span>' + (pierwszy ? 'TURNIEJ RUSZYŁ' : 'NOWA RUNDA') + ' \u00B7 ' +
      String(t.nazwa).replace(/</g, '&lt;').toUpperCase() + '</span>' +
      '<b>' + nazwa + '</b>' +
      (g2 && g2.src ? '<img src="' + g2.src + '" height="34" alt="">' : '') +
      '<i>runda ' + r.nr + ' z ' + (t.rund || '?') + ' \u00B7 liczy się najlepsza sztuka</i>';
    baner.classList.remove('gasnie');
    baner.classList.add('on');
    if (navigator.vibrate) { try { navigator.vibrate([18, 40, 18, 40, 30]); } catch (e) {} }
    clearTimeout(banerTimer); clearTimeout(banerGas);
    banerTimer = setTimeout(() => {
      baner.classList.add('gasnie');
      banerGas = setTimeout(() => baner.classList.remove('on', 'gasnie'), 700);
    }, 32000);
  }

  function sprawdzRundy() {
    if (typeof Zawody === 'undefined') return;
    const mapa = znaneRundy();
    let zmiana = false, doPokazu = null;
    for (const t of Zawody.moje()) {
      if (t.tryb !== 'liga' || !t.runda) continue;
      const bylo = mapa[t.id];
      if (bylo === t.runda.nr) continue;
      mapa[t.id] = t.runda.nr;
      zmiana = true;
      /* baner tylko dla PRZEJSCIA, nie dla pierwszego poznania turnieju
         w rundzie innej niz pierwsza: wtedy gracz dopiero dolaczyl */
      if (bylo !== undefined || t.runda.nr === 1) doPokazu = { t: t, r: t.runda, p: bylo === undefined };
    }
    if (zmiana) zapamietajRunde(mapa);
    if (doPokazu) pokazBaner(doPokazu.t, doPokazu.r, doPokazu.p);
  }

  if (typeof Zawody !== 'undefined') Zawody.nasluchuj(() => { rysuj(); sprawdzRundy(); });
  setInterval(rysuj, 1000);
  rysuj();
})();
