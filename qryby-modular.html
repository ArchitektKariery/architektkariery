<script>/* ============================================================
   QRyby - ZEGAR. Maly wyswietlacz z godzina i data w grze,
   w prawym dolnym rogu kadru.

   Bierze czas z PORA, jesli modul jest wpiety. Jesli nie, prowadzi wlasny
   zegar tak samo: start z realnej daty i godziny, potem 1 minuta realna
   na 1 godzine w grze, doba w 24 minuty.

   Rysowany z bitmapy 3x5, tak samo jak cyfry w medalionie, wiec zostaje
   ostry na plotnie 768 px z wylaczonym wygladzaniem. Kolor plyty i cyfr
   idzie z palety PORA, wiec zegar ciemnieje razem z niebem i nie odcina sie
   od sceny nocy jak przyklejona etykieta.
   ============================================================ */

const Zegar = (() => {

  const ZNAKI = {
    '0':["111","101","101","101","111"], '1':["010","110","010","010","111"],
    '2':["111","001","111","100","111"], '3':["111","001","111","001","111"],
    '4':["101","101","111","001","001"], '5':["111","100","111","001","111"],
    '6':["111","100","111","101","111"], '7':["111","001","001","001","001"],
    '8':["111","101","111","101","111"], '9':["111","101","111","001","111"],
    ':':["000","010","000","010","000"], ' ':["000","000","000","000","000"],
    'S':["111","100","111","001","111"], 'T':["111","010","010","010","010"],
    'Y':["101","101","010","010","010"], 'L':["100","100","100","100","111"],
    'U':["101","101","101","101","111"], 'M':["101","111","111","101","101"],
    'A':["111","101","111","101","101"], 'R':["110","101","110","101","101"],
    'K':["101","101","110","101","101"], 'W':["101","101","111","111","101"],
    'I':["111","010","010","010","111"], 'J':["001","001","001","101","111"],
    'C':["111","100","100","100","111"], 'Z':["111","001","010","100","111"],
    'E':["111","100","111","100","111"], 'P':["111","101","111","100","100"],
    'G':["111","100","101","101","111"], 'N':["101","111","111","111","101"],
    'O':["111","101","101","101","111"], 'D':["110","101","101","101","110"],
    'B':["110","101","110","101","110"], 'F':["111","100","111","100","100"],
    /* Polskie znaki dorobione w tej samej siatce 3x5. Bez nich napisy
       DZIS, LAWIC i LAWICA gubily pierwsza litere i caly szyld sie rozjezdzal,
       bo szerokosc liczyla znak, ktorego font nie potrafil narysowac. */
    'Ą':["010","101","111","101","111"], 'Ć':["001","111","100","100","111"], 'Ę':["111","100","110","100","111"], 'Ł':["100","101","110","100","111"], 'Ń':["001","101","111","101","101"], 'Ó':["001","111","101","101","111"], 'Ś':["001","111","100","111","111"], 'Ź':["001","111","001","010","111"], 'Ż':["010","111","001","010","111"]
  };
  const MIESIACE = ['STY','LUT','MAR','KWI','MAJ','CZE','LIP','SIE','WRZ','PAZ','LIS','GRU'];
  /* dni w miesiacach, rok nieprzestepny; gra nie potrzebuje 29 lutego */
  const DNI = [31,28,31,30,31,30,31,31,30,31,30,31];

  function dzienNaDate(n) {
    let d = ((n - 1) % 365) + 1, m = 0;
    while (d > DNI[m]) { d -= DNI[m]; m++; }
    return { dzien: d, miesiac: m };
  }

  /* Zapasowy zegar na wypadek braku PORA */
  const wlasny = { godzina: null, dzien: null, tempo: 60 };
  function stanCzasu(dt) {
    if (window.PORA && PORA.teraz) {
      const s = PORA.teraz();
      return { godzina: s.godzina, dzienRoku: s.dzien, paleta: s.paleta };
    }
    if (wlasny.godzina == null) {
      const d = new Date();
      wlasny.godzina = d.getHours() + d.getMinutes()/60;
      wlasny.dzien = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
    }
    if (dt) {
      wlasny.godzina += dt * wlasny.tempo / 3600;
      while (wlasny.godzina >= 24) { wlasny.godzina -= 24; wlasny.dzien++; }
    }
    return { godzina: wlasny.godzina, dzienRoku: wlasny.dzien, paleta: null };
  }

  function pisz(g, tekst, x, y, px, kolor, obrys) {
    for (const faza of [0, 1]) {
      let xx = x;
      for (const c of tekst) {
        const wz = ZNAKI[c] || ZNAKI[' '];
        for (let ry = 0; ry < 5; ry++) for (let rx = 0; rx < 3; rx++) {
          if (wz[ry][rx] !== '1') continue;
          const X = xx + rx*px, Y = y + ry*px;
          if (faza === 0) { const o = Math.max(1, Math.floor(px/2));
            g.fillStyle = obrys; g.fillRect(X - o, Y - o, px + 2*o, px + 2*o); }
          else { g.fillStyle = kolor; g.fillRect(X, Y, px, px); }
        }
        xx += 4*px;
      }
    }
  }
  const szer = (tekst, px) => tekst.length * 4 * px - px;


  /* Zwraca prostokat plotna, ktory na pewno widac, w pikselach plotna.
     Liczy odwzorowanie object-fit: cover z rzeczywistego rozmiaru elementu,
     wiec dziala na kazdym telefonie bez zgadywania marginesu. */
  function bezpieczny(g, W, H, margines) {
    const m = margines || 10;
    let scinaneX = 0, scinaneY = 0;
    const c = g && g.canvas;
    if (c && typeof c.getBoundingClientRect === 'function') {
      const r = c.getBoundingClientRect();
      if (r.width > 0 && r.height > 0) {
        const skala = Math.max(r.width / W, r.height / H);
        scinaneX = Math.max(0, (W - r.width / skala) / 2);
        scinaneY = Math.max(0, (H - r.height / skala) / 2);
      }
    } else {
      /* Bez DOM przyjmuje najgorszy realny przypadek: 88 px z boku. */
      scinaneX = 88;
    }
    return {
      lewa:  scinaneX + m,       prawa: W - scinaneX - m,
      gora:  scinaneY + m,       dol:   H - scinaneY - m,
      scinaneX: Math.round(scinaneX), scinaneY: Math.round(scinaneY)
    };
  }

  /* g - kontekst sceny, W i H - kadr, dt - sekundy realne od poprzedniej
     klatki. Mozna pominac: wtedy modul liczy dt sam z zegara przegladarki,
     zeby dalo sie go wpiac jedna linia w dowolnym miejscu petli rysowania. */
  let ostatniCzas = null;
  function rysuj(g, W, H, dt, ust) {
    if (dt == null) {
      const teraz = (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000;
      dt = ostatniCzas == null ? 0 : Math.min(0.5, teraz - ostatniCzas);
      ostatniCzas = teraz;
    }
    const u = Object.assign({ px: 3, margines: 14, alfa: 0.82 }, ust || {});
    const s = stanCzasu(dt);
    const d = dzienNaDate(s.dzienRoku);
    const hh = String(Math.floor(s.godzina)).padStart(2, '0');
    const mm = String(Math.floor(s.godzina % 1 * 60)).padStart(2, '0');
    const gora = hh + ':' + mm;
    const dol = String(d.dzien) + ' ' + MIESIACE[d.miesiac];
    const px = u.px, odstep = px * 2;
    /* Rekord sesji nad zegarem. Mniejsza kratka, bo linia jest dluga,
       a ma nie rozpychac plyty ponad to, co i tak miesci sie w bezpiecznym
       obszarze na najwezszym telefonie. */
    /* Rekord DOBY, nie sesji: nowa lawica juz go nie kasuje, zeruje sie sam
       o polnocy razem z reszta licznikow dobowych. */
    let rekV = 0;
    if (typeof Zapis !== 'undefined') { Zapis.nowaDoba(); rekV = Zapis.dane().stat.dobaRekord || 0; }
    if (!rekV && typeof Zegar !== 'undefined') rekV = Zegar.rekordSesji || 0;
    const rek = rekV > 0 ? 'REKORD DOBY ' + Math.round(rekV) : null;
    /* Dwie linie dobowe pod rekordem sesji: ile ryb zlowionych od polnocy
       i ile razy odswiezona lawica. Licza sie w zapisie, wiec przezywaja
       zamkniecie gry i zeruja sie same o polnocy czasu lokalnego. */
    let dob1 = null, dob2 = null;
    if (typeof Zapis !== 'undefined') {
      Zapis.nowaDoba();
      const st = Zapis.dane().stat;
      if (st.dobaPunkty > 0) dob1 = 'DZIŚ ' + st.dobaPunkty + ' PKT Z ' + st.dobaSztuk + ' RYB';
      if (st.dobaOdswiezen > 0) dob2 = 'ŁAWIC ' + st.dobaOdswiezen;
    }
    const pxR = Math.max(2, px - 1);
    /* Ile zostalo do wymiany lawicy. Ostatnie dziesiec sekund idzie
       osobnym kolorem, bo wtedy ryby zaczynaja spływać z kadru i warto
       wiedziec, ze to nie przypadek. */
    let dob3 = null, pilne = false;
    if (typeof CYKL !== 'undefined' && CYKL.okres) {
      const zostalo = Math.max(0, Math.ceil(CYKL.okres - CYKL.t));
      pilne = zostalo <= 10;
      dob3 = 'ŁAWICA ' + zostalo + ' S';
    }
    const linieD = [dob1, dob2, dob3].filter(Boolean);
    const w = Math.max(szer(gora, px), szer(dol, px), rek ? szer(rek, pxR) : 0,
                       ...linieD.map(t => szer(t, pxR)));
    const h = 5*px*2 + odstep + (rek ? 5*pxR + odstep : 0)
              + linieD.length * (5*pxR + odstep);
    const pad = px * 2;
    /* Bezpieczny obszar zamiast stalego marginesu od krawedzi plotna.
       Plotno ma 768x1316, czyli proporcje 0.584, a CSS trzyma je na
       object-fit: cover. Na telefonie wezszym niz to przycina sie z bokow
       i nic tam nie widac: Galaxy S w pelnym ekranie gubi 80 px z kazdej
       strony, S Ultra 88 px, Pixel 7 61 px. Zegar z marginesem 10 px
       siedzial w calosci w scietym pasie. */
    const b = bezpieczny(g, W, H, u.margines);
    const x0 = b.prawa - w - pad, y0 = b.dol - h - pad;

    /* Plyta bierze kolor z palety nieba, wiec nocą ciemnieje razem ze scena. */
    const p = s.paleta;
    /* Tlo ciemniejsze i gestsze niz wczesniej: 0,45 jasnosci dna zamiast 0,70
       i krycie podbite o jedna trzecia, zeby napisy mialy na czym stac. */
    const alfaT = Math.min(1, (u.alfa || 0.6) * 1.35);
    const tlo = p ? `rgba(${Math.round(p.dno[0]*0.45)},${Math.round(p.dno[1]*0.45)},${Math.round(p.dno[2]*0.45)},${alfaT})`
                  : `rgba(9,6,18,${alfaT})`;
    const ram = p ? `rgb(${p.swiatlo[0]},${p.swiatlo[1]},${p.swiatlo[2]})` : '#E4A824';
    g.save();
    g.fillStyle = tlo;
    g.fillRect(x0 - pad, y0 - pad, w + pad*3, h + pad*3);
    g.fillStyle = ram; g.globalAlpha = 0.55;
    g.fillRect(x0 - pad, y0 - pad, w + pad*3, 1);
    g.fillRect(x0 - pad, y0 - pad, 1, h + pad*3);
    g.globalAlpha = 1;

    /* Napisy nie biora juz barwy z palety pory. Noca swiatlo palety schodzi
       do ciemnego brazu i tabliczka gasla razem ze scena. Teraz kolory sa
       stale i dobrane na kontrast wzgledem wlasnego, ciemnego tla. */
    const jasny = '#FFF6DC';
    const ciemny = 'rgba(6,4,14,0.95)';
    let yy = y0;
    if (rek) {
      /* Rekord ma wlasny, cieplejszy kolor, zeby nie zlewal sie z godzina. */
      pisz(g, rek, x0 + (w - szer(rek, pxR))/2, yy, pxR, '#FFC93C', ciemny);
      yy += 5*pxR + odstep;
    }
    for (const t of linieD) {
      const barwa = (t === dob3) ? (pilne ? '#FF7A55' : '#9FD9FF') : '#B7F0C0';
      pisz(g, t, x0 + (w - szer(t, pxR))/2, yy, pxR, barwa, ciemny);
      yy += 5*pxR + odstep;
    }
    pisz(g, gora, x0 + (w - szer(gora, px))/2, yy, px, jasny, ciemny);
    pisz(g, dol,  x0 + (w - szer(dol, px))/2, yy + 5*px + odstep, px, jasny, ciemny);
    g.restore();
    return { godzina: gora, data: dol, dzienRoku: s.dzienRoku, rekord: Zegar.rekordSesji };
  }

  /* Najwyzszy X-Score tej sesji. Zeruje sie razem z przeladowaniem strony,
     bo to jest rekord SESJI, a nie konta. */
  return { rysuj, dzienNaDate, bezpieczny, MIESIACE, rekordSesji: 0 };
})();
window.Zegar = Zegar;

/* Subtelny zegar jeziora w warstwie DOM. Zostawia graczom godzinę na kadrze,
   ale bez powrotu czarnej tabliczki diagnostycznej na canvas. */
(function(){
  const el = document.getElementById('lakeClock');
  if (!el) return;
  const poleGodz = el.querySelector('b');
  const poleOpis = el.querySelector('span');
  function pobierzCzas() {
    if (window.PORA && PORA.teraz) {
      const s = PORA.teraz();
      return { godzina: s.godzina, dzien: s.dzien };
    }
    const d = new Date();
    const dz = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
    return { godzina: d.getHours() + d.getMinutes()/60, dzien: dz };
  }
  function odswiezZegarJeziora() {
    const s = pobierzCzas();
    const hh = String(Math.floor(s.godzina)).padStart(2, '0');
    const mm = String(Math.floor((s.godzina % 1) * 60)).padStart(2, '0');
    if (poleGodz) poleGodz.textContent = hh + ':' + mm;
    if (poleOpis && window.Zegar && Zegar.dzienNaDate) {
      const d = Zegar.dzienNaDate(s.dzien || 1);
      const mies = (Zegar.MIESIACE && Zegar.MIESIACE[d.miesiac]) ? Zegar.MIESIACE[d.miesiac] : '';
      poleOpis.textContent = String(d.dzien).padStart(2, '0') + ' ' + mies;
    }
  }
  odswiezZegarJeziora();
  setInterval(odswiezZegarJeziora, 1000);
})();

<script>/* ============================================================
   RUCH: mala biblioteka mikroanimacji dla otoczki.
   Nie dotyka gry ani jej petli. Wszystko dziala na warstwie HTML
   nad kanwa i kosztuje tyle, co kilka transformacji CSS.
   ============================================================ */
const Ruch = (() => {
  const iskry = document.getElementById('iskry');
  const toast = document.getElementById('toast');

  /* Fala z punktu dotkniecia. Rozmiar liczy sie z przekatnej przycisku,
     zeby na duzym i malym elemencie wygladala tak samo. */
  function fala(el, e) {
    const r = el.getBoundingClientRect();
    const d = Math.hypot(r.width, r.height);
    const f = document.createElement('span');
    f.className = 'fala';
    f.style.width = f.style.height = d + 'px';
    f.style.left = ((e && e.clientX !== undefined ? e.clientX - r.left : r.width / 2)) + 'px';
    f.style.top = ((e && e.clientY !== undefined ? e.clientY - r.top : r.height / 2)) + 'px';
    el.appendChild(f);
    setTimeout(() => f.remove(), 560);
  }

  /* Licznik dobijajacy do wartosci. Krzywa gasnaca, wiec ostatnie cyfry
     zwalniaja, i to one daja uczucie odliczania. */
  function licz(el, od, doK, ms) {
    if (!el) return;
    const t0 = performance.now(), czas = ms || 700;
    (function krok(t) {
      const u = Math.min(1, (t - t0) / czas);
      el.textContent = Math.round(od + (doK - od) * (1 - Math.pow(1 - u, 3)));
      if (u < 1) requestAnimationFrame(krok);
    })(t0);
  }

  /* Monety lecace z punktu do licznika. Kazda dostaje wlasny luk i wlasne
     opoznienie, wiec sypia sie strumieniem, a nie rzedem. */
  function sypnij(x0, y0, ile, gotowe) {
    const cel = document.getElementById('monety');
    if (!cel || !iskry) { if (gotowe) gotowe(); return; }
    const r = cel.getBoundingClientRect();
    const rk = iskry.getBoundingClientRect();
    const x1 = r.left + r.width * 0.28 - rk.left, y1 = r.top + r.height / 2 - rk.top;
    const n = Math.max(6, Math.min(18, ile));
    for (let i = 0; i < n; i++) {
      const k = document.createElement('div');
      k.className = 'iskra';
      const rozrzut = 46;
      const sx = x0 - rk.left + (Math.random() - 0.5) * rozrzut;
      const sy = y0 - rk.top + (Math.random() - 0.5) * rozrzut;
      k.style.left = sx + 'px'; k.style.top = sy + 'px';
      iskry.appendChild(k);
      const opoz = i * 34 + Math.random() * 60;
      const czas = 520 + Math.random() * 220;
      /* luk: moneta najpierw podskakuje, potem spada na licznik */
      const wygina = -70 - Math.random() * 60;
      k.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: 'translate(' + (x1 - sx) * 0.45 + 'px,' + ((y1 - sy) * 0.35 + wygina) + 'px) scale(1.25)', opacity: 1, offset: 0.55 },
        { transform: 'translate(' + (x1 - sx) + 'px,' + (y1 - sy) + 'px) scale(.35)', opacity: 0 }
      ], { duration: czas, delay: opoz, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards' });
      setTimeout(() => {
        k.remove();
        cel.classList.add('bije');
        setTimeout(() => cel.classList.remove('bije'), 180);
        if (i === n - 1 && gotowe) gotowe();
      }, opoz + czas);
    }
  }

  /* Pasek u gory. Sam znika, nie blokuje niczego pod spodem. */
  let toastT = 0;
  function powiedz(txt, zielony) {
    if (!toast) return;
    toast.innerHTML = txt;
    toast.classList.toggle('zielony', !!zielony);
    toast.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(() => toast.classList.remove('on'), 3000);
  }

  /* Panel wyskakuje z przycisku: przesuniecie startowe liczy sie z roznicy
     srodkow, wiec skala i przesuniecie razem daja wrazenie wyjscia stamtad. */
  function zPrzycisku(el) {
    const p = document.getElementById('panelTresc');
    if (!p || !el) return;
    const r = el.getBoundingClientRect();
    const c = p.getBoundingClientRect();
    const dx = (r.left + r.width / 2) - (window.innerWidth / 2);
    const dy = (r.top + r.height / 2) - (window.innerHeight / 2);
    p.style.setProperty('--zx', (dx * 0.35) + 'px');
    p.style.setProperty('--zy', (dy * 0.35) + 'px');
  }

  /* Paski postepu startuja od zera i nalewaja sie po otwarciu panelu. */
  function nalej() {
    requestAnimationFrame(() => {
      for (const i of document.querySelectorAll('#panelTresc .pas i')) {
        i.style.width = (i.dataset.w || 0) + '%';
      }
    });
  }
  /* Zostawione jako awaryjne wywolanie, gdyby chmura monet nie miala
     gdzie polecec: bez licznika na ekranie zostaje sam pasek meldunku. */
  /* ============================================================
     CHMURA MONET.

     Napis "+10" wyleciał: liczba na ekranie nie mowi nic, czego nie mowi
     licznik, a psuje obraz. Zamiast niej z miejsca zdarzenia unosi sie
     ROWNOMIERNA chmurka monet i plynie do licznika.

     Rownomierna znaczy naprawde rownomierna: monety startuja w regularnym
     wachlarzu, nie losowo, i wychodza jedna po drugiej w stalym odstepie.
     Kazda najpierw UNOSI SIE w gore po lagodnym luku, zwalniajac, a dopiero
     potem sciaga ja licznik. Dzieki temu chmurka przez chwile wisi w
     powietrzu, zamiast wystrzelic i zniknac.

     Ilosc monet nie rosnie liniowo z nagroda, tylko pierwiastkiem: przy
     10 qryb leci ich siedem, przy 5000 dwadziescia siedem. Inaczej rekord
     spolecznosci zasypalby ekran.
     ============================================================ */
  function chmura(x0, y0, ile) {
    const cel = document.querySelector('#monety');
    if (!cel || !iskry) return;
    const rk = iskry.getBoundingClientRect(), rc = cel.getBoundingClientRect();
    const cx = rc.left + rc.width / 2 - rk.left, cy = rc.top + rc.height / 2 - rk.top;
    const n = Math.max(5, Math.min(27, Math.round(Math.sqrt(ile) * 2.2)));
    const sx = x0 - rk.left, sy = y0 - rk.top;
    for (let i = 0; i < n; i++) {
      const m = document.createElement('span');
      m.className = 'iskra';
      /* wachlarz rowny co do stopnia, nie losowy */
      const u = n === 1 ? 0.5 : i / (n - 1);
      const kat = -Math.PI / 2 + (u - 0.5) * 1.15;
      const zasieg = 46 + u * 8;
      const px = sx + Math.cos(kat) * zasieg, py = sy + Math.sin(kat) * zasieg;
      m.style.left = sx + 'px'; m.style.top = sy + 'px';
      m.style.transitionDelay = (i * 0.045) + 's';
      iskry.appendChild(m);
      /* faza 1: unoszenie */
      requestAnimationFrame(() => {
        m.style.transition = 'transform .52s cubic-bezier(.16,.9,.3,1),opacity .3s';
        m.style.transform = 'translate(' + (px - sx) + 'px,' + (py - sy) + 'px) rotate(' + ((u - .5) * 40) + 'deg)';
        m.style.opacity = '1';
      });
      /* faza 2: sciagniecie do licznika */
      setTimeout(() => {
        m.style.transition = 'transform .62s cubic-bezier(.55,0,.35,1),opacity .2s .44s';
        m.style.transform = 'translate(' + (cx - sx) + 'px,' + (cy - sy) + 'px) scale(.55)';
        m.style.opacity = '0';
        if (i === n - 1) setTimeout(() => cel.classList.add('brzek'), 380);
      }, 520 + i * 45);
      setTimeout(() => m.remove(), 1500 + i * 45);
    }
    setTimeout(() => cel.classList.remove('brzek'), 1500 + n * 45);
  }

  function zaRekord(ile, powody) {
    const mo = document.querySelector('#monety b');
    const przed = Math.max(0, parseInt(mo && mo.textContent, 10) || 0);
    /* Nazwa rekordu zostaje, bo niesie tresc. Kwota nie: pokazuje ja licznik. */
    powiedz(powody.join(' \u00B7 '), true);
    if (navigator.vibrate) { try { navigator.vibrate(ile >= 1000 ? [18, 46, 18, 46, 58] : [14, 40, 22]); } catch (e) {} }
    /* Dzwonek nagrody (IX 2026): cieply trojkat z gorna kwinta zamiast
       ostrego piku prostokatnego. Wysokosc zalezy od kwoty -- male
       nagrody dzwonia nizej i skromniej, duze wchodza wyzej i pelniej,
       wiec ucho odroznia "cos wpadlo" od "cos DUZEGO wpadlo" bez
       patrzenia na ekran. */
    if (typeof dzwonek === 'function') {
      dzwonek(ile >= 10000 ? 1046 : ile >= 1000 ? 880 : 698, ile >= 1000 ? 0.075 : 0.05);
    }
    const r = iskry ? iskry.getBoundingClientRect() : { left: 0, top: 0, width: 360, height: 640 };
    chmura(r.left + r.width / 2, r.top + r.height * 0.46, ile);
    setTimeout(() => { if (mo) licz(mo, przed, przed + ile, ile >= 1000 ? 1900 : 1000); }, 620);
  }
  /* ============================================================
     MNOZNIK SERII.
     Maly znak przy srodku kadru, ktory unosi sie i gasnie. Celowo bez tla
     i bez ramki: to ma byc szept, nie komunikat. Im dluzsza seria, tym
     cieplejsza barwa i tym wyzej dolatuje.
     ============================================================ */
  function seria(ile, nazwa) {
    if (!iskry) return;
    const el = document.createElement('div');
    el.className = 'mnoznik';
    el.textContent = '\u00D7' + ile;
    const r = iskry.getBoundingClientRect();
    el.style.left = (r.width * 0.5) + 'px';
    el.style.top = (r.height * 0.42) + 'px';
    const cieplo = Math.min(1, (ile - 2) / 8);
    el.style.color = 'rgb(' + Math.round(232 + 20 * cieplo) + ',' +
      Math.round(199 - 40 * cieplo) + ',' + Math.round(101 - 60 * cieplo) + ')';
    el.style.fontSize = (17 + Math.min(9, ile)) + 'px';
    iskry.appendChild(el);
    requestAnimationFrame(() => {
      el.style.transform = 'translate(-50%,' + (-40 - Math.min(30, ile * 3)) + 'px) scale(1)';
      el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 1200);
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  }
  return { fala, licz, sypnij, chmura, powiedz, zPrzycisku, nalej, zaRekord, seria };
})();
window.Ruch = Ruch;

(function () {
  const stop = e => e.stopPropagation();
  const panel = document.getElementById('panel');
  const tresc = document.getElementById('panelTresc');
  let zrodlo = null;
  /* ============================================================
     PANEL ZAMYKAL SIE SAM PRZY TWORZENIU LIGI.

     Kazdy przycisk w zakladce STWORZ przerysowuje panel przez innerHTML,
     wiec przycisk, ktory wlasnie stuknales, przestaje istniec w trakcie
     wlasnego stukniecia. WebView na Androidzie wysyla click PO tej
     podmianie i trafienie liczy od nowa, z biezacego ukladu. Lista po
     przerysowaniu jest innej dlugosci, wiec palec ladowal na tle panelu,
     a tlo znaczy zamknij.

     Dwa zamki zamiast jednego. Zamkniecie wymaga teraz, zeby na tle
     zaczelo sie ORAZ skonczylo stukniecie, i zeby od ostatniego
     przerysowania minelo 300 ms. Stukniecie w tlo dziala jak dzialalo,
     stukniecie w znikajacy przycisk juz nie zamyka.
     ============================================================ */
  let odTla = false, ostatniPokaz = 0;
  let wracajDoMenuPoPanelu = false;
  function terazMs() {
    return (typeof performance !== 'undefined' && performance.now)
      ? performance.now() : Date.now();
  }
  function pokaz(html, el) {
    if (el) zrodlo = el;
    Ruch.zPrzycisku(zrodlo);
    /* FIX IX 2026: znacznik typu panelu NIE MOZE przezyc po poprzednim widoku.
       Wczesniej po wyjsciu z TURNIEJOW i otwarciu np. ZADAN `dataset.panel`
       nadal mial wartosc `turnieje`. Gdy w tle konczyl sie polling Zawody,
       listener uznawal ZADANIA za nadal otwarty panel turniejowy i podmienial
       cala tresc na TURNIEJE. Objaw wygladal losowo, bo zalezal od momentu
       odpowiedzi sieciowej. Kazdy zwykly panel zaczyna teraz bez znacznika;
       panelTurniejow/panelGracza/panelAdmina ustawiaja wlasny znacznik JAWNIE
       juz po renderze. */
    if (tresc.dataset) delete tresc.dataset.panel;
    if (window.zamknijMenuIkon) window.zamknijMenuIkon();
    tresc.innerHTML = html;
    ostatniPokaz = terazMs();
    panel.classList.add('on');
    document.body.classList.add('panel-otwarty');
    Ruch.nalej();
    for (const b of document.querySelectorAll('.ikonka')) b.classList.remove('otwarta');
    if (zrodlo && zrodlo.classList.contains('ikonka')) zrodlo.classList.add('otwarta');
  }
  /* NAPRAWA "otwiera sie inne okno niz powinno" (IX 2026, zgloszenie
     z iPhone: "bedac w wiaderku [otwiera sie] ranking").
     PRZYCZYNA: przebicie klikniecia. Panel zamyka sie na `click` w tlo.
     Na iOS po tapnieciu leci touchstart -> touchend -> click, a gdy
     miedzy nimi tlo znika (bo panel wlasnie sie zamknal), przegladarka
     dostarcza to samo klikniecie do elementu, ktory znalazl sie pod
     palcem -- czyli do IKONY w lewym slupku, nad ktora akurat byl
     palec. Gracz zamykal wiaderko i natychmiast otwieral turnieje,
     bo ikona turniejow lezy nizej w tym samym slupku.
     LEK: krotki czas martwy po zamknieciu. Ikony ignoruja klikniecia
     przez 350 ms od schowania panelu -- to mniej, niz trwa swiadome
     powtorne siegniecie palcem, a wiecej niz opoznienie ducha
     klikniecia na iOS. */
  let zamknietoMs = 0;
  function schowaj() {
    const powrot = !!wracajDoMenuPoPanelu;
    wracajDoMenuPoPanelu = false;
    panel.classList.remove('on');
    document.body.classList.remove('panel-otwarty');
    zamknietoMs = terazMs();
    if (window.zamknijMenuIkon) window.zamknijMenuIkon();
    for (const b of document.querySelectorAll('.ikonka')) b.classList.remove('otwarta');
    if (powrot) {
      /* Stage 13: najpierw schodzi papier, dopiero potem wraca MENU. */
      setTimeout(() => {
        if (window.otworzMasterMenu &&
            !document.body.classList.contains('karta-otwarta') &&
            !document.body.classList.contains('ksiega-otwarta')) {
          window.otworzMasterMenu();
        }
      }, 220);
    }
  }
  panel.addEventListener('pointerdown', e => { odTla = (e.target === panel); stop(e); });
  panel.addEventListener('click', e => {
    e.stopPropagation();
    const swiezo = terazMs() - ostatniPokaz < 300;
    if (e.target === panel && odTla && !swiezo) schowaj();
    odTla = false;
  });
  document.getElementById('panelX').addEventListener('click', e => { e.stopPropagation(); schowaj(); });
  /* Udostepnione dla modulow spoza tego pliku (ekosystem w `48`).
     Wystawiam istniejaca funkcje zamiast pisac drugi panel -- caly styl,
     animacja i obsluga zamykania sa juz tutaj i maja wlasna historie
     naprawek (patrz komentarz o zamykaniu przy tworzeniu ligi wyzej). */
  window.pokazPanel = pokaz;

  /* Licznik monet odswiezany dwa razy na sekunde, bo zmienia sie rzadko
     i nie ma po co obciazac petli rysowania. */
  const mo = document.querySelector('#monety b');
  const bz = document.getElementById('zadania');
  setInterval(() => {
    if (typeof Zapis === 'undefined') return;
    const m = Zapis.dane().monety || 0;
    if (mo.textContent !== String(m)) mo.textContent = m;
    if (typeof Zadania !== 'undefined' && bz) {
      const ile = Zadania.doOdbioru();
      /* Pierwsze wykonanie zadania melduje sie samo, zeby gracz nie musial
         zagladac do panelu. Jeden komunikat na jedno zadanie. */
      if (ile > (+(bz.dataset ? bz.dataset.bylo : 0) || 0)) {
        Ruch.powiedz('ZADANIE WYKONANE', true);
        const tw = document.getElementById('toast');
        if (tw) { tw.classList.remove('rozkwita'); void tw.offsetWidth; tw.classList.add('rozkwita');
                  setTimeout(() => tw.classList.remove('rozkwita'), 700); }
        if (navigator.vibrate) { try { navigator.vibrate([12, 40, 22]); } catch (err) {} }
      }
      if (bz.dataset) bz.dataset.bylo = ile;
      bz.classList.toggle('gotowe', ile > 0);
      const zi = document.getElementById('zadaniaGotoweIk');
      if (zi) zi.classList.toggle('on', ile > 0);
      const mt = document.getElementById('masterTask');
      if (mt) mt.classList.toggle('on', ile > 0);
      const qt = document.getElementById('quickTasksAlert');
      if (qt) qt.classList.toggle('on', ile > 0);
      const et = bz.querySelector('.et');
      if (et) { const tekst = ile > 0 ? 'ODBIERZ' : 'ZADANIA';
                if (et.textContent !== tekst) et.textContent = tekst; }
    }
    /* Ksiega melduje sie tak samo jak zadania, gdy w atlasie czeka nowy wpis. */
    const zl = document.getElementById('zanetaLicz');
    if (zl) {
      const z = Zapis.dane().zaneta;
      const Z = (z && window.ZANETY) ? ZANETY[z.id] : null;
      if (z && Z && z.zostalo > 0) { zl.classList.add('on');
        const t = z.zostalo + ' ŁAW';
        if (zl.textContent !== t) zl.textContent = t;
        const g = (window.ZANETA_GRAF && window.ZANETA_GRAF[Z.graf]) || '';
        if (zl.dataset.graf !== Z.graf) {
          zl.dataset.graf = Z.graf;
          zl.style.setProperty('--zgraf', g ? 'url("' + g + '")' : 'none');
        }
      } else zl.classList.remove('on');
    }
    {
      const bh=document.getElementById('baitRoundsHud');
      if(bh){
        const z=Zapis.dane().zaneta;
        const Z=(z&&window.ZANETY)?ZANETY[z.id]:null;
        if(z&&Z&&z.zostalo>0){
          const n=Math.max(0,Math.round(z.zostalo));
          const opis=n===1?'OSTATNIA ŁAWICA':(n+' ŁAWICE');
          const bb=bh.querySelector('b');
          if(bb&&bb.textContent!==opis)bb.textContent=opis;
          bh.classList.add('on');
        }else bh.classList.remove('on');
      }
    }
    const ba = document.getElementById('atlas');
    const atlasNowe0 = !!Zapis.dane().stat.nowaWAtlasie;
    if (ba) ba.classList.toggle('gotowe', atlasNowe0);
    const atlasMini = document.getElementById('atlasNoweIk');
    if (atlasMini) atlasMini.classList.toggle('on', atlasNowe0);
    const atlasGlow = document.getElementById('alertSwiatAtlas');
    if (atlasGlow) atlasGlow.classList.toggle('on', atlasNowe0);
    const masterBook = document.getElementById('masterBook');
    if (masterBook) masterBook.classList.toggle('on', atlasNowe0);
    const qb = document.getElementById('quickBucketAlert');
    if (qb) {
      let maWiadro=false;
      try { maWiadro=!!(window.Wiaderko&&Wiaderko.lista&&Wiaderko.lista().length); } catch(e){}
      const trade=document.getElementById('wiadHandel'),heart=document.getElementById('wiadSerce');
      qb.classList.toggle('on',maWiadro||!!(trade&&trade.classList.contains('on'))||!!(heart&&heart.classList.contains('on')));
    }
    const gk0 = document.getElementById('grupaKompendium');
    if (gk0) {
      gk0.classList.toggle('has-alert', atlasNowe0);
      const gk0Btn = gk0.querySelector('.ikonka');
      if (gk0Btn) gk0Btn.setAttribute('data-alert', '');
    }

    /* ============================================================
       WIADERKO W HUD.
       Licznik pod ikona pokazuje zajetosc, a przy czekajacej ofercie
       kwote. Sama ikona zapala sie klasa 'gotowe' -- ta sama, ktorej
       uzywaja zadania i atlas -- wiec wykrzyknik i podswietlenie
       przychodza za darmo, bez ani jednej nowej reguly CSS.
       ============================================================ */
    if (typeof Gielda !== 'undefined') {
      const nowy = Gielda.tik();
      /* Rozrod w wiaderku jedzie na TYM SAMYM tiku, co gielda. Wlasny
         setInterval bylby drugim zegarem, ktory moglby sie rozjechac
         z pierwszym -- ta gra ma juz za soba jeden taki blad. */
      let wyklute = null;
      if (window.Rozrod) { try { wyklute = Rozrod.tik(); } catch (e) {} }
      if (wyklute) {
        const GW = GATUNKI[wyklute.gat];
        Ruch.powiedz((GW ? GW.nazwa : wyklute.gat.toUpperCase()) + ': TARŁO W WIADERKU', true);
        if (navigator.vibrate) { try { navigator.vibrate([12, 40, 12, 40, 12]); } catch (err) {} }
      }
      const bw = document.getElementById('wiaderko');
      const wl = document.getElementById('wiadLicz');
      const o = Gielda.oferta();
      const ileW = (typeof Wiaderko !== 'undefined') ? Wiaderko.ile() : 0;
      /* WYKRZYKNIK ZA SIEC. Odznaka wiaderka opisuje towar na gieldzie
         ("3/10" albo kwota oferty), a polow z sieci to inna kieszen
         i inna decyzja. Dlatego siec nie miesza sie do tamtej liczby,
         tylko dokłada wykrzyknik: gracz widzi, ze cos czeka, i dowiaduje
         sie CO dopiero po wejsciu w zakladke.
         Oferta handlarza ma pierwszenstwo: jest ograniczona czasem,
         a siec czeka w nieskonczonosc. */
      const wSieci = (window.Siec && Siec.sztuk()) || 0;
      /* SERCE: para trze sie w wiaderku. Osobna odznaka, nie wykrzyknik,
         bo to nie jest "cos na ciebie czeka" tylko "cos sie dzieje" --
         gracz nie ma tu nic do zrobienia poza niewypuszczaniem pary. */
      /* ============================================================
         TABLICA TARLA pod przyciskiem LAWICA. Odswiezana w tej samej
         petli, co odznaki wiaderka, wiec pasek postepu plynie w czasie
         zamiast stac do nastepnego przerysowania.
         Pokazuje gatunki, ktore trą sie W WODZIE (Eko), NIE te
         w wiaderku -- od tamtych jest serce na ikonie wiaderka.
         ============================================================ */
      /* PASEK BRAKU KONTA. Przelaczany w tej samej petli, co odznaki,
         wiec reaguje natychmiast po zalogowaniu i wylogowaniu, bez
         przeladowania strony. */
      document.body.classList.toggle('bez-konta', !pelnyDostep());
      /* Wykrzyknik na ikonie ekosystemu: czeka meldunek o narybku,
         ktory znika dopiero po kliknieciu OK w zakladce. */
      let ileM = 0;
      try { ileM = (window.Eko && Eko.meldunkiCzekaja) ? Eko.meldunkiCzekaja() : 0; } catch (e) { ileM = 0; }
      const ew = document.getElementById('ekoWykrz');
      if (ew) {
        if (!ileM || o) ew.classList.remove('on');
        else {
          ew.classList.add('on');
          if (ew.textContent !== '🐟') ew.textContent = '🐟';
        }
      }
      const gk = document.getElementById('grupaKompendium');
      if (gk) {
        const atlasNowe = !!(typeof Zapis !== 'undefined' && Zapis.dane().stat.nowaWAtlasie);
        const ekoNowe = !!(ileM > 0 && !o);
        const maAlertSwiat = atlasNowe || ekoNowe;
        gk.classList.toggle('has-alert', maAlertSwiat);
        const gkBtn = gk.querySelector('.ikonka');
        if (gkBtn) gkBtn.setAttribute('data-alert', '');
        const swiatEko = document.getElementById('alertSwiatEko');
        if (swiatEko) swiatEko.classList.toggle('on', ekoNowe);
        const masterFish = document.getElementById('masterFish');
        if (masterFish) masterFish.classList.toggle('on', ekoNowe);
      }
      /* Panel ekosystemu, gdy otwarty: paski maja plynac w czasie.
         `o` to znacznik otwartego panelu, uzywany juz przez odznaki. */
      if (window.EkoPanel && EkoPanel.tik) {
        const pnl = document.getElementById('panel');
        if (pnl && pnl.classList.contains('on')) { try { EkoPanel.tik(); } catch (e) {} }
      }
      const tab = document.getElementById('tarla');
      if (tab) {
        let poz = [];
        try {
          if (window.Eko && Eko.paraGodowa && typeof GATUNKI !== 'undefined') {
            const juz = {};
            for (const f of school) {
              if (!f || !f.gody || !f.gat || juz[f.gat]) continue;
              const para = Eko.paraGodowa(f.gat);
              if (!para) continue;
              juz[f.gat] = 1;
              const post = Math.max(0, Math.min(1, (Date.now() - para.start) / Eko.CFG.CZAS_GODOW));
              poz.push({ gat: f.gat, post: post });
            }
          }
        } catch (e) { poz = []; }
        if (!poz.length) tab.classList.remove('on');
        else {
          tab.classList.add('on');
          /* Przerysowujemy TYLKO gdy zmienil sie sklad -- inaczej
             innerHTML co klatke kasowalby animacje serc. Sam pasek
             postepu ruszamy w miejscu, bez przebudowy. */
          const klucz = poz.map(x => x.gat).join(',');
          if (tab.dataset.klucz !== klucz) {
            tab.dataset.klucz = klucz;
            tab.innerHTML = poz.map(x => {
              const G2 = GATUNKI[x.gat];
              const src = (G2 && G2.img && G2.img.src) ? G2.img.src : '';
              return '<div class="tg" data-g="' + x.gat + '">'
                   + (src ? '<img src="' + src + '" alt="">' : '')
                   + '<u></u></div><div class="tp" data-g="' + x.gat + '"><i></i></div>';
            }).join('');
          }
          for (const x of poz) {
            const pas = tab.querySelector('.tp[data-g="' + x.gat + '"] i');
            if (pas) pas.style.width = Math.round(x.post * 100) + '%';
          }
        }

        /* Zegar jeziora jest teraz niezalezny od tarla i siedzi centralnie
           pod gornym HUD-em. Tarlo moze miec dowolna wysokosc bez kolizji. */
      }
      let trwa = false;
      try { trwa = !!(window.Rozrod && Rozrod.pary().length); } catch (e) { trwa = false; }
      const serce = document.getElementById('wiadSerce');
      if (serce) serce.classList.toggle('on', !o && trwa);
      const wh = document.getElementById('wiadHandel');
      if (wh) wh.classList.toggle('on', !!o);
      const mh = document.getElementById('alertMenuHandel');
      if (mh) mh.classList.toggle('on', !!o);
      const ms = document.getElementById('alertMenuSerce');
      if (ms) ms.classList.toggle('on', !o && trwa);
      const masterTrade = document.getElementById('masterTrade');
      if (masterTrade) masterTrade.classList.toggle('on', !!o);
      const masterHeart = document.getElementById('masterHeart');
      if (masterHeart) masterHeart.classList.toggle('on', !o && trwa);
      const masterNet = document.getElementById('masterNet');
      if (masterNet) masterNet.classList.toggle('on', wSieci > 0);
      const wiadSiec = document.getElementById('wiadSiec');
      if (wiadSiec) wiadSiec.classList.toggle('on', wSieci > 0);
      if (nowy) {
        Ruch.powiedz('HANDLARZ PRZY WIADERKU', true);
        if (navigator.vibrate) { try { navigator.vibrate([18, 60, 18]); } catch (err) {} }
      }
      if (bw) bw.classList.toggle('gotowe', !!o);
      if (bw) bw.classList.toggle('siec-czeka', !o && wSieci > 0);
      const gn = document.getElementById('grupaNawigacja');
      if (gn) {
        const maAlertMenu = !!o || wSieci > 0 || ileW > 0 || trwa;
        gn.classList.toggle('has-alert', maAlertMenu);
        const gnBtn = gn.querySelector('.ikonka');
        if (gnBtn) gnBtn.setAttribute('data-alert', '');
      }
      if (wl) {
        if (!ileW) wl.classList.remove('on');
        else {
          wl.classList.add('on');
          wl.classList.toggle('pilne', !!o);
          const t = o ? (o.suma >= 1000 ? Math.round(o.suma / 1000) + 'K' : Math.round(o.suma) + '')
                      : ileW + '/' + Wiaderko.max;
          if (wl.textContent !== t) wl.textContent = t;
        }
      }
      /* Zegar handlarza pod sama ikona. Przy czekajacej ofercie nie ma
         czego odliczac -- zegar stoi az do decyzji -- wiec zamiast liczb
         idzie tam slowo, ktore mowi, co sie dzieje. */
      const wz = document.getElementById('wiadZeg');
      if (wz) {
        if (!ileW) wz.classList.remove('on');
        else {
          wz.classList.add('on');
          wz.classList.toggle('pilne', !!o);
          const sek = Gielda.doNastepnego();
          const t2 = (sek === null) ? 'TWÓJ RUCH'
                   : Math.floor(sek / 60) + ':' + String(sek % 60).padStart(2, '0');
          if (wz.textContent !== t2) wz.textContent = t2;
        }
      }
    }
  }, 500);


  function podpMenuIkon() {
    const cfg = [
      { wrap: 'grupaNawigacja', toggle: 'nawigacjaToggle', menu: 'nawigacjaMenu' },
      { wrap: 'grupaMenu', toggle: 'menuToggle', menu: 'menuMenu' },
      { wrap: 'grupaKompendium', toggle: 'kompendiumToggle', menu: 'kompendiumMenu' }
    ];
    function zamknij(pomin) {
      for (const c of cfg) {
        const w = document.getElementById(c.wrap);
        if (w && c.wrap !== pomin) { w.classList.remove('otw'); const bt=document.getElementById(c.toggle); if(bt) bt.setAttribute('aria-expanded','false'); }
      }
    }
    window.zamknijMenuIkon = zamknij;
    for (const c of cfg) {
      const w = document.getElementById(c.wrap);
      const t = document.getElementById(c.toggle);
      const m = document.getElementById(c.menu);
      if (!w || !t || !m) continue;
      t.addEventListener('touchstart', stop, { passive: true });
      t.addEventListener('pointerdown', stop);
      t.addEventListener('pointerdown', e => { Ruch.fala(t, e); }, true);
      t.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
        const open = w.classList.contains('otw');
        zamknij(open ? null : c.wrap);
        w.classList.toggle('otw', !open); t.setAttribute('aria-expanded', String(!open));
      });
      m.addEventListener('pointerdown', stop);
      m.addEventListener('click', e => e.stopPropagation());
      for (const b of m.querySelectorAll('button')) {
        b.addEventListener('click', () => { zamknij(); });
      }
    }
    document.addEventListener('click', () => zamknij());
  }
  podpMenuIkon();

  /* SZYBKI DOSTEP korzysta z istniejacych przyciskow. Jedna logika
     paneli, bramek progresji i telemetryki — zero kopii. */
  (function podpQuickAccess() {
    const map = [['quickBucket','wiaderko'],['quickTasks','zadania']];
    for (const [qid,oid] of map) {
      const q=document.getElementById(qid),o=document.getElementById(oid);
      if(!q||!o) continue;
      q.addEventListener('pointerdown',e=>{e.stopPropagation();Ruch.fala(q,e);},true);
      q.addEventListener('click',e=>{
        e.preventDefault();e.stopPropagation();
        window.__quickNavInvoke=true;
        try{
          if(window.Telemetry)Telemetry.event('quick_nav_open',{target:oid});
          o.click();
        }finally{window.__quickNavInvoke=false;}
      });
    }
  })();

  /* Jeden przycisk otwiera całe menu. Stare grupy zostają w DOM, żeby
     nie ruszać handlerów/ID, ale CSS spłaszcza je do 8 bezpośrednich akcji. */
  (function podpMenuMaster() {
    const b = document.getElementById('menuMaster');
    const nav = document.getElementById('ikony');
    if (!b || !nav) return;
    const zamknij = () => {
      document.body.classList.remove('menu-master-open');
      b.setAttribute('aria-expanded', 'false');
    };
    const otworz = () => {
      if (window.zamknijMenuIkon) window.zamknijMenuIkon();
      document.body.classList.add('menu-master-open');
      b.setAttribute('aria-expanded', 'true');
    };
    window.zamknijMasterMenu = zamknij;
    window.otworzMasterMenu = otworz;
    b.addEventListener('touchstart', stop, { passive: true });
    b.addEventListener('pointerdown', stop);
    b.addEventListener('pointerdown', e => { Ruch.fala(b, e); }, true);
    b.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
      document.body.classList.contains('menu-master-open') ? zamknij() : otworz();
    });
    nav.addEventListener('pointerdown', stop);
    nav.addEventListener('click', e => e.stopPropagation());
    for (const btn of nav.querySelectorAll('button')) {
      if (btn.classList.contains('nav-glowna')) continue;
      btn.addEventListener('click', () => setTimeout(zamknij, 0));
    }
    document.addEventListener('click', zamknij);
  })();


  /* ============================================================
     ETAP 1/6 — AUTOMATYCZNE PRZYGASZANIE HUD.
     Jeden timer dla calej otoczki; gameplay i petla renderujaca scene
     nie sa dotykane. Powiadomienia sa osobna warstwa i nie gasna.
     ============================================================ */
  (function autoHideHud() {
    /* STAGE 15.7: decyzja produktowa — interfejs nie znika po bezczynnosci.
       Zostawiamy klase ui-idle jako historyczny kontrakt CSS, ale runtime
       nigdy jej nie wlacza. Kontekstowe chowanie przy karcie/atlasie/lidze
       pozostaje osobnym mechanizmem i nie jest tym auto-hide. */
    document.body.classList.remove('ui-idle');
  })();

  const guzik = (id, fn) => {
    const b = document.getElementById(id);
    if (!b) return;
    b.addEventListener('touchstart', stop, { passive: true });
    b.addEventListener('pointerdown', stop);
    b.addEventListener('pointerdown', e => { Ruch.fala(b, e); }, true);
    b.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      /* Czas martwy po zamknieciu panelu -- patrz schowaj() wyzej. */
      if (terazMs() - zamknietoMs < 350) return;
