/* ============================================================
   PRODUCT STAGE 6 — PROGRES 1–70.

   Poziom jest wyliczany z TRWALEGO DOROBKU:
   - liczby zlowien,
   - odkrytych gatunkow,
   - najlepszych okazow w atlasie,
   - zakonczonych turniejow.

   Dzięki temu nie tworzymy drugiego zapisu XP, ktory moglby rozjechac sie
   z chmura. Ten sam save na drugim telefonie daje ten sam poziom.
   ============================================================ */
const Progression = (() => {
  const WL = !!(window.Features && Features.is('progression70'));
  const LAST_KEY = 'qryby.progression.last_level.v1';
  let testLevel = null;

  const MILESTONES = [
    {lvl:1, key:'core',         nazwa:'WĘDKA I JEZIORO',      opis:'łowienie i podstawowy świat'},
    {lvl:2, key:'world',        nazwa:'WIADRO · ATLAS · EKO', opis:'pierwsze narzędzia po pierwszym połowie'},
    {lvl:3, key:'tasks',        nazwa:'ZADANIA',               opis:'dzienne cele'},
    {lvl:5, key:'share',        nazwa:'KARTA POŁOWU',          opis:'udostępnianie trofeów'},
    {lvl:7, key:'shop',         nazwa:'STRAGAN',               opis:'zanęty i kosmetyka'},
    {lvl:10,key:'worldDigest',  nazwa:'CO SIĘ ZMIENIŁO',       opis:'zmiany jeziora od ostatniej wizyty'},
    {lvl:12,key:'jobs',         nazwa:'OGŁOSZENIA',            opis:'zlecenia ze świata gry'},
    {lvl:15,key:'league',       nazwa:'LIGA',                  opis:'turnieje'},
    {lvl:20,key:'observations', nazwa:'ZESZYT OBSERWACJI',     opis:'własne tropy pogody, pory i księżyca'},
    {lvl:30,key:'demography',   nazwa:'DEMOGRAFIA',            opis:'samce i samice w populacji'},
    {lvl:40,key:'frequency',    nazwa:'CZĘSTOŚĆ',              opis:'udział gatunku w jeziorze i ławicach'},
    {lvl:50,key:'chronicle',    nazwa:'PEŁNA KRONIKA',         opis:'archiwum wspólnego jeziora'},
    {lvl:60,key:'trends',       nazwa:'ANALIZA WZORCÓW',       opis:'dwa najsilniejsze tropy naraz'},
    {lvl:70,key:'research',     nazwa:'DZIENNIK BADACZA',      opis:'pełny skrót własnego archiwum obserwacji'}
  ];

  const BUTTONS = {
    wiaderko:'world', atlas:'world', ekosystem:'world',
    zadania:'tasks', shareCatch:'share', sklep:'shop',
    zleceniaTablica:'jobs', turnieje:'league'
  };

  function zrodla(){
    let catches=0,species=0,best=0,tournaments=0;
    try{
      const d=Zapis.dane();
      catches=Math.max(0,Number(d.stat&&d.stat.zlowien)||0);
      for(const a of Object.values(d.atlas||{})){
        if(!a || !(Number(a.n)>0)) continue;
        species++;
        best += Math.max(0,Math.min(100,Number(a.pkt)||0));
      }
      tournaments=Array.isArray(d.turniejeHistoria)?d.turniejeHistoria.length:0;
    }catch(e){}
    const xp=catches*10 + species*75 + best*3 + tournaments*250;
    return {xp,catches,species,best,tournaments};
  }

  /* Prog 70 ~= 75 tys. punktow rozwoju. Wczesne poziomy ida szybko,
     potem tempo rosnie bez sztucznego "grindu za logowanie". */
  function prog(lvl){
    const n=Math.max(0,Math.min(69,(Number(lvl)||1)-1));
    return 15*n*n + 50*n;
  }

  function poziomZXP(xp){
    let lo=1,hi=70;
    while(lo<hi){
      const mid=Math.ceil((lo+hi)/2);
      if(prog(mid)<=xp) lo=mid; else hi=mid-1;
    }
    return lo;
  }

  function level(){
    if(testLevel!==null) return Math.max(1,Math.min(70,Number(testLevel)||1));
    return poziomZXP(zrodla().xp);
  }

  function stan(){
    const d=zrodla(),lvl=level(),a=prog(lvl),b=lvl<70?prog(lvl+1):a;
    const frac=lvl>=70?1:Math.max(0,Math.min(1,(d.xp-a)/Math.max(1,b-a)));
    return {lvl,xp:d.xp,from:a,to:b,frac,catches:d.catches,species:d.species,
            best:d.best,tournaments:d.tournaments};
  }

  function milestone(key){return MILESTONES.find(x=>x.key===key)||null;}
  function wymagany(key){const m=milestone(key);return m?m.lvl:1;}
  function dostep(key){return !WL || level()>=wymagany(key);}

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  function html(){
    if(!WL) return '';
    const s=stan(),next=MILESTONES.find(x=>x.lvl>s.lvl)||null;
    const pct=Math.round(s.frac*100);
    let h='<div class="prog-card">'
      +'<div class="prog-top"><div class="prog-lvl"><small>POZIOM WĘDKARZA</small>'+s.lvl+' / 70</div>'
      +'<div class="prog-xp">'+s.xp.toLocaleString('pl-PL')+' pkt rozwoju<br>'
      +s.catches.toLocaleString('pl-PL')+' połowów · '+s.species+' gat.</div></div>'
      +'<div class="prog-bar"><i style="width:'+pct+'%"></i></div>';

    if(next){
      h+='<div class="prog-next">NASTĘPNIE · L'+next.lvl+' <b>'+esc(next.nazwa)+'</b>'
        +'<span class="prog-desc">'+esc(next.opis)+'</span></div>';
    }else{
      h+='<div class="prog-next"><b>PEŁNY DOSTĘP DO NARZĘDZI JEZIORA</b>'
        +'<span class="prog-desc">poziom 70 nie zwiększa szans na ryby</span></div>';
    }

    const idx=MILESTONES.findIndex(x=>x.lvl>s.lvl);
    const od=idx<0?Math.max(0,MILESTONES.length-4):Math.max(0,idx-1);
    const doI=idx<0?MILESTONES.length:Math.min(MILESTONES.length,idx+4);
    h+='<div class="prog-road">';
    for(const m of MILESTONES.slice(od,doI)){
      const cl=m.lvl<=s.lvl?' on':(next&&m.key===next.key?' next':'');
      h+='<div class="prog-row'+cl+'"><span class="prog-n">L'+m.lvl+'</span>'
        +'<span><span class="prog-title">'+esc(m.nazwa)+'</span>'
        +'<span class="prog-desc">'+esc(m.opis)+'</span></span></div>';
    }
    return h+'</div></div>';
  }

  function blocked(key){
    const m=milestone(key);
    if(!m) return false;
    try{
      if(window.Ruch) Ruch.powiedz('OD POZIOMU '+m.lvl+' · '+m.nazwa,true);
      if(window.Telemetry) Telemetry.event('progression_gate_hit',{
        feature:key,required_level:m.lvl,current_level:level()
      });
    }catch(e){}
    return true;
  }

  function refreshLocks(){
    if(!WL) return;
    for(const [id,key] of Object.entries(BUTTONS)){
      const el=document.getElementById(id);
      if(!el) continue;
      if(dostep(key)) el.removeAttribute('data-prog-lock');
      else el.setAttribute('data-prog-lock',String(wymagany(key)));
    }
  }

  function poZlowieniu(){
    if(!WL) return;
    const now=level();
    let prev=now;
    try{
      const raw=localStorage.getItem(LAST_KEY);
      prev=raw===null?now:Math.max(1,Math.min(70,Number(raw)||now));
    }catch(e){}
    if(now<prev) prev=now; /* reset zapisu nie moze zablokowac przyszlych level-upow */
    if(now>prev){
      const unlocked=MILESTONES.filter(x=>x.lvl>prev&&x.lvl<=now);
      const naj=unlocked.length?unlocked[unlocked.length-1]:null;
      try{
        if(window.Ruch) Ruch.powiedz('POZIOM '+now+(naj?' · '+naj.nazwa:''),true);
        if(window.Telemetry) Telemetry.event('player_level_up',{
          from_level:prev,to_level:now,unlocks:unlocked.map(x=>x.key).join(',')
        });
      }catch(e){}
    }
    try{localStorage.setItem(LAST_KEY,String(now));}catch(e){}
    refreshLocks();
  }

  function init(){
    if(!WL) return;
    try{
      if(localStorage.getItem(LAST_KEY)===null)
        localStorage.setItem(LAST_KEY,String(level()));
    }catch(e){}
    refreshLocks();
  }

  /* Jedna bramka dla wszystkich fizycznych przyciskow. */
  document.addEventListener('click',e=>{
    if(!WL) return;
    const b=e.target&&e.target.closest?e.target.closest('button[id]'):null;
    if(!b) return;
    const key=BUTTONS[b.id];
    if(!key || dostep(key)) return;
    e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
    blocked(key);
  },true);

  function test(n){
    testLevel=n===null?null:Math.max(1,Math.min(70,Number(n)||1));
    refreshLocks();
    return level();
  }

  setTimeout(init,500);
  setInterval(refreshLocks,900);

  return {level,stan,prog,dostep,wymagany,milestone,html,blocked,
          poZlowieniu,refreshLocks,test,milestones:()=>MILESTONES.slice()};
})();
window.Progression=Progression;

/* ============================================================
   PRODUCT STAGE 5 — TAJEMNICE ZAMIAST WIKI.

   Dwa poziomy informacji:
     WIEDZA      — to, co gra moze nazwac pewnym bez klamania.
     OBSERWACJE  — faktyczne warunki przy polowach TEGO gracza.

   Nie pokazujemy spawn-rate'u ani mnoznikow. Obserwacja nie staje sie
   "prawda" tylko dlatego, ze wydarzyla sie kilka razy.
   ============================================================ */
const MysteryHints = (() => {
  const WL = !!(window.Features && Features.is('mysteryHints'));
  const TEST = /(?:\?|&)mysterytest=1(?:&|$)/.test(location.search);
  const KEY = 'qryby.mystery.observations.v1';
  const MAX_NA_GATUNEK = 30;
  const PORY = ['świt','dzień','zmierzch','noc'];

  function load() {
    try {
      const x = JSON.parse(localStorage.getItem(KEY) || '{}');
      return x && typeof x === 'object' ? x : {};
    } catch (e) { return {}; }
  }
  function save(x) {
    if (TEST) return;
    try { localStorage.setItem(KEY, JSON.stringify(x)); } catch (e) {}
  }

  function teraz() {
    let st = null, moon = '';
    try { st = PORA.teraz(); } catch (e) {}
    try { moon = PORA.ksiezyc().nazwa || ''; } catch (e) {}
    if (!st) return null;
    let pora = 1;
    try { pora = OKNA.poraZGodziny(st.godzina); } catch (e) {}
    return {
      t: Date.now(),
      pora: PORY[pora] || 'dzień',
      sezon: String(st.sezon || ''),
      pogoda: String(st.pogoda || ''),
      opad: st.opad ? String(st.opad) : '',
      ksiezyc: moon
    };
  }

  function record(gk) {
    if (!WL || !gk || TEST) return;
    const o = teraz();
    if (!o) return;
    const db = load();
    const a = Array.isArray(db[gk]) ? db[gk] : [];
    a.push(o);
    db[gk] = a.slice(-MAX_NA_GATUNEK);
    save(db);
    try {
      if (window.Telemetry) Telemetry.event('mystery_observation_recorded', {
        species:gk, period:o.pora, season:o.sezon,
        weather:o.pogoda, precipitation:o.opad, moon:o.ksiezyc
      });
    } catch (e) {}
  }

  function fake(gk) {
    if (gk === 'kupid') return [
      {pora:'noc',sezon:'lato',pogoda:'pogodnie',opad:'',ksiezyc:'pełnia'},
      {pora:'zmierzch',sezon:'lato',pogoda:'bezchmurnie',opad:'',ksiezyc:'pełnia'},
      {pora:'noc',sezon:'wiosna',pogoda:'pogodnie',opad:'',ksiezyc:'pełnia'}
    ];
    if (gk === 'nessy') return [
      {pora:'dzień',sezon:'jesien',pogoda:'opad',opad:'deszcz',ksiezyc:'ubywa'},
      {pora:'noc',sezon:'lato',pogoda:'burza',opad:'deszcz',ksiezyc:'przybywa'},
      {pora:'zmierzch',sezon:'wiosna',pogoda:'opad',opad:'deszcz',ksiezyc:'nów'}
    ];
    return [
      {pora:'noc',sezon:'lato',pogoda:'pogodnie',opad:'',ksiezyc:'ubywa'},
      {pora:'noc',sezon:'jesien',pogoda:'pochmurno',opad:'',ksiezyc:'przybywa'},
      {pora:'zmierzch',sezon:'lato',pogoda:'bezchmurnie',opad:'',ksiezyc:'pierwsza kwadra'}
    ];
  }

  function lista(gk) {
    if (TEST) return fake(gk);
    const db = load();
    return Array.isArray(db[gk]) ? db[gk].slice() : [];
  }

  function moda(a, pole) {
    const m = {};
    for (const x of a) {
      const v = String((x && x[pole]) || '');
      if (!v) continue;
      m[v] = (m[v] || 0) + 1;
    }
    let best = '', n = 0;
    for (const [v,c] of Object.entries(m)) if (c > n) { best=v; n=c; }
    return {v:best,n,ratio:a.length ? n/a.length : 0};
  }

  function obserwacje(gk) {
    if (!WL) return '';
    if (window.Progression && !Progression.dostep('observations'))
      return 'OD POZIOMU 20 · ZESZYT OBSERWACJI';
    const a = lista(gk);
    const n = a.length;
    if (!n) return 'BRAK WŁASNYCH OBSERWACJI';
    if (n < 3) return n + (n === 1 ? ' POŁÓW' : ' POŁOWY') + ' · WARUNEK NIEPOTWIERDZONY';

    /* Najpierw szukamy wzorcow, ktore sa najbardziej "warunkowe":
       ksiezyc -> opad -> pora -> sezon. Minimum 2/3 obserwacji.
       To nadal jest sugestia, nie dowod. */
    const kand = [
      ['ksiezyc', moda(a,'ksiezyc')],
      ['opad', moda(a,'opad')],
      ['pora', moda(a,'pora')],
      ['sezon', moda(a,'sezon')]
    ];

    function trop(typ,m,licznik) {
      if (!m.v || m.ratio < 2/3) return '';
      if (typ === 'ksiezyc' && m.v === 'pełnia')
        return licznik ? (m.n+'/'+n+' PEŁNIA') : 'SUGERUJĄ PEŁNIĘ';
      if (typ === 'opad' && m.v === 'deszcz')
        return licznik ? (m.n+'/'+n+' DESZCZ') : 'SUGERUJĄ DESZCZ';
      if (typ === 'pora') {
        const z={noc:'PO ZMROKU',zmierzch:'O ZMIERZCHU','świt':'O ŚWICIE','dzień':'ZA DNIA'}[m.v]||m.v.toUpperCase();
        return licznik ? (m.n+'/'+n+' '+z) : 'NAJCZĘŚCIEJ '+z;
      }
      if (typ === 'sezon')
        return licznik ? (m.n+'/'+n+' '+m.v.toUpperCase()) : 'NAJCZĘŚCIEJ: '+m.v.toUpperCase();
      return '';
    }

    if (window.Progression && Progression.dostep('trends')) {
      const mocne=kand.map(([typ,m])=>trop(typ,m,true)).filter(Boolean).slice(0,2);
      if(mocne.length) return n+' OBS. · '+mocne.join(' · ');
    }

    for (const [typ,m] of kand) {
      const t=trop(typ,m,false);
      if(t) return n + ' OBSERWACJE · ' + t;
    }
    return n + ' OBSERWACJE · BRAK PEWNEGO WZORCA';
  }

  function poryTekst(a) {
    const s = (a || []).map(i => PORY[Number(i)] || '').filter(Boolean);
    if (!s.length) return '';
    if (s.length === 1) return s[0];
    return s.slice(0,-1).join(', ') + ' i ' + s[s.length-1];
  }

  function wiedza(gk, znany, plotka) {
    if (!WL) return plotka || '';

    /* Nieodkryty gatunek nie dostaje twardej instrukcji. Atlas moze
       podsunac plotke, ale nie zdradza warunku przed pierwszym polowem. */
    if (!znany) return 'PLOTKA · ' + (plotka || 'warunek pozostaje nieznany');

    try {
      if (window.OKNO_KSIEZYCA && OKNO_KSIEZYCA[gk]) {
        const x = OKNO_KSIEZYCA[gk];
        return 'POTWIERDZONE · związana z ' + String(x[0] || '').toUpperCase() + ' księżyca';
      }
      if (window.OKNO_OPADU && OKNO_OPADU[gk]) {
        const x = OKNO_OPADU[gk];
        return 'POTWIERDZONE · spotykana tylko podczas ' + String(x[0] || '').toUpperCase();
      }

    const kg = w2 => (w2 / 1000).toFixed(2).replace('.', ',');
    /* ============================================================
       SZEPT O PORZE. Nie liczba, nie godzina, nie mnoznik. Jedno zdanie,
       ktore mowi gdzie szukac, ale nie mowi ile z tego bedzie. Stoi na
       kazdej stronie, takze nieodkrytej, bo to plotka, a nie rekord:
       ma prowadzic do ryby, a nie nagradzac za jej zlowienie.
       ============================================================ */
    const SZEPT_PORA = {
      dzienna:     'Podobno bierze wtedy, gdy słońce stoi wysoko nad wodą.',
      zmierzchowa: 'Rybacy mówią, że rusza się w godzinie, gdy światło się łamie.',
      nocna:       'Widywano ją głównie po zmroku, gdy tafla robi się czarna.',
      obojetna:    'Nie zauważono, żeby pora dnia robiła jej różnicę.'
    };
    /* ============================================================
       PLOTKA O PASMIE SIODMYM. Mityczne nie maja wpisu w OKNA.EKO --
       zamiast zwyklego wazenia pora/sezon/pogoda maja TWARDE bramy
       (OKNO_GODZIN, OKNO_OPADU, OKNO_KSIEZYCA) albo nie maja zadnej.
       Cztery kategorie tych bram nie mieszcza sie w czterech kategoriach
       SZEPT_PORA (dzien/zmierzch/noc/obojetnie), wiec dostaja wlasny,
       osobny slownik zamiast probowac wcisnac deszcz czy pelnie ksiezyca
       w jedna z istniejacych czterech plotek. Ten sam warunek co reszta
       sekcji: stoi na kazdej stronie, takze nieodkrytej. */
    const SZEPT_MITYCZNE = {
      ksiaznik: 'Podobno pokazuje się wyłącznie na granicy dnia i nocy — o świcie albo o zmierzchu.',
      smucior: 'Widywano go tylko nocą. Nigdy w dzień.',
      nessy: 'Rybacy twierdzą, że wypływa jedynie wtedy, gdy pada deszcz.',
      kupid: 'Podobno pokazuje się raz w miesiącu, wyłącznie w pełnię księżyca.',
      tyrios_morski: 'Nikt nie potrafi powiedzieć, kiedy go szukać. Bierze, kiedy sam zechce.',
      minog_majlowy: 'Nikt nie potrafi powiedzieć, kiedy go szukać. Bierze, kiedy sam zechce.',
      dzolej_rudogrzywy: 'Nikt nie potrafi powiedzieć, kiedy go szukać. Bierze, kiedy sam zechce.',
      japoniec: 'Nikt nie potrafi powiedzieć, kiedy go szukać. Bierze, kiedy sam zechce.',
      smokosz: 'Nikt nie potrafi powiedzieć, kiedy go szukać. Poluje, kiedy sam zechce.',
      krukkomrukko: 'Nikt nie potrafi powiedzieć, kiedy go szukać. Poluje, kiedy sam zechce.',
      smok_zycia: 'stworzenie z wróżby'
    };
    let szept = SZEPT_PORA.obojetna;
    if (SZEPT_MITYCZNE[k]) {
      szept = SZEPT_MITYCZNE[k];
    } else {
      try {
        const eko = (typeof OKNA !== 'undefined' && OKNA.EKO) ? OKNA.EKO[k] : null;
        if (eko && SZEPT_PORA[eko[0]]) szept = SZEPT_PORA[eko[0]];
      } catch (e) {}
    }
    const wiedzaMyst = (window.MysteryHints && Features.is('mysteryHints'))
      ? MysteryHints.wiedza(k, znany, szept)
      : szept;
    const obserMyst = (window.MysteryHints && Features.is('mysteryHints'))
      ? MysteryHints.obserwacje(k)
      : '—';
    const archMyst = (window.MysteryHints && Features.is('mysteryHints') && MysteryHints.archiwum)
      ? MysteryHints.archiwum(k)
      : '';
    const sek = [
      ['WIEDZA', wiedzaMyst],
      ['OBSERWACJE', obserMyst],
      ['OPIS', znany ? (OPISY_ATLAS[k] || '') : '\u2014'],
      ['REKORD POLSKI', znany ? (G2.rekordDl + ' cm \u00B7 ' + kg(G2.rekordWaga) + ' kg') : '\u2014'],
      ['TWÓJ REKORD', (mo && mo.n) ? (mo.cm + ' cm \u00B7 ' + kg(mo.g) + ' kg \u00B7 ' + mo.pkt + ' pkt') : 'brak'],
      ['REKORD SPOŁECZNOŚCI', (() => {
        const s = (typeof Zapis !== 'undefined' && Zapis.spoleczny) ? Zapis.spoleczny(k) : null;
        return s ? (s.cm + ' cm \u00B7 ' + kg(s.g) + ' kg \u00B7 ' + s.pkt + ' pkt \u00B7 ' + s.nick) : 'brak';
      })()]
    ];
    if (archMyst) sek.splice(2, 0, ['ARCHIWUM BADACZA', archMyst]);
    /* ============================================================
       SKLAD SEKCJI Z DOPASOWANIEM DO WYSOKOSCI STRONY.

       BLAD: wysokosc wiersza i wielkosc pisma byly stale, a liczba sekcji
       urosla z czterech do pieciu. Przy dluzszym opisie tekst przejezdzal
       przez stopke i "REKORD SPOLECZNOSCI" nakladal sie na "ZLOWIONE 3 x".

       Teraz sklad idzie dwoma przebiegami. Pierwszy tylko MIERZY, ile
       wierszy naprawde wyjdzie przy tej szerokosci kolumny. Drugi rysuje,
       ale wczesniej dzieli dostepna wysokosc przez zmierzona i tym ilorazem
       skaluje interlinie oraz oba stopnie pisma. Skala jest przycieta do
       przedzialu 0,74 do 1,00: powyzej jedynki tekst nie rosnie, bo strona
       ma wygladac tak samo dla plotki i dla suma, a ponizej 0,74 zrobilby
       sie nieczytelny. Krotsze strony rysuja sie dokladnie jak dotad.
       ============================================================ */
    const GORA = y + h * 0.458, DOL = y + h * 0.905;
    const lh0 = h * 0.035;

    /* przebieg mierzacy: ile wierszy zajmie kazda sekcja */
    function ileWierszy(tre, font) {
      g.font = font;
      const slowa = String(tre).split(' ');
      let lin = '', n = 0;
      for (const sl of slowa) {
        const prob = lin ? lin + ' ' + sl : sl;
        if (g.measureText(prob).width > (P - L) && lin) { n++; lin = sl; }
        else lin = prob;
      }
      if (lin) n++;
      return n;
    }
    /* Trzy podejscia zamiast jednego. Pomiar przy pelnym piśmie zawyza
       potrzebe, bo mniejsza czcionka mieści wiecej znakow w wierszu i tekst
       zawija sie na mniej linii. Bez iteracji strona kurczylaby sie mocniej,
       niz trzeba. Petla zbiega w dwoch krokach, trzeci to bezpiecznik. */
    let skala = 1;
    for (let i = 0; i < 3; i++) {
      let wierszy = 0;
      for (const [, tre] of sek) wierszy += ileWierszy(tre, F(w * 0.040 * skala));
      /* naglowek 0,92 wiersza, odstep po sekcji 0,5 wiersza */
      const trzeba = (wierszy + sek.length * 0.92 + sek.length * 0.5) * lh0 * skala;
      const nowa = Math.max(0.74, Math.min(1, skala * (DOL - GORA) / trzeba));
      if (Math.abs(nowa - skala) < 0.012) { skala = nowa; break; }
      skala = nowa;
    }

    const fT = F(w * 0.031 * skala, 1), fW = F(w * 0.038 * skala), lh = lh0 * skala;
    let yy = GORA + lh;
    g.textAlign = 'left';

    function zawin(tre, font, szer) {
      g.font=font;
      const slowa=String(tre).split(' '), linie=[]; let lin='';
      for(const sl of slowa){
        const prob=lin ? lin+' '+sl : sl;
        if(g.measureText(prob).width>szer && lin){linie.push(lin);lin=sl;}
        else lin=prob;
      }
      if(lin) linie.push(lin);
      return linie;
    }

    for (const [tyt, tre] of sek) {
      const specjalna = tyt === 'WIEDZA' || tyt === 'OBSERWACJE';

      if (specjalna) {
        const linie=zawin(tre,fW,(P-L)-w*.050);
        const boxH=(linie.length*lh)+lh*1.48;
        g.fillStyle = tyt === 'WIEDZA'
          ? 'rgba(150,110,42,.085)'
          : 'rgba(77,111,112,.075)';
        g.fillRect(L, yy-lh*.72, P-L, boxH);

        g.fillStyle = tyt === 'WIEDZA' ? '#86611D' : '#4D6E6F';
        g.fillRect(L, yy-lh*.72, w*.010, boxH);

        g.font=fT;
        g.fillText(tyt, L+w*.026, yy);
        yy += lh*.92;

        g.font=fW; g.fillStyle='#2A2018';
        for(const lin of linie){g.fillText(lin,L+w*.026,yy);yy+=lh;}
        yy += lh*.58;
      } else {
        g.font=fT; g.fillStyle='#8A6524';
        g.fillText(tyt,L,yy);

        /* mala linia po tytule jak w katalogu okazow */
        const tw=g.measureText(tyt).width;
        g.strokeStyle='rgba(42,32,24,.12)';
        g.lineWidth=Math.max(1,w*.002);
        g.beginPath();
        g.moveTo(L+tw+w*.025,yy-lh*.18);
        g.lineTo(P,yy-lh*.18);
        g.stroke();

        yy += lh*.88;
        g.font=fW; g.fillStyle='#2A2018';
        const linie=zawin(tre,fW,P-L);
        for(const lin of linie){g.fillText(lin,L,yy);yy+=lh;}
        yy += lh*.42;
      }
    }

    /* stopka atlasowa */
    g.strokeStyle='rgba(42,32,24,.24)'; g.lineWidth=Math.max(1,w*.003);
    g.beginPath(); g.moveTo(L,y+h*.918); g.lineTo(P,y+h*.918); g.stroke();

    g.textAlign='left'; g.font=F(w*.028,1);
    g.fillStyle=znany ? '#6B4E1C' : 'rgba(42,32,24,.40)';
    g.fillText(znany ? ('OKAZÓW W REJESTRZE · '+Zapis.ile(k)) : 'STATUS · NIEODKRYTA',
      L,y+h*.955);

    g.textAlign='right'; g.font=F(w*.026);
    g.fillStyle='rgba(42,32,24,.36)';
    g.fillText('QRyby · ATLAS',P,y+h*.955);
  }

  /* ---------- strona instrukcji ----------
     Krok po kroku, duzym drukiem, z numerem na marginesie. Typografia
     o polowe wieksza niz w atlasie, bo to ma sie czytac bez okularow. */
  /* ---------- strona instrukcji ----------
     Typografia liczona z szerokosci strony, wiec wyglada tak samo na kazdym
     telefonie. Cztery zasady, ktore odrozniaja instrukcje od sciany tekstu:
       1. numer w kolku, nie sama cyfra, zeby oko mialo sie czego zlapac
       2. tekst wyrownany do jednej osi, nie do numeru
       3. odstep miedzy punktami wiekszy niz miedzy wierszami jednego punktu,
          bo to on grupuje tresc
       4. tresc pionowo wysrodkowana w kolumnie, a nie wypychana od gory,
          wiec strona z trzema punktami nie wyglada na niedokonczona
     ---------------------------------------- */
  function trescPomocy(g, x, y, w, h, idx) {
    const P = POMOC[idx];
    if (P.c) return trescCennika(g, x, y, w, h, idx);
    papier(g, x, y, w, h);
    const L = x + w * 0.10, PR = x + w * 0.90, SR = x + w / 2;
    const F = (px, gr) => (gr ? '700 ' : '') + Math.round(px) + 'px system-ui,-apple-system,sans-serif';

    /* naglowek */
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = '#2A2018'; g.font = F(w * 0.068, 1);
    g.fillText(P.t, SR, y + h * 0.105);
    g.fillStyle = 'rgba(42,32,24,.40)'; g.font = F(w * 0.032);
    g.fillText((idx + 1) + ' \u2044 ' + POMOC.length, SR, y + h * 0.142);
    g.strokeStyle = 'rgba(42,32,24,.30)'; g.lineWidth = Math.max(1, w * 0.004);
    g.beginPath(); g.moveTo(L, y + h * 0.168); g.lineTo(PR, y + h * 0.168); g.stroke();

    /* rozmierzenie: najpierw licze, ile miejsca zajmie tresc, potem ja stawiam */
    const r = Math.max(9, w * 0.030);           /* promien kolka z numerem */
    const lewy = L + r * 2.6, szer = PR - lewy;
    const fT = F(w * 0.046), lh = h * 0.046, przerwa = h * 0.030;
    g.font = fT;
    const bloki = P.a.map(txt => {
      const slowa = txt.split(' ');
      const linie = []; let lin = '';
      for (const sl of slowa) {
        const prob = lin ? lin + ' ' + sl : sl;
        if (g.measureText(prob).width > szer && lin) { linie.push(lin); lin = sl; }
        else lin = prob;
      }
      if (lin) linie.push(lin);
      return linie;
    });
    const wysokosc = bloki.reduce((a, b) => a + b.length * lh + przerwa, -przerwa);
    const gora = y + h * 0.20, dol = y + h * 0.90;
    let yy = gora + Math.max(0, (dol - gora - wysokosc) / 2) + lh * 0.7;

    bloki.forEach((linie, n) => {
      /* kolko z numerem, wysrodkowane na PIERWSZYM wierszu punktu */
      const cy2 = yy - lh * 0.32;
      g.beginPath(); g.arc(L + r, cy2, r, 0, 6.2832);
      g.fillStyle = '#E3C55B'; g.fill();
      g.strokeStyle = '#2A2018'; g.lineWidth = Math.max(1.4, w * 0.005); g.stroke();
      g.fillStyle = '#2A2018'; g.font = F(r * 1.05, 1);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(n + 1), L + r, cy2 + r * 0.04);
      /* tekst punktu */
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.font = fT; g.fillStyle = '#2A2018';
      for (const lin of linie) { g.fillText(lin, lewy, yy); yy += lh; }
      yy += przerwa;
    });

    /* stopka: na ostatniej stronie mowi, jak wyjsc, na reszcie jak isc dalej */
    g.textAlign = 'center'; g.font = F(w * 0.030, 1);
    g.fillStyle = 'rgba(42,32,24,.42)';
    g.fillText(idx + 1 < POMOC.length ? 'PRZESU\u0143 PALCEM W BOK' : 'PRZESU\u0143 W D\u00D3\u0141, ABY ZAMKN\u0104\u0106',
      SR, y + h * 0.945);
  }

  /* ---------- strona cennika ----------
     Dwie kolumny, nazwa z lewej, kwota z prawej, kropkowana linia miedzy
     nimi. Kwoty wyrownane do prawej krawedzi, wiec czytaja sie jak rachunek,
     a nie jak wyliczanka. Bez numerow w kolkach, bo to nie sa kroki. */
  function trescCennika(g, x, y, w, h, idx) {
    const P = POMOC[idx];
    papier(g, x, y, w, h);
    const L = x + w * 0.10, PR = x + w * 0.90, SR = x + w / 2;
    const F = (px, gr) => (gr ? '700 ' : '') + Math.round(px) + 'px system-ui,-apple-system,sans-serif';

    /* naglowek */
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = '#2A2018'; g.font = F(w * 0.058, 1);
    g.fillText(P.t, SR, y + h * 0.105);
    g.fillStyle = 'rgba(42,32,24,.40)'; g.font = F(w * 0.032);
    g.fillText((idx + 1) + ' \u2044 ' + POMOC.length, SR, y + h * 0.142);
    g.strokeStyle = 'rgba(42,32,24,.30)'; g.lineWidth = Math.max(1, w * 0.004);
    g.beginPath(); g.moveTo(L, y + h * 0.168); g.lineTo(PR, y + h * 0.168); g.stroke();

    /* ============================================================
       UKLAD LICZONY, NIE ZGADYWANY.
       Poprzednia wersja stawiala wiersze od stalego miejsca i klada przypis
       na stalej wysokosci, wiec przy jedenastu pozycjach jedno wchodzilo
       na drugie. Teraz najpierw licze, ile miejsca zajmie CALA tresc razem
       z przypisem, potem rozdzielam je proporcjonalnie, a odstepy skalują
       sie same. Dolozenie kolejnego wiersza niczego nie rozwali.
       ============================================================ */
    const maPodpis = P.c.some(r => r[2]);
    const fW = F(w * 0.044), fK = F(w * 0.046, 1), fP = F(w * 0.030);
    const hWiersz = h * (maPodpis ? 0.042 : 0.038);
    const hPodpis = h * 0.030;
    const przerwa = h * 0.024;
    let potrzeba = 0;
    for (const r of P.c) potrzeba += hWiersz + (r[2] ? hPodpis : 0) + przerwa;
    const przypisH = P.s ? h * 0.085 : 0;
    const gora = y + h * 0.205, dol = y + h * 0.895 - przypisH;
    const luz = Math.max(0, (dol - gora - potrzeba) / 2);
    let yy = gora + luz + hWiersz * 0.8;

    for (const [co, ile, pod] of P.c) {
      /* nazwa z lewej */
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.font = fW; g.fillStyle = '#2A2018';
      g.fillText(co, L, yy);
      const konNazwy = L + g.measureText(co).width;
      /* kwota z prawej */
      g.textAlign = 'right'; g.font = fK; g.fillStyle = '#7A5C1E';
      g.fillText(ile, PR, yy);
      const poczKwoty = PR - g.measureText(ile).width;
      /* kropki tylko tam, gdzie naprawde jest miejsce */
      const odKropek = konNazwy + w * 0.03, doKropek = poczKwoty - w * 0.03;
      if (doKropek - odKropek > w * 0.06) {
        g.fillStyle = 'rgba(42,32,24,.24)';
        for (let kx = odKropek; kx < doKropek; kx += w * 0.020)
          g.fillRect(kx, yy - h * 0.005, w * 0.005, w * 0.005);
      }
      yy += hWiersz;
      /* podpis pod wierszem */
      if (pod) {
        g.textAlign = 'left'; g.font = fP; g.fillStyle = 'rgba(42,32,24,.52)';
        g.fillText(pod, L, yy);
        yy += hPodpis;
      }
      yy += przerwa;
    }

    if (P.s) {
      g.textAlign = 'center'; g.font = F(w * 0.032);
      g.fillStyle = 'rgba(42,32,24,.55)';
      const slowa = P.s.split(' '); let lin = '', n = 0;
      const yb = y + h * 0.885 - przypisH * 0.4;
      for (const sl of slowa) {
        const prob = lin ? lin + ' ' + sl : sl;
        if (g.measureText(prob).width > (PR - L) && lin) { g.fillText(lin, SR, yb + n * h * 0.038); n++; lin = sl; }
        else lin = prob;
      }
      if (lin) g.fillText(lin, SR, yb + n * h * 0.038);
    }

    g.textAlign = 'center'; g.font = F(w * 0.030, 1);
    g.fillStyle = 'rgba(42,32,24,.42)';
    g.fillText(idx + 1 < POMOC.length ? 'PRZESU\u0143 PALCEM W BOK' : 'PRZESU\u0143 W D\u00d3\u0141, ABY ZAMKN\u0104\u0106',
      SR, y + h * 0.945);
  }

  /* ---------- geometria ksiegi ---------- */
  function obszar(W, H) {
    const w = Math.min(W * 0.92, H * 0.64), h = Math.min(H * 0.88, w * 1.42);
    return { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h };
  }

  /* ---------- rysowanie ---------- */
  function rysuj(g, W, H) {
    if (!otwarta) return;
    const O = obszar(W, H);
    g.save();

    /* Stage 13: jezioro najpierw schodzi z uwagi, potem ksiega osiada.
       Ruch jest krotki i bez bounce, zeby nie wygladala jak popup. */
    const e0 = Math.max(0, Math.min(1, wej));
    const e = 1 - Math.pow(1 - e0, 3);
    g.fillStyle = 'rgba(6,5,10,' + (0.48 + 0.42 * e) + ')';
    g.fillRect(0, 0, W, H);

    g.translate(W/2, H/2);
    g.scale(0.94 + 0.06*e, 0.94 + 0.06*e);
    g.translate(-W/2, -H/2);
    g.globalAlpha = e;

    /* okladka i grzbiet */
    g.fillStyle = '#432C14'; g.fillRect(O.x - 15, O.y - 15, O.w + 30, O.h + 30);
    g.strokeStyle = '#B08840'; g.lineWidth = 2;
    g.strokeRect(O.x - 8, O.y - 8, O.w + 16, O.h + 16);
    g.fillStyle = '#301E0C'; g.fillRect(O.x - 15, O.y - 15, 15, O.h + 30);

    const bw = Math.round(O.w), bh = Math.round(O.h);
    const podSpodem = (post > 0 && kier > 0) ? docelowa : strona;
    g.drawImage(bufor(podSpodem, bw, bh), O.x, O.y, O.w, O.h);

    if (post > 0) {
      /* ============================================================
         OBROT BEZ LUSTRA.

         Poprzedni model traktowal kartke jak fizyczna karte z rewersem:
         po polowie obrotu rysowal strone docelowa w odbiciu lustrzanym.
         W prawdziwej ksiazce to dziala, bo rewers jest ZADRUKOWANY po
         drugiej stronie papieru i czyta sie normalnie. Na ekranie mamy
         jedna strone naraz, wiec odbicie bylo po prostu odbiciem: tekst
         szedl od prawej do lewej i to widac bylo na zrzucie.

         Model wlasciwy dla pojedynczej strony jest prostszy i czytelniejszy:
           dalej   strona biezaca odchyla sie od grzbietu i znika,
                   odslaniajac lezaca pod spodem strone docelowa
           wstecz  strona docelowa nasuwa sie od grzbietu i przykrywa biezaca
         W obu wypadkach os obrotu jest przy grzbiecie, a szerokosc idzie
         cosinusem kata, wiec ruch zwalnia przy koncu tak jak papier.
         Zadnego odbicia nie ma w ogole.
         ============================================================ */
      const kat = post * (Math.PI / 2);
      const szer = (kier > 0) ? Math.cos(kat) : Math.sin(kat);
      const rysowana = (kier > 0) ? strona : docelowa;
      const os = O.x;                       /* grzbiet jest po lewej */

      /* cien pod krawedzia ruchomej strony */
      const kraw = os + O.w * szer;
      const gc = g.createLinearGradient(kraw, 0, kraw + O.w * 0.34, 0);
      gc.addColorStop(0, 'rgba(26,16,6,' + (0.40 * Math.sin(post * Math.PI)) + ')');
      gc.addColorStop(1, 'rgba(26,16,6,0)');
      g.save(); g.beginPath(); g.rect(O.x, O.y, O.w, O.h); g.clip();
      g.fillStyle = gc; g.fillRect(O.x, O.y, O.w, O.h);
      g.restore();

      g.save();

  /* ============================================================
     ZAKLADKI PASM.
     Siedem jezyczkow przyklejonych do dolnej krawedzi okladki, w barwach
     laku. Dotkniecie przenosi do PIERWSZEGO gatunku danego pasma, wiec
     szukanie konkretnej ryby nie wymaga przewracania dziesiatkow stron.
     Aktywne pasmo, czyli to, w ktorym stoi otwarta strona, jest wysuniete
     i jasniejsze.
     ============================================================ */
  function zakladki(W, H) {
    const O = obszar(W, H);
    const sz = O.w / 8, wys = Math.max(20, O.h * 0.038);

    const ks = klucze();

/* ============================================================
   PODPIECIE WYSZUKIWARKI.
   Pole zyje poza kanwa, wiec musi samo pilnowac trzech rzeczy: zeby dotkniecie
   w nie NIE przewracalo kartki, zeby zamkniecie ksiegi kasowalo filtr,
   i zeby Enter zdejmowal klawiature zamiast wysylac formularz.
   ============================================================ */
(function podepnijSzukajke() {
  const pole = document.getElementById('szukajRyb');
  const x = document.getElementById('szukajX');
  const box = document.getElementById('szukajka');
  if (!pole || !box) return;
  /* Dotkniecia w pasek nie ida do warstwy przewracania kartek. */
  for (const zd of ['pointerdown', 'pointerup', 'pointermove', 'touchstart', 'click'])
    box.addEventListener(zd, e => e.stopPropagation());
  pole.addEventListener('input', () => Ksiega.ustawFiltr(pole.value));
  pole.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); pole.blur(); } });
  x.addEventListener('click', () => { pole.value = ''; Ksiega.ustawFiltr(''); pole.blur(); });
  /* Zamkniecie ksiegi zeruje filtr, zeby nastepne otwarcie zaczynalo od spisu. */
  let bylo = false;
  setInterval(() => {
    const jest = Ksiega.czyOtwarta() && Ksiega.tryb() === 'atlas';
    if (bylo && !jest && pole.value) { pole.value = ''; Ksiega.ustawFiltr(''); }
    bylo = jest;
  }, 400);
})();

   droga niz przez zamknij(), HUD i tak wraca. Sprawdzenie co pol sekundy
   kosztuje tyle co nic, a ratuje przed ekranem bez zadnego przycisku. */
setInterval(() => {
  const kl = document.body && document.body.classList;
  if (!kl || typeof kl.contains !== 'function') return;
  const ma = kl.contains('ksiega-otwarta');
  if (ma !== Ksiega.czyOtwarta()) kl.toggle('ksiega-otwarta', Ksiega.czyOtwarta());
}, 500);

/* ============================================================
   ZADANIA DZIENNE.

   276 zadan w tablicy ZADANIA: 84 jednogwiazdkowych, 112 dwu, 80 trzy.
   Nagrody 1000, 5000 i 25 000 qryb. Gwiazdka liczy sie z CZASU wykonania
   (do 12 minut, do 45, powyzej), a nie z widzimisie -- dzieki temu pula
   sama sie sortuje, gdy dochodza nowe pozycje.

   NA DOBE WYPADAJA TRZY, po jednym z kazdego poziomu. Wybor idzie z ZIARNA
   Z DATY, wiec kazdy gracz dostaje tego samego dnia ten sam zestaw i mozna
   o nim rozmawiac na grupie. Odswiezenie za 300 qryb dosypuje ziarno, wiec
   nowy zestaw jest inny, ale nadal deterministyczny.

   Postep liczy sie z tych samych zdarzen, ktore i tak przechodza przez zapis,
   wiec zadania nie wymagaja zadnej dodatkowej ksiegowosci w petli gry.
   Liczniki dobowe zeruja sie o polnocy razem z reszta statystyk.
   ============================================================ */
const Zadania = (() => {
  /* ============================================================
     NAGRODY PRZELICZONE NA EKONOMIE, KTORA JUZ ZYJE.
     Gdy zadania powstawaly, jedynym zrodlem qryb byly rekordy i progi doby,
     wiec sto qryb za zadanie bylo sensowna stawka. Potem doszla gielda:
     jedno wiaderko przecietnych ryb idzie za 150-1000 qryb, a wiaderko
     z trofeum potrafi pojsc za ponad dwa tysiace. Sto qryb za zadanie
     dnia znaczylo wiec mniej niz jedna sprzedaz -- czyli nic.

     Punkt odniesienia dla nowych stawek: najtansza zaneta kosztuje 50 000.
     Dzien z kompletem pieciu zadan ma dawac mniej wiecej tyle, zeby dwa
     dobre dni starczyly na nia bez lowienia pod wiaderko. Stad 1000 /
     5000 / 25 000, przy sredniej dobowej okolo 30-40 tysiecy.
     Odswiezenie idzie w gore w tej samej proporcji: ma bolec tyle samo
     co wczesniej, czyli mniej wiecej jedno zadanie jednogwiazdkowe.
     ============================================================ */
  const NAGRODA = { 1: 7000, 2: 35000, 3: 175000 }, KOSZT_ODSWIEZENIA = 28000;
  const ILE_NA_DOBE = 5;

  /* Prosty generator z ziarna, zeby ten sam dzien dawal ten sam zestaw. */
  function ziarno(txt) {
    let h = 2166136261;
    for (let i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); }
    return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13; return (h >>> 0) / 4294967296; };
  }
  /* ============================================================
     PIEC ZADAN, LOSOWANYCH Z CALEJ PULI.
     Wczesniej dzien mial sztywno jedno latwe, jedno srednie i jedno trudne.
     Teraz kazde z pieciu ciagnie sie z tego samego worka, wiec moze trafic
     sie piec latwych albo piec trudnych. Proporcje puli robia reszte:
     81 jednogwiazdkowych, 105 dwu i 61 trzy, wiec dzien z samymi trudnymi
     jest mozliwy, ale rzadki.
     Powtorki w obrebie dnia sa odsiewane, zeby nie wypadlo dwa razy to samo.
     ============================================================ */
  function wybierz(dzien, obrot) {
    const r = ziarno(dzien + '#' + obrot), lista = [];
    let ochrona = 0;
    while (lista.length < ILE_NA_DOBE && ochrona++ < 200) {
      const kand = ZADANIA[Math.floor(r() * ZADANIA.length)];
      if (!kand || lista.indexOf(kand.i) >= 0) continue;
      lista.push(kand.i);
    }
    return lista;
  }
  function stan() {
    if (typeof Zapis === 'undefined') return null;
    Zapis.nowaDoba();
    const d = Zapis.dane();
    const dzien = d.stat.doba;
    /* ============================================================
       ZESTAW DNIA MUSI PASOWAC DO OBECNEJ PULI.

       Numery zadan sa indeksami w tablicy ZADANIA. Gdy pula sie zmienia,
       a zapis pamieta wczorajsze numery, moga one wskazywac na zadania,
       ktorych juz nie ma: ZADANIA[id] wychodzi undefined i panel wywala
       sie przy pierwszym odczycie gwiazdek.

       Stad znacznik wersji puli w zapisie. Kazda zmiana liczby zadan albo
       liczby zadan na dobe uniewaznia zestaw i losuje go od nowa, zamiast
       udawac, ze stare numery cos jeszcze znacza.
       ============================================================ */
    const wersjaPuli = ZADANIA.length + 'x' + ILE_NA_DOBE;
    const zly = d.zadania && (
      d.zadania.w !== wersjaPuli ||
      !Array.isArray(d.zadania.lista) ||
      d.zadania.lista.length !== ILE_NA_DOBE ||
      d.zadania.lista.some(i => !ZADANIA[i]));
    if (!d.zadania || d.zadania.dzien !== dzien || zly) {
      const pusteN = () => new Array(ILE_NA_DOBE).fill(0);
      d.zadania = { dzien: dzien, w: wersjaPuli, obrot: 0, lista: wybierz(dzien, 0),
                    postep: pusteN(), gotowe: pusteN(), odebrane: pusteN() };
      Zapis.zapisz();
    }
    return d.zadania;
  }
  function odswiez() {
    const z = stan(), d = Zapis.dane();
    if (!z) return false;
    if ((d.monety || 0) < KOSZT_ODSWIEZENIA) return false;
    d.monety -= KOSZT_ODSWIEZENIA;
    z.obrot++; z.lista = wybierz(z.dzien, z.obrot);
    const pusteN = () => new Array(ILE_NA_DOBE).fill(0);
    z.postep = pusteN(); z.gotowe = pusteN(); z.odebrane = pusteN();
    Zapis.zapisz();
    return true;
  }
  /* Dolozenie postepu. typ i wartosc opisuja ZDARZENIE, nie zadanie:
     jedno zlowienie moze ruszyc kilka zadan naraz. */
  function zdarzenie(typ, ile, gat) {
    const z = stan(); if (!z) return [];
    const zrobione = [];
    /* Trzy tablice licznikow musza miec te sama dlugosc co lista. */
    for (const pole of ['postep', 'gotowe', 'odebrane'])
      if (!Array.isArray(z[pole]) || z[pole].length !== ILE_NA_DOBE)
        z[pole] = new Array(ILE_NA_DOBE).fill(0);
    z.lista.forEach((id, n) => {
      const Z = ZADANIA[id];
      if (!Z || z.gotowe[n]) return;
      let dodaj = 0;
      if (Z.t === typ) {
        if (Z.t === 'gat') dodaj = (gat === Z.k) ? ile : 0;
        /* Zadania na WARTOSC DOKLADNA i na PROGI liczone maksimum, nie suma:
           'dokladnie 54' spelnia sie jedna ryba, a nie zbieraniem punktow. */
        else dodaj = ile;
      }
      if (!dodaj) return;
      /* Zadania na rekord jednorazowy trzymaja maksimum, nie sume. */
      if (typ === 'dokladnie') {
        /* Trafienie CO DO PUNKTU: albo ta ryba ma dokladnie tyle, albo nic. */
        if (dodaj === Z.c) z.postep[n] = Z.c;
      }
      /* 'sprzedaz' i 'wiadro' licza sie MAKSIMUM, nie suma: jedna transakcja
         za tysiac spelnia prog tysiaca, a dwie po piecset juz nie. Tak samo
         wiaderko -- liczy sie stan naraz, nie suma wrzuconych ryb.
         'utarg' zostaje suma, bo to obrot calej doby. */
      else if (typ === 'karta' || typ === 'dlugosc' || typ === 'waga' ||
               typ === 'gatunki' || typ === 'seria' || typ === 'srednia' ||
               typ === 'lawice' || typ === 'sprzedaz' || typ === 'wiadro')
        z.postep[n] = Math.max(z.postep[n], dodaj);
      else z.postep[n] += dodaj;
      /* Zadanie wykonane nie wyplaca sie samo. Czeka na odbior: ikona
         zadan zapala sie innym kolorem i dostaje wykrzyknik, a monety
         przesypuja sie na konto dopiero po dotknieciu. */
      if (z.postep[n] >= Z.c) { z.gotowe[n] = 1; zrobione.push(Z); }
    });
    Zapis.zapisz();
    return zrobione;
  }
  function odbierz(n) {
    const z = stan(); if (!z || !z.gotowe[n] || z.odebrane[n]) return 0;
    const Z = ZADANIA[z.lista[n]];
    z.odebrane[n] = 1;
    Zapis.dane().monety = (Zapis.dane().monety || 0) + NAGRODA[Z.g];
    Zapis.zapisz();
    return NAGRODA[Z.g];
  }
  /* Ile nagrod czeka na odbior. HUD pyta o to co pol sekundy. */
  function doOdbioru() {
    const z = stan(); if (!z || !z.gotowe) return 0;
    let n = 0;
    for (let i = 0; i < z.lista.length; i++) if (z.gotowe[i] && !z.odebrane[i]) n++;
    return n;
  }
  const wszystkieZrobione = () => { const z = stan(); return z && z.odebrane.every(Boolean); };
  const opis = n => { const z = stan(); return z ? ZADANIA[z.lista[n]] : null; };
  return { stan, odswiez, zdarzenie, odbierz, doOdbioru, wszystkieZrobione, opis,
           NAGRODA, KOSZT_ODSWIEZENIA, ILE: () => ZADANIA.length };
})();
window.Zadania = Zadania;

  const w = { razem: MIX.razem, tiery: {}, gatunki: {}, odrzucone: MIX.odrzucone };
  for (const t in MIX.tier) w.tiery[t] = +(100 * MIX.tier[t] / MIX.razem).toFixed(2);
  for (const k in MIX.spawn) w.gatunki[k] = +(100 * MIX.spawn[k] / MIX.razem).toFixed(2);
  const teraz = {};
  for (const f of school) { const t = f.tier || 1; teraz[t] = (teraz[t] || 0) + 1; }
  w.wKadrze = teraz;
  console.table(w.tiery); console.log(w);
  return w;
};

function tierGatunku(slug) {

/* ============================================================
   PACZKI: SPOSOB KUPOWANIA ZANET, ZAMIAST WYBIERANIA WPROST.

   zamiast tego trzy paczki, kazda z jawnie podanymi szansami na kazda

   powyzej) razy szanse danej paczki:
     PODSTAWOWA  EV 169 021  cena 130 000  (76% EV)
     TECH        EV 298 833  cena 250 000  (84% EV)

   Najdrozsza ma najlepsze szanse na epickie (50%), ale nigdy sto
   procent -- 15% pozostaje pospolite, bo tak mial byc, zeby nawet
   w najdrozszej paczce dalo sie trafic gowno. */
const PACZKI = {

    szanse: { pospolita: 0.15, rzadka: 0.35, epicka: 0.50 } }

window.PACZKI = PACZKI;

/* ============================================================
   CIASTKO Z WROZBA.
   Do ostatniego etapu UI nie zdradza, ze cala pula efektow jest negatywna.
   Skutki sa osobiste dla kupujacego — troll nie niszczy wspolnej populacji. */
const FortuneCookie = (() => {
  const PRICE = 10000000;
  const DEFINICJE = [
    {id:'cierpliwosc',quote:'Cierpliwość zostanie nagrodzona.',tekst:'Ten gatunek nie pojawi się przez 1000 ławic.',lawic:1000,spawnMult:0},

    {id:'czas_leczy',quote:'Czas leczy wszystkie rany.',tekst:'Przerwa od tego gatunku potrwa 250 ławic.',lawic:250,spawnMult:0},
    {id:'wielkie_zmiany',quote:'Wielkie zmiany są już blisko.',tekst:'Udział tego gatunku w Twoich ławicach spada o 50% przez 1000 ławic.',lawic:1000,spawnMult:.5},
    {id:'rzadkosc',quote:'Rzadkość dodaje wartości.',tekst:'Szansa na ten gatunek spada o 90% przez 500 ławic.',lawic:500,spawnMult:.1},
    {id:'mniej_wiecej',quote:'Mniej znaczy więcej.',tekst:'Szansa na ten gatunek spada o 75% przez 750 ławic.',lawic:750,spawnMult:.25},
    {id:'male_rzeczy',quote:'Małe rzeczy mają wielką wartość.',tekst:'Przez 400 ławic okazy tego gatunku mają około 25% normalnego rozmiaru.',lawic:400,sizeMult:.25},
    {id:'skromnosc',quote:'Skromność zostanie zauważona.',tekst:'Przez 600 ławic ten gatunek będzie wyraźnie mniejszy niż zwykle.',lawic:600,sizeMult:.45},
    {id:'rekordy',quote:'Rekordy są po to, by je wspominać.',tekst:'Przez 500 ławic ten gatunek nie będzie miał szansy na naprawdę duży okaz.',lawic:500,sizeMult:.60},
    {id:'niepewnosc',quote:'Los kocha niepewność.',tekst:'Szansa na spotkanie tego gatunku spada o 65% przez 1000 ławic.',lawic:1000,spawnMult:.35},
    {id:'znikanie',quote:'Czasem najlepiej po prostu zniknąć.',tekst:'Przez 450 ławic 75% ławic usuwa wszystkie sztuki tego gatunku tuż przed pojawieniem się.',lawic:450,vanishChance:.75},
    {id:'samotnosc',quote:'Samotność sprzyja refleksji.',tekst:'Przez 600 ławic może pojawić się najwyżej jedna sztuka tego gatunku na ławicę.',lawic:600,maxPerShoal:1},
    {id:'tlok',quote:'Tłok nie służy nikomu.',tekst:'Przez 800 ławic najwyżej jedna sztuka na ławicę, a sama szansa pojawienia spada o połowę.',lawic:800,spawnMult:.5,maxPerShoal:1},
    {id:'polowa',quote:'Połowa sukcesu to właściwy moment.',tekst:'Szansa na ten gatunek jest o połowę mniejsza przez 1500 ławic.',lawic:1500,spawnMult:.5},
    {id:'droga',quote:'Nie każda droga prowadzi tam, gdzie chcesz.',tekst:'Szansa na ten gatunek spada o 80% przez 300 ławic.',lawic:300,spawnMult:.2},
    {id:'przerwa',quote:'Krótka przerwa dobrze robi każdej relacji.',tekst:'Ten gatunek nie pokaże się przez 300 ławic.',lawic:300,spawnMult:0},
    {id:'wielkosc',quote:'Wielkość nie jest najważniejsza.',tekst:'Przez 900 ławic ten gatunek będzie miał około 35% normalnego rozmiaru.',lawic:900,sizeMult:.35},
    {id:'najlepsze',quote:'Najlepsze rzeczy wymagają cierpliwości.',tekst:'Szansa na ten gatunek spada o 85% przez 400 ławic.',lawic:400,spawnMult:.15},
    {id:'rocznik',quote:'Każdy rocznik ma swój charakter.',tekst:'Przez 700 ławic gatunek pojawia się o połowę rzadziej i jest o połowę mniejszy.',lawic:700,spawnMult:.5,sizeMult:.5},
    {id:'po_stronie',quote:'Los jest po Twojej stronie.',tekst:'…ale nie po stronie tej ryby. 95% jej szansy na pojawienie się znika przez 200 ławic.',lawic:200,spawnMult:.05},
    {id:'smok_zycia',quote:'Życie zawsze znajduje drogę.',tekst:'W następnej ławicy czeka stworzenie z wróżby.',legendary:'smok_zycia'}
  ];
  function stan(){
    if(typeof Zapis==='undefined')return null;
    const d=Zapis.dane();
    if(!Array.isArray(d.fortuneEffects))d.fortuneEffects=[];
    if(!Array.isArray(d.fortuneHistory))d.fortuneHistory=[];
    return d;
  }
  function def(id){return DEFINICJE.find(x=>x.id===id)||null}
  function aktywne(slug){
    const d=stan();if(!d)return[];
    return d.fortuneEffects.filter(e=>e&&e.slug===slug&&e.left>0&&def(e.id));
  }
  function species(){
    return Object.keys(window.GATUNKI||{}).filter(k=>GATUNKI[k]&&!GATUNKI[k].zepsuty&&!GATUNKI[k].bezEko)
      .sort((a,b)=>String(GATUNKI[a].nazwa||a).localeCompare(String(GATUNKI[b].nazwa||b),'pl'));
  }
  function nazwa(slug){return(window.GATUNKI&&GATUNKI[slug]&&GATUNKI[slug].nazwa)||String(slug||'').toUpperCase()}
  function draw(){return DEFINICJE[Math.floor(Math.random()*DEFINICJE.length)]}
  function purchase(slug){
    const d=stan();
    if(!d||!window.GATUNKI||!GATUNKI[slug]||GATUNKI[slug].zepsuty)return{ok:false,powod:'NIEPRAWIDŁOWY GATUNEK'};
    if((d.monety||0)<PRICE)return{ok:false,powod:'ZA MAŁO QRYB'};
    const f=draw();
    d.monety-=PRICE;
    if (!f.legendary)
      d.fortuneEffects.push({slug:slug,id:f.id,left:f.lawic,od:f.lawic,kiedy:Date.now()});
    d.fortuneHistory.unshift({slug:slug,id:f.id,kiedy:Date.now()});
    d.fortuneHistory=d.fortuneHistory.slice(0,20);
    d.fortunePending={slug:slug,id:f.id,kiedy:Date.now()};
    if(Zapis.teraz)Zapis.teraz();else Zapis.zapisz();
    return{ok:true,slug:slug,id:f.id,def:f};
  }
  function pending(){
    const d=stan();if(!d||!d.fortunePending)return null;
    const q=d.fortunePending,f=def(q.id);
    return(q.slug&&f)?{slug:q.slug,id:q.id,def:f}:null;
  }
  function clearPending(){
    const d=stan();if(!d)return;
    if(d.fortunePending&&d.fortunePending.id==='smok_zycia')
      d.fortuneLegendaryNextShoal='smok_zycia';
    d.fortunePending=null;Zapis.zapisz();
  }
  function legendaryReady(){
    const d=stan();return !!(d&&d.fortuneLegendaryNextShoal==='smok_zycia');
  }
  function consumeLegendary(){
    const d=stan();if(!d||!legendaryReady())return false;
    d.fortuneLegendaryNextShoal=null;Zapis.zapisz();return true;
  }
  function spawnMultiplier(slug){
    let m=1;
    for(const e of aktywne(slug)){const f=def(e.id);if(f&&f.spawnMult!==undefined)m*=f.spawnMult}
    return Math.max(0,m);
  }
  function adjustFish(fish){
    if(!fish||!fish.gat)return fish;
    let m=1;
    for(const e of aktywne(fish.gat)){const f=def(e.id);if(f&&f.sizeMult!==undefined)m*=f.sizeMult}
    if(m>=.999)return fish;
    try{
      fish.cm=Math.max(1,fish.cm*m);
      fish.waga=wagaZ(fish.cm,fish.kLog,fish.gat);
      fish.s=skalaZCm(fish.cm,fish.gat);
      fish.sy=fish.s*glebokoscZ(fish.kLog);
      if(window.XScore&&GATUNKI[fish.gat])fish.tier=XScore.tierRyby(fish.gat,GATUNKI[fish.gat],fish.cm,fish.waga);
    }catch(e){}
    return fish;
  }
  function afterShoal(arr){
    if(!Array.isArray(arr)||!arr.length)return;
    const d=stan();if(!d)return;
    for(const e of d.fortuneEffects.slice()){
      if(!e||e.left<=0)continue;
      const f=def(e.id);if(!f)continue;
      if(f.spawnMult===0){
        for(let i=arr.length-1;i>=0;i--)if(arr[i]&&arr[i].gat===e.slug)arr.splice(i,1);
        continue;
      }
      if(f.vanishChance&&Math.random()<f.vanishChance)
        for(let i=arr.length-1;i>=0;i--)if(arr[i]&&arr[i].gat===e.slug)arr.splice(i,1);
      if(f.maxPerShoal!==undefined){
        let seen=0;
        for(let i=0;i<arr.length;i++){
          if(!arr[i]||arr[i].gat!==e.slug)continue;
          if(++seen>f.maxPerShoal){arr.splice(i,1);i--}
        }
      }
    }
  }
  function consumeShoal(){
    const d=stan();if(!d)return;
    let changed=false;
    for(const e of d.fortuneEffects)if(e&&e.left>0){e.left--;changed=true}
    const n=d.fortuneEffects.length;
    d.fortuneEffects=d.fortuneEffects.filter(e=>e&&e.left>0&&def(e.id));
    if(d.fortuneEffects.length!==n)changed=true;
    if(changed)Zapis.zapisz();
  }
  return{PRICE,species,nazwa,def,purchase,pending,clearPending,legendaryReady,consumeLegendary,
    spawnMultiplier,adjustFish,afterShoal,consumeShoal,
    active:slug=>aktywne(slug).map(e=>Object.assign({},e,{def:def(e.id)}))};
})();

window.FortuneCookie=FortuneCookie;

<script>window.ZANETY_RZADKOSC = (function () {
  const out = { pospolita: [], rzadka: [], epicka: [] };
  for (const k in ZANETY) out[ZANETY[k].rzadkosc].push(k);
  return out;
})();

/* Losowanie jednej paczki: najpierw rzadkosc wedlug szans paczki, potem
   gatunek zanety losowo (rowno) wsrod wszystkich o tej rzadkosci. */
function losujZPaczki(idPaczki) {
  const P = PACZKI[idPaczki]; if (!P) return null;
  const r = Math.random();
  let prog = 0, rz = 'pospolita';
  for (const k of ['pospolita', 'rzadka', 'epicka']) {
    prog += P.szanse[k];
    if (r < prog) { rz = k; break; }
  }
  const pula = ZANETY_RZADKOSC[rz];
  if (!pula.length) return null;
  return pula[Math.floor(Math.random() * pula.length)];
}
window.losujZPaczki = losujZPaczki;
window.ZANETY = ZANETY;

function zanetaStan() {
  if (typeof Zapis === 'undefined') return null;
  const z = Zapis.dane().zaneta;
  return (z && ZANETY[z.id] && z.zostalo > 0) ? z : null;
}
window.zanetaStan = zanetaStan;

function zanWPuli(slug, pula, z) {
  if (pula === 'pasma123') return zanPasmo(slug) <= 3;
  if (pula === 'pasma456') { const p = zanPasmo(slug); return p >= 4 && p <= 6; }
  if (pula === 'karpiowate') return ZAN_KARPIOWATE.indexOf(slug) >= 0;
  if (pula === 'drapiezne') return ZAN_DRAPIEZNE.indexOf(slug) >= 0;
  if (pula === 'nocne') return zanNocna(slug);
  if (pula === 'losowe5') return !!(z && z.gat && z.gat.indexOf(slug) >= 0);
  if (pula === 'wszystkie') return true;
  if (pula === 'wartosciowe123') return ZAN_WARTOSCIOWE_123.indexOf(slug) >= 0;
  /* Szesc nowych pul, jedna na pasmo: 'pasmo1'..'pasmo6'. Numer po prostu
     idzie do parsowania jako Number(pula.slice(5)) zamiast szesciu
     osobnych if-ow. */
  if (pula.indexOf('pasmo') === 0) { const n = Number(pula.slice(5)); return n > 0 && zanPasmo(slug) === n; }
  return false;
}

window.zanetaRozmiar = function (slug) {
  const z = zanetaStan(); if (!z) return 1;
  const e = ZANETY[z.id].efekt;
  return (e.rodzaj === 'rozmiar' && zanWPuli(slug, e.pula, z)) ? e.mnoznik : 1;
};
window.zanetaPotwor = function (slug) {
  const z = zanetaStan(); if (!z) return 1;
  const e = ZANETY[z.id].efekt;
  return (e.rodzaj === 'potwor' && zanWPuli(slug, e.pula, z)) ? e.mnoznik : 1;
};
window.zanetaTylko = function () {
  const z = zanetaStan(); if (!z) return null;
  const e = ZANETY[z.id].efekt;
  if (e.rodzaj !== 'tylko') return null;
  if (e.pula === 'drapiezne') return ZAN_DRAPIEZNE;
  if (e.pula === 'wartosciowe123') return ZAN_WARTOSCIOWE_123;
  if (e.pula.indexOf('pasmo') === 0) {
    const n = Number(e.pula.slice(5));
    return n > 0 ? zanPasmoLista(n) : null;
  }
  return null;
};
window.zanetaProg = function () {
  const z = zanetaStan(); if (!z) return null;
  const e = ZANETY[z.id].efekt;
  return (e.rodzaj === 'prog') ? { prog: e.prog, krotnosc: e.krotnosc, warunek: e.warunek || null } : null;
};
/* Zaneta 'najlepsza' (wlocznia): pickLure w module zarzutu pyta o to
   bezposrednio, bo to nie dotyczy losowania ryb, tylko wyboru celu
   przy haczyku. */
window.zanetaNajlepsza = function () {
  const z = zanetaStan(); if (!z) return false;
  return ZANETY[z.id].efekt.rodzaj === 'najlepsza';
};

/* Piatka gatunkow losuje sie RAZ, w chwili wrzucenia zanety do wody, i lezy
   w zapisie. Gdyby losowala sie przy kazdym pytaniu, gracz mialby inna
   piatke w kazdej klatce i zaneta nie znaczylaby nic. */
window.zanetaLosujPiatke = function () {
  const p = [];
  for (const k in GATUNKI) if (!GATUNKI[k].zepsuty && zanPasmo(k) <= 3) p.push(k);
  const w = [];
  for (let i = 0; i < 5 && p.length; i++)
    w.push(p.splice(Math.floor(Math.random() * p.length), 1)[0]);
  return w;
};

/* ============================================================
   ZANETA GWARANTUJACA.
   Obietnica brzmi: ryba ponad progiem w NASTEPNEJ lawicy. Losowaniem tego
   nie da sie zalatwic, bo przy progu 57 punktow czekanie idzie w godziny.
   Bierzemy wiec najlepsza sztuke z nowej lawicy i rozciagamy ja do dlugosci,
   ktora daje wymagana liczbe punktow. Punkty rosna z dlugoscia monotonicznie,
   wiec wystarczy polowienie przedzialu.
   Prog 57 lezy PONIZEJ szescdziesiatki, a szescdziesiatke daje dopiero
   pobicie rekordu gatunku, wiec szyld REKORD POLSKI nie zapala sie za darmo.
   ============================================================ */
function wstawGwarant() {
  const z = zanetaStan(); if (!z) return;
  const e = ZANETY[z.id].efekt;
  if (e.rodzaj !== 'gwarant' || !window.XScore || !school.length) return;
  let naj = -1, idx = 0;
  for (let i = 0; i < school.length; i++) {
    const p = punktyRyby(school[i]);
    if (p > naj) { naj = p; idx = i; }
  }
  if (naj >= e.prog) return;
  const f = school[idx], G2 = GATUNKI[f.gat];
  if (!G2) return;
  let lo = f.cm, hi = Math.max(f.cm * 6, (G2.cmMax || f.cm) * 3), cel = 0;
  for (let i = 0; i < 44; i++) {
    const mid = (lo + hi) / 2;
    const p = XScore.punkty(f.gat, G2, mid, wagaZ(mid, f.kLog, f.gat));
    if (p >= e.prog) { cel = mid; hi = mid; } else lo = mid;
  }
  if (!cel) return;
  f.cm = cel;
  f.waga = wagaZ(cel, f.kLog, f.gat);
  f.s = skalaZCm(cel, f.gat);
  f.sy = f.s * glebokoscZ(f.kLog);
  f.tier = XScore.tierRyby(f.gat, G2, f.cm, f.waga);
}
window.wstawGwarant = wstawGwarant;

/* ============================================================
   POSAZEK WATLEGO KROLA: nastepna lawica na pewno ma nieodkryta ryba
   z pasm 1-6. CELOWO NIE korzysta z istniejacego kuponu odkrywcy --
   tamten (Atlas.wagaKuponu) dlawi pasmo 5 i w ogole omija 6 i 7, bo ma
   ciagnac ogon POLSKIEGO rejestru, nie kazde pasmo rowno. Posazek ma
   inna obietnice ("pasma 1-6", bez ulubieńców), wiec liczy szanse sam,
   rowno miedzy wszystkimi nieodkrytymi az po szostke.
   Podmienia gatunek JEDNEJ, losowej sztuki juz obecnej w lawicy -- ta
   sama sztuczka co zmiana gatunku w akwarium: pozycja, nastroj i faza
   animacji zostaja, zmieniaja sie tylko pola zalezne od gatunku. */
function wstawNowyGatunek() {
  const z = zanetaStan(); if (!z) return;
  const e = ZANETY[z.id].efekt;
  if (e.rodzaj !== 'nowy_gatunek' || !school.length || !window.Atlas) return;
  const kandydaci = [];
  for (const k in GATUNKI) {
    if (GATUNKI[k].zepsuty || Atlas.odkryte.has(k)) continue;
    if (zanPasmo(k) > 6) continue;
    kandydaci.push(k);
  }
  /* Wszystko z pasm 1-6 juz odkryte -- posazkowi nie ma czego podstawic.
     Zanieta i tak sie zuzywa (zaplacone zostaje zaplacone), ale bez
     podmiany, bo klamstwem byloby podstawic cokolwiek na sile. */
  if (!kandydaci.length) return;
  const wybrany = kandydaci[Math.floor(Math.random() * kandydaci.length)];
  const f = school[Math.floor(Math.random() * school.length)];
  const GG = GATUNKI[wybrany];
  const cm = losujCm(Math.random, wybrany);
  const kLog = losujKond(Math.random, wybrany);
  const d = GG.glebia[0] + Math.random() * (GG.glebia[1] - GG.glebia[0]);
  const kol = Scene.BED - Scene.SURFACE;
  f.gat = wybrany;
  f.cm = cm;
  f.kLog = kLog;
  f.s = skalaZCm(cm, wybrany);
  f.sy = f.s * glebokoscZ(kLog);
  f.waga = wagaZ(cm, kLog, wybrany);
  f.base = predkoscGat(wybrany, GG);
  f.gMin = Scene.SURFACE + kol * GG.glebia[0];
  f.gMax = Scene.SURFACE + kol * GG.glebia[1];
  f.home = Scene.SURFACE + kol * d;
  f.tier = (window.XScore) ? XScore.tierRyby(wybrany, GG, f.cm, f.waga) : 1;
}

/* Zaneta z poprzedniego straganu nie ma juz odpowiednika w tablicy, wiec

setTimeout(function () {

function punktyRyby(f) {

}
function aktywnaZaneta() {

/* Warunek zawezajacy 'prog': brak warunku dziala jak zawsze (adolf, globalnie),
   {pasmo:N} zawęża do jednego pasma, {pora:'swit'|'zmierzch'} do jednej pory. */
function zanSpelniaWarunek(f, warunek) {

<script>
/* ============================================================
   HAPTYKA WALKI
   navigator.vibrate nie ma regulacji sily, przyjmuje tylko czasy.
   Sile buduje wiec dlugosc impulsu i gestosc rytmu:
   przy spokojnym zwijaniu rzadkie, 5 ms tykniecia jak kolowrotek,
   przy granicy zerwania niemal ciagly warkot.

   Do tego dochodzi dzwiek, bo iOS nie udostepnia wibracji w Safari
   i bez niego gracz na iPhonie nie mialby zadnej informacji zwrotnej.
   ============================================================ */

/* Diagnostyka wibracji. Na telefonie nie ma jak otworzyc konsoli, wiec
   panel wlacza sie doklejeniem ?hap do adresu.

   navigator.vibrate wymaga trzech rzeczy naraz i kazda z nich potrafi
   milczaco zabic haptyke:
     1. bezpiecznego kontekstu (https, localhost albo file), bo po zwyklym
        http metoda albo nie istnieje, albo zwraca false;
     2. aktywacji uzytkownika, czyli wczesniejszego dotkniecia strony,
        bo bez niej przegladarka ignoruje wywolanie bez slowa;
     3. zgody systemu, a Android wylacza wibracje w trybie wyciszenia,
        przy zerowej siLe wibracji i w trybie oszczedzania energii.
   Do tego iOS Safari nie ma tego API wcale, a czesc przegladarek
   nastawionych na prywatnosc blokuje je jako slad do odciskania palca. */
const HapDiag = {
  proby: 0, przyjete: 0, odrzucone: 0, ostatniWzor: null, ostatniZwrot: null,
  odblokowane: false, odblokowanyZwrot: null,
  raport() {
    const n = navigator;
    return [
      'protokol       ' + location.protocol,
      'bezpieczny     ' + (window.isSecureContext ? 'tak' : 'NIE'),
      'navigator.vibrate ' + (typeof n.vibrate),
      'aktywacja      ' + (n.userActivation ? (n.userActivation.hasBeenActive ? 'byla' : 'BRAK') : 'nieznana'),
      'Hap.on         ' + (Hap.on ? 'tak' : 'NIE'),
      'proba odblok.  ' + (this.odblokowane ? String(this.odblokowanyZwrot) : 'jeszcze nie'),
      'wywolan        ' + this.proby + '  przyjete ' + this.przyjete + '  odrzucone ' + this.odrzucone,
      'ostatni wzor   ' + JSON.stringify(this.ostatniWzor),
      'ostatni zwrot  ' + String(this.ostatniZwrot)
    ];
  }
};
window.HapDiag = HapDiag;
const MIX_PANEL = /[?&]mix\b/.test(location.search);
/* Twarde przeladowanie co minute, gdyby cykl lawicy nie wystarczyl. */
if (/[?&]reload\b/.test(location.search)) setTimeout(() => location.reload(), 60000);
const HAP_PANEL = /[?&]hap\b/.test(location.search);

const Hap = {
  /* Sama obecnosc metody nie wystarczy: po http istnieje, a nie dziala. */
  on: typeof navigator.vibrate === 'function' && window.isSecureContext !== false,
  nextAt: 0,
  lastZone: -1,
  lastTen: 0,
  clickAt: 0,

  /* Progi ostrzegawcze. Przekroczenie w gore odpala osobny sygnal,
     zeby gracz wiedzial, ze wlasnie wszedl w gorszy zakres. */
  zones: [
    { at: 0.00, name: 'spokoj' },
    { at: 0.42, name: 'praca' },
    { at: 0.64, name: 'uwaga' },
    { at: 0.82, name: 'granica' },
    { at: 0.94, name: 'pekanie' }
  ],

  zoneOf(t) {
    let z = 0;
    for (let i = 0; i < this.zones.length; i++) if (t >= this.zones[i].at) z = i;
    return z;
  },

  buzz(p) {
    if (!this.on) return false;
    let r = false;
    try { r = navigator.vibrate(p); } catch (e) { r = false; }
    HapDiag.proby++; HapDiag.ostatniWzor = p; HapDiag.ostatniZwrot = r;
    if (r) HapDiag.przyjete++; else HapDiag.odrzucone++;
    return r;
  },

  /* Sygnal przekroczenia progu: im wyzszy zakres, tym bardziej natarczywy. */
  crossing(z) {
    if (z === 2) this.buzz([16, 44, 16]);
    else if (z === 3) this.buzz([26, 32, 26, 32, 26]);
    else if (z === 4) this.buzz([44, 24, 44, 24, 60]);
    else if (z === 1) this.buzz(12);
    beepHap(z);
  },

  /* Sygnal powrotu do bezpiecznego zakresu. */
  relief() { this.buzz(10); beepHap(-1); },

  update(dt, now) {
    const walka = (typeof G !== 'undefined') && G.phase === 'fight';
    if (!walka) { this.lastZone = -1; this.lastTen = 0; return; }

    const ten = Math.max(0, Math.min(1, G.tension));
    const z = this.zoneOf(ten);

    /* przekroczenie progu w gore albo powrot w dol */
    if (this.lastZone >= 0 && z > this.lastZone) this.crossing(z);
    else if (this.lastZone >= 2 && z < this.lastZone && z <= 1) this.relief();
    this.lastZone = z;
    this.lastTen = ten;

    if (now < this.nextAt) return;

    if (G.holding) {
      /* Zwijanie: rytm gestnieje i impuls sie wydluza razem z naprezeniem.
         Krzywa jest wykladnicza, wiec dol jest naprawde delikatny,
         a gora naprawde alarmujaca. */
      const k = Math.pow(ten, 1.5);
      const okres = 200 - 158 * k;          /* 200 ms w spokoju, 42 ms przy granicy */
      const dlug = Math.round(4 + 30 * Math.pow(ten, 1.7));
      /* Okon puka twardo i krotko, wiec jego rytm jest gestszy od ploci. */
      const gk = (typeof G !== "undefined" && G.hooked && G.hooked.gat) || "ploc";
      const puk = (typeof GATUNKI !== "undefined" && GATUNKI[gk]) ? GATUNKI[gk].pukanie : 0;
      if (puk > 0 && ten > 0.35 && ten <= 0.94) {
        this.buzz([Math.round(dlug * 0.8), 22, Math.round(dlug * 0.8)]);
        this.nextAt = now + okres * 0.7;
        clickSound(ten, true);
        return;
      }
      if (ten > 0.94) {
        /* Tuz przed zerwaniem rytm nie ma juz sensu: idzie ciagly warkot,
           odswiezany zanim poprzedni impuls zdazy wygasnac. */
        this.buzz(150);
        this.nextAt = now + 110;
      } else if (ten > 0.82) {
        /* w strefie granicznej podwojne uderzenie, czyta sie jak alarm */
        this.buzz([dlug, 18, Math.round(dlug * 0.7)]);
        this.nextAt = now + okres;
      } else {
        this.buzz(dlug);
        this.nextAt = now + okres;
      }
      clickSound(ten, true);
    } else {
      /* Puszczone: zylka jest luzna i haczyk sie obluzowuje.
         Rytm przyspiesza w miare ubywania zaczepu, wiec palec czuje,
         ze czas dziala na niekorzysc. */
      const g = (typeof G !== 'undefined' && G.grip !== undefined) ? G.grip : 1;
      const pilnosc = 1 - Math.max(0, Math.min(1, g));
      const okres = 300 - 200 * pilnosc;
      this.buzz(Math.round(6 + 14 * pilnosc));
      this.nextAt = now + okres;
      clickSound(0.15 + pilnosc * 0.5, false);
    }
  }
};
window.Hap = Hap;

/* ---------- Dzwiek: klik kolowrotka i sygnaly progow ---------- */
let AC = null, master = null;
let _ostatniKlik = 0;   /* podloga czasowa dla clickSound, patrz komentarz tamze */
function audioOn() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C();
  master = AC.createGain();
  /* Start od ciszy i lagodne dojscie do poziomu -- inaczej pierwszy
     dotyk ekranu wali w uszy pelnym tlem od zera. Gdy dzwiek jest
     wylaczony w ustawieniach, zostajemy na ciszy: kontekst istnieje
     (wiec przelacznik zadziala od razu, bez czekania na kolejny
     dotyk), ale nic nie slychac. */
  const wl = (typeof dzwiekWl === 'function') ? dzwiekWl() : true;
  master.gain.setValueAtTime(0.0001, AC.currentTime);
  if (wl) master.gain.linearRampToValueAtTime(0.30, AC.currentTime + 1.2);
  master.connect(AC.destination);
  window.__AC = AC; window.__MASTER = master;
  if (wl && typeof ambientStart === 'function') ambientStart();
}
window.audioOn = audioOn;

function clickSound(ten, zwijanie) {
  if (!AC) return;
  /* NAPRAWA "zylka sie przycina przy wciaganiu" (IX 2026, zgloszenie
     Andrzeja). Przy wysokim naprezeniu okres rytmu schodzi do 42 ms
     (patrz Hap.update wyzej), wiec ta funkcja tworzyla DWA nowe wezly
     Web Audio (oscylator + wzmocnienie) ~24 razy na sekunde, kazdy do
     posprzatania przez GC po wygasnieciu. Razem z navigator.vibrate()
     w tym samym rytmie wypada to dokladnie w chwili, gdy gracz trzyma
     palec i patrzy na zylke -- czyli tam, gdzie zacinanie boli najbardziej.
     Podloga 70 ms na sam DZWIEK: ucho i tak nie rozroznia klikniec
     gestszych niz ~14/s (zlewaja sie w warkot), a scinamy blisko polowe
     alokacji w najgorszym momencie. Rytm HAPTYKI zostaje nietkniety --
     palec czuje pelna gestosc, tak jak byl zaprojektowany. */
  const teraz = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  if (teraz - _ostatniKlik < 70) return;
  _ostatniKlik = teraz;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = zwijanie ? 'square' : 'triangle';
  /* im blizej zerwania, tym wyzszy i ostrzejszy klik */
  o.frequency.setValueAtTime(zwijanie ? 420 + ten * 900 : 180 + ten * 220, t);
  const v = zwijanie ? 0.02 + ten * 0.09 : 0.02 + ten * 0.04;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (zwijanie ? 0.035 : 0.06));
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.09);
}

function beepHap(z) {
  if (!AC) return;
  const t = AC.currentTime;
  const seq = z === -1 ? [[520, 0.10]]
    : z === 2 ? [[700, 0.07], [880, 0.09]]
    : z === 3 ? [[900, 0.06], [1150, 0.06], [900, 0.08]]
    : z === 4 ? [[1250, 0.05], [1250, 0.05], [1250, 0.05], [1400, 0.12]]
    : [[600, 0.05]];
  seq.forEach((s, i) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(s[0], t + i * 0.09);
    g.gain.setValueAtTime(0.0001, t + i * 0.09);
    g.gain.exponentialRampToValueAtTime(0.07, t + i * 0.09 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + s[1]);
    o.connect(g); g.connect(master);
    o.start(t + i * 0.09); o.stop(t + i * 0.09 + s[1] + 0.02);
  });
}

/* ---------- Petla haptyki ---------- */
(function hapLoop() {
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    Hap.update(dt, now);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ============================================================
   PEJZAZ DZWIEKOWY (IX 2026, zyczenie: "wyliftuj gre wizualnie,
   animacje, ux, asmr... niech bedzie zew jakosci firmy gamedev").

   STAN ZASTANY: gra o jeziorze byla CALKOWICIE CICHA poza dwoma
   sygnalami z fali prostokatnej (klik kolowrotka i pik progu).
   Fala prostokatna to najostrzejszy mozliwy przebieg -- brzmi jak
   budzik z lat osiemdziesiatych, czyli dokladne przeciwienstwo tego,
   o co chodzi w ASMR. Zadne studio nie wypuscilo by gry wedkarskiej
   bez wody w tle.

   DECYZJA: wszystko SYNTEZOWANE przez WebAudio, zero plikow audio.
   Cala gra to jeden plik HTML z grafika w base64 -- doklejenie
   nagran wody i ptakow dorzucilo by megabajty i zlamalo te
   architekture. Szum generowany proceduralnie kosztuje zero bajtow
   i nigdy sie nie zapetla slyszalnie, bo bufor jest dlugi i modulowany.

   TRZY WARSTWY, kazda z innym zadaniem:
     1. WODA -- ciagly podklad. Brazowy szum (nie bialy: bialy syczy,
        brazowy szumi jak woda) przez filtr dolnoprzepustowy, ktorego
        czestotliwosc i glosnosc powoli faluja dwoma niewspolmiernymi
        okresami. Niewspolmiernymi celowo: przy okresach 1:2 ucho
        wychwytuje rytm i robi sie usypiajaca pralka zamiast jeziora.
     2. PORA DNIA -- warstwa zycia, podpieta pod istniejacy system
        PORA (0=swit, 1=dzien, 2=zmierzch, 3=noc). Switem i o zmierzchu
        rzadkie ptaki, w nocy swierszcze, w dzien niemal cisza (w
        poludnie nad woda faktycznie jest najciszej). To jest ta
        rzecz, ktora robi "studio" zamiast "efekt dzwiekowy": dzwiek
        WIE, co sie dzieje w grze, zamiast grac w kolko to samo.
     3. ZDARZENIA -- plusk zarzutu, klik kolowrotka, dzwonki progow.

   WSZYSTKO wchodzi lagodnie (ramp 2 s), zeby wlaczenie dzwieku nie
   bylo skokiem, i schodzi tak samo przy wylaczeniu. */

let _amb = null;                 /* wezly warstwy ciaglej */
let _ambStart = 0;

/* Bufor szumu brazowego. Generowany RAZ, potem zapetlany -- 8 sekund
   przy 44,1 kHz to ~350 tys. probek, ktore w pamieci zajmuja tyle co
   nic, a przy naszej modulacji ucho nie slyszy szwu petli. */
function _bufSzumu(AC2, sekund) {
  const n = Math.floor(AC2.sampleRate * sekund);
  const buf = AC2.createBuffer(1, n, AC2.sampleRate);
  const d = buf.getChannelData(0);
  /* Brazowy szum: calka z bialego, czyli kazda probka to poprzednia
     plus mala losowa zmiana. Daje -6 dB/oktawe, czyli duzo basu i malo
     gory -- brzmi jak woda i wiatr, nie jak syk telewizora. */
  let ost = 0;
  for (let i = 0; i < n; i++) {
    const bialy = Math.random() * 2 - 1;
    ost = (ost + 0.02 * bialy) / 1.02;
    d[i] = ost * 3.5;
  }
  return buf;
}

function _lfo(AC2, okres, glebokosc, srodek, cel) {
  /* Powolna sinusoida sterujaca parametrem. Okres w sekundach. */
  const o = AC2.createOscillator(), g = AC2.createGain();
  o.type = 'sine';
  o.frequency.value = 1 / okres;
  g.gain.value = glebokosc;
  o.connect(g); g.connect(cel);
  cel.value = srodek;
  o.start();
  return o;
}

function ambientStart() {
  if (!AC || _amb) return;
  const t = AC.currentTime;
  const wyj = AC.createGain();
  wyj.gain.setValueAtTime(0.0001, t);
  wyj.gain.linearRampToValueAtTime(1, t + 2.0);   /* lagodne wejscie */
  wyj.connect(master);

  /* --- warstwa 1: woda --- */
  const zrodlo = AC.createBufferSource();
  zrodlo.buffer = _bufSzumu(AC, 8);
  zrodlo.loop = true;
  const filtr = AC.createBiquadFilter();
  filtr.type = 'lowpass';
  filtr.Q.value = 0.7;
  const gWody = AC.createGain();
  gWody.gain.value = 0.5;
  zrodlo.connect(filtr); filtr.connect(gWody); gWody.connect(wyj);
  /* Okresy 11 s i 7 s -- liczby pierwsze, wiec wzor powtarza sie
     dopiero co 77 s i ucho nie znajduje rytmu. */
  const lfoF = _lfo(AC, 11, 220, 420, filtr.frequency);
  const lfoG = _lfo(AC, 7, 0.16, 0.5, gWody.gain);
  zrodlo.start(t);

  _amb = { wyj, zrodlo, filtr, gWody, lfoF, lfoG, zycie: null };
  _ambStart = t;
  _zycieHarmonogram();
}

function ambientStop() {
  if (!_amb) return;
  const t = AC.currentTime;
  const a = _amb;
  _amb = null;
  a.wyj.gain.cancelScheduledValues(t);
  a.wyj.gain.setValueAtTime(a.wyj.gain.value, t);
  a.wyj.gain.linearRampToValueAtTime(0.0001, t + 1.2);
  setTimeout(() => {
    try { a.zrodlo.stop(); a.lfoF.stop(); a.lfoG.stop(); a.wyj.disconnect(); } catch (e) {}
  }, 1600);
  if (a.zycie) clearTimeout(a.zycie);
}

/* --- warstwa 2: zycie zalezne od pory dnia --- */
function _poraTeraz() {
  try {
    const st = (window.PORA && PORA.teraz) ? PORA.teraz() : null;
    if (!st) return 1;
    return (window.OKNA && OKNA.poraZGodziny) ? OKNA.poraZGodziny(st.godzina) : 1;
  } catch (e) { return 1; }
}

/* Ptak: dwa-trzy krotkie gwizdy o opadajacej wysokosci. Sinus, nie
   prostokat -- ma byc daleki i mieksy, nie natretny. */
function _ptak() {
  if (!AC || !_amb) return;
  const t = AC.currentTime;
  const baza = 1400 + Math.random() * 1100;
  const ile = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < ile; i++) {
    const o = AC.createOscillator(), g = AC.createGain();
    const t0 = t + i * (0.13 + Math.random() * 0.07);
    o.type = 'sine';
    o.frequency.setValueAtTime(baza * (1 - i * 0.05), t0);
    o.frequency.exponentialRampToValueAtTime(baza * (0.72 - i * 0.05), t0 + 0.11);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.020, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    o.connect(g); g.connect(_amb.wyj);
    o.start(t0); o.stop(t0 + 0.2);
  }
}

/* Swierszcz: seria bardzo krotkich impulsow pasmowych. */
function _swierszcz() {
  if (!AC || !_amb) return;
  const t = AC.currentTime;
  const ile = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < ile; i++) {
    const t0 = t + i * 0.075;
    const src = AC.createBufferSource();
    src.buffer = _bufSzumu(AC, 0.05);
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 4200 + Math.random() * 600; bp.Q.value = 22;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.030, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.045);
    src.connect(bp); bp.connect(g); g.connect(_amb.wyj);
    src.start(t0); src.stop(t0 + 0.06);
  }
}

function _zycieHarmonogram() {
  if (!_amb) return;
  const pora = _poraTeraz();
  /* Odstepy w sekundach: swit/zmierzch zyja najgloniej, dzien jest
     najcichszy (w poludnie nad woda faktycznie nic nie spiewa),
     noc nalezy do swierszczy. */
  let min, max, kto;
  if (pora === 0 || pora === 2) { min = 3.5; max = 9; kto = _ptak; }
  else if (pora === 3) { min = 2.5; max = 6; kto = _swierszcz; }
  else { min = 11; max = 26; kto = _ptak; }
  const za = (min + Math.random() * (max - min)) * 1000;
  _amb.zycie = setTimeout(() => { kto(); _zycieHarmonogram(); }, za);
}

/* --- warstwa 3: zdarzenia --- */

/* Plusk zarzutu: krotki impuls szumu przez filtr schodzacy w dol
   (imituje wode zamykajaca sie nad spławikiem) plus niski "blup". */
function plusk(sila) {
  if (!AC) return;
  const s = Math.max(0.2, Math.min(1, sila || 0.6));
  const t = AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = _bufSzumu(AC, 0.4);
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2600 * s, t);
  lp.frequency.exponentialRampToValueAtTime(280, t + 0.28);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.14 * s, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.4);
  /* "blup" -- sinus opadajacy, to on daje wrazenie objetosci wody */
  const o = AC.createOscillator(), og = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(420 * s, t + 0.01);
  o.frequency.exponentialRampToValueAtTime(90, t + 0.16);
  og.gain.setValueAtTime(0.0001, t + 0.01);
  og.gain.exponentialRampToValueAtTime(0.10 * s, t + 0.03);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(og); og.connect(master);
  o.start(t + 0.01); o.stop(t + 0.24);
}
window.plusk = plusk;

/* Dzwonek nagrody: trojkat zamiast prostokata, z gorna kwinta --
   cieply, nie budzikowy. Uzywany zamiast beepHap tam, gdzie chodzi
   o nagrode, a nie o ostrzezenie. */
function dzwonek(wysokosc, glosnosc) {
  if (!AC) return;
  const t = AC.currentTime;
  const f = wysokosc || 880;
  [[f, 1], [f * 1.5, 0.45], [f * 2, 0.2]].forEach(([hz, w]) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(hz, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime((glosnosc || 0.06) * w, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 1.0);
  });
}
window.dzwonek = dzwonek;

/* ---------- Wlacznik dzwieku ---------- */
/* Domyslnie WLACZONY, ale AudioContext i tak nie ruszy bez dotkniecia
   ekranu (polityka przegladarek), wiec nic nie zagra bez zgody gracza.
   Stan trzymany osobno od Zapis, w Magazyn -- ustawienie sprzetu,
   nie postep gry, wiec nie ma czego szukac w kodzie zapasowym. */
function dzwiekWl() {
  try { return Magazyn.czytaj('dzwiek') !== '0'; } catch (e) { return true; }
}
function ustawDzwiek(wl) {
  try { Magazyn.pisz('dzwiek', wl ? '1' : '0'); } catch (e) {}
  if (!AC) { if (wl) audioOn(); return; }
  const t = AC.currentTime;
  master.gain.cancelScheduledValues(t);
  master.gain.setValueAtTime(master.gain.value, t);
  master.gain.linearRampToValueAtTime(wl ? 0.30 : 0.0001, t + 0.35);
  if (wl) ambientStart(); else ambientStop();
}
window.dzwiekWl = dzwiekWl;
window.ustawDzwiek = ustawDzwiek;
window.ambientStart = ambientStart;
window.ambientStop = ambientStop;
</script>
