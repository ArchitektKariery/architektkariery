<script>/* ============================================================
   ZAPIS. Jeden obiekt w localStorage, wersjonowany.

   Do tej pory gra nie zapisywala niczego: atlas odkrytych gatunkow zyl
   w pamieci i ginal przy kazdym przeladowaniu. Teraz przezywa.

   Format jest plaski i maly, bo ma sie miescic w limitach kazdej
   przegladarki i dac przepisac recznie: 68 gatunkow po jednym wpisie to
   okolo czterech kilobajtow przy limicie piatki megabajtow.

   Zapis idzie z opoznieniem 1,2 s od ostatniej zmiany, zeby seria zlowien
   nie robila serii zapisow. Kazde wyjscie ze strony domyka go natychmiast.

   OGRANICZENIA, ktore trzeba znac: Safari na iOS kasuje dane witryn
   nieodwiedzanych przez siedem dni, tryb prywatny nie zapisuje nic, a zapis
   nie przechodzi miedzy urzadzeniami. Dlatego jest kod eksportu: Zapis.kod()
   zwraca ciag do skopiowania, Zapis.wczytajKod(t) go przyjmuje.
   ============================================================ */
/* ============================================================
   MAGAZYN. Jedyne miejsce w calej grze, ktore wie, GDZIE leza dane.

   Do tej pory Zapis wolal localStorage wprost, w dwoch miejscach. Kazde
   przeniesienie stanu na serwer znaczyloby wiec grzebanie w logice gry.
   Teraz Zapis rozmawia z tym interfejsem, a interfejs ma dzisiaj jedna
   implementacje: przegladarke. Podpiecie chmury to dopisanie drugiej
   i jedno wolanie Magazyn.podepnij(), bez ruszania reszty pliku.

   Klucze zostaja te same co dotad ('qryby.' + 'zapis.v1'), wiec zapisy
   sprzed tej zmiany wczytuja sie normalnie.
   ============================================================ */
const Magazyn = (() => {
  const PREFIX = 'qryby.';
  let dziala = true;
  /* ============================================================
     NAPRAWA Q15 (audyt IX 2026): JEDEN BLAD WYLACZAL ZAPIS NA CALA SESJE.
     Bylo: kazdy wyjatek z localStorage ustawial `dziala = false` NA STALE,
     a Zapis.teraz() sprawdza te flage i po prostu przestaje probowac.
     Jedno chwilowe przepelnienie (albo blad przy otwartym prywatnym oknie)
     kasowalo zapisywanie postepu az do przeladowania strony -- po cichu,
     bo komunikat siedzi w panelu gracza, do ktorego nikt nie zaglada w
     trakcie lowienia.
     Teraz to KWARANTANNA, nie wyrok: po bledzie odczekujemy 20 sekund
     i probujemy jeszcze raz. Ostatni blad jest zapamietany, zeby panel
     mogl pokazac, co sie stalo. */
  let odKiedyZle = 0;
  const KWARANTANNA_MS = 20000;
  let ostatniBlad = '';
  const czas = () => (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  function zleraz(e) { dziala = false; odKiedyZle = czas(); ostatniBlad = (e && e.name) ? e.name : 'blad'; }
  function moznaProbowac() {
    if (dziala) return true;
    if (czas() - odKiedyZle < KWARANTANNA_MS) return false;
    dziala = true;             // koniec kwarantanny -- damy magazynowi kolejna szanse
    return true;
  }
  const lokalny = {
    nazwa: 'przegladarka',
    czytaj(k) { try { const v = localStorage.getItem(PREFIX + k); dziala = true; return v; } catch (e) { zleraz(e); return null; } },
    pisz(k, v) { try { localStorage.setItem(PREFIX + k, v); dziala = true; return true; } catch (e) { zleraz(e); return false; } },
    skasuj(k) { try { localStorage.removeItem(PREFIX + k); } catch (e) {} }
  };
  let biezacy = lokalny;
  return {
    czytaj: k => biezacy.czytaj(k),
    pisz: (k, v) => biezacy.pisz(k, v),
    skasuj: k => biezacy.skasuj(k),
    /* czyDziala() zwraca teraz "czy warto sprobowac", nie "czy nigdy nie
       zawiodl" -- inaczej kwarantanna nie mialaby jak sie skonczyc. */
    czyDziala: () => moznaProbowac(),
    zdrowy: () => dziala,
    ostatniBlad: () => ostatniBlad,
    nazwa: () => biezacy.nazwa,
    /* Tu wejdzie implementacja chmurowa. Musi miec czytaj, pisz, skasuj
       i nazwe. Wolanie podmienia zrodlo dla calej gry naraz. */
    podepnij(impl) { if (impl && impl.czytaj && impl.pisz) { biezacy = impl; dziala = true; odKiedyZle = 0; } },
    lokalny
  };
})();
window.Magazyn = Magazyn;

const STROJE = [

const Zapis = (() => {
  const KLUCZ = 'zapis.v1', WERSJA = 1, ZWLOKA = 1200;
  const pusty = () => ({ v: WERSJA, atlas: {},
                         stat: { zlowien: 0, sesji: 0, rekordZycia: 0,
                                 doba: '', dobaPunkty: 0, dobaSztuk: 0,
                                 dobaOdswiezen: 0, dobaRekord: 0,
                                 /* ile progow nagrodowych juz wyplacono w tej dobie */
                                 progLawic: 0, progPunktow: 0 },
                         /* TOZSAMOSC. Losowe id nadawane raz, przy pierwszym
                            uruchomieniu, i od tego momentu niezmienne. Bez niego
                            nie da sie skleic lokalnego zapisu z kontem w chmurze:
                            po zalozeniu konta serwer musi wiedziec, ktory stan
                            do niego nalezy. Kosztuje 16 znakow. */
                         id: '', utworzone: 0,
                         /* PROFIL. Wszystko, co jest gracza, a nie jego wynikiem:
                            nick i awatar. Trzymane osobno od stat i atlasu,
                            zeby przy przenosinach na serwer szlo w innej tabeli
                            i dalo sie pokazac innym bez wysylania calego zapisu. */
                         profil: { nick: '', awatar: { stroj: 'zielony', ikona: 'kolo', ikonaKolor: 'granat' } },
                         /* Rekordy z kodow znajomych. Wylacznie do pokazania
                            w atlasie, nie licza sie do niczego wlasnego. */
                         spoleczne: {},
                         monety: 0, zadania: null, skorki: { posiadane: [], zalozone: {} },
                         zaneta: null,          /* { id, zostalo, gat }  zostalo liczone w lawicach */
                         /* Torba: co kupione, a jeszcze nie wrzucone do wody.
                            Zaneta za milion nie moze wchodzic do gry sama
                            w chwili zakupu, bo trafilaby na zla lawice. */
                         zanetyMam: {},
                         /* Wiaderko: do dziesieciu zlowionych sztuk czekajacych
                            na handlarza. Gielda: swiezosc towaru, rozglos po
                            targu, biezaca oferta, zegar nastepnego handlarza
                            i srednie cen ze sprzedazy. */
                         wiaderko: [],
                         gielda: { swiezosc: 1, rozglos: 0, oferta: null, nastepny: 0, sprzedaze: {}, polow: 0 },
                         seria: { gat: '', ile: 0 },
                         /* Podsumowanie ZAKONCZONYCH turniejow (IX 2026). Zywa tablica
                            wynikow w Zawody.moje() znika, gdy serwer posprzata stary
                            turniej (zawody_sprzataj) -- ta lista zostaje na zawsze,
                            bo jest CZESCIA zapisu gracza, nie odpytywanym stanem
                            serwera. Ograniczona do 30 najnowszych (patrz zapiszTurniej),
                            zeby nie rosla bez konca przez lata grania. */
                         turniejeHistoria: [] });
  /* Doba liczona od polnocy do polnocy, w czasie lokalnym gracza. */
  const dzisiaj = () => { const d = new Date(); return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  function nowaDoba() {
    const d = dzisiaj();
    if (dane.stat.doba !== d) {
      dane.stat.doba = d;
      dane.stat.dobaPunkty = 0; dane.stat.dobaSztuk = 0;
      dane.stat.dobaOdswiezen = 0; dane.stat.dobaRekord = 0;
      dane.stat.progLawic = 0; dane.stat.progPunktow = 0;
      /* NAPRAWA Q11 (audyt IX 2026): zbior gatunkow zlowionych DZIS.
         Zadanie "Zlow 3 rozne gatunki" jest DOBOWE, a dostawalo
         Zapis.odkryte().length -- czyli kolekcje CALEGO ZYCIA. Gracz
         z trzema gatunkami w atlasie zaliczal je natychmiast po pierwszej
         rybie, 3/3, bez lowienia czegokolwiek nowego. */
      dane.stat.dobaGat = [];
    }
    if (!Array.isArray(dane.stat.dobaGat)) dane.stat.dobaGat = [];
  }
  let dane = pusty(), timer = 0;

  /* Szesnascie znakow hex z generatora kryptograficznego, z zejsciem na
     zegar i Math.random, gdyby przegladarka nie dawala crypto. */
  function nowyId() {
    try {
      const b = new Uint8Array(8);
      (self.crypto || window.crypto).getRandomValues(b);
      return Array.from(b, v => v.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }
  }

  /* Doklada pola, ktorych stary zapis nie mial. Wolane po kazdym wczytaniu,
     takze po wczytaniu kodu zapasowego z innego telefonu. Nigdy nie nadpisuje
     tego, co juz jest: id nadane raz zostaje na zawsze. */
  function migruj(d) {
    if (!d.id) d.id = nowyId();
    if (!d.utworzone) d.utworzone = Date.now();
    if (!d.profil) d.profil = { nick: '', awatar: { stroj: 'zielony' } };
    if (!d.profil.awatar) d.profil.awatar = { stroj: 'zielony' };
    if (!d.profil.awatar.stroj) d.profil.awatar.stroj = 'zielony';
    if (!d.profil.awatar.ikona) d.profil.awatar.ikona = 'kolo';
    /* Wizytowki sprzed rozdzielenia palet mialy ikone w barwie kurtki.
       Przepisujemy te barwe na nowe pole, wiec nikomu nic sie nie zmienia
       pod rekami, a od teraz jedno i drugie wybiera sie osobno. */
    if (!d.profil.awatar.ikonaKolor) d.profil.awatar.ikonaKolor = d.profil.awatar.stroj || 'granat';
    if (!d.skorki) d.skorki = { posiadane: [], zalozone: {} };
    if (!d.skorki.posiadane) d.skorki.posiadane = [];
    /* Stragan rusza dopiero teraz, a gracze wybierali stroje i ikony
       wczesniej za darmo. Cokolwiek maja na sobie w chwili migracji,
       zostaje ich na wlasnosc: odbieranie czegos, co juz noszą, byloby
       kara za granie wczesniej. */
    if (!d.skorki.migrowane) {
      const a = d.profil.awatar;
      for (const [r, v] of [['stroj', a.stroj], ['ikona', a.ikona], ['barwa', a.ikonaKolor]]) {
        const k = r + ':' + v;
        if (v && d.skorki.posiadane.indexOf(k) < 0) d.skorki.posiadane.push(k);
      }
      d.skorki.migrowane = 1;
    }
    if (!d.spoleczne) d.spoleczne = {};
    return d;
  }

  /* ============================================================
     NAPRAWA Q07 (audyt IX 2026): NUMER WERSJI TO ZA MALO.
     Wszystkie trzy sciezki wczytania sprawdzaly tylko `d.v === WERSJA`
     i robily Object.assign(pusty(), d). Assign kopiuje NAJWYZSZY poziom,
     wiec `{v:1, stat:null}` przechodzilo jako poprawny zapis i kasowalo
     dzialajacy obiekt statystyk -- pierwsze zlowienie wywalalo sie na
     odczycie `doba` z null. To samo dotyczy atlasu, monet, wiaderka i
     reszty. Kod znajomego to dane z zewnatrz, wiec sprawdzamy je tak samo
     jak wlasny zapis z dysku.
     Zasada: naprawiamy, czego sie da (pole zlego typu wraca do wartosci
     domyslnej), a odrzucamy tylko wtedy, gdy zapis nie ma sensu jako
     calosc. Lepiej wpuscic zapis z wyzerowanym jednym polem niz wywalic
     graczowi caly postep przez jeden uszkodzony klucz. */
  function liczba(x, dom, min, max) {
    const n = Number(x);
    if (!isFinite(n)) return dom;
    return Math.min(max === undefined ? Infinity : max, Math.max(min === undefined ? -Infinity : min, n));
  }
  function sanujZapis(d) {
    if (!d || typeof d !== 'object' || Array.isArray(d)) return null;
    /* UWAGA (blad znaleziony wlasnym testem tej samej sesji): Object.assign
       MUTUJE pierwszy argument, wiec `out` i `wz` bylyby TYM SAMYM obiektem
       i `out.stat = wz.stat` przypisywaloby uszkodzone pole samo na siebie.
       Wzorzec musi byc osobna, nietkniata kopia -- dokladnie ten typ pomylki,
       przed ktorym ostrzega Q07 w audycie. */
    const wz = pusty();                 // wzorzec, NIE dotykany przez assign
    const out = Object.assign(pusty(), d);

    /* stat: kazde pole liczbowe osobno, bo openCard czyta je bez oslony */
    if (!out.stat || typeof out.stat !== 'object' || Array.isArray(out.stat)) out.stat = wz.stat;
    else {
      const s = out.stat, w = pusty().stat;
      for (const k in w) {
        if (typeof w[k] === 'number') s[k] = liczba(s[k], w[k], 0);
        else if (typeof w[k] === 'string') s[k] = (typeof s[k] === 'string') ? s[k] : w[k];
      }
      if (!Array.isArray(s.dobaGat)) s.dobaGat = [];
      else s.dobaGat = s.dobaGat.filter(x => typeof x === 'string').slice(0, 200);
    }

    /* atlas: tylko znane gatunki, tylko sensowne liczby */
    if (!out.atlas || typeof out.atlas !== 'object' || Array.isArray(out.atlas)) out.atlas = {};
    else {
      const czysty = {};
      for (const k in out.atlas) {
        const a = out.atlas[k];
        if (!a || typeof a !== 'object') continue;
        if (window.GATUNKI && !window.GATUNKI[k]) continue;   // gatunek spoza gry
        czysty[k] = { n: liczba(a.n, 0, 0), cm: liczba(a.cm, 0, 0),
                      g: liczba(a.g, 0, 0), pkt: liczba(a.pkt, 0, 0, 100),
                      kiedy: liczba(a.kiedy, 0, 0) };
      }
      out.atlas = czysty;
    }

    out.monety = liczba(out.monety, 0, 0, Number.MAX_SAFE_INTEGER);
    if (!Array.isArray(out.wiaderko)) out.wiaderko = [];
    else out.wiaderko = out.wiaderko.filter(r => r && typeof r === 'object' &&
                          (!window.GATUNKI || window.GATUNKI[r.gat])).slice(0, 32);
    if (!out.zanetyMam || typeof out.zanetyMam !== 'object' || Array.isArray(out.zanetyMam)) out.zanetyMam = {};
    else for (const k in out.zanetyMam) {
      if (window.ZANETY && !window.ZANETY[k]) { delete out.zanetyMam[k]; continue; }
      out.zanetyMam[k] = liczba(out.zanetyMam[k], 0, 0, 9999);
    }
    if (out.zaneta && (typeof out.zaneta !== 'object' ||
        (window.ZANETY && !window.ZANETY[out.zaneta.id]))) out.zaneta = null;
    if (out.paczkaOczekuje && (typeof out.paczkaOczekuje !== 'object' ||
        (window.ZANETY && !window.ZANETY[out.paczkaOczekuje.wynik]))) out.paczkaOczekuje = null;
    if (!out.progi || typeof out.progi !== 'object' || Array.isArray(out.progi)) out.progi = {};
    if (!out.spoleczne || typeof out.spoleczne !== 'object' || Array.isArray(out.spoleczne)) out.spoleczne = {};
    else for (const k in out.spoleczne) {
      const r = out.spoleczne[k];
      if (!r || typeof r !== 'object') { delete out.spoleczne[k]; continue; }
      r.nick = czystyNick(r.nick);     // Q04: stare zapisy sprzed filtra
    }
    if (out.profil && typeof out.profil === 'object') out.profil.nick = czystyNick(out.profil.nick);
    /* Historia turniejow: tylko tablica obiektow z sensownymi liczbami,
       obcieta do 30 -- ta sama zasada co reszta sanujZapis: naprawiaj,
       co sie da, odrzucaj tylko to, co nie ma sensu jako calosc. */
    if (!Array.isArray(out.turniejeHistoria)) out.turniejeHistoria = [];
    else out.turniejeHistoria = out.turniejeHistoria
      .filter(w => w && typeof w === 'object')
      .map(w => ({ id: String(w.id || ''), nazwa: String(w.nazwa || 'TURNIEJ').slice(0, 24),
                    minut: liczba(w.minut, 30, 1), gracze: liczba(w.gracze, 1, 1),
                    miejsce: liczba(w.miejsce, 1, 1), nagroda: liczba(w.nagroda, 0, 0),
                    kiedy: liczba(w.kiedy, 0, 0) }))
      .slice(0, 30);
    return out;
  }

  function wczytaj() {
    try {
      const t = Magazyn.czytaj(KLUCZ);
      if (t) {
        const d = JSON.parse(t);
        if (d && d.v === WERSJA) {
          const s = sanujZapis(d);
          if (s) dane = s;
        }
      }
    } catch (e) {}
    migruj(dane);
  }
  function teraz() {
    if (!Magazyn.czyDziala()) return;
    Magazyn.pisz(KLUCZ, JSON.stringify(dane));
    /* Lokalny zapis jest cachem. Dla zalogowanego konta wyslanie przechodzi
       przez Chmura CAS: serwer nie zostanie nadpisany, jesli zmienil sie od
       ostatniego pobrania. Brak sieci nie blokuje lokalnej gry. */
    if (typeof Chmura !== 'undefined' && Chmura.zaplanujWyslanie) Chmura.zaplanujWyslanie();
  }
  function zapisz() {
    if (!Magazyn.czyDziala()) return;
    clearTimeout(timer);
    timer = setTimeout(teraz, ZWLOKA);
  }

  /* Zwraca opis tego, co ta sztuka wnosi do kolekcji. Wolane raz, przy
     ladowaniu ryby, wiec karta moze od razu pokazac NOWY GATUNEK albo
     REKORD ZYCIOWY, a licznik nie zmienia sie w trakcie ogladania. */
  function zlowiono(slug, cm, waga, pkt) {
    nowaDoba();
    /* Dorobek doby liczy sie w PUNKTACH z kart, nie w sztukach: dwadziescia
       uklei ma wazyc mniej niz jeden lipien. Sztuki leca obok, do zadan. */
    dane.stat.dobaPunkty += pkt;
    dane.stat.dobaSztuk++;
    /* Q11: gatunek dopisany do zbioru DOBOWEGO (patrz nowaDoba). */
    if (dane.stat.dobaGat.indexOf(slug) < 0) dane.stat.dobaGat.push(slug);
    if (pkt > dane.stat.dobaRekord) dane.stat.dobaRekord = pkt;
    const a = dane.atlas[slug] || (dane.atlas[slug] = { n: 0, cm: 0, g: 0, pkt: 0, kiedy: 0 });
    const nowy = a.n === 0;
    const rekord = pkt > a.pkt;
    a.n++;
    if (rekord) { a.cm = Math.round(cm * 10) / 10; a.g = waga; a.pkt = pkt; a.kiedy = Date.now(); }
    dane.stat.zlowien++;
    if (pkt > dane.stat.rekordZycia) dane.stat.rekordZycia = pkt;
    zapisz();
    return { nowy, rekord, ile: a.n, najlepszy: a.pkt };
  }

  const kod = () => {
    try { return btoa(unescape(encodeURIComponent(JSON.stringify(dane)))); }
    catch (e) { return ''; }
  };
  function wczytajKod(t) {
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob(String(t).trim()))));
      if (!d || d.v !== WERSJA) return false;
      const s2 = sanujZapis(d);              // Q07
      if (!s2) return false;
      dane = migruj(s2); teraz(); return true;
    } catch (e) { return false; }
  }
  /* ============================================================
     NAPRAWA Q06 (audyt IX 2026): PRZYWRACANIE WLASNEJ KOPII.
     `wczytajKod` powyzej robi dokladnie to, co potrzeba -- PELNE
     zastapienie lokalnego stanu -- i istnial od dawna, ale audyt
     znalazl, ze W CALYM PLIKU NIE MA ANI JEDNEGO WYWOLANIA GO Z
     INTERFEJSU. Panel obiecywal "schowaj kod, wkleisz na innym
     telefonie", ale nie bylo gdzie tego wkleic -- jedyne pole
     tekstowe ("KOD ZNAJOMEGO") woła `dolaczKod`, ktora tylko DOKLEJA
     cudze rekordy do `spoleczne`, nie zastepuje niczego.
     Ta funkcja to podglad PRZED decyzja: dekoduje i waliduje (ta sama
     `sanujZapis` co realne wczytanie) ale NICZEGO NIE ZMIENIA w `dane`,
     zeby UI moglo pokazac "to masz teraz / to dostaniesz po przywroceniu"
     i zapytac o potwierdzenie, zanim cokolwiek nadpisze. */
  function podgladKodu(t) {
    let d;
    try { d = JSON.parse(decodeURIComponent(escape(atob(String(t).trim())))); }
    catch (e) { return { ok: false, powod: 'To nie wygląda na kod gry.' }; }
    if (!d || d.v !== WERSJA) return { ok: false, powod: 'Kod jest z innej wersji gry.' };
    const s2 = sanujZapis(d);
    if (!s2) return { ok: false, powod: 'Kod jest uszkodzony.' };
    return { ok: true, zlowien: s2.stat.zlowien || 0,
             gatunkow: Object.keys(s2.atlas || {}).filter(k => s2.atlas[k] && s2.atlas[k].n > 0).length,
             monety: s2.monety || 0, utworzone: s2.utworzone || 0 };
  }

  /* ============================================================
     REKORDY SPOLECZNOSCI BEZ SERWERA.

     Kod zapasowy juz istnieje i zawiera caly atlas nadawcy. Wystarczy wiec
     wkleic kod znajomego, zeby jego rekordy stanely obok twoich. Ta funkcja
     bierze z cudzego kodu WYLACZNIE najlepsze wyniki i nick. Monety, zadania,
     seria i zaneta sa ignorowane: cudzy kod nie moze niczego dodac do twojego
     konta poza liczba do pobicia. Wlasny kod wklejony tutaj nie robi nic.
     ============================================================ */
  /* ============================================================
     NAPRAWA Q04 (audyt IX 2026): XSS przez nick z kodu znajomego.
     Wlasny nick jest filtrowany przy wpisywaniu, ale nick WCZYTANY
     z cudzego kodu byl tylko przycinany do 16 znakow i szedl prosto do
     komunikatu wstawianego przez innerHTML. Szesnascie znakow wystarcza
     na znacznik z atrybutem zdarzenia. Kod znajomego to dane z zewnatrz
     -- wklejone z czatu, forum, czegokolwiek -- wiec traktujemy je jak
     kazde inne niezaufane wejscie.
     Filtrujemy U ZRODLA, przy imporcie: do `dane.spoleczne` nie ma prawa
     trafic nic poza literami, cyframi, spacja i kilkoma znakami. Dzieki
     temu bezpieczne staja sie WSZYSTKIE miejsca, ktore ten nick pozniej
     wyswietlaja, a nie tylko te, o ktorych ktos pamietal. */
  function czystyNick(x) {
    return String(x == null ? '' : x)
      .replace(/[^\p{L}\p{N} ._\-]/gu, '')   // tylko litery/cyfry/spacja/kropka/podkreslnik/myslnik
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 16) || 'ANONIM';
  }
  window.czystyNick = czystyNick;

  function dolaczKod(t) {
    let d;
    try { d = JSON.parse(decodeURIComponent(escape(atob(String(t).trim())))); }
    catch (e) { return { ok: false, powod: 'To nie wygląda na kod gry.' }; }
    if (!d || d.v !== WERSJA || !d.atlas) return { ok: false, powod: 'Kod jest z innej wersji gry.' };
    if (d.id && d.id === dane.id) return { ok: false, powod: 'To twój własny kod.' };
    const nick = czystyNick(d.profil && d.profil.nick);
    let nowych = 0, lepszych = 0;
    for (const slug in d.atlas) {
      const a = d.atlas[slug];
      if (!a || !a.n || !(a.pkt > 0)) continue;
      const b = dane.spoleczne[slug];
      if (!b) nowych++;
      else if (a.pkt > b.pkt) lepszych++;
      else continue;
      dane.spoleczne[slug] = { cm: a.cm, g: a.g, pkt: a.pkt, nick: nick };
    }
    if (nowych || lepszych) teraz();
    return { ok: true, nick: nick, nowych: nowych, lepszych: lepszych };
  }

  wczytaj();
  window.addEventListener('pagehide', teraz);
  window.addEventListener('visibilitychange', () => { if (document.hidden) teraz(); });

  function odswiezono() {
    nowaDoba(); dane.stat.dobaOdswiezen++; zapisz();
    /* ZLECENIA: termin liczy sie w LAWICACH (tabela LAWIC_PASMA w `47`),
       wiec to jest jego jedyny tykajacy zegar. Tedy przechodzi KAZDA
       wymiana lawicy. */
    if (window.Zlecenia) {
      const w = Zlecenia.lawicaMinela();
      if (w && w.co === 'przepadlo' && typeof Ruch !== 'undefined')
        Ruch.powiedz('ZLECENIE PRZEPADŁO  -' + w.kaucja, true);
      if (window.__odswiezPasekZlecen) window.__odswiezPasekZlecen();
    }
  }

  /* Zaneta zuzywa sie na LAWICE, nie na czas: jedna wymiana ławicy, czy to
     z zegara czy z przycisku, to jedna jednostka. Dzieki temu gracz sam
     decyduje, jak szybko ja spala. */
  function zuzyjLawice() {
    const z = dane.zaneta;
    if (!z) return;
    z.zostalo--;
    if (z.zostalo <= 0) dane.zaneta = null;
    zapisz();
  }
  /* ============================================================
     KAMIENIE MILOWE DOBY.
     Dwa liczniki placa same, bez odbierania: co 1000 wymian lawicy i co
     500 punktow zebranych od polnocy wpada 100 qryb. Progi licza sie
     narastajaco, wiec przeskoczenie kilku naraz wyplaca kilka razy,
     a zerowanie o polnocy kasuje takze pamiec wyplat.
     ============================================================ */
  const PROG_LAWIC = 1000, PROG_PUNKTOW = 500, NAGRODA_PROGU = 100;
  /* ============================================================
     DOMKNIECIE PASM I ATLASU.
     Placi sie RAZ za kazde pasmo i raz za caly atlas. Wyplacone znaczniki
     leza w zapisie, wiec nagroda nie powtorzy sie po przeladowaniu ani po
     wczytaniu kodu zapasowego.
     ============================================================ */
  /* ============================================================
     NAPRAWA Q13 (audyt IX 2026, decyzja projektowa Andrzeja: "podejmij
     decyzje"). Bylo: ta funkcja grupowala gatunki wedlug `tierGatunku`
     (przelicza X-Score TYPOWEGO okazu na przedzial 1-6 -- funkcja
     legalna i nadal uzywana do NAGRODA_ODKRYCIA, tam nic nie zmieniam).
     Atlas i jego zakladki grupuja wedlug `KLASA` (stala klasyfikacja
     gatunku, 1-7) -- patrz `pasmoAtlasu` w 21. Dla 46 z 80 gatunkow te
     dwa systemy dawaly RÓŻNY numer pasma, wiec zamkniecie WIDOCZNEJ
     zakladki atlasu (np. caly komplet pasma 2 na ekranie) nie musialo
     wcale odpalic wyplaty za "pasmo 2" -- bo ta funkcja liczyla wlasny,
     niewidoczny podzial.
     Naprawa: zero parametru, zero drugiego zrodla prawdy. Grupowanie
     TU jest dokladnie tym samym wyrazeniem co `pasmoAtlasu` w 21 --
     ten sam kod, nie "rownowazny kod w dwoch miejscach", zeby nie dalo
     sie znowu rozjechac przy kolejnej zmianie. Petla 1..7, bo KLASA ma
     siedem pasm (bylo 1..6 -- pasmo mityczne bylo poza zasiegiem, wiec
     dziesiec gatunkow mitycznych nie mialo wlasnej nagrody za komplet
     mimo osobnej zakladki w atlasie). NAGRODA_PASMA[7] dopisana nizej. */
  function sprawdzKolekcje() {
    if (!dane.progi) dane.progi = {};
    if (!dane.progi.pasma) dane.progi.pasma = {};
    const wszystkie = Object.keys(window.GATUNKI || {});
    if (!wszystkie.length) return null;
    const pasmoAtlasu = k => (window.KLASA && KLASA[k]) || 1;
    let ile = 0; const powody = [];
    for (let t = 1; t <= 8; t++) {
      if (dane.progi.pasma[t]) continue;
      const wPasmie = wszystkie.filter(k => pasmoAtlasu(k) === t);
      if (!wPasmie.length) continue;
      if (wPasmie.every(k => (dane.atlas[k] && dane.atlas[k].n > 0))) {
        dane.progi.pasma[t] = 1;
        ile += (window.NAGRODA_PASMA || {})[t] || 0;
        powody.push('PASMO ' + t + ' KOMPLETNE');
      }
    }
    if (!dane.progi.atlas && wszystkie.every(k => (dane.atlas[k] && dane.atlas[k].n > 0))) {
      dane.progi.atlas = 1;
      ile += window.NAGRODA_ATLASU || 0;
      powody.push('CAŁY ATLAS');
    }
    /* ============================================================
       NAPRAWA Q08 (audyt IX 2026): PODWOJNA WYPLATA.
       Bylo tu: `if (ile > 0) { dane.monety += ile; zapisz(); }` -- czyli ta
       funkcja SAMA wyplacala nagrode, a jednoczesnie zwracala jej wysokosc
       do openCard (26), ktore doliczalo te sama kwote do `bonus` i wyplacalo
       ja DRUGI RAZ. Komplet pasma 2 placil 4200 zamiast 2200.
       Teraz ta funkcja tylko ZAZNACZA progi jako odebrane i MOWI, ile sie
       nalezy. Wyplaca wylacznie openCard, przez `bonus` -- jedno miejsce
       zmienia saldo, tak jak reszta nagrod za polow (odkrycie, seria, rekord).
       `zapisz()` zostaje, bo trzeba utrwalic sam fakt odebrania progu:
       inaczej po przeladowaniu komplet dalby sie odebrac ponownie. */
    if (ile > 0) zapisz();
    return { ile: ile, powody: powody };
  }

  function sprawdzProgi() {
    nowaDoba();
    const st = dane.stat;
    let zysk = 0, ile = 0;
    const nL = Math.floor(st.dobaOdswiezen / PROG_LAWIC);
    if (nL > (st.progLawic || 0)) { ile = nL - st.progLawic; st.progLawic = nL; zysk += ile * NAGRODA_PROGU; }
    const nP = Math.floor(st.dobaPunkty / PROG_PUNKTOW);
    if (nP > (st.progPunktow || 0)) { ile = nP - st.progPunktow; st.progPunktow = nP; zysk += ile * NAGRODA_PROGU; }
    if (zysk > 0) { dane.monety = (dane.monety || 0) + zysk; zapisz(); }
    return zysk;
  }
  /* Nick: 3 do 16 znakow, litery polskie, cyfry, spacja, kropka i mysl
     nik. Bez znakow sterujacych i bez nawiasow katowych, bo nick trafi
     kiedys do HTML panelu i do cudzego ekranu. */
  function ustawNick(n) {
    const czysty = String(n || '').replace(/[^\p{L}\p{N} .\-_]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 16);
    dane.profil.nick = czysty;
    zapisz();
    return czysty;
  }
  function ustawIkone(id) {
    if (!(window.IKONY || []).some(i => i.id === id)) return false;
    if (!maSkorke('ikona', id)) return false;
    dane.profil.awatar.ikona = id;
    zapisz();
    return true;
  }
  function ustawIkoneKolor(id) {
    if (!(window.BARWY || []).some(b => b.id === id)) return false;
    if (!maSkorke('barwa', id)) return false;
    dane.profil.awatar.ikonaKolor = id;
    zapisz();
    return true;
  }

  /* ============================================================
     WLASNOSC SKOREK.

     Trzy startowe sztuki sa darmowe i nikt ich nie kupuje: lesny stroj,
     ikona kola i barwa granatowa. Reszte bierze sie ze straganu.

     Klucz ma postac 'rodzaj:id', bo trzy rodzaje maja rozlaczne przestrzenie
     nazw, ale nie w calosci: 'granat' istnieje i jako stroj, i jako barwa
     ikony. Bez przedrostka kupno kurtki dawaloby za darmo znaczek.
     ============================================================ */
  const DARMOWE = { stroj: 'zielony', ikona: 'kolo', barwa: 'granat' };
  function maSkorke(rodzaj, id) {
    /* Zamkniety stragan znaczy: nie ma jak niczego kupic, wiec blokowanie
       skorek zamienialoby brak sklepu w karę. Dopoki nie ruszy, wszystko
       jest dostepne. Rejestr posiadanych mimo to dziala i rosnie, wiec po
       otwarciu nic nie trzeba odtwarzac. */
    if (typeof window !== 'undefined' && window.SKLEP_ZAMKNIETY) return true;
    if (DARMOWE[rodzaj] === id) return true;
    return (dane.skorki.posiadane || []).indexOf(rodzaj + ':' + id) >= 0;
  }
  function dodajSkorke(rodzaj, id) {
    const k = rodzaj + ':' + id;
    if (!dane.skorki.posiadane) dane.skorki.posiadane = [];
    if (dane.skorki.posiadane.indexOf(k) < 0) dane.skorki.posiadane.push(k);
  }
  /* Zwraca nowy stan monet albo null, gdy nie stac lub rodzaj nieznany. */
  function kupSkorke(rodzaj, id, cena) {
    if (maSkorke(rodzaj, id)) return null;
    if ((dane.monety || 0) < cena) return null;
    dane.monety -= cena;
    dodajSkorke(rodzaj, id);
    zapisz();
    return dane.monety;
  }
  function ustawStroj(id) {
    const ok = (window.STROJE || []).some(s => s.id === id);
    if (!ok) return false;
    if (!maSkorke('stroj', id)) return false;
    dane.profil.awatar.stroj = id;
    zapisz();
    if (typeof window.przemalujLodke === 'function') window.przemalujLodke();
    return true;
  }

  /* Wgranie calego zapisu przyslanego z serwera. Ta sama sciezka co przy
     kodzie zapasowym, tylko bez base64: obiekt jest juz rozpakowany. */
  function wczytajObiekt(d) {
    if (!d || d.v !== WERSJA) return false;
    const s2 = sanujZapis(d);                // Q07
    if (!s2) return false;
    dane = migruj(s2);
    teraz();
    return true;
  }
  /* Zwraca true tylko wtedy, gdy wynik faktycznie jest lepszy od tego,
     co juz stoi w polu rekordu spolecznosci. */
  function ustawSpoleczny(slug, cm, waga, pkt, nick) {
    if (!slug || !(pkt > 0)) return false;
    const b = dane.spoleczne[slug];
    if (b && b.pkt >= pkt) return false;
    dane.spoleczne[slug] = { cm: cm, g: waga, pkt: pkt, nick: String(nick || 'ANONIM').slice(0, 16) };
    return true;
  }

  /* Q06: kopia zapasowa PRZED zastapieniem, pod osobnym kluczem magazynu.
     Nie nadpisuje sie sama -- jedna kopia starczy, zeby cofnac nieudane
     przywrocenie (np. wkleil zly kod, ale ten akurat przeszedl walidacje
     strukturalnie, tylko to nie ta gra, ktora mial na mysli). */
  function zrobKopieZapasowa() {
    try { Magazyn.pisz('kopia_przed_przywroceniem', JSON.stringify(dane)); } catch (e) {}
  }
  /* ============================================================
     WYNIK TURNIEJU (IX 2026). Jedno miejsce, ktore jednoczesnie
     wyplaca nagrode I zapisuje ja do historii -- tak jak Q08 uczyl:
     zaden inny kod nie ma prawa osobno dotykac monet za turniej.
     Zwraca zapisany wpis, zeby UI moglo od razu pokazac tabelke
     bez czekania na kolejny odczyt zapisu. */
  function zapiszTurniej(wpis) {
    dane.monety = (dane.monety || 0) + (wpis.nagroda || 0);
    if (!Array.isArray(dane.turniejeHistoria)) dane.turniejeHistoria = [];
    dane.turniejeHistoria.unshift({
      id: String(wpis.id || ''), nazwa: String(wpis.nazwa || 'TURNIEJ').slice(0, 24),
      minut: wpis.minut || 30, gracze: wpis.gracze || 1, miejsce: wpis.miejsce || 1,
      nagroda: wpis.nagroda || 0, kiedy: Date.now()
    });
    dane.turniejeHistoria = dane.turniejeHistoria.slice(0, 30);
    zapisz();
    return dane.turniejeHistoria[0];
  }
  function turniejJuzWyplacony(id) {
    return (dane.turniejeHistoria || []).some(w => w.id === id);
  }
  return { dane: () => dane, zlowiono, odswiezono, zuzyjLawice, sprawdzProgi, sprawdzKolekcje, nowaDoba, zapisz, teraz, kod, wczytajKod, podgladKodu, zrobKopieZapasowa, zapiszTurniej, turniejJuzWyplacony,
           dobaGat: () => { nowaDoba(); return dane.stat.dobaGat.slice(); },
           wczytajObiekt, ustawSpoleczny,
           odkryte: () => Object.keys(dane.atlas),
           ile: slug => (dane.atlas[slug] || { n: 0 }).n,
           najlepszy: slug => dane.atlas[slug] || null,
           /* profil i tozsamosc */
           id: () => dane.id,
           utworzone: () => dane.utworzone,
           profil: () => dane.profil,
           ustawNick, ustawStroj, ustawIkone, ustawIkoneKolor,
           maSkorke, kupSkorke, dodajSkorke,
           spoleczny: slug => dane.spoleczne[slug] || null,
           dolaczKod,
           czyDziala: () => Magazyn.czyDziala(), wyczysc: () => { dane = migruj(pusty()); teraz(); } };
})();

window.Zapis = Zapis;

/* ============================================================
   STAGE 9.4 — PANI RAPTOROWA / PRIVATE DAILY.

   Prywatnosc:
   - ZERO aktywacji nickiem,
   - ZERO parametru URL,
   - ZERO treści 100 wyznań w publicznym HTML,
   - klient pyta wyłącznie uwierzytelnione RPC Supabase,
   - RPC zwraca wiersz tylko auth.uid() z prywatnej allowlisty.
   ============================================================ */
const RaptorLove = (() => {
  const WL = !!(window.Features && Features.is('raptorowaDaily'));
  const el = document.getElementById('raptorLove');

  let shown = false;
  let inFlight = false;
  let accessResolved = false;
  let dzisiejsza = null;
  let timer = 0;

  function uid() {
    try { return (window.Chmura && Chmura.uid && Chmura.uid()) || ''; }
    catch (e) { return ''; }
  }

  function lastKey() {
    return 'qryby.raptorowa.daily.last_server.v1:' + (uid() || 'no-user');
  }

  function lsGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }

  function lsSet(k, v) {
    try { localStorage.setItem(k, String(v)); return true; }
    catch (e) { return false; }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  function uiBusy() {
    if (!document.body) return true;
    if (document.body.classList.contains('return-digest-open')) return true;
    if (document.body.classList.contains('karta-otwarta')) return true;
    if (document.body.classList.contains('ksiega-otwarta')) return true;
    if (document.body.classList.contains('menu-master-open')) return true;
    const p = document.getElementById('panel');
    if (p && p.classList.contains('on')) return true;
    try {
      if (window.Onboarding && Onboarding.aktywny && Onboarding.aktywny()) return true;
    } catch (e) {}
    return false;
  }

  async function pobierzDzisiejsza() {
    if (!WL || inFlight || accessResolved) return dzisiejsza;

    /* Tylko potwierdzone konto. Sam nick/mail w HTML nie ma znaczenia. */
    if (!window.Chmura || !Chmura.pelnyDostep || !Chmura.pelnyDostep() || !Chmura.wolajRpc)
      return null;

    inFlight = true;
    try {
      const r = await Chmura.wolajRpc('raptorowa_daily_today', {});
      const row = Array.isArray(r) ? (r[0] || null) : (r || null);

      /* Supabase odpowiedzial. Brak wiersza oznacza brak prywatnego dostepu. */
      accessResolved = true;

      if (!row || !row.day_key || !row.message || !row.work) {
        dzisiejsza = null;
        return null;
      }

      dzisiejsza = {
        day_key: String(row.day_key),
        day_no: Number(row.day_no) || 0,
        work: String(row.work),
        text: String(row.message)
      };
      return dzisiejsza;
    } catch (e) {
      /* Brak sieci/odswiezanie tokenu nie jest decyzja o dostepie.
         Kolejne podejscie moze sie udac. */
      return null;
    } finally {
      inFlight = false;
    }
  }

  function render(m) {
    if (!el || !m) return;
    el.innerHTML =
      '<div class="rl-kicker">TYLKO DLA CIEBIE · ♥</div>' +
      '<h3 class="rl-title">Pani Raptorowa</h3>' +
      '<div class="rl-quote">„' + esc(m.text) + '”</div>' +
      '<div class="rl-work">inspiracja: „' + esc(m.work) + '”</div>' +
      '<div class="rl-sign">— A.</div>' +
      '<div class="rl-day">' + m.day_no + ' / 100</div>' +
      '<div class="rl-actions"><button type="button" data-rl="close">ZACHOWUJĘ ♥</button></div>';
  }

  async function show() {
    if (!WL || !el || shown || uiBusy()) return false;

    const m = dzisiejsza || await pobierzDzisiejsza();
    if (!m) return false;

    if (lsGet(lastKey()) === m.day_key) return false;

    render(m);
    shown = true;
    lsSet(lastKey(), m.day_key);
    el.classList.add('on');
    el.setAttribute('aria-hidden', 'false');
    document.body.classList.add('raptor-love-open');
    return true;
  }

  function close() {
    if (!el) return;
    el.classList.remove('on');
    el.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('raptor-love-open');
  }

  if (el) {
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-rl="close"]');
      if (!b) return;
      e.preventDefault();
      e.stopPropagation();
      close();
    });
  }

  /* Konto i token laduja sie asynchronicznie. Przez 45 s czekamy
     na zalogowana sesje. Po jednoznacznej odpowiedzi "brak dostepu"
     przestajemy pytac. */
  if (WL) {
    setTimeout(show, 2400);

    timer = setInterval(() => {
      if (shown) {
        clearInterval(timer);
        timer = 0;
        return;
      }
      if (accessResolved && !dzisiejsza) {
        clearInterval(timer);
        timer = 0;
        return;
      }
      show();
    }, 1200);

    setTimeout(() => {
      if (timer) {
        clearInterval(timer);
        timer = 0;
      }
    }, 45000);
  }

  return {
    show,
    close,
    hasPrivateMessage: () => !!dzisiejsza,
    today: () => dzisiejsza
  };
})();
window.RaptorLove = RaptorLove;

/* ============================================================
   CHMURA. Konto, logowanie i kopia zapisu na serwerze.

   ZASADA NADRZEDNA: DLA ZALOGOWANEGO KONTA SERWER JEST ZRODLEM PRAWDY.
   Lokalny zapis jest cachem i pozwala grac bez sieci, ale po odzyskaniu
   polaczenia nie moze nadpisac stanu serwera, dopoki klient nie pobierze
   aktualnego zapisu konta. Bez konta gra nadal dziala lokalnie.

   Bez SDK. Supabase to zwykle HTTP, wiec cztery adresy i fetch wystarcza.
   Doklejanie biblioteki z CDN zlamaloby najwazniejsza wlasnosc tego pliku:
   ze jest jeden i dziala z dysku telefonu.

   TRZY DROGI DO KONTA:
     1. anonimowe   jeden przycisk, konto bez maila, dziala od razu
     2. dopiecie    do konta anonimowego dokladasz mail i haslo
     3. logowanie   mailem na drugim telefonie, zapis sciaga sie z serwera

   KLUCZ ANONIMOWY JEST JAWNY z zalozenia. Bezpieczenstwa pilnuje RLS
   po stronie bazy: kazdy wiersz widzi i zmienia wylacznie jego wlasciciel.
   Schemat i polityki leza w pliku qryby-baza.sql.
   ============================================================ */
const Chmura = (() => {
  const K_KONF = 'chmura.konf', K_SESJA = 'chmura.sesja';
  const LIMIT_MS = 9000;          /* zadne zadanie nie wisi dluzej */
  const ZWLOKA_WYSYL = 4000;      /* skleja serie zapisow w jedno wyslanie */

  let konf = null, sesja = null, blad = '', timer = 0;
  let wLocie = false, zaleglosc = false, ostatniaKopia = 0;
  /* Dla zalogowanego konta zapis lokalny nie moze nic wyslac, dopoki
     nie pobierzemy aktualnego stanu serwera. */
  let autorytetGotowy = false, autorytetPromise = null;
  /* CAS: zapamietujemy DOKLADNA wersje wiersza pobrana z serwera.
     Kazdy pozniejszy upload moze przejsc tylko, jesli serwer nadal ma
     te sama wartosc zmieniono. Inaczej serwer wygrywa i robimy pull. */
  let autorytetZmieniono = '', autorytetMaWiersz = false;
  const sluchacze = [];
  function powiadom() { for (const f of sluchacze) { try { f(); } catch (e) {} } }

  /* ---------- konfiguracja ---------- */
  /* Ustawienia wpisane w naglowku pliku maja pierwszenstwo i sa NIEZMIENNE
     z poziomu gry. Gracz, ktory dostal gotowy plik, nie moze ich zepsuc ani
     przypadkiem odlaczyc. Pola w panelu sa awaryjna sciezka dla autora,
     zanim wklei wartosci do naglowka. */
  let zNaglowka = false;
  function wczytajKonf() {
    const n = window.QRYBY_CHMURA;
    if (n && String(n.url || '').trim() && String(n.klucz || '').trim()) {
      konf = { url: String(n.url).trim().replace(/\/+$/, ''), klucz: String(n.klucz).trim() };
      zNaglowka = true;
      return;
    }
    try {
      const t = Magazyn.czytaj(K_KONF);
      if (t) { const d = JSON.parse(t); if (d && d.url && d.klucz) konf = d; }
    } catch (e) {}
  }
  function ustawKonf(url, klucz) {
    url = String(url || '').trim().replace(/\/+$/, '');
    klucz = String(klucz || '').trim();
    if (!/^https:\/\/[\w.-]+$/.test(url) || klucz.length < 20) return false;
    konf = { url, klucz };
    Magazyn.pisz(K_KONF, JSON.stringify(konf));
    blad = ''; powiadom();
    return true;
  }
  function zapomnijKonf() {
    if (zNaglowka) return false;      /* wpisane na stale, gra tego nie rusza */
    konf = null; Magazyn.skasuj(K_KONF); wyloguj();
    return true;
  }

  /* ---------- sesja ---------- */
  function wczytajSesje() {
    try { const t = Magazyn.czytaj(K_SESJA); if (t) sesja = JSON.parse(t); } catch (e) {}
  }
  /* ============================================================
     IDENTYFIKATOR KONTA Z SAMEGO TOKENU.

     BLAD: uid brany byl wylacznie z pola user w odpowiedzi serwera, a przy
     niektorych odpowiedziach tego pola nie ma. Po wylogowaniu nie bylo tez
     z czego wziac zapasu, bo poprzednia sesja juz nie istniala. Konczylo sie
     pustym uid i zapytaniem "id=eq." bez wartosci, ktore PostgREST odrzuca
     bledem 400. Objaw: pierwsze logowanie po wylogowaniu wywalalo sie
     komunikatem o bledzie zamiast wpuscic.

     Token dostepu to JWT, a w jego srodkowej czesci siedzi pole sub, czyli
     identyfikator konta. Bierzemy go stamtad i mamy uid zawsze, niezaleznie
     od ksztaltu odpowiedzi.
     ============================================================ */
  function uidZTokenu(token) {
    try {
      const s = String(token).split('.')[1];
      if (!s) return '';
      const b = s.replace(/-/g, '+').replace(/_/g, '/');
      const json = decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))));
      return JSON.parse(json).sub || '';
    } catch (e) { return ''; }
  }
  function mailZTokenu(token) {
    try {
      const s = String(token).split('.')[1];
      if (!s) return '';
      const b = s.replace(/-/g, '+').replace(/_/g, '/');
      const json = decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))));
      return JSON.parse(json).email || '';
    } catch (e) { return ''; }
  }
  function potwierdzonyZUsera(u) {
    return !!(u && u.email && (u.email_confirmed_at || u.confirmed_at));
  }
  function zapiszSesje(s) {
    const staryUid = (sesja && sesja.uid) || '';
    const u = s && s.user ? s.user : null;
    sesja = s ? {
      token: s.access_token, odswiez: s.refresh_token,
      wygasa: Date.now() + (s.expires_in || 3600) * 1000,
      uid: (u && u.id) || uidZTokenu(s.access_token) || (sesja && sesja.uid) || '',
      mail: (u && u.email) || mailZTokenu(s.access_token) || '',
      /* Dostęp do połowu wymaga POTWIERDZONEGO maila, nie samego pola email.
         Przy odpowiedzi bez obiektu user zachowujemy wcześniejszy stan tylko
         dla już zweryfikowanej sesji; backend i tak sprawdza auth.users. */
      potwierdzony: u ? potwierdzonyZUsera(u) : !!(sesja && sesja.potwierdzony)
    } : null;
    const nowyUid = (sesja && sesja.uid) || '';
    if (!sesja || nowyUid != staryUid) {
      autorytetGotowy = false;
      autorytetPromise = null;
      autorytetZmieniono = '';
      autorytetMaWiersz = false;
    }
    if (sesja) Magazyn.pisz(K_SESJA, JSON.stringify(sesja));
    else Magazyn.skasuj(K_SESJA);
    powiadom();
  }
  function wyloguj() { zapiszSesje(null); blad = ''; powiadom(); }

  /* ---------- warstwa HTTP ---------- */
  async function zadanie(sciezka, opcje, zAuth) {
    if (!konf) throw new Error('Brak konfiguracji serwera.');
    const kontrola = new AbortController();
    const stoper = setTimeout(() => kontrola.abort(), LIMIT_MS);
    const naglowki = Object.assign({
      'apikey': konf.klucz,
      'Content-Type': 'application/json'
    }, (opcje && opcje.headers) || {});
    if (zAuth && sesja && sesja.token) naglowki['Authorization'] = 'Bearer ' + sesja.token;
    else naglowki['Authorization'] = 'Bearer ' + konf.klucz;
    let o;
    try {
      o = await fetch(konf.url + sciezka, Object.assign({}, opcje, {
        headers: naglowki, signal: kontrola.signal
      }));
    } catch (e) {
      clearTimeout(stoper);
      throw new Error(e.name === 'AbortError' ? 'Serwer nie odpowiada.' : 'Brak połączenia.');
    }
    clearTimeout(stoper);
    if (o.status === 204) return null;
    let tresc = null;
    try { tresc = await o.json(); } catch (e) {}
    if (!o.ok) {
      const surowy = (tresc && (tresc.msg || tresc.message || tresc.error_description || tresc.error)) || ('Błąd ' + o.status);
      const e = new Error(poLudzku(surowy));
      e.status = o.status; e.surowy = surowy;
      throw e;
    }
    return tresc;
  }

  /* Token zyje godzine. Odswiezany jest leniwie, minute przed koncem,
     przy pierwszym zadaniu, ktore go potrzebuje. */
  /* ============================================================
     ODSWIEZANIE TOKENU, JEDNO NA RAZ.

     BLAD: "Invalid Refresh Token: Already Used". Supabase ROTUJE token
     odswiezajacy, a gra pyta serwer z kilku miejsc naraz: tablica turniejow
     co trzy sekundy, rekordy swiata co kwadrans, kopia zapisu po kazdym
     zlowieniu. Gdy token dobiegal konca, kilka watkow zauwazalo to w tej
     samej sekundzie i kazdy szedl odswiezac wlasnym egzemplarzem. Pierwszy
     wygrywal, reszta dostawala odmowe, a kod kasowal wtedy sesje. Przy
     koncie anonimowym znaczylo to utrate konta bez ostrzezenia.

     Trzy warstwy: jedno odswiezanie na raz; po odmowie zagladamy do magazynu,
     czy rownolegly watek nie zapisal juz swiezego tokenu; na koncu jedna
     proba ponowna, bo serwer przez kilka sekund oddaje na zuzyty token te
     sama nowa sesje. Kasujemy dopiero, gdy wszystkie trzy zawioda.
     ============================================================ */
  let wLocieOdswiezanie = null;
  function sesjaZMagazynu() {
    try { const t = Magazyn.czytaj(K_SESJA); return t ? JSON.parse(t) : null; } catch (e) { return null; }
  }
  async function odswiezToken() {
    const stary = sesja.odswiez;
    try {
      const o = await zadanie('/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', body: JSON.stringify({ refresh_token: stary })
      }, false);
      if (!o || !o.access_token) throw new Error('Serwer nie zwrócił sesji.');
      zapiszSesje(o); return;
    } catch (e) {
      const z = sesjaZMagazynu();
      if (z && z.token && z.odswiez !== stary && Date.now() < z.wygasa - 5000) {
        sesja = z; powiadom(); return;
      }
      await new Promise(r => setTimeout(r, 1100));
      try {
        const o2 = await zadanie('/auth/v1/token?grant_type=refresh_token', {
          method: 'POST', body: JSON.stringify({ refresh_token: sesja.odswiez })
        }, false);
        if (o2 && o2.access_token) { zapiszSesje(o2); return; }
      } catch (e2) {}
      const z2 = sesjaZMagazynu();
      if (z2 && z2.token && Date.now() < z2.wygasa - 5000) { sesja = z2; powiadom(); return; }
      zapiszSesje(null);
      throw new Error('Sesja wygasła, zaloguj się ponownie.');
    }
  }
  async function pewnyToken() {
    if (!sesja) throw new Error('Nie jesteś zalogowany.');
    if (Date.now() < sesja.wygasa - 60000) return;
    if (wLocieOdswiezanie) return wLocieOdswiezanie;
    wLocieOdswiezanie = odswiezToken().finally(() => { wLocieOdswiezanie = null; });
    return wLocieOdswiezanie;
  }

  /* Serwer jest źródłem prawdy dla potwierdzenia maila.
     Stare sesje sprzed tej poprawki nie dostają praw "z rozpędu". */
  async function sprawdzPotwierdzenie() {
    if (!sesja || !sesja.token) return false;
    try {
      await pewnyToken();
      const u = await zadanie('/auth/v1/user', {}, true);
      const ok = potwierdzonyZUsera(u);
      sesja.mail = (u && u.email) || sesja.mail || '';
      sesja.potwierdzony = ok;
      Magazyn.pisz(K_SESJA, JSON.stringify(sesja));
      powiadom();
      return ok;
    } catch (e) {
      if (sesja) {
        sesja.potwierdzony = false;
        try { Magazyn.pisz(K_SESJA, JSON.stringify(sesja)); } catch (err) {}
        powiadom();
      }
      return false;
    }
  }

  /* ---------- logowanie ---------- */
  async function anonim() {
    const o = await zadanie('/auth/v1/signup', { method: 'POST', body: JSON.stringify({ data: {} }) }, false);
    if (!o || !o.access_token) throw new Error('Serwer nie zwrócił sesji. Włącz logowanie anonimowe w Supabase.');
    zapiszSesje(o);
    return o;
  }
  async function rejestracja(mail, haslo) {
    const o = await zadanie('/auth/v1/signup', {
      method: 'POST', body: JSON.stringify({ email: mail, password: haslo })
    }, false);
    if (o && o.access_token) zapiszSesje(o);
    return o;
  }
  async function logowanie(mail, haslo) {
    const o = await zadanie('/auth/v1/token?grant_type=password', {
      method: 'POST', body: JSON.stringify({ email: mail, password: haslo })
    }, false);
    if (!o || !o.access_token) throw new Error('Zły mail albo hasło.');
    zapiszSesje(o);
    return o;
  }
  /* Dopiecie maila do konta anonimowego. Konto zostaje to samo, wiec zapis,
     atlas i rekordy przezywaja operacje bez zadnego przenoszenia. */
  async function dopnijMail(mail, haslo) {
    await pewnyToken();
    const o = await zadanie('/auth/v1/user', {
      method: 'PUT', body: JSON.stringify({ email: mail, password: haslo })
    }, true);
    if (sesja) {
      sesja.mail = mail;
      sesja.potwierdzony = potwierdzonyZUsera(o);
      Magazyn.pisz(K_SESJA, JSON.stringify(sesja));
      powiadom();
    }
    return o;
  }

  /* ---------- kopia zapisu ---------- */
  const K_KONTO = 'chmura.ostatnie';
  function ostatnieKonto() { try { return Magazyn.czytaj(K_KONTO) || ''; } catch (e) { return ''; } }

  function wiersz() {
    const d = Zapis.dane();
    return {
      id: sesja.uid,
      nick: (d.profil && d.profil.nick) || '',
      stroj: (d.profil && d.profil.awatar && d.profil.awatar.stroj) || 'zielony',
      zlowien: d.stat.zlowien || 0,
      gatunkow: Object.keys(d.atlas || {}).length,
      rekord_zycia: d.stat.rekordZycia || 0,
      zapis: d,
      zmieniono: new Date().toISOString()
    };
  }

  async function zapewnijAutorytetSerwera() {
    if (!konf || !sesja) return { co: 'lokalny' };
    if (autorytetGotowy) return { co: 'gotowy' };
    if (autorytetPromise) return await autorytetPromise;

    autorytetPromise = (async () => {
      const zdalny = await pobierz();
      if (zdalny && zdalny.zapis) {
        /* SERWER WYGRYWA. Lokalny stan jest tylko cachem. */
        Zapis.wczytajObiekt(zdalny.zapis);
        Magazyn.pisz(K_KONTO, sesja.uid);
        autorytetZmieniono = String(zdalny.zmieniono || '');
        autorytetMaWiersz = true;
        autorytetGotowy = true;
        ostatniaKopia = Date.now();
        blad = '';
        powiadom();
        return { co: 'pobrano', ile: zdalny.zlowien || 0 };
      }

      /* Nowe konto bez zapisu: dopiero teraz wolno utworzyc pierwszy
         serwerowy stan z lokalnego cache. */
      autorytetZmieniono = '';
      autorytetMaWiersz = false;
      autorytetGotowy = true;
      return { co: 'brak' };
    })();

    try {
      return await autorytetPromise;
    } finally {
      autorytetPromise = null;
    }
  }

  async function wyslijTeraz() {
    if (!konf || !sesja) return false;
    if (wLocie) { zaleglosc = true; return false; }
    wLocie = true;
    try {
      await pewnyToken();

      /* Pierwszy ruch po starcie/logowaniu jest ZAWSZE serwer -> telefon.
         Jesli istnieje zdalny zapis, konczymy ten cykl bez uploadu. */
      const start = await zapewnijAutorytetSerwera();
      if (start && start.co === 'pobrano') {
        blad = '';
        return true;
      }

      const payload = wiersz();
      let zapisane = null;

      if (autorytetMaWiersz) {
        /* COMPARE-AND-SWAP.
           Nie robimy juz slepego UPSERT. Aktualizacja przejdzie tylko,
           gdy zmieniono na serwerze nadal jest wersja, ktora ten klient
           ostatnio pobral. Stara karta, drugi telefon albo zmiana admina
           nie moga zostac nadpisane lokalnym cachem. */
        const wersja = encodeURIComponent(autorytetZmieniono || '');
        zapisane = await zadanie(
          '/rest/v1/gracze?id=eq.' + sesja.uid +
          '&zmieniono=eq.' + wersja +
          '&select=zmieniono',
          {
            method: 'PATCH',
            headers: { 'Prefer': 'return=representation' },
            body: JSON.stringify(payload)
          }, true
        );

        if (!zapisane || !zapisane.length) {
          /* Serwer zmienil sie od ostatniego pull. SERWER WYGRYWA. */
          autorytetGotowy = false;
          autorytetPromise = null;
          const nowszy = await zapewnijAutorytetSerwera();
          blad = '';
          return !!(nowszy && nowszy.co === 'pobrano');
        }
      } else {
        /* Nowe konto bez wiersza: probujemy tylko INSERT. Jesli wiersz
           powstal rownolegle, niczego nie nadpisujemy i pobieramy serwer. */
        zapisane = await zadanie('/rest/v1/gracze?select=zmieniono', {
          method: 'POST',
          headers: { 'Prefer': 'resolution=ignore-duplicates,return=representation' },
          body: JSON.stringify(payload)
        }, true);

        if (!zapisane || !zapisane.length) {
          autorytetGotowy = false;
          autorytetPromise = null;
          const nowszy = await zapewnijAutorytetSerwera();
          blad = '';
          return !!(nowszy && nowszy.co === 'pobrano');
        }
        autorytetMaWiersz = true;
      }

      autorytetZmieniono = String(zapisane[0].zmieniono || payload.zmieniono || '');
      ostatniaKopia = Date.now(); blad = '';
      Magazyn.pisz(K_KONTO, sesja.uid);
    } catch (e) {
      blad = e.message || 'Nie udało się wysłać.';
    } finally {
      wLocie = false; powiadom();
      if (zaleglosc) { zaleglosc = false; zaplanujWyslanie(); }
    }
    return !blad;
  }
  function zaplanujWyslanie() {
    if (!konf || !sesja) return;
    clearTimeout(timer);
    timer = setTimeout(wyslijTeraz, ZWLOKA_WYSYL);
  }

  async function pobierz() {
    await pewnyToken();
    /* Bez identyfikatora zapytanie i tak by sie nie udalo, a blad 400
       nic nikomu nie mowi. Lepiej powiedziec wprost, co jest nie tak. */
    if (!sesja.uid) throw new Error('Sesja bez identyfikatora konta. Wyloguj się i zaloguj ponownie.');
    const o = await zadanie('/rest/v1/gracze?select=zapis,zlowien,gatunkow,nick,zmieniono&id=eq.' + sesja.uid, {}, true);
    return (o && o.length) ? o[0] : null;
  }

  /* ============================================================
     SYNCHRONIZACJA KONTA — SERWER JEST ZRODLEM PRAWDY.
     Po starcie i po logowaniu najpierw pobieramy zapis z serwera.
     Jezeli istnieje, zawsze trafia on na telefon. Lokalny stan moze
     utworzyc zapis serwera tylko dla nowego konta bez zadnego wiersza.
     ============================================================ */
  async function pierwszeSpotkanie() {
    const stan = await zapewnijAutorytetSerwera();
    if (stan && stan.co === 'pobrano') return stan;
    if (stan && (stan.co === 'gotowy' || stan.co === 'brak')) {
      const ok = await wyslijTeraz();
      return { co: ok ? 'wyslano' : 'blad' };
    }
    return { co: 'lokalny' };
  }
  function przyjmijZdalny(zapisZdalny) {
    Zapis.wczytajObiekt(zapisZdalny);
    powiadom();
  }

  /* ============================================================
     REKORDY SWIATA.
     Jedno zapytanie do widoku, ktory oddaje najlepszy wynik na gatunek
     w calej bazie razem z nickiem. Wynik ladu je w tym samym miejscu,
     z ktorego atlas czyta rekordy wklejone z kodu znajomego, wiec strona
     ryby nie wie i nie musi wiedziec, skad przyszla liczba.
     Czytane bez logowania: widok jest publiczny do odczytu.
     ============================================================ */
  /* ============================================================
     RANKING OGOLNY.

     Widok tablica jest publiczny do odczytu, wiec czyta sie go BEZ konta
     i bez logowania. Konta bez nicku do niego nie wchodza: pusty nick
     w rankingu to smiec, a nie zawodnik, i tak jest to zapisane w samym
     widoku, nie tutaj.

     Sortowanie robi baza: rekord zycia, potem gatunki, potem zlowienia.
     Klient bierze pierwsza setke i nic nie przelicza.
     ============================================================ */
  async function tablicaSwiata(ile) {
    if (!konf) throw new Error('Nie masz podłączonego serwera.');
    return await zadanie('/rest/v1/tablica?select=nick,rekord_zycia,zlowien,gatunkow&limit=' +
      Math.max(1, Math.min(200, ile || 100)), {}, false);
  }

  async function rekordySwiata() {
    if (!konf) return 0;
    const o = await zadanie('/rest/v1/rekordy_swiata?select=gatunek,cm,waga,pkt,nick', {}, false);
    if (!o || !o.length) return 0;
    let ile = 0;
    for (const r of o) if (Zapis.ustawSpoleczny(r.gatunek, r.cm, r.waga, r.pkt, r.nick || 'ANONIM')) ile++;
    if (ile) Zapis.teraz();
    return ile;
  }

  /* Procedura w bazie. Wszystko, co zmienia cudze wiersze albo pilnuje
     regul, idzie ta droga, a nie przez zwykly zapis do tabeli. */
  /* ============================================================
     TLUMACZ BLEDOW BAZY.

     PostgREST oddaje komunikaty Postgresa slowo w slowo, po angielsku
     i w jezyku schematu. "column tryb of relation zawody does not exist"
     jest precyzyjne, ale nie mowi graczowi, co ma zrobic. A mowi to
     jednoznacznie: brakuje migracji.

     Tlumaczymy tylko te kilka wzorcow, ktore faktycznie moga wystapic
     przy niedograniu schematu. Reszta idzie bez zmian, zeby nie zgubic
     tresci prawdziwego bledu.
     ============================================================ */
  const PODPOWIEDZI = [
    [/relation .*(rundy|zawodnicy|zawody|korekty|administratorzy).* does not exist/i,
     'Baza nie ma jeszcze tabel turniejowych. Uruchom w Supabase plik qryby-liga-final.sql.'],
    [/column .* of relation .* does not exist/i,
     'Baza ma starszy schemat niż gra. Uruchom w Supabase plik qryby-liga-final.sql.'],
    [/function .* does not exist/i,
     'Baza nie ma jeszcze procedur turniejowych. Uruchom w Supabase plik qryby-liga-final.sql.'],
    [/permission denied/i,
     'Baza odmawia dostępu. Sprawdź, czy uruchomiłeś całość pliku SQL, razem z sekcją uprawnień.']
  ];
  function poLudzku(tekst) {
    for (const [wz, rada] of PODPOWIEDZI) if (wz.test(tekst)) return rada;
    return tekst;
  }

  async function wolajRpc(nazwa, ciało) {
    if (!konf) throw new Error('Nie masz podłączonego serwera.');
    if (!sesja) throw new Error('Nie jesteś zalogowany.');
    await pewnyToken();
    return await zadanie('/rest/v1/rpc/' + nazwa, {
      method: 'POST', body: JSON.stringify(ciało || {})
    }, true);
  }
  async function pobierzTablice(zawodyId) {
    await pewnyToken();
    return await zadanie('/rest/v1/zawodnicy?zawody=eq.' + zawodyId +
      '&select=gracz,nick,punkty,sztuk,najlepszy_gat,najlepsze_pkt&order=punkty.desc,sztuk.asc', {}, true);
  }

  /* ============================================================
     REKORDY SWIATA SAME.

     Widok rekordow jest publiczny, wiec czyta sie go BEZ logowania i bez
     konta. Nie ma wiec powodu, zeby ktokolwiek to klikal.

     Trzy wyzwalacze, wszystkie tanie: raz przy starcie gry z opoznieniem
     szesciu sekund, zeby nie konkurowac z wczytywaniem grafiki; potem co
     pietnascie minut; i dodatkowo zaraz po zalogowaniu, bo wtedy gracz
     zwykle zaglada do ksiegi.

     Jedno zapytanie oddaje rekord kazdego gatunku naraz, wiec koszt to
     cztery zapytania na godzine niezaleznie od tego, ile ryb jest w grze.
     Brak sieci nie robi nic zlego: nastepne podejscie po prostu sie uda.
     ============================================================ */
  const AUTO_REKORDY_MS = 15 * 60 * 1000;
  let autoRekordyTimer = 0;
  function autoRekordy() {
    clearTimeout(autoRekordyTimer);
    if (!konf) return;
    rekordySwiata().catch(() => {});
    autoRekordyTimer = setTimeout(autoRekordy, AUTO_REKORDY_MS);
  }

  wczytajKonf(); wczytajSesje();
  /* Sesja zapisana przez starszą wersję nie ma wiarygodnej flagi
     potwierdzenia. Sprawdzamy ją z Supabase przy starcie. */
  if (konf && sesja) {
    /* Zalogowany klient zaczyna od PULL. Dopiero po nim wolno wysylac save. */
    setTimeout(() => { zapewnijAutorytetSerwera().catch(e => {
      blad = e.message || 'Nie udało się pobrać zapisu z serwera.';
      powiadom();
    }); }, 120);
    setTimeout(() => { sprawdzPotwierdzenie().catch(() => {}); }, 250);
  }
  if (konf) setTimeout(autoRekordy, 6000);
  sluchacze.push(() => { if (konf && sesja) rekordySwiata().catch(() => {}); });

  return {
    ustawKonf, zapomnijKonf, skonfigurowana: () => !!konf, konf: () => konf,
    autoRekordy,
    naStale: () => zNaglowka,
    anonim, rejestracja, logowanie, dopnijMail, wyloguj,
    zalogowany: () => !!(sesja && sesja.token),
    /* ============================================================
       PELNY DOSTEP = KONTO Z MAILEM (IX 2026).
       `zalogowany` mowi tylko tyle, ze jest wazna sesja -- a konto
       anonimowe tez ja ma. Przez to ktos bez maila mial pelne prawa:
       lowil mityczne, ruszal wspolna populacja i wchodzil w turnieje
       jako ANONIM. Teraz gra pyta o `pelnyDostep`, a to wymaga maila.
       Konto anonimowe zostaje wylacznie jako szkielet do DOPIECIA
       maila (Chmura.dopnijMail), zeby dotychczasowi gracze nie stracili
       postepu. `zalogowany` zostaje bez zmian, bo od niego zalezy
       wazenie sesji i odswiezanie tokena. */
    pelnyDostep: () => !!(sesja && sesja.token && sesja.mail && sesja.potwierdzony),
    potwierdzony: () => !!(sesja && sesja.potwierdzony),
    sprawdzPotwierdzenie,
    mail: () => (sesja && sesja.mail) || '',
    uid: () => (sesja && sesja.uid) || '',
    zaplanujWyslanie, wyslijTeraz, pobierz, pierwszeSpotkanie, przyjmijZdalny, rekordySwiata,
    wolajRpc, pobierzTablice, tablicaSwiata,
    blad: () => blad, ostatniaKopia: () => ostatniaKopia,
    nasluchuj: f => sluchacze.push(f)
  };
})();
window.Chmura = Chmura;

/* ============================================================
   PRODUCT STAGE 0 — TELEMETRY.
   Cel: zmierzyc pierwsze 30 minut bez ingerowania w gameplay.

   Zasady prywatnosci tego modulu:
   - nie wysyla maila, nicku, tresci wpisywanych przez gracza ani stackow;
   - konto, jezeli istnieje, jest tylko technicznym UUID Supabase;
   - install_id i session_id sa losowymi UUID;
   - payload ma twardy limit i tylko proste dane o zachowaniu w grze;
   - brak tabeli / brak sieci NIGDY nie blokuje gry — kolejka zostaje lokalnie.
   ============================================================ */
const Telemetry = (() => {
  const WL = !!(window.Features && Features.is('telemetry'));
  const BUILD = String(window.QRYBY_BUILD || 'dev');
  const K_INSTALL = 'qryby.telemetry.install';
  const K_QUEUE = 'qryby.telemetry.queue.v1';
  const MAX_QUEUE = 500;
  const BATCH = 25;
  const FLUSH_MS = 6000;
  const sessionStart = Date.now();
  const sessionId = uuid();
  const razSesja = new Set();

  /* STAGE 9 — fala testowa pochodzi wyłącznie z jawnego linku.
     Nie losujemy użytkownikow do kohort po cichu. ?wave=... zapisuje sie
     lokalnie, zeby kolejne wejscie tej samej osoby zostalo w tej samej fali. */
  const K_WAVE = 'qryby.testwave.id.v1';
  const K_VARIANT = 'qryby.testwave.variant.v1';

  function cleanTag(v, fallback) {
    v = String(v == null ? '' : v).trim().toLowerCase()
      .replace(/[^a-z0-9_-]/g, '_').replace(/_+/g, '_').slice(0, 32);
    return v || fallback;
  }

  const qs = new URLSearchParams(location.search);
  const qWave = qs.get('wave');
  const qVariant = qs.get('variant');

  let waveId = 'organic';
  let waveVariant = 'base';

  const sessionStats = {
    casts:0,catches:0,decisions:0,kept:0,released:0,
    shoals:0,bucket:0,atlas:0,ecosystem:0,quests:0,
    shares:0,gates:0,errors:0,stage1_done:false
  };

  function countEvent(name) {
    if (name === 'first_cast') sessionStats.casts = Math.max(1, sessionStats.casts);
    else if (name === 'fish_caught') sessionStats.catches++;
    else if (name === 'first_decision') sessionStats.decisions = Math.max(1, sessionStats.decisions);
    else if (name === 'fish_kept') { sessionStats.decisions++; sessionStats.kept++; }
    else if (name === 'fish_released') { sessionStats.decisions++; sessionStats.released++; }
    else if (name === 'shoal_refresh') sessionStats.shoals++;
    else if (name === 'bucket_open') sessionStats.bucket++;
    else if (name === 'atlas_open') sessionStats.atlas++;
    else if (name === 'ecosystem_open') sessionStats.ecosystem++;
    else if (name === 'quest_open') sessionStats.quests++;
    else if (name === 'share_invoked') sessionStats.shares++;
    else if (name === 'progression_gate_hit') sessionStats.gates++;
    else if (name === 'client_error') sessionStats.errors++;
    else if (name === 'onboarding_stage1_done') sessionStats.stage1_done = true;
  }

  function summaryPayload(reason) {
    return {
      reason:String(reason || 'checkpoint').slice(0,24),
      duration_s:Math.round((Date.now()-sessionStart)/1000),
      casts:sessionStats.casts,
      catches:sessionStats.catches,
      decisions:sessionStats.decisions,
      kept:sessionStats.kept,
      released:sessionStats.released,
      shoals:sessionStats.shoals,
      bucket_open:sessionStats.bucket,
      atlas_open:sessionStats.atlas,
      ecosystem_open:sessionStats.ecosystem,
      quest_open:sessionStats.quests,
      shares:sessionStats.shares,
      gates:sessionStats.gates,
      errors:sessionStats.errors,
      stage1_done:sessionStats.stage1_done
    };
  }

  let timer = 0;
  let wysylanie = false;
  let remoteBlocked = false;

  function uuid() {
    try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0, v = c === 'x' ? r : ((r & 3) | 8);
      return v.toString(16);
    });
  }

  function getLocal(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function setLocal(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  }

  if (qWave) setLocal(K_WAVE, cleanTag(qWave, 'organic'));
  if (qVariant) setLocal(K_VARIANT, cleanTag(qVariant, 'base'));
  waveId = cleanTag(getLocal(K_WAVE), 'organic');
  waveVariant = cleanTag(getLocal(K_VARIANT), 'base');

  let installId = getLocal(K_INSTALL);
  if (!installId || !/^[0-9a-f-]{30,40}$/i.test(installId)) {
    installId = uuid();
    setLocal(K_INSTALL, installId);
  }

  function loadQueue() {
    try {
      const q = JSON.parse(getLocal(K_QUEUE) || '[]');
      return Array.isArray(q) ? q.slice(-MAX_QUEUE) : [];
    } catch (e) { return []; }
  }
  let kolejka = loadQueue();

  function saveQueue() {
    if (kolejka.length > MAX_QUEUE) kolejka = kolejka.slice(-MAX_QUEUE);
    setLocal(K_QUEUE, JSON.stringify(kolejka));
  }

  function cleanPayload(p) {
    const out = {};
    if (!p || typeof p !== 'object') return out;
    for (const k of Object.keys(p).slice(0, 20)) {
      const key = String(k).replace(/[^a-zA-Z0-9_]/g, '').slice(0, 32);
      if (!key) continue;
      let v = p[k];
      if (typeof v === 'string') v = v.slice(0, 120);
      else if (typeof v === 'number') v = Number.isFinite(v) ? v : null;
      else if (typeof v === 'boolean' || v === null) {}
      else continue; /* zero obiektow, DOM, stackow, dowolnego tekstu */
      out[key] = v;
    }
    return out;
  }

  function accountId() {
    try {
      const x = window.Chmura && Chmura.uid ? String(Chmura.uid() || '') : '';
      return /^[0-9a-f-]{30,40}$/i.test(x) ? x : null;
    } catch (e) { return null; }
  }

  function event(nazwa, payload) {
    if (!WL) return false;
    nazwa = String(nazwa || '').toLowerCase().replace(/[^a-z0-9_]/g, '_').slice(0, 48);
    if (nazwa.length < 2) return false;
    if (nazwa !== 'session_summary' && nazwa !== 'session_checkpoint') countEvent(nazwa);
    kolejka.push({
      client_time: new Date().toISOString(),
      install_id: installId,
      session_id: sessionId,
      account_id: accountId(),
      event_name: nazwa,
      event_version: 1,
      build: BUILD.slice(0, 64),
      payload: Object.assign({
        elapsed_ms: Date.now() - sessionStart,
        wave_id: waveId,
        variant: waveVariant
      }, cleanPayload(payload))
    });
    saveQueue();
    planFlush();
    return true;
  }

  function onceSession(nazwa, payload) {
    if (razSesja.has(nazwa)) return false;
    razSesja.add(nazwa);
    return event(nazwa, payload);
  }

  function endpoint() {
    const k = window.QRYBY_CHMURA;
    if (!k || !k.url || !k.klucz) return null;
    return { url: String(k.url).replace(/\/+$/, '') + '/rest/v1/analytics_events', key: String(k.klucz) };
  }

  async function flush(opcje) {
    if (!WL || wysylanie || remoteBlocked || !kolejka.length || !navigator.onLine) return false;
    const ep = endpoint();
    if (!ep) return false;
    const batch = kolejka.slice(0, BATCH);
    wysylanie = true;
    try {
      const r = await fetch(ep.url, {
        method: 'POST',
        headers: {
          'apikey': ep.key,
          'Authorization': 'Bearer ' + ep.key,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(batch),
        keepalive: !!(opcje && opcje.keepalive)
      });
      if (!r.ok) {
        /* 404 = migracja jeszcze nie uruchomiona; 401/403 = polityka niegotowa.
           Nie bombardujemy backendu w tej sesji i nie gubimy kolejki. */
        if (r.status === 404 || r.status === 401 || r.status === 403) remoteBlocked = true;
        return false;
      }
      kolejka.splice(0, batch.length);
      saveQueue();
      if (kolejka.length) planFlush(250);
      return true;
    } catch (e) {
      return false;
    } finally {
      wysylanie = false;
    }
  }

  function planFlush(ms) {
    if (!WL || remoteBlocked) return;
    clearTimeout(timer);
    timer = setTimeout(() => { flush().catch(() => {}); }, ms == null ? FLUSH_MS : ms);
  }

  function stan() {
    return {
      enabled: WL, build: BUILD, install_id: installId, session_id: sessionId,
      wave_id: waveId, variant: waveVariant,
      queued: kolejka.length, remoteBlocked: remoteBlocked,
      stats: Object.assign({}, sessionStats),
      elapsed_s: Math.round((Date.now()-sessionStart)/1000)
    };
  }

  /* Klikniecia w panele mierzymy bez grzebania w ich logice. */
  document.addEventListener('click', e => {
    const b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b || !b.id) return;
    const mapa = {
      wiaderko: 'bucket_open',
      atlas: 'atlas_open',
      ekosystem: 'ecosystem_open',
      zadania: 'quest_open',
      reset: 'shoal_refresh'
    };
    if (mapa[b.id]) event(mapa[b.id]);
  }, true);

  window.addEventListener('online', () => { remoteBlocked = false; planFlush(250); });

  function checkpoint(label) {
    event('session_checkpoint', summaryPayload(label));
  }

  if (waveId !== 'organic') {
    setTimeout(() => onceSession('test_wave_joined', {
      wave_id:waveId,variant:waveVariant
    }), 20);
  }

  setTimeout(() => checkpoint('5m'), 5*60*1000);
  setTimeout(() => checkpoint('10m'), 10*60*1000);
  setTimeout(() => checkpoint('30m'), 30*60*1000);

  window.addEventListener('pagehide', () => {
    onceSession('session_summary', summaryPayload('pagehide'));
    onceSession('session_end', { duration_s: Math.round((Date.now() - sessionStart) / 1000) });
    flush({ keepalive: true }).catch(() => {});
  });

  /* Bledy: tylko nazwa/komunikat po obcieciu. Bez stacka i bez danych DOM. */
  window.addEventListener('error', e => {
    event('client_error', { kind: 'error', msg: String((e && e.message) || 'error').slice(0, 120) });
  });
  window.addEventListener('unhandledrejection', e => {
    let msg = 'promise';
    try { msg = String(e && e.reason && (e.reason.message || e.reason) || 'promise'); } catch (_) {}
    event('client_error', { kind: 'promise', msg: msg.slice(0, 120) });
  });

  setTimeout(() => {
    event('game_open', {
      screen: innerWidth <= 390 ? 'small' : (innerWidth <= 560 ? 'medium' : 'large'),
      confirmed: !!(window.Chmura && Chmura.pelnyDostep && Chmura.pelnyDostep()),
      wave_id: waveId,
      variant: waveVariant
    });
    flush().catch(() => {});
  }, 0);

  return {
    event, onceSession, flush, stan,
    wave:()=>({id:waveId,variant:waveVariant}),
    summary:()=>summaryPayload('live')
  };
})();
window.Telemetry = Telemetry;

/* ============================================================
   PRODUCT STAGE 1 — FIRST 30 MINUTES.
   Stan:
     0 pierwszy rzut
     1 pierwsza ryba
     2 decyzja karta: zatrzymaj / wypusc
     3 konsekwencja dla swiata
     4 odkrycie Wiadra
     5 odkrycie Atlasu
     6 odkrycie Ekosystemu
     7 nowa lawica
     8 maly cel: jeszcze jedna ryba
     9 domkniecie pierwszych krokow
    99 zakonczone

   MAX_ONB_STEP jest jedynym parametrem rozniacym buildy 1B..1G.
   ============================================================ */
const Onboarding = (() => {
  const WL = !!(window.Features && Features.is('onboardingV2'));
  const MAX_ONB_STEP = 9;
  const BUILD_SCOPE = '1G';
  const guide = document.getElementById('onbGuide');
  const karta = document.getElementById('onbKarta');
  const KEY = 'qryby.onboarding.stage1.v2';
  const KEY_LAST = 'qryby.onboarding.stage1.last.v2';
  const OLD_FIRST_CAST = 'qryby.onboarding.first_cast.v2';
  const FORCE = /(?:\?|&)onboarding=1(?:&|$)/.test(location.search);
  let step = -1;
  let booted = false;
  let timer = 0;
  let autoTimer = 0;
  let ostatnia = null;
  let shownKey = '';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k,v) { try { localStorage.setItem(k,String(v)); } catch (e) {} }
  function loadLast() {
    try { const x = JSON.parse(lsGet(KEY_LAST) || 'null'); return x && typeof x === 'object' ? x : null; }
    catch (e) { return null; }
  }
  function saveLast(x) {
    ostatnia = x || null;
    if (!FORCE) { try { localStorage.setItem(KEY_LAST, JSON.stringify(ostatnia)); } catch (e) {} }
  }
  function zapisz() { if (!FORCE && step >= 0) lsSet(KEY, step); }

  function statZlowien() {
    try { return Number(Zapis.dane().stat.zlowien || 0); } catch (e) { return 0; }
  }
  function mozeLowic() {
    try { return !!(window.Chmura && Chmura.pelnyDostep && Chmura.pelnyDostep()); }
    catch (e) { return false; }
  }

  function boot() {
    if (!WL || booted || !window.Zapis || !Zapis.dane) return false;
    if (!FORCE && !mozeLowic()) return false;
    booted = true;
    ostatnia = loadLast();

    if (FORCE) step = 0;
    else {
      const raw = lsGet(KEY);
      if (raw !== null && raw !== '') step = Math.max(0, Math.min(99, parseInt(raw,10) || 0));
      else if (statZlowien() > 0) step = 99;  /* stary gracz: bez tutorialu */
      else if (lsGet(OLD_FIRST_CAST) === '1') step = 1; /* migracja z 1A */
      else step = 0;
      zapisz();
    }
    render();
    return true;
  }

  function telemetry(nazwa, payload) {
    try { if (window.Telemetry) Telemetry.event(nazwa, Object.assign({ onb_step: step, scope: BUILD_SCOPE }, payload || {})); }
    catch (e) {}
  }

  function setStep(n, eventName, payload) {
    if (!WL) return;
    if (!booted && !boot()) return;
    if (n <= step && step !== 99) return;
    step = n;
    zapisz();
    shownKey = '';
    clearTimeout(autoTimer); autoTimer = 0;
    if (eventName) telemetry(eventName, payload);
    render();

    if (step === 3 && MAX_ONB_STEP >= 4) {
      autoTimer = setTimeout(() => setStep(4, 'onboarding_world_consequence_done'), 3400);
    } else if (step === 9 && MAX_ONB_STEP >= 9) {
      autoTimer = setTimeout(() => {
        step = 99; zapisz(); shownKey = ''; render();
        telemetry('onboarding_stage1_done');
      }, 3200);
    }
  }

  function target(id) {
    document.querySelectorAll('.onbCel').forEach(x => x.classList.remove('onbCel'));
    if (!id) return;
    document.querySelectorAll('[id="' + id + '"]').forEach(x => x.classList.add('onbCel'));
    if (id !== 'reset') {
      const mm = document.getElementById('menuMaster');
      if (mm) mm.classList.add('onbCel');
    }
  }
  function clearTarget() { document.querySelectorAll('.onbCel').forEach(x => x.classList.remove('onbCel')); }

  function html(el, duzy, maly) {
    if (!el) return;
    el.innerHTML = duzy + (maly ? '<small>' + maly + '</small>' : '');
    el.classList.add('on');
    el.setAttribute('aria-hidden','false');
  }
  function hide(el) {
    if (!el) return;
    el.classList.remove('on');
    el.setAttribute('aria-hidden','true');
  }
  function shown(key, evt) {
    if (shownKey === key) return;
    shownKey = key;
    if (evt) telemetry(evt);
  }

  function nazwaGat(gk) {
    try { return (GATUNKI[gk] && GATUNKI[gk].nazwa) || String(gk || '').toUpperCase(); }
    catch (e) { return String(gk || '').toUpperCase(); }
  }

  function render() {
    if (!WL) return;
    if (!booted && !boot()) return;
    hide(guide); hide(karta); clearTarget();
    if (step === 99) return;
    if (!mozeLowic() && !FORCE) return;

    if (step === 0 && MAX_ONB_STEP >= 0) {
      html(guide, 'DOTKNIJ WODY', 'zarzuć wędkę');
      shown('s0','onboarding_first_cast_shown');
      return;
    }

    if (step === 1 && MAX_ONB_STEP >= 1) {
      if (!window.G) return;
      const ph = G.phase || 'ready';
      if (ph === 'cast') {
        html(guide, 'PATRZ NA SPŁAWIK', 'zarzut leci sam');
      } else if (ph === 'drop') {
        html(guide, 'DOTKNIJ KRÓTKO', 'zatrzymaj haczyk na wybranej głębokości');
      } else if (ph === 'hang') {
        html(guide, 'CZEKAJ NA BRANIE', 'ryba podejdzie do przynęty');
      } else if (ph === 'fight' && G.hooked) {
        html(guide, 'PRZYTRZYMAJ', 'zwijaj · puść, gdy naprężenie robi się niebezpieczne');
      } else if (ph === 'fight') {
        html(guide, 'PRZYTRZYMAJ', 'zwiń zestaw i spróbuj ponownie');
      } else if (ph === 'land') {
        html(guide, 'MASZ JĄ', 'chwila…');
      } else if (!window.Card || !Card.open) {
        html(guide, 'SPRÓBUJ JESZCZE RAZ', 'dotknij wody');
      }
      shown('s1','onboarding_first_catch_guide_shown');
      return;
    }

    if (step === 2 && MAX_ONB_STEP >= 2) {
      if (window.Card && Card.open && Card.swipe && Card.czeka) {
        html(karta, '<strong>← WYPUSZCZ · ZATRZYMAJ →</strong>', 'przesuń kartę w wybraną stronę');
        shown('s2','onboarding_first_decision_shown');
      }
      return;
    }

    if (step === 3 && MAX_ONB_STEP >= 3) {
      if (window.Card && Card.open) return;
      const o = ostatnia || {};
      const g = nazwaGat(o.gat);
      if (o.kier === 'wiaderko') {
        const ile = Number.isFinite(o.pop) ? ' · zostało ' + o.pop : '';
