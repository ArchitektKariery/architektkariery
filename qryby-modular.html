<script>/* ============================================================
   SLADY NA WODZIE.

   Wspolna warstwa czastek dla zachowan ryb. Jedna tablica, jeden budzet,
   jedno rysowanie. Zachowanie gatunku tylko zglasza, co ma sie pojawic,
   i nie zna sposobu rysowania.

   Pierwszy klient: kilwater zagielnicy. Ryba idaca 400 px na sekunde pcha
   przed soba wode. Bez sladu wyglada jak sprite przesuwany po tle, ze
   sladem jak cos, co przez te wode faktycznie przeszlo.

   Czastka to prostokat o wlasnej szerokosci i wysokosci: babel jest
   kwadratem, smuga przy ogonie plaskim paskiem. Rysowane po calych
   pikselach, bez wygladzania, zeby nie rozjechac sie ze stylem gry.
   ============================================================ */
var SLADY = [];
var SLAD_BUDZET = 220;

/* b: 0 woda, 1 mul, 2 luski. Domyslnie woda, wiec stare wywolania
   dzialaja bez zmian. */
var SLAD_BARWY = [['206,230,244', '246,252,255'],   /* 0 woda */
                    ['118,96,66', '162,134,92'],      /* 1 mul */
                    ['214,222,232', '252,250,244'],   /* 2 luski */
                    ['138,26,34', '196,54,48'],       /* 3 czerwien */
                    ['176,196,206', '226,238,244']];  /* 4 oblok zamieszania */
function dodajSlad(x, y, rx, ry, vx, vy, zycie, moc, gr, b) {
  if (typeof SLADY === 'undefined' || !SLADY) return;
  if (SLADY.length >= SLAD_BUDZET) SLADY.shift();
  SLADY.push({ x: x, y: y, rx: rx, ry: ry, vx: vx, vy: vy,
               t: zycie, tMax: zycie, moc: moc, gr: gr, b: b || 0 });
}

/* Wybuch w chwili startu szarzy: wachlarz babli w tyl, plus dwa jezyki wody
   odrzucone w gore i w dol, tak jak przy ruszeniu z miejsca. */
function pryskSzarzy(f) {
  const dir = f.face || 1;
  const G2 = gat(f), w = G2.meta.w * f.s, h = G2.meta.h * (f.sy !== undefined ? f.sy : f.s);
  for (let i = 0; i < 20; i++) {
    const a = Math.PI + (Math.random() - 0.5) * 1.6;
    const v = 50 + Math.random() * 150;
    const r = 2 + Math.random() * 3;
    dodajSlad(f.x - dir * w * 0.30 + (Math.random() - 0.5) * w * 0.3,
              f.y + (Math.random() - 0.5) * h * 0.7, r, r,
              dir * Math.cos(a) * v, Math.sin(a) * v * 0.6,
              0.5 + Math.random() * 0.5, 0.9, 5);
  }
  for (const zn of [-1, 1]) {
    for (let i = 0; i < 5; i++) {
      const r = 2 + Math.random() * 2.5;
      dodajSlad(f.x - dir * w * (0.1 + i * 0.06), f.y + zn * h * (0.3 + i * 0.09), r, r,
                -dir * (30 + Math.random() * 50), zn * (16 + Math.random() * 28),
                0.5 + Math.random() * 0.4, 0.7, 5);
    }
  }
}

/* Ciagly kilwater. Dwie rzeczy naraz: jasna smuga tuz za ogonem, ktora zyje
   cwierc sekundy i trzyma sie linii ciala, oraz babelki rozchodzace sie
   stozkiem w tyl. Odstepy licza sie z predkosci, nie z klatki, wiec slad
   wyglada tak samo przy 60 i przy 30 klatkach. */
function sladSzarzy(f, dt) {
  const v = Math.abs(f.vx);
  if (v < 60) return;
  const dir = f.face || 1;
  const G2 = gat(f), w = G2.meta.w * f.s, h = G2.meta.h * (f.sy !== undefined ? f.sy : f.s);

  const odstep = Math.max(0.010, 4.2 / v);
  f.sladT = (f.sladT || 0) - dt;
  let ile = 0;
  while (f.sladT <= 0 && ile < 4) {
    f.sladT += odstep; ile++;
    const roz = (Math.random() - 0.5) * h * 0.5;
    const r = 1.6 + Math.random() * 2.6;
    dodajSlad(f.x - dir * w * (0.40 + Math.random() * 0.14), f.y + roz, r, r,
              -dir * (10 + Math.random() * 40) + f.vx * 0.10,
              roz * 2.4 + (Math.random() - 0.5) * 22,
              0.4 + Math.random() * 0.5, 0.55 + Math.min(0.4, v / 900), 3.6);
  }

  f.smugaT = (f.smugaT || 0) - dt;
  let ile2 = 0;
  while (f.smugaT <= 0 && ile2 < 3) {
    f.smugaT += 0.020; ile2++;
    dodajSlad(f.x - dir * w * 0.44, f.y + (Math.random() - 0.5) * h * 0.18,
              16 + Math.random() * 20, 2 + Math.random() * 2.5,
              f.vx * 0.16, (Math.random() - 0.5) * 8,
              0.24 + Math.random() * 0.16, 0.50, 10);
  }
}

function aktualizujSlady(dt) {
  if (typeof SLADY === 'undefined' || !SLADY) return;
  for (let i = SLADY.length - 1; i >= 0; i--) {
    const p = SLADY[i];
    p.t -= dt;
    if (p.t <= 0) { SLADY.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.12, dt);                   /* woda hamuje babel w ulamku sekundy */
    p.vy = p.vy * Math.pow(0.35, dt) - 26 * dt;   /* i wypycha go do gory */
    p.rx += p.gr * dt; p.ry += p.gr * dt * 0.8;
    /* Oblok zamieszania puchnie i traci moc wolniej niz babel, wiec
       zdazy zaslonic zdarzenie i dopiero potem odslania puste miejsce. */
    if (p.b === 4) { p.vx *= Math.pow(0.5, dt); p.vy *= Math.pow(0.5, dt); }
  }
}

function rysujSlady(g) {
  if (typeof SLADY === 'undefined' || !SLADY) return;
  for (const p of SLADY) {
    const u = p.t / p.tMax;
    const a = Math.min(1, u * u * 1.35) * p.moc;
    if (a <= 0.02) continue;
    const rx = Math.max(1, Math.round(p.rx)), ry = Math.max(1, Math.round(p.ry));
    const x = Math.round(p.x - rx / 2), y = Math.round(p.y - ry / 2);
    const B = SLAD_BARWY[p.b || 0];
    g.fillStyle = 'rgba(' + B[0] + ',' + (a * 0.5).toFixed(3) + ')';
    g.fillRect(x, y, rx, ry);
    if (rx > 2 && ry > 2) {
      g.fillStyle = 'rgba(' + B[1] + ',' + (a * 0.85).toFixed(3) + ')';
      g.fillRect(x + 1, y + 1, rx - 2, ry - 2);
    }
  }
}
window.SLADY = SLADY; window.rysujSlady = rysujSlady;

</script>

<script>/* ============================================================
   VISUAL AUDIT — STAGE 12 / CONTEXTUAL FX

   Zasada po rewalidacji Stage 1-10:
   EFEKT MA BYC WIDOCZNY, ALE TYLKO WTEDY, GDY SWIAT MA POWOD.

   Nie robimy stalej warstwy "particles".
   Cztery konkretne zdarzenia:

   1. SPLAWIK DOTYKA WODY
      istniejacy plusk/ringi zostaja; pod tafla pojawia sie krotka kieszen
      babelkow, jak powietrze wciagniete razem ze splawikiem.

   2. AKTYWNA ZANETA PRZY HACZYKU
      bardzo drobne okruszki pracuja w promieniu kilku px od przynety.
      Bez aktywnej zanety = zero tego efektu.

   3. BRANIE / ZACIECIE
      jeden krotki impuls cisnienia + kilka babelkow przy haczyku.
      Nie ma serca, blysku ani wykrzyknika.

   4. KONTAKT Z DNEM
      jesli zestaw faktycznie dochodzi do dna, podnosi sie maly oblok mulu.

   Budzet: max 96 czastek. Wszystkie sa pikselowe i gasna szybko.
   Zero zmian w mechanice polowu.
   ============================================================ */
const ContextFX = (() => {
  const MAX = 96;
  const P = [];
  let lastStage = '';
  let lastPhase = '';
  let baitClock = 0;
  let demoClock = 0;
  const FORCE = /(?:\?|&)fxlab=1(?:&|$)/.test(location.search);

  function push(p) {
    if (P.length >= MAX) P.shift();
    p.life = p.life || 1;
    p.max = p.life;
    P.push(p);
  }

  function splashPocket(x) {
    const y = Scene.SURFACE + 7;
    for (let i=0;i<10;i++) {
      push({
        type:'bubble',
        x:x + (Math.random()-.5)*22,
        y:y + Math.random()*16,
        vx:(Math.random()-.5)*12,
        vy:-(11+Math.random()*22),
        life:.45+Math.random()*.48,
        size:1+(Math.random()<.34?1:0)
      });
    }
  }

  function bitePulse(x,y) {
    /* Jedna fala cisnienia + kilka babelkow. */
    push({type:'pulse',x,y,life:.52,r:4,vr:38});
    for(let i=0;i<6;i++) {
      push({
        type:'bubble',
        x:x+(Math.random()-.5)*14,
        y:y+(Math.random()-.5)*8,
        vx:(Math.random()-.5)*16,
        vy:-(12+Math.random()*20),
        life:.38+Math.random()*.45,
        size:1+(Math.random()<.25?1:0)
      });
    }
  }

  function bottomSilt(x,y) {
    for(let i=0;i<13;i++) {
      push({
        type:'silt',
        x:x+(Math.random()-.5)*18,
        y:y-2+Math.random()*8,
        vx:(Math.random()-.5)*24,
        vy:-(4+Math.random()*16),
        life:.55+Math.random()*.70,
        size:1+(Math.random()<.45?1:0)
      });
    }
  }

  function baitCrumb(x,y) {
    push({
      type:'crumb',
      x:x+(Math.random()-.5)*10,
      y:y+(Math.random()-.5)*7,
      vx:(Math.random()-.5)*7,
      vy:3+Math.random()*8,
      life:.55+Math.random()*.45,
      size:1
    });
  }

  function surfaceRing(x) {
    push({type:'surfaceRing',x,y:Scene.SURFACE+2,life:.52,r:5,vr:44});
  }

  function baitActive() {
    try {
      return (typeof zanetaStan === 'function') ? !!zanetaStan() : false;
    } catch(e) { return false; }
  }

  function step(dt,t) {
    if (!window.G || !Number.isFinite(dt)) return;

    const stage = G.castStage || '';
    const phase = G.phase || '';

    /* 1. Lot -> plusk. */
    if (stage === 'plusk' && lastStage !== 'plusk') {
      const x=(G.castTo && Number.isFinite(G.castTo[0])) ? G.castTo[0] : G.hookX;
      splashPocket(x);
    }

    /* 2. Wejscie w fight = zaciecie / realny kontakt z ryba. */
    if (phase === 'fight' && lastPhase !== 'fight') {
      bitePulse(G.hookX,G.hookY);
      surfaceRing(G.hookX);
    }

    /* 3. Drop -> hang tuz nad dnem. Tylko prawdziwy kontakt z dolna strefa. */
    if (lastPhase === 'drop' && phase === 'hang' && G.hookY >= Scene.BED - 24) {
      bottomSilt(G.hookX,Math.min(Scene.BED-4,G.hookY+8));
    }

    /* 4. Zaneta: kilka okruszkow na sekunde, tylko przy zawisie/dropie. */
    baitClock -= dt;
    if ((phase === 'drop' || phase === 'hang') && baitActive() && baitClock <= 0) {
      baitCrumb(G.hookX,G.hookY);
      if (Math.random()<.35) baitCrumb(G.hookX,G.hookY);
      baitClock=.18+Math.random()*.16;
    }

    /* TEST / fxlab: co ~2.6 s pokazuje po jednym reprezentancie, ale tylko
       diagnostycznie. Produkcja nigdy nie emituje tego bez zdarzenia. */
    if (FORCE) {
      demoClock -= dt;
      if (demoClock<=0) {
        splashPocket(W*.38);
        bitePulse(W*.60,SURFACE+(BED-SURFACE)*.48);
        bottomSilt(W*.76,BED-7);
        for(let i=0;i<5;i++) baitCrumb(W*.47,SURFACE+(BED-SURFACE)*.63);
        demoClock=2.6;
      }
    }

    for(let i=P.length-1;i>=0;i--) {
      const p=P[i];
      p.life-=dt;
      if(p.life<=0){P.splice(i,1);continue;}

      if(p.type==='bubble') {
        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.vx*=Math.pow(.62,dt);
        p.vy-=8*dt;
        if(p.y<Scene.SURFACE+3) p.life=Math.min(p.life,.10);
      } else if(p.type==='crumb') {
        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.vx*=Math.pow(.40,dt);
        p.vy*=Math.pow(.72,dt);
      } else if(p.type==='silt') {
        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.vx*=Math.pow(.18,dt);
        p.vy*=Math.pow(.28,dt);
      } else if(p.type==='pulse' || p.type==='surfaceRing') {
        p.r+=p.vr*dt;
      }
    }

    lastStage=stage;
    lastPhase=phase;
  }

  function drawUnderwater(ctx,t) {
    ctx.save();
    for(const p of P) {
      if(p.type==='surfaceRing') continue;
      const q=clamp(p.life/p.max,0,1);

      if(p.type==='bubble') {
        ctx.globalAlpha=.20+.60*q;
        ctx.strokeStyle='rgba(226,240,250,.88)';
        ctx.lineWidth=1;
        const r=p.size+.35*(1-q);
        ctx.strokeRect(Math.round(p.x-r/2),Math.round(p.y-r/2),Math.max(1,Math.round(r)),Math.max(1,Math.round(r)));
      } else if(p.type==='crumb') {
        ctx.globalAlpha=.30+.50*q;
        ctx.fillStyle='#B79A63';
        ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);
      } else if(p.type==='silt') {
        ctx.globalAlpha=.10+.36*q;
        ctx.fillStyle='#796B57';
        ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);
      } else if(p.type==='pulse') {
        ctx.globalAlpha=.42*q;
        ctx.strokeStyle='rgba(208,228,238,.72)';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.ellipse(p.x,p.y,p.r,p.r*.34,0,0,TAU);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }

  function drawSurface(ctx,t) {
    ctx.save();
    for(const p of P) {
      if(p.type!=='surfaceRing') continue;
      const q=clamp(p.life/p.max,0,1);
      ctx.globalAlpha=.42*q;
      ctx.strokeStyle='rgba(245,240,236,.78)';
      ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.ellipse(p.x,p.y,p.r,p.r*.24,0,0,TAU);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }

  function audit(ctx) {
    const counts={};
    for(const p of P) counts[p.type]=(counts[p.type]||0)+1;
    ctx.save();
    ctx.fillStyle='rgba(8,10,18,.78)';
    ctx.fillRect(8,Scene.SURFACE+96,176,58);
    ctx.fillStyle='#F2DFB2';
    ctx.font='9px monospace';
    ctx.fillText('CONTEXT FX · '+P.length+'/'+MAX,16,Scene.SURFACE+111);
    ctx.fillText('BUB '+(counts.bubble||0)+'  CRUMB '+(counts.crumb||0),16,Scene.SURFACE+126);
    ctx.fillText('SILT '+(counts.silt||0)+'  PULSE '+(counts.pulse||0),16,Scene.SURFACE+140);
    ctx.restore();
  }

  function count(){ return P.length; }
  function clear(){ P.length=0; lastStage=''; lastPhase=''; baitClock=0; demoClock=0; }

  return { step, drawUnderwater, drawSurface, audit, count, clear,
           splashPocket, bitePulse, bottomSilt, baitCrumb };
})();
window.ContextFX=ContextFX;

</script>

<script>/* ============================================================
   CENNIK, WIADERKO I GIELDA HANDLARZY.

   Trzy rzeczy w jednym module, bo jedna bez drugiej nie ma sensu:
   cennik daje wartosc bazowa, wiaderko trzyma towar, gielda go kupuje.

   ZASADA NADRZEDNA GIELDY: handlarz ZAWSZE chce kupic taniej niz warte,
   ale boi sie, ze dobra ryba trafi do konkurenta. Dlatego mnoznik bazowy
   jest nizszy od jedynki u wiekszosci archetypow, a to, co go podnosi,
   to APETYT na trofeum -- im lepsza sztuka lezy w wiaderku, tym wyzej
   kazdy z nich licytuje, zeby zdazyc przed innymi.

   RYZYKO ODRZUCENIA stoi na dwoch przeciwnych silach:
     SWIEZOSC   spada co cykl (ryba lezy w wiaderku) -- kara za czekanie
     ROZGLOS    rosnie z kazda odrzucona oferta, ale TYLKO gdy w wiaderku
                jest trofeum -- wiesc niesie sie po targu i sciaga
                grubsze ryby handlarskie
   Bez trofeum czekanie jest czysta strata. Z trofeum oplaca sie
   poczekac kilka cykli, ale nie w nieskonczonosc. Tego wlasnie chcial
   wlasciciel: zeby warto bylo ryzykowac i zeby dalo sie stracic.
   ============================================================ */

/* NAPRAWA (IX 2026): stary CENNIK ("cena rynkowa w zl/kg, zrodla: PZW,
   gospodarstwa rybackie") usuniety w calosci -- byl to realny cennik
   pozagrowy, spisany raz i trzymany na sztywno per gatunek. Zastapiony
   przez STAWKA_TIER nizej (zalezna od KLASA, nie od realnej wagi rynkowej
   gatunku) -- pelne uzasadnienie w komentarzu przy wartoscRyby(). Sama
   idea "kazda ryba ma liczbe, nawet gatunki chronione" zostaje -- patrz
   CHRONIONE ponizej, ktora dalej tylko oznacza etykiete w UI i nie
   zmienila sie wcale. */


/* Gatunki bez legalnego obrotu w Polsce. Cena wyzej jest oszacowaniem,

/* Rzadkosc "1 na N ryb", liczona RAZ z sumy udzialow calego rejestru.
   Leniwa, bo GATUNKI musi byc juz w calosci wczytane. */
let _rzadkoscTab = null;
function rzadkoscGatunku(gk) {
  if (!_rzadkoscTab) {
    _rzadkoscTab = {};
    let suma = 0;
    for (const k in GATUNKI) if (!GATUNKI[k].zepsuty) suma += (GATUNKI[k].udzial || 0);
    for (const k in GATUNKI) {
      const u = GATUNKI[k].udzial || 0;
      _rzadkoscTab[k] = (u > 0) ? suma / u : 1;
    }
  }
  return _rzadkoscTab[gk] || 1;
}
window.rzadkoscGatunku = rzadkoscGatunku;

/* Typowa waga gatunku: waga przy dominancie dlugosci (modzie rozkladu
   logarytmiczno-normalnego), czyli przy sztuce, jaka wypada najczesciej.
   Ten sam wzor co w tierGatunku, zeby obie funkcje mowily o tej samej
   "przecietnej sztuce". Liczone raz na gatunek i zapamietane. */
const _typowaWagaTab = {};
function typowaWagaGatunku(gk) {
  if (_typowaWagaTab[gk] !== undefined) return _typowaWagaTab[gk];
  const G2 = GATUNKI[gk];
  if (!G2) return (_typowaWagaTab[gk] = 1);
  const dom = Math.exp(G2.mu - G2.sigma * G2.sigma);
  return (_typowaWagaTab[gk] = Math.max(1, Math.exp(G2.kMu) * Math.pow(dom, 3)));
}
window.typowaWagaGatunku = typowaWagaGatunku;

/* Mnoznik jakosci konkretnego okazu wzgledem WLASNEGO gatunku. Pkt idzie
   od 1 (najgorsze) do 70 (absolutny sufit mitycznych, patrz SUFIT_PASMA
   w 06) -- przy 0,6 + pkt/50 mnoznik biegnie od 0,62 (dno) przez 1,0
   (pkt=20, typowy przyzwoity polow) do 2,0 (pkt=70, rekord absolutny).
   Celowo LAGODNY (nie wykladniczy) -- to STAWKA_TIER ma robic ciezar
   rzadkosci gatunku, ten mnoznik tylko doprawia za jakosc SZTUKI. */
function mnoznikXScore(pkt) {
  return 0.6 + Math.max(1, Math.min(70, pkt || 1)) / 50;
}
window.mnoznikXScore = mnoznikXScore;

/* Wartosc bazowa jednej ryby: stawka rzadkosci gatunku razy pierwiastek
   z wagi razy jakosc konkretnej sztuki. Rzadkosc i rozmiar/gatunek/jakosc
   to trzy oddzielne osie -- zaden okaz nie wygrywa samym kilogramem, zaden
   gatunek nie przegrywa samym tym, ze naturalnie rosnie mniejszy. Reszta
   wplywu handlarza (apetyt na trofeum, tempo, rozglos) siedzi po stronie
   handlarza, tak jak wczesniej -- ta funkcja daje tylko punkt startowy. */
function wartoscRyby(r) {
  const gk = r.gat;
  /* WYKLADNIK 0,33 ZAMIAST PIERWIASTKA (IX 2026, zgloszenie Andrzeja
     "jest za grubo" -- wiaderko za 37 mln, glowacica za 3,6 mln za sztuke).
     Zakres rzadkosci to siedem rzedow wielkosci (1 na 5 do 1 na 71 mln).
     Pierwiastek (0,5) sciskal go do 3,5 rzedu, ale to wciaz za duzo:
     glowacica (1 na milion) dostawala mnoznik 1000, a ukleja 2,2 -- stad
     miliony za pojedyncza sztuke przy medianie rzedu tysiecy.
     0,33 sciska mocniej TAM, GDZIE TRZEBA: glowacica spada z 1000 do 100
     (dziesieciokrotnie), a ukleja z 2,24 do 1,71 (o jedna czwarta).
     Gora zbita, dol prawie nietkniety -- dokladnie to, o co chodzilo. */
  const stawka = BAZA_WYCENY * Math.pow(rzadkoscGatunku(gk), 0.33);
  const typ = typowaWagaGatunku(gk);
  const rozmiar = Math.max(0.55, Math.min(1.90, Math.sqrt(Math.max(0, r.waga || 0) / typ)));
  return stawka * rozmiar * mnoznikXScore(r.pkt);
}
window.wartoscRyby = wartoscRyby;

/* ============================================================
   TEMPO POLOWU.
   Im wiecej sztuk zlowiles w tym samym oknie oczekiwania (od ostatniej
   decyzji do nastepnej), tym lepiej wygladasz w oczach handlarza -- pelne
   wiaderko swieze z wody to towar kogos, kto naprawde lowi, nie kogos,
   kto wystawia jedna przypadkowa ryba. Skala 1-10 sztuk, bo tyle miesci
   wiaderko: jedna ryba to 0,65x, komplet dziesieciu to 1,40x. Licznik
   zeruje sie przy kazdej decyzji (sprzedaz albo odrzucenie), bo wtedy
   zaczyna sie nowe okno oczekiwania. */
function mnoznikTempa(ile) {
  const x = Math.max(1, Math.min(10, ile || 1));
  return 0.65 + 0.75 * (x - 1) / 9;
}
window.mnoznikTempa = mnoznikTempa;

/* Ile TEN handlarz placi za TA ryba. Rozbicie na sztuki jest potrzebne,
   bo panel pokazuje cene przy kazdej rybie osobno i porownuje ja ze
   srednia. Suma po wszystkich sztukach = oferta za cale wiaderko. */
function ofertaZaRybe(r, H, swiezosc, tempo) {
  const baza = wartoscRyby(r);
  /* Trofeum liczy sie od 25 punktow w gore i nasyca przy 60. Ponizej 25
     nikt nie doplaca -- drobnica to drobnica, nawet dla kolekcjonera. */
  const trof = Math.max(0, Math.min(1, ((r.pkt || 0) - 25) / 35));
  return baza * swiezosc * H.m * (1 + H.apetyt * trof) * (tempo || 1);
}
window.ofertaZaRybe = ofertaZaRybe;

/* Najlepsza sztuka w wiaderku. To ona sciaga na targ grubszych kupcow. */
function trofeumWiaderka(w) {
  let n = 0;
  for (const r of (w || [])) if ((r.pkt || 0) > n) n = r.pkt;
  return n;
}
window.trofeumWiaderka = trofeumWiaderka;

/* Losowanie handlarza. Rozglos przesuwa pule w strone premiowych, ale
   dziala TYLKO przy trofeum od 40 punktow: bez okazu nikt nie przyjedzie
   z drugiego konca targu, choćbys odrzucil dziesiec ofert. */
function losujHandlarza(rozglos, trofeum) {
  /* Sila rozglosu dobrana POMIAREM, nie na oko: przy 0.55 wiesc po targu
     nie nadazala za psuciem sie towaru i czekanie z trofeum wychodzilo
     na zero, czyli mechanika nie dawala po co ryzykowac. Przy 1.05
     srednia rosnie przez trzy cykle i dopiero potem opada -- jest wiec
     realne optimum do trafienia i realna kara za przetrzymanie. */
  const podbicie = (trofeum >= 40) ? (1 + rozglos * 1.05) : 1;
  const tlumienie = (trofeum >= 40) ? (1 + rozglos * 0.60) : 1;
  let suma = 0; const wagi = [];
  for (const H of HANDLARZE) {
    const w = H.premia ? H.waga * podbicie : H.waga / tlumienie;
    wagi.push(w); suma += w;
  }
  let x = Math.random() * suma;
  for (let i = 0; i < HANDLARZE.length; i++) { x -= wagi[i]; if (x <= 0) return HANDLARZE[i]; }
  return HANDLARZE[1];
}

/* Nowa oferta. Rzut kostka +-6 procent na wierzchu wszystkiego, zeby dwie
   wizyty tego samego archetypu nie byly identyczne. */
function nowaOferta() {
  const d = gieldaStan(); if (!d) return null;
  const w = d.wiaderko;
  if (!w.length) { d.gielda.oferta = null; return null; }
  const trof = trofeumWiaderka(w);
  const H = losujHandlarza(d.gielda.rozglos || 0, trof);
  /* Handlarz paczek: zero qryb na stole, zawsze paczka albo kupon.
     Osobna sciezka calkowicie, bo tu nie ma "cwiartki pigulki" do policzenia
     na sztuke -- albo dostajesz cala paczke za caly polow, albo nic
     nie zmienia sie w wiaderku i dostajesz tylko kupon. */
  if (H.paczka) {
    d.gielda.oferta = (trof >= 40)
      ? { h: H.id, typ: 'paczka', paczka: H.paczka, trofeum: trof }
      : { h: H.id, typ: 'kupon', rabat: H.rabat, trofeum: trof };
    return d.gielda.oferta;
  }
  const jitter = 0.94 + Math.random() * 0.12;
  const pozycje = w.map(r => Math.max(1, Math.round(ofertaZaRybe(r, H, d.gielda.swiezosc, mnoznikTempa(d.gielda.polow)) * jitter)));
  let suma = 0; for (const p of pozycje) suma += p;
  d.gielda.oferta = { h: H.id, typ: 'qryby', pozycje: pozycje, suma: suma, trofeum: trof };
  return d.gielda.oferta;
}
window.nowaOferta = nowaOferta;

/* Handlarz stoi przy wiaderku i widzi, co sie w nim zmienilo. Gdy w trakcie
   jego wizyty dojdzie albo zniknie ryba, przelicza WLASNA oferte tym samym
   apetytem, zamiast oddawac miejsce nowemu handlarzowi. Bez tego lista
   pozycji rozjechalaby sie z lista ryb i panel pokazywalby ceny nie tych
   sztuk, co trzeba. */
function przeliczOferte() {
  const d = gieldaStan(); if (!d || !d.gielda.oferta) return;
  const o = d.gielda.oferta;
  let H = null; for (const h of HANDLARZE) if (h.id === o.h) H = h;
  if (!H || !d.wiaderko.length) { d.gielda.oferta = null; return; }
  if (H.paczka) {
    /* Trofeum mogl zniknac (gracz wymienil albo wypuscil rybe), wiec
       przeliczamy TYP oferty od nowa, nie tylko kwote. */
    const trof = trofeumWiaderka(d.wiaderko);
    o.trofeum = trof;
    if (trof >= 40) { o.typ = 'paczka'; o.paczka = H.paczka; delete o.rabat; }
    else { o.typ = 'kupon'; o.rabat = H.rabat; delete o.paczka; }
    return;
  }
  const poz = d.wiaderko.map(r => Math.max(1, Math.round(ofertaZaRybe(r, H, d.gielda.swiezosc, mnoznikTempa(d.gielda.polow)))));
  let s = 0; for (const x of poz) s += x;
  o.pozycje = poz; o.suma = s; o.trofeum = trofeumWiaderka(d.wiaderko);
}
window.przeliczOferte = przeliczOferte;

/* ============================================================
   SREDNIA RYNKOWA.
   Liczona tak jak rekord spolecznosci: z FAKTYCZNYCH transakcji, nie
   z cennika. Cennik jest tylko ziarnem -- dopoki gatunek nie ma ani
   jednej sprzedazy, srednia rowna sie cenie katalogowej za kilogram.
   Kazda sprzedaz dosypuje sie do sredniej biegnacej, w zlotowkach za
   kilogram, zeby porownywac ryby roznej wielkosci.

   UWAGA NA PRZYSZLOSC: to jest srednia LOKALNA, z transakcji tego gracza.
   Zeby byla naprawde spoleczna, potrzebna jest tabela po stronie Chmury,
   tak samo jak przy rekordach swiata. Ksztalt danych jest juz na to
   przygotowany (slug -> {n, suma}), wiec podpiecie synchronizacji nie
   wymaga przebudowy niczego powyzej.
   ============================================================ */
/* NAPRAWA (IX 2026): fallback liczony teraz z tej samej STAWKA_TIER co
   wartoscRyby, zamiast z usunietego CENNIK. Nie probuje odtworzyc
   typowej wagi gatunku (to wymagaloby symulacji rozkladu dlugosci/kondycji
   w locie, kosztowne i niepotrzebne tutaj) -- to tylko ZIARNO poczatkowe,
   szybko przebijane przez prawdziwe transakcje (patrz wazenie 5:n ponizej).
   Mnoznik jakosci przy typowym, przyzwoitym polowie (10 pkt) daje sensowny
   punkt startowy bez zgadywania wagi. */
function sredniaRynkowa(slug) {
  const d = gieldaStan();
  const klasa = (window.KLASA && KLASA[slug]) || 1;
  const bazowa = (STAWKA_TIER[klasa] || STAWKA_TIER[1]) * mnoznikXScore(10);
  if (!d) return bazowa;
  const s = d.gielda.sprzedaze[slug];
  if (!s || !s.n) return bazowa;
  /* Ziarno wazone jak piec transakcji, zeby jedna dziwna sprzedaz nie
     wywracala sredniej do gory nogami. */
  return (bazowa * 5 + s.suma) / (5 + s.n);
}
window.sredniaRynkowa = sredniaRynkowa;

function zapiszSprzedaz(r, kwota) {
  const d = gieldaStan(); if (!d) return;
  const kg = Math.max(0.001, (r.waga || 0) / 1000);
  const zaKg = kwota / kg;
  const s = d.gielda.sprzedaze[r.gat] || (d.gielda.sprzedaze[r.gat] = { n: 0, suma: 0 });
  s.n++; s.suma += zaKg;
  if (s.n > 40) { s.suma = s.suma * 40 / s.n; s.n = 40; }   /* okno biegnace */
}

/* ============================================================
   WIADERKO.
   Pasmo 7 nigdy tu nie trafia: mityczne nie maja ceny rynkowej, wiec
   place od razu i nie zajmuja miejsca (patrz hak w karcie polowu).
   ============================================================ */
window.Wiaderko = {
  max: WIADERKO_MAX,
  lista() { const d = gieldaStan(); return d ? d.wiaderko : []; },
  ile() { return this.lista().length; },
  pelne() { return this.ile() >= WIADERKO_MAX; },
  dodaj(gat, cm, waga, pkt, plec) {
    const d = gieldaStan(); if (!d) return false;
    if (d.wiaderko.length >= WIADERKO_MAX) return false;
    /* PLEC ZAPAMIETANA RAZEM Z RYBA. Potrzebna przy wypuszczeniu:
       ryba wraca do populacji jako TA SAMA sztuka, wiec musi oddac
       swoja plec, a nie losowa. Stare zapisy nie maja tego pola --
       `wyrzuc` radzi sobie z ich brakiem. */
    d.wiaderko.push({ gat: gat, cm: cm, waga: waga, pkt: pkt,
                      plec: (plec === 'm' || plec === 'f') ? plec : null });
    /* Swieza ryba odrobine odswieza cale wiaderko, ale nigdy ponad 1. */
    d.gielda.swiezosc = Math.min(1, (d.gielda.swiezosc || 1) + 0.05);
    /* Tempo polowu: ile sztuk w TYM oknie oczekiwania. Zerowane przy kazdej
       decyzji (sprzedaz/odrzucenie), nie przy pustym wiaderku -- wypuszczenie
       ryby na wymiane nie oznacza nowego okna. */
    d.gielda.polow = (d.gielda.polow || 0) + 1;
    /* Pierwsza ryba uruchamia zegar handlarzy. */
    if (!d.gielda.nastepny && !d.gielda.oferta) d.gielda.nastepny = Date.now() + CYKL_HANDLARZA * 1000;
    przeliczOferte();
    Zapis.zapisz();
    /* Stan wiaderka NARAZ, nie suma wrzuconych ryb: zadanie na dziesiec
       sztuk wymaga dziesieciu w srodku jednoczesnie. */
    if (typeof Zadania !== 'undefined') Zadania.zdarzenie('wiadro', d.wiaderko.length);
    return true;
  },
  wyrzuc(i) {
    const d = gieldaStan(); if (!d) return;
    /* ============================================================
       RYBA WYPUSZCZONA Z WIADERKA WRACA DO POPULACJI (IX 2026).
       Roznica wobec wypuszczenia z KARTY jest zasadnicza i latwo ja
       pomylic: ryba z karty nigdy nie zostala z populacji odjeta, wiec
       `Eko.wypuszczono` slusznie nic nie robi. Ryba z wiaderka zostala
       odjeta w chwili zatrzymania (`Eko.zatrzymano` daje -1), wiec jej
       wypuszczenie MUSI oddac te sztuke, inaczej gracz kasuje ryby ze
       swiata samym otwieraniem i zamykaniem wiaderka.
       Plec oddajemy te sama, ktora ryba miala. Zapisy sprzed tej zmiany
       nie maja pola `plec` -- wtedy bierzemy plec ze skladu populacji,
       bo to jedyna uczciwa wartosc, jaka mamy. */
    const ryba = d.wiaderko[i];
    if (ryba && ryba.gat && window.Eko && Eko.zmien) {
      let pl = (ryba.plec === 'm' || ryba.plec === 'f') ? ryba.plec : null;
      if (!pl) { try { pl = Eko.losujPlec(ryba.gat); } catch (e) { pl = 'f'; } }
      try { Eko.zmien(ryba.gat, 1, pl, 'wypuszczona-z-wiaderka'); } catch (e) {}
    }
    d.wiaderko.splice(i, 1);
    if (!d.wiaderko.length) { d.gielda.oferta = null; d.gielda.rozglos = 0; d.gielda.swiezosc = 1; }
    else przeliczOferte();
    Zapis.zapisz();
  },
  wartosc() { let s = 0; for (const r of this.lista()) s += wartoscRyby(r); return s; },

  /* ============================================================
     WYMIANA: wiaderko pelne, nowa ryba czeka na decyzje gracza.
     Trzy kroki, trzy funkcje: zaproponuj (karta polowu, w chwili gdy
     dodaj() zawiedzie), wymien (gracz kliknal konkretna rybe w panelu --
     ta idzie precz, nowa wchodzi na jej miejsce), anuluj (gracz sie
     rozmyslil -- nowa ryba przepada, stare wiaderko zostaje bez zmian).
     Stan trzyma sie tutaj, nie w Zapisie: to decyzja W TRAKCIE, nie fakt
     o koncie, i nie ma sensu jej zapisywac miedzy sesjami. */
  _oczekujaca: null,
  zaproponujWymiane(gat, cm, waga, pkt, plec) { this._oczekujaca = { gat: gat, cm: cm, waga: waga, pkt: pkt, plec: plec || null }; },
  oczekujaca() { return this._oczekujaca; },
  anulujWymiane() { this._oczekujaca = null; },
  wymien(i) {
    if (!this._oczekujaca) return false;
    const o = this._oczekujaca;
    this._oczekujaca = null;
    this.wyrzuc(i);
    return this.dodaj(o.gat, o.cm, o.waga, o.pkt, o.plec);
  }
};

/* ============================================================
   GIELDA: zegar, przyjecie i odrzucenie oferty.
   ============================================================ */
window.Gielda = {
  /* ============================================================
     ZEGAR STOI, DOPOKI OFERTA CZEKA NA DECYZJE.
     Handlarz, ktory juz zlozyl oferte, nie odchodzi sam z siebie -- stoi
     przy wiaderku tak dlugo, az gracz przyjmie albo odrzuci. Dopiero
     decyzja odpala odliczanie do nastepnego. Inaczej najlepsza oferta
     w grze przepadalaby komus, kto akurat holowal rybe i nie patrzyl
     w ikone, a to jest kara za granie, nie za zla decyzje.
     ============================================================ */
  czekaNaDecyzje() { const d = gieldaStan(); return !!(d && d.wiaderko.length && d.gielda.oferta); },
  doNastepnego() {
    const d = gieldaStan(); if (!d || !d.wiaderko.length) return null;
    if (d.gielda.oferta) return null;              /* zegar stoi: trwa decyzja */
    if (!d.gielda.nastepny) return CYKL_HANDLARZA;
    return Math.max(0, Math.round((d.gielda.nastepny - Date.now()) / 1000));
  },
  oferta() { const d = gieldaStan(); return d ? d.gielda.oferta : null; },
  handlarz() {
    const o = this.oferta(); if (!o) return null;
    for (const H of HANDLARZE) if (H.id === o.h) return H;
    return null;
  },
  swiezosc() { const d = gieldaStan(); return d ? (d.gielda.swiezosc || 1) : 1; },
  rozglos() { const d = gieldaStan(); return d ? (d.gielda.rozglos || 0) : 0; },
  /* Ile sztuk zlowionych w biezacym oknie oczekiwania -- to wlasnie ta
     liczba steruje mnoznikiem tempa (patrz mnoznikTempa w tym pliku). */
  polow() { const d = gieldaStan(); return d ? (d.gielda.polow || 0) : 0; },
  /* Wolane z tykniecia HUD co pol sekundy. Zwraca true dokladnie w tej
     jednej klatce, w ktorej handlarz WLASNIE przyszedl -- HUD robi wtedy
     meldunek, wibracje i zapala wykrzyknik na ikonie. */
  tik() {
    const d = gieldaStan(); if (!d || !d.wiaderko.length) return false;
    if (d.gielda.oferta) return false;              /* czekamy na decyzje gracza */
    if (!d.gielda.nastepny) { d.gielda.nastepny = Date.now() + CYKL_HANDLARZA * 1000; return false; }
    if (Date.now() < d.gielda.nastepny) return false;
    nowaOferta();
    Zapis.zapisz();
    return true;
  },
  przyjmij() {
    const d = gieldaStan(); if (!d) return 0;
    const o = d.gielda.oferta; if (!o) return 0;
    /* Kupon: nic nie bierze z wiaderka (nie ma czym sie chwalic, wiec
       handlarz nie kupuje) -- tylko zostawia znizke i jedzie dalej.
       Zegar i tak startuje od nowa, jak po kazdej decyzji. */
    if (o.typ === 'kupon') {
      d.kupon = { rabat: o.rabat };
      d.gielda.oferta = null; d.gielda.nastepny = 0;
      Zapis.zapisz();
      return { typ: 'kupon', rabat: o.rabat };
    }
    if (!d.wiaderko.length) return 0;
    /* ============================================================
       MITYCZNA PLACI PRZY SPRZEDAZY (IX 2026). Odkad pasmo 7 wchodzi
       do wiaderka zwykla sciezka, `NAGRODA_MITYCZNA` nie ma juz gdzie
       sie wyplacic na karcie. Placi sie tutaj, doliczona do oferty
       handlarza: wybor "dziesiec milionow albo zycie gatunku" zostaje,
       tylko wymaga teraz slotu w wiaderku i doczekania handlarza.
       Liczone PRZED wyczyszczeniem listy, bo obie galezie nizej ja kasuja. */
    let bonusMit = 0;
    if (window.KLASA) {
      const stawka = window.NAGRODA_MITYCZNA || 10000000;
      for (const r of d.wiaderko) if (r && KLASA[r.gat] === 7) bonusMit += stawka;
    }
    if (bonusMit) {
      d.monety = (d.monety || 0) + bonusMit;
      if (typeof Ruch !== 'undefined' && Ruch.zaRekord) Ruch.zaRekord(bonusMit, ['MITYCZNA SPRZEDANA']);
    }
    if (o.typ === 'paczka') {
      for (const r of d.wiaderko) zapiszSprzedaz(r, 0);
      d.wiaderko = [];
      d.gielda.oferta = null; d.gielda.rozglos = 0; d.gielda.swiezosc = 1;
      d.gielda.nastepny = 0; d.gielda.polow = 0;
      Zapis.zapisz();
      return { typ: 'paczka', paczka: o.paczka };
    }
    for (let i = 0; i < d.wiaderko.length; i++) zapiszSprzedaz(d.wiaderko[i], o.pozycje[i] || 0);
    d.monety = (d.monety || 0) + o.suma;
    d.wiaderko = [];
    d.gielda.oferta = null; d.gielda.rozglos = 0; d.gielda.swiezosc = 1;
    d.gielda.nastepny = 0; d.gielda.polow = 0;
    Zapis.zapisz();
    /* Zadania gieldowe. 'sprzedaz' to POJEDYNCZA transakcja (liczy sie
       maksimum), 'utarg' to obrot calej doby (liczy sie suma). Oba ida
       z jednego miejsca, bo jest tylko jedno miejsce, w ktorym pieniadze
       naprawde wpadaja na konto. */
    if (typeof Zadania !== 'undefined') {
      Zadania.zdarzenie('sprzedaz', o.suma);
      Zadania.zdarzenie('utarg', o.suma);
    }
    return o.suma;
  },
  /* Odrzucenie jest KOSZTOWNE i nieodwracalne: oferta znika, towar traci
     swiezosc, a zegar rusza od nowa. Zysk z czekania moze przyjsc tylko
     z rozglosu, ktory buduje sie wylacznie przy trofeum od 40 punktow. */
  odrzuc() {
    const d = gieldaStan(); if (!d || !d.gielda.oferta) return;
    d.gielda.swiezosc = Math.max(0.5, (d.gielda.swiezosc || 1) * 0.93);
    if (trofeumWiaderka(d.wiaderko) >= 40)
      d.gielda.rozglos = Math.min(5, (d.gielda.rozglos || 0) + 1);
    d.gielda.oferta = null;
    d.gielda.nastepny = Date.now() + CYKL_HANDLARZA * 1000;
    d.gielda.polow = 0;
    Zapis.zapisz();
  }
};
/* ============================================================
   ZLECENIA HANDLARZY (IX 2026, zamowienie Andrzeja: "chcialbym zbudowac
   mechanike zeby gracz szukal konkretnych ryb i zeby ryzykowal").

   Handlarz przychodzi nie z oferta za wiaderko, tylko ze ZLECENIEM:
   "potrzebuje lipienia powyzej 41 punktow, masz 12 lawic, place 34 000".
   Zeby je przyjac, gracz wplaca KAUCJE z gory. Dostarczy w terminie --
   dostaje stawke i kaucje z powrotem. Nie dostarczy -- kaucja przepada.

   PO CO TO JEST, czyli czego nie robily poprzednie systemy:
     - zadania dobowe daja cel, ale nic nie kosztuja: odpuszczenie zadania
       jest darmowe, wiec nie ma decyzji, jest tylko lista
     - gielda daje pieniadze, ale nie mowi CZEGO szukac: lowisz, co wplynie
     - zlecenie robi oba naraz. Mowi gatunek i prog, wiec nagle zaneta
       pasmowa, pora dnia i glebokosc gatunku maja znaczenie taktyczne.
       I ma stawke, wiec odrzucenie zlecenia tez jest decyzja, a nie
       brakiem decyzji.

   TERMIN LICZONY W LAWICACH, Z TABELI PASM (LAWIC_PASMA nizej).
   Przeszedl droge: lawice -> zlowione ryby -> z powrotem lawice, i kazdy
   krok mial powod.
     lawice (v1)      zle, bo termin liczyl sie z prawdopodobienstwa i tylko
                      18 gatunkow dawalo sie zmiescic w rozsadnym oknie
     zlowione ryby    poprawialy rachunek, ale pula zwezila sie do 16
                      gatunkow, wiec problem zostal
     lawice z TABELI  termin nie wynika juz z rachunku, tylko z pasma
     (v3, obecne)     gatunku -- dzieki temu WSZYSTKIE gatunki moga trafic
                      na zlecenie, a rzadkosc przenosi sie z dopuszczenia
                      do STAWKI.
   Lawica idzie wylacznie z przycisku i tutaj to jest ZALETA: termin staje
   sie zasobem, ktory gracz zuzywa swiadomie, dokladnie jak zaneta.

   JAK LICZY SIE TRUDNOSC I STAWKA:
     p_gat    szansa, ze pojedyncza nowa ryba to TEN gatunek (z udzialu
              w populacji, ta sama liczba co w wycenie)
     p_prog   odsetek sztuk gatunku z co najmniej PROG punktow, MIERZONY
              z probki 400 losowan. Nie da sie go juz odczytac z percentyla,
              bo prog jest podnoszony do 35, jesli percentyl dal mniej.
     szansa   1 - exp(-lawic * POP.max * p_gat * p_prog), czyli realne
              prawdopodobienstwo, ze w calym terminie przeplynie choc jedna
              pasujaca sztuka. Im mniejsza, tym rzadziej takie zlecenie
              w ogole zostanie zaproponowane (wazenie s^WYKLADNIK_SZANSY).
     stawka   (lawice * PREMIA_LAWICY + wartosc okazu * UDZIAL) * poziom
              * trudnosc, gdzie trudnosc = 1/szansa przyciete do 40. Bez
              tego czlonu zlecenie na suma placiloby tyle co na plocie.
   ============================================================ */
const Zlecenia = (() => {
  /* ============================================================
     TERMIN Z TABELI PASM (IX 2026, decyzja Andrzeja: "wszystkie ryby,
     najwyzej na wyzsze pasmo wiecej lawic. Zamien czas 'ryb' na ilosc
     lawic. 100 na pasmo 6, 80 na 5, 60 na 4, 40 na 3, 20 na 2 i 10 na 1").

     To odwraca poprzedni rachunek i UPRASZCZA go radykalnie: termin nie
     wynika juz z prawdopodobienstwa, tylko z pasma gatunku. Dzieki temu
     na zlecenie moze trafic KAZDY gatunek, nie tylko te 18, ktore dawaly
     sie policzyc w rozsadnym terminie -- rzadkosc przestaje decydowac
     o dopuszczeniu i zaczyna decydowac o STAWCE.

     LAWICE, NIE RYBY, I TO JEST SWIADOME. Wczesniej odszedlem od lawic,
     bo `nowaLawica()` idzie wylacznie z przycisku, wiec termin nie tykal
     sam. Teraz to jest ZALETA: termin staje sie zasobem, ktory gracz
     zuzywa swiadomie, dokladnie jak zaneta. Gracz sam decyduje, kiedy
     spalic lawice na szukanie, a kiedy dolowic to, co juz plywa.
     ============================================================ */
  const LAWIC_PASMA = { 1: 10, 2: 20, 3: 40, 4: 60, 5: 80, 6: 100 };
  /* Prog punktowy NIGDY ponizej 35 (decyzja Andrzeja). Zlecenie ma dotyczyc
     okazu, nie pierwszej lepszej sztuki -- ponizej 35 punktow kazda ryba
     z lawicy zaliczalaby je przypadkiem. */
  const PROG_MIN = 35;
  const PROBKA = 400;             /* ile losowan punktow na wyznaczenie progu */
  /* Percentyl progu i mnoznik stawki, osobno na trzy poziomy trudnosci.
     Percentyl jest tylko PUNKTEM WYJSCIA -- faktyczny prog to
     max(PROG_MIN, percentyl), a szansa trafienia liczona jest potem
     z probki, bo po podniesieniu do 35 nie da sie jej juz odczytac
     z samego percentyla. */
  const POZIOMY = [
    { gwiazdki: 1, pct: 0.45, mnoznik: 1.00 },
    { gwiazdki: 2, pct: 0.75, mnoznik: 1.45 },
    { gwiazdki: 3, pct: 0.92, mnoznik: 2.20 }
  ];
  /* WSZYSTKIE 70 GATUNKOW SPOZA PASMA 7 MOGA TRAFIC NA ZLECENIE
     (IX 2026, uwaga Andrzeja: "39 gatunkow? a jest chyba 80 lacznie
     z pasmem 7").
     Wczesniej staly prog MIN_SZANSA odcinal wszystko ponizej 2% szansy.
     ZMIERZONE, ile gatunkow przepuszczal: 0,02 -> 44, 0,005 -> 58,
     0,001 -> 64, a dopiero 0 daje pelne 70.
     Prog zostal USUNIETY, bo po przejsciu na kaucje proporcjonalna do
     szansy przestal byc potrzebny do ochrony gracza: przy szansie
     mikroskopijnej kaucja tez jest mikroskopijna, wiec beznadziejne
     zlecenie nic nie kosztuje, a bilans zostaje dodatni z samej
     konstrukcji wzoru.
     Zostaje jedno realne ryzyko: zlecenie nie do wykonania blokuje jedyny
     slot na caly swoj termin. Dlatego zamiast twardego progu jest WAZENIE:
     zlecenie o szansie s przechodzi z prawdopodobienstwem s^WYKLADNIK.
     Przy 0,35 gatunek o szansie 50% wchodzi ok. 60 razy czesciej niz taki
     o szansie 0,001%, ale ten drugi NIE jest wykluczony -- moze sie trafic
     jako zlecenie zyciowe. */
  const WYKLADNIK_SZANSY = 1.6;
  /* Stawka ma trzy skladniki: czas (lawice), wartosc rynkowa okazu
     i TRUDNOSC. Trudnosc to odwrotnosc szansy powodzenia, przycieta do 40 --
     bez tego zlecenie na rzadki gatunek placiloby tyle samo co na plocie,
     mimo ze jest nieporownanie trudniejsze. */
  const PREMIA_LAWICY = 1400;
  const UDZIAL_WARTOSCI = 0.35;
  const TRUDNOSC_MAX = 4;

     "kaucja slabo bo ma ryzyko -- kaucja ma byc 30% nagrody i koniec").
     Poprzednie dwie wersje (staly procent 18%, potem proporcja do szansy
     z sufitem na stanie konta) probowaly gwarantowac, ze przyjecie zlecenia
     zawsze sie oplaca. To bylo wbrew sensowi mechaniki: jesli kazde
     zlecenie ma dodatni bilans, nie ma decyzji, jest tylko przycisk.
     Przy stalych 30% prog oplacalnosci wychodzi z nierownosci
        szansa * stawka > (1 - szansa) * 0,3 * stawka
     czyli szansa > 0,3/1,3 = 23,1%. Ponizej tego zlecenie jest ZLYM
     interesem i to jest zamierzone -- gracz ma je odrzucic.
     Dlatego okno propozycji POKAZUJE szanse: ryzyko ma byc widoczne,
     a nie ukryte w kodzie. Bez tej liczby gracz nie mialby jak podjac
     decyzji, o ktora tu chodzi. */
  const KAUCJA_UDZIAL = 0.30;
  /* ============================================================
     COOLDOWN PO ODMOWIE I PO ZAKONCZENIU (IX 2026, zgloszenie Andrzeja:
     "po odmowie zlecenia nastepne pojawia sie co lawice").
     Bez przerwy handlarz wracal przy najblizszym zdarzeniu, wiec odmowa
     nic nie znaczyla -- gracz odklikiwal kolejne oferty, az trafil na
     dobra. To kasowalo cala wage decyzji: skoro nastepna propozycja jest
     za chwile, odrzucenie slabego zlecenia nic nie kosztuje.
     Cooldown liczony w ZDARZENIACH (zlowiona ryba ALBO wymiana lawicy),
     bo na tych samych dwoch torach stoi wyzwalacz -- inaczej gracz
     omijalby przerwe, robiac to, czego akurat nie liczymy.
     Po zakonczeniu dluzej niz po odmowie: swiezo po oddanym albo

  /* ODSTEP WYDLUZONY DO OKOLO 30 LAWIC (IX 2026, zgloszenie Andrzeja:

     czeka.

     samych dwoch torach stoi wyzwalacz -- gdyby liczyc same lawice, gracz
     ktory tylko lowi nigdy by zlecenia nie dostal, a to juz raz sie
     zdarzylo i kosztowalo cala ture. Dla kogos, kto glownie przerzuca

     sztuk gatunku od nowa -- do 64 000 losowan na JEDNO zlecenie, liczone
     w watku UI. Probka zalezy wylacznie od gatunku, wiec liczymy ja RAZ
     i trzymamy. Rozklad punktow gatunku nie zmienia sie w trakcie gry.
     ============================================================ */
  const _probki = {};
  function probkaPunktow(gk, ile) {
    if (_probki[gk]) return _probki[gk];
    return (_probki[gk] = probkaPunktowLiczona(gk, ile));
  }
  function probkaPunktowLiczona(gk, ile) {
    const G2 = GATUNKI[gk]; const out = [];
    for (let i = 0; i < ile; i++) {
      const cm = losujCm(Math.random, gk);
      const kLog = losujKond(Math.random, gk);
      const waga = wagaZ(cm, kLog, gk);
      out.push({ pkt: XScore.punkty(gk, G2, cm, waga), waga: waga });
    }
    return out;
  }

  /* Czy z tego gatunku da sie w ogole zlozyc sensowne zlecenie.
     Mityczne (pasmo 7) odpadaja: placa od razu, nie ida do wiaderka,
     a termin na nie bylby setkami lawic. */
  function kandydat(gk) {
    const G2 = GATUNKI[gk];
    if (!G2 || G2.zepsuty) return false;
    if (((window.KLASA && KLASA[gk]) || 1) === 7) return false;
    return true;
  }

  function zbudujZlecenie() {
    if (typeof GATUNKI === 'undefined' || typeof XScore === 'undefined') return null;
    const klucze = Object.keys(GATUNKI).filter(kandydat);
    if (!klucze.length) return null;
    /* ============================================================
       WYBOR GATUNKU WAZONY KU RZADSZYM (IX 2026, po pierwszym benchmarku).
       Losowanie rowne po kluczach dawalo w kolko ukleje, kraпia i plocie --
       czyli dokladnie te ryby, ktorych gracz i tak ma pelne wiaderko.
       Zlecenie ma kierowac lowieniem, wiec ma wskazywac cos, po co trzeba
       sie pofatygowac.
       Waga = pierwiastek z rzadkosci, przyciety: szczupak (1 na 83) wypada
       ok. 4x czesciej niz ukleja (1 na 5), ale ukleja nie znika calkiem --
       latwe zlecenie na pospolita ryba tez ma prawo sie trafic.
       PULA JEST Z NATURY WASKA: zmierzone, tylko 18 gatunkow da sie
       dostarczyc w rozsadnym terminie. Nastepny w kolejce (bolen, 1 na
       2098) wymagalby 323 lawic przy najlatwiejszym progu. To ograniczenie

    const wagi = klucze.map(k => Math.min(12, Math.sqrt(
      window.rzadkoscGatunku ? rzadkoscGatunku(k) : 1)));
    const sumaWag = wagi.reduce((a, b) => a + b, 0);
    const losujKlucz = () => {
      let r = Math.random() * sumaWag;
      for (let i = 0; i < klucze.length; i++) { r -= wagi[i]; if (r <= 0) return klucze[i]; }
      return klucze[klucze.length - 1];
    };
    /* Kilka podejsc: gatunek moze wypasc zbyt trudny na swoj termin. */
    for (let proba = 0; proba < 160; proba++) {
      const gk = losujKlucz();
      const P = POZIOMY[Math.floor(Math.random() * POZIOMY.length)];
      const pasmo = Math.min(6, Math.max(1, (window.KLASA && KLASA[gk]) || 1));
      const lawic = LAWIC_PASMA[pasmo];
      if (!lawic) continue;

      const pr = probkaPunktow(gk, PROBKA);
      const pkty = pr.map(x => x.pkt).sort((a, b) => a - b);
      /* Prog: percentyl trudnosci, ale NIGDY ponizej PROG_MIN. */
      const zPct = pkty[Math.min(PROBKA - 1, Math.floor(PROBKA * P.pct))];
      const prog = Math.max(PROG_MIN, zPct);
      /* Szansa trafienia MIERZONA z probki -- po podniesieniu progu do 35
         nie da sie jej juz odczytac z percentyla. */
      const pas = pr.filter(x => x.pkt >= prog);
      const pProg = pas.length / PROBKA;
      if (pProg <= 0) continue;              /* gatunek nie dobija do 35 pkt */

      const pGat = 1 / (window.rzadkoscGatunku ? rzadkoscGatunku(gk) : 1);
      /* Oczekiwana liczba pasujacych sztuk w calym terminie. */
      const oczek = lawic * (window.POP ? POP.max : 25) * pGat * pProg;
      const szansa = 1 - Math.exp(-oczek);
      /* Wazenie zamiast twardego progu -- patrz komentarz przy
         WYKLADNIK_SZANSY. Im mniejsza szansa, tym rzadziej takie zlecenie
         w ogole zostanie zaproponowane. */
      if (Math.random() > Math.pow(szansa, WYKLADNIK_SZANSY)) continue;

      /* Typowa sztuka SPELNIAJACA prog -- ona wyznacza wartosc rynkowa. */
      const wzor = pas[Math.floor(pas.length / 2)];
      const wart = (typeof wartoscRyby === 'function')
        ? wartoscRyby({ gat: gk, waga: wzor.waga, pkt: wzor.pkt }) : 0;

      const trudnosc = Math.min(TRUDNOSC_MAX, 1 / szansa);
      /* SUFIT NA CZLON WARTOSCI (IX 2026, zgloszenie Andrzeja "i nagroda
         w milionach..."). `wart` to wartosc rynkowa okazu, a ta po
         przepisaniu wyceny rosnie z pierwiastkiem rzadkosci -- dla gatunku
         1 na 71 mln wychodzi ponad 8 mln za sztuke. Pomnozone przez poziom
         i trudnosc dawalo zlecenia na 130 mln qryb przy koncie gracza
         rzedu tysiecy. Czlon wartosci nie moze przebic czlonu czasu wiecej
         niz dwukrotnie: rzadkosc ma PODNOSIC stawke, a nie ja definiowac. */
      const zaCzas = lawic * PREMIA_LAWICY;
      const zaOkaz = Math.min(wart * UDZIAL_WARTOSCI, zaCzas * 2);
      const stawka = Math.round((zaCzas + zaOkaz) * P.mnoznik * trudnosc);
      const kaucja = Math.round(stawka * KAUCJA_UDZIAL);
      return { gat: gk, prog: prog, lawic: lawic, zostalo: lawic,
               stawka: stawka, kaucja: kaucja, gwiazdki: P.gwiazdki,
               /* Szansa w DZIESIATYCH procenta: przy zaokragleniu do pelnych
                  procent zlecenia ponizej 0,5% pokazywaly "0%", a kazdy
                  rachunek na tej liczbie (test bilansu, UI) wychodzil falszywie
                  ujemny. Kaucja liczy sie z wartosci niezaokraglonej. */
               szansa: Math.round(szansa * 1000) / 10, przyjete: false };
    }
    return null;
  }

  /* Propozycja czeka, az gracz zdecyduje. Jedna naraz. */
  function zaproponuj() {
    const D = d(); if (!D) return null;
    if (D.zlecenie || D.zlecenieOferta) return null;
    const z = zbudujZlecenie();
    if (!z) return null;
    D.zlecenieOferta = z;
    Zapis.zapisz();
    return z;
  }

  function przyjmij() {
    const D = d(); if (!D || !D.zlecenieOferta) return false;
    const z = D.zlecenieOferta;
    if ((D.monety || 0) < z.kaucja) return false;
    D.monety -= z.kaucja;
    z.przyjete = true;
    D.zlecenie = z; D.zlecenieOferta = null;
    Zapis.zapisz();
    return true;
  }

  function odrzuc() {
    const D = d(); if (!D) return false;
    D.zlecenieOferta = null;
    ustawCooldown(COOLDOWN_ODMOWA);
    Zapis.zapisz();
    return true;
  }

  /* Wolane przy KAZDEJ wymianie lawicy. Zerowy termin = kaucja przepada. */
  function lawicaMinela() {
    const D = d(); if (!D || !D.zlecenie) return null;
    const z = D.zlecenie;
    z.zostalo--;
    if (z.zostalo <= 0) {
      D.zlecenie = null;
      ustawCooldown(COOLDOWN_KONIEC);
      Zapis.zapisz();
      return { co: 'przepadlo', kaucja: z.kaucja, gat: z.gat };
    }
    Zapis.zapisz();
    return { co: 'tyka', zostalo: z.zostalo };

    const z = D.zlecenie;
    if (z.gat !== gk || pkt < z.prog) return null;
    const wyplata = z.stawka + z.kaucja;      /* stawka plus zwrot kaucji */
    D.monety = (D.monety || 0) + wyplata;
    D.zlecenie = null;
    ustawCooldown(COOLDOWN_KONIEC);
    Zapis.zapisz();
    return { co: 'wykonane', stawka: z.stawka, kaucja: z.kaucja, wyplata: wyplata, gat: gk };
  }

  function aktywne() { const D = d(); return D ? (D.zlecenie || null) : null; }
  function oferta()  { const D = d(); return D ? (D.zlecenieOferta || null) : null; }

  return { zaproponuj, przyjmij, odrzuc, lawicaMinela, zlowiono, aktywne, oferta,

      if (ostatnieZlowien < 0) { ostatnieZlowien = nz0; ostatnieLawic = nl0; return; }
      let ubylo = 0;
      if (nz0 !== ostatnieZlowien) { ubylo += Math.max(1, nz0 - ostatnieZlowien); ostatnieZlowien = nz0; }
      if (nl0 !== ostatnieLawic)  { ubylo += Math.max(1, nl0 - ostatnieLawic);  ostatnieLawic = nl0; }
      if (ubylo > 0) {
        D.zlecCooldown = Math.max(0, (D.zlecCooldown || 0) - ubylo);
        Zapis.zapisz();
      }
      return;
    }

    /* Gwarantowane pierwsze zlecenie w zyciu zapisu. */
    if (!D.zlecPierwsze && (st.zlowien || 0) >= RYB_NA_PIERWSZE
        && !Zlecenia.aktywne() && !Zlecenia.oferta()) {
      if (Zlecenia.zaproponuj()) {
        D.zlecPierwsze = 1; Zapis.zapisz(); pokazOferte();
      }
      return;
    }

    const nz = st.zlowien || 0;
    const nl = st.dobaOdswiezen || 0;
    if (ostatnieZlowien < 0) { ostatnieZlowien = nz; ostatnieLawic = nl; return; }
    let przyrost = 0;
    if (nz !== ostatnieZlowien) { przyrost += Math.max(1, nz - ostatnieZlowien); ostatnieZlowien = nz; }
    if (nl !== ostatnieLawic)  { przyrost += Math.max(1, nl - ostatnieLawic);  ostatnieLawic = nl; }
    if (przyrost > 0) sprobujZaproponowac(przyrost, false);
  }, 700);
})();
</script>
