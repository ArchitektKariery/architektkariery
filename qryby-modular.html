<script>/* ============================================================
   CENNIK, WIADERKO I GIELDA HANDLARZY.

   Trzy rzeczy w jednym module, bo jedna bez drugiej nie ma sensu:
   cennik daje wartosc bazowa, wiaderko trzyma towar, gielda go kupuje.

   ZASADA NADRZEDNA GIELDY: handlarz ZAWSZE chce kupic taniej niz warte,
   ale boi sie, ze dobra ryba trafi do konkurenta. Dlatego mnoznik bazowy
   jest nizszy od jedynki u wiekszosci archetypow, a to, co go podnosi,
   to APETYT na trofeum -- im lepsza sztuka lezy w wiaderku, tym wyzej
   kazdy z nich licytuje, zeby zdazyc przed innymi.

   RYZYKO ODRZUCENIA stoi na dwoch przeciwnych silach:
     SWIEZOSC   spada co cykl (ryba lezy w wiaderku) -- kara za czekanie
     ROZGLOS    rosnie z kazda odrzucona oferta, ale TYLKO gdy w wiaderku
                jest trofeum -- wiesc niesie sie po targu i sciaga
                grubsze ryby handlarskie
   Bez trofeum czekanie jest czysta strata. Z trofeum oplaca sie
   poczekac kilka cykli, ale nie w nieskonczonosc. Tego wlasnie chcial
   wlasciciel: zeby warto bylo ryzykowac i zeby dalo sie stracic.
   ============================================================ */

/* NAPRAWA (IX 2026): stary CENNIK ("cena rynkowa w zl/kg, zrodla: PZW,
   gospodarstwa rybackie") usuniety w calosci -- byl to realny cennik
   pozagrowy, spisany raz i trzymany na sztywno per gatunek. Zastapiony
   przez STAWKA_TIER nizej (zalezna od KLASA, nie od realnej wagi rynkowej
   gatunku) -- pelne uzasadnienie w komentarzu przy wartoscRyby(). Sama
   idea "kazda ryba ma liczbe, nawet gatunki chronione" zostaje -- patrz

const CHRONIONE = ['koza','piskorz','rozanka','sliz','brzanka','glowacz_bialopletwy',
  'glowacz_pregopletwy','kielb_bialopletwy','kielb_kesslera','koza_zlotawa',

const WIADERKO_MAX = 10;
const NAGRODA_PASMA7 = 700000;  /* mityczne nie ida do wiaderka, placa od razu.
                                    IX 2026: 100 000 -> 3 000 000 przy wyrownaniu
                                    ekonomii do serii. Typowa ryba idzie teraz za
                                    ok. 50 000, wiec stara stawka za MITYCZNA byla
                                    warta dwie zwykle plocie -- absurd, ktory wyszedl
                                    dopiero przy pomiarze po podwyzce. */
const CYKL_HANDLARZA = 300;      /* sekundy miedzy handlarzami */

function gieldaStan() {
  if (typeof Zapis === 'undefined') return null;
  const d = Zapis.dane();
  if (!d.wiaderko) d.wiaderko = [];
  if (!d.gielda) d.gielda = { swiezosc: 1, rozglos: 0, oferta: null, nastepny: 0, sprzedaze: {}, polow: 0 };
  if (!d.gielda.sprzedaze) d.gielda.sprzedaze = {};
  if (d.gielda.polow === undefined) d.gielda.polow = 0;
  return d;
}
window.gieldaStan = gieldaStan;

/* ============================================================
   NAPRAWA EKONOMII SPRZEDAZY (IX 2026, zgloszenie ze zrzutu ekranu:
   "SUMIK KARLOWATY dostaje -1" -- 36 pkt, 0,14 kg, sprzedany za 1 qryba).

   Stary CENNIK byl w zl/kg wprost z cennika PZW do wycen szkod: realna,
   pozagrowa wartosc rynkowa gatunku. To dawalo dokladnie zle wyniki
   w TEJ grze, bo realna cena ryby idzie z tego, jak duza rosnie i jak
   bardzo jest poszukiwana na talerz -- a rzadkosc W TEJ GgRZE (klasa
   1-7, ta sama co pasma w atlasie) to zupelnie inna oś. Sumik karlowaty
   to gatunek naturalnie drobny (dominanta 18 cm), wiec dostal niski
   zl/kg jak na targu rybnym -- ale w gre jest rzadszy niz wiekszosc
   pasma 1 i 2 (klasa 3, 1 sztuka na >1000 polowow), wiec ekonomia GRY
   powinna go cenic wyzej, nie nizej.

   Zasada, na wyrazne zyczenie: "nie moze byc ekonomia samej wielkosci...
   czym wyzszy xscore tym lepsza cena, ale plos xscore 50 i sumik xscore
   50 -- za sumika musi byc duzo wiecej, bo jest rzadszy w swoim gatunku.
   Rozmiar i zl/kg tylko per gatunek."

   Nowy wzor, trzy oddzielne czynniki:
     STAWKA_TIER[klasa]  -- zalezy WYLACZNIE od rzadkosci gatunku (KLASA,
                            ta sama tabela co zakladki atlasu), NIE od
                            typowej wielkosci gatunku. Jedna stawka na
                            cala klase, nie osobna liczba na gatunek --
                            koniec z przypadkowymi niespojnosciami starego
                            CENNIK (np. pstrag_teczowy=32 kontra
                            wegorz=120, oba klasa 3).
     sqrt(wagaKg)        -- "rozmiar... tylko per gatunek": WIEKSZA sztuka
                            TEGO SAMEGO gatunku placi wiecej, ale pierwiastek
                            zamiast surowej wagi, zeby naturalnie ciezkie
                            drapiezniki (barakuda, 15+ kg) nie zdominowaly
                            ceny samym kilogramem kosztem gatunkow drobnych
                            -- sprawdzone empirycznie (patrz test), surowa
                            waga dawala za rekordowa barakude ~43 tys. qryb,
                            ponad jedna trzecia najdrozszej paczki za JEDNA
                            rybe; z pierwiastkiem ~11 tys., wciaz duzo, ale
                            juz proporcjonalnie do reszty ekonomii.
     mnoznikXScore(pkt)  -- "czym wyzszy xscore tym lepsza cena": ta sama
                            konkretna sztuka placi wiecej, gdy jest dobrym
                            okazem WZGLEDEM WLASNEGO gatunku (X-Score jest
                            juz znormalizowany per gatunek), niezaleznie od
                            wagi -- kondycja, nie tylko rozmiar.

   Zweryfikowane empirycznie (nie na kartce) prawdziwym rozkladem wagi
   z silnika (losujCm+losujKond+wagaZ+XScore.punkty, po 40-60 tys. prob
   na punkt): przy TYM SAMYM X-Score=50 plos wazy realnie ~2,4 kg (bo dla
   plosi score 50 to niemal rekordowy okaz), sumik ~1,17 kg -- czyli plos
   jest tam NAWET CIEZSZY. Mimo to, dzieki temu, ze STAWKA_TIER[3] jest
   ok. 5,3x wieksza niz STAWKA_TIER[1], sumik i tak wychodzi ok. 3,7x
   drozszy niz plos przy identycznym wyniku -- rzadkosc gatunku wygrywa
   z waga, tak jak prosil wlasciciel.

   ZAROBKI x3,5: druga, osobna prosba z tej samej rozmowy -- "zarobki
   ze sklepu zrob 3,5 razy, bo sa za male". Sprawdzone symulacja 20 000
   POLOWOW WAZONYCH TAK SAMO JAK PRAWDZIWA GRA (kandydatRyby, nie rowno
   po gatunku) -- pierwsza probka stawek dala CALOSCIOWY stosunek nowej
   sumy do starej 3,00x, wiec caly stol przeskalowany o brakujacy czynnik
   (3,5/3,00=1,167x), zeby zarobek z typowej sesji lowienia (nie
   pojedynczej ryby, caly MIKS gatunkow) wyszedl tam, gdzie prosil
   wlasciciel. Nie jest to osobny mnoznik doklejony na koncu -- wliczony
   wprost w stawki, zeby nie trzeba bylo pamietac o dwoch osobnych
   czynnikach na raz. */
const STAWKA_TIER = { 1: 82, 2: 187, 3: 432, 4: 992, 5: 2275, 6: 5250, 7: 21000 };
window.STAWKA_TIER = STAWKA_TIER;

/* ============================================================
   PRZEPISANA WYCENA (IX 2026, zgloszenie Andrzeja: "zarobki sa za male
   i nie wszystkie ryby sa dobrze wyceniane").

   ZMIERZONY BLAD starego wzoru (`STAWKA_TIER[KLASA] * sqrt(wagaKg) *
   jakosc`), benchmark na prawdziwych rozkladach silnika, 4000 losowan
   na gatunek, wszystkie 81 gatunkow:
     MINOG UKRAINSKI  1 na 71 839 008 ryb  placil    238
     SZCZUPAK         1 na         83 ryb  placil    216
     -> gatunek 868 945x RZADSZY placil 1,1x tyle co szczupak
     KOZA ZLOTAWA     1 na    848 118      placila    77
     KARP             1 na        205      placil    232
     -> gatunek 4 135x rzadszy placil TRZY RAZY MNIEJ
     CIERNICZEK       1 na    214 676      placil     45  (mniej niz leszcz!)
     STRZEBLA BLOTNA  1 na    354 042      placila   111

   DWIE przyczyny, obie w starym wzorze:
   1. KLASA to zakladka ATLASU, nie realna rzadkosc. Minog ukrainski ma
      klase 5, barakuda tez klase 5 -- a jeden wypada 1 400 razy rzadziej
      od drugiego. Tabela na 7 pozycji nie odda zakresu, ktory w populacji
      rozciaga sie na SIEDEM RZEDOW wielkosci (1 na 5 do 1 na 71 mln).
   2. sqrt(wagaKg) to jedyny czlon ABSOLUTNY i kasowal male gatunki:
      minog ukrainski wazy 5 g -> sqrt(0,005)=0,071, czyli mnoznik 0,07,
      podczas gdy sum (5,8 kg) dostawal 2,41. Trzydziestokrotna roznica
      z samej wagi, ktora zjadala cala premie za rzadkosc.

   NOWY WZOR -- trzy osie, kazda mierzy co innego i zadna nie kasuje
   pozostalych:
     sqrt(rzadkosc)  rzadkosc liczona z FAKTYCZNEGO udzialu w populacji
                     ("1 na N ryb"), nie z zakladki atlasu. Pierwiastek,
                     bo zakres 7 rzedow wielkosci wprost dalby kwoty
                     nie do ogarniecia -- sqrt sciska go do ok. 3 rzedow.
     rozmiarWzgledny waga TEJ sztuki podzielona przez TYPOWA wage gatunku,
                     pod pierwiastkiem i przycieta do 0,55-1,90. Wiekszy
                     okaz tego samego gatunku dalej placi wiecej (o to
                     chodzilo w starym wzorze), ale gatunek nie przegrywa
                     juz samym tym, ze z natury rosnie maly.
     mnoznikXScore   bez zmian, jakosc sztuki wzgledem wlasnego gatunku.
   ============================================================ */
const BAZA_WYCENY = 1300;
window.BAZA_WYCENY = BAZA_WYCENY;

/* Rzadkosc "1 na N ryb", liczona RAZ z sumy udzialow calego rejestru.
   Leniwa, bo GATUNKI musi byc juz w calosci wczytane. */
let _rzadkoscTab = null;
function rzadkoscGatunku(gk) {
  if (!_rzadkoscTab) {
    _rzadkoscTab = {};
    let suma = 0;
    for (const k in GATUNKI) if (!GATUNKI[k].zepsuty) suma += (GATUNKI[k].udzial || 0);
    for (const k in GATUNKI) {
      const u = GATUNKI[k].udzial || 0;
      _rzadkoscTab[k] = (u > 0) ? suma / u : 1;
    }
  }
  return _rzadkoscTab[gk] || 1;
}
window.rzadkoscGatunku = rzadkoscGatunku;

/* Typowa waga gatunku: waga przy dominancie dlugosci (modzie rozkladu
   logarytmiczno-normalnego), czyli przy sztuce, jaka wypada najczesciej.
   Ten sam wzor co w tierGatunku, zeby obie funkcje mowily o tej samej
   "przecietnej sztuce". Liczone raz na gatunek i zapamietane. */
const _typowaWagaTab = {};
function typowaWagaGatunku(gk) {
  if (_typowaWagaTab[gk] !== undefined) return _typowaWagaTab[gk];
  const G2 = GATUNKI[gk];
  if (!G2) return (_typowaWagaTab[gk] = 1);
  const dom = Math.exp(G2.mu - G2.sigma * G2.sigma);
  return (_typowaWagaTab[gk] = Math.max(1, Math.exp(G2.kMu) * Math.pow(dom, 3)));
}
window.typowaWagaGatunku = typowaWagaGatunku;

/* Mnoznik jakosci konkretnego okazu wzgledem WLASNEGO gatunku. Pkt idzie
   od 1 (najgorsze) do 70 (absolutny sufit mitycznych, patrz SUFIT_PASMA
   w 06) -- przy 0,6 + pkt/50 mnoznik biegnie od 0,62 (dno) przez 1,0
   (pkt=20, typowy przyzwoity polow) do 2,0 (pkt=70, rekord absolutny).
   Celowo LAGODNY (nie wykladniczy) -- to STAWKA_TIER ma robic ciezar
   rzadkosci gatunku, ten mnoznik tylko doprawia za jakosc SZTUKI. */
function mnoznikXScore(pkt) {
  return 0.6 + Math.max(1, Math.min(70, pkt || 1)) / 50;
}
window.mnoznikXScore = mnoznikXScore;

/* Wartosc bazowa jednej ryby: stawka rzadkosci gatunku razy pierwiastek
   z wagi razy jakosc konkretnej sztuki. Rzadkosc i rozmiar/gatunek/jakosc
   to trzy oddzielne osie -- zaden okaz nie wygrywa samym kilogramem, zaden
   gatunek nie przegrywa samym tym, ze naturalnie rosnie mniejszy. Reszta
   wplywu handlarza (apetyt na trofeum, tempo, rozglos) siedzi po stronie
   handlarza, tak jak wczesniej -- ta funkcja daje tylko punkt startowy. */
function wartoscRyby(r) {
  const gk = r.gat;
  /* WYKLADNIK 0,33 ZAMIAST PIERWIASTKA (IX 2026, zgloszenie Andrzeja
     "jest za grubo" -- wiaderko za 37 mln, glowacica za 3,6 mln za sztuke).
     Zakres rzadkosci to siedem rzedow wielkosci (1 na 5 do 1 na 71 mln).
     Pierwiastek (0,5) sciskal go do 3,5 rzedu, ale to wciaz za duzo:
     glowacica (1 na milion) dostawala mnoznik 1000, a ukleja 2,2 -- stad
     miliony za pojedyncza sztuke przy medianie rzedu tysiecy.
     0,33 sciska mocniej TAM, GDZIE TRZEBA: glowacica spada z 1000 do 100
     (dziesieciokrotnie), a ukleja z 2,24 do 1,71 (o jedna czwarta).
     Gora zbita, dol prawie nietkniety -- dokladnie to, o co chodzilo. */
  const stawka = BAZA_WYCENY * Math.pow(rzadkoscGatunku(gk), 0.33);
  const typ = typowaWagaGatunku(gk);
  const rozmiar = Math.max(0.55, Math.min(1.90, Math.sqrt(Math.max(0, r.waga || 0) / typ)));
  return stawka * rozmiar * mnoznikXScore(r.pkt);
}
window.wartoscRyby = wartoscRyby;

/* ============================================================
   TEMPO POLOWU.
   Im wiecej sztuk zlowiles w tym samym oknie oczekiwania (od ostatniej
   decyzji do nastepnej), tym lepiej wygladasz w oczach handlarza -- pelne
   wiaderko swieze z wody to towar kogos, kto naprawde lowi, nie kogos,
   kto wystawia jedna przypadkowa ryba. Skala 1-10 sztuk, bo tyle miesci
   wiaderko: jedna ryba to 0,65x, komplet dziesieciu to 1,40x. Licznik
   zeruje sie przy kazdej decyzji (sprzedaz albo odrzucenie), bo wtedy
   zaczyna sie nowe okno oczekiwania. */
function mnoznikTempa(ile) {
  const x = Math.max(1, Math.min(10, ile || 1));
  return 0.65 + 0.75 * (x - 1) / 9;
}
window.mnoznikTempa = mnoznikTempa;

/* Ile TEN handlarz placi za TA ryba. Rozbicie na sztuki jest potrzebne,
   bo panel pokazuje cene przy kazdej rybie osobno i porownuje ja ze
   srednia. Suma po wszystkich sztukach = oferta za cale wiaderko. */
function ofertaZaRybe(r, H, swiezosc, tempo) {
  const baza = wartoscRyby(r);
  /* Trofeum liczy sie od 25 punktow w gore i nasyca przy 60. Ponizej 25
     nikt nie doplaca -- drobnica to drobnica, nawet dla kolekcjonera. */
  const trof = Math.max(0, Math.min(1, ((r.pkt || 0) - 25) / 35));
  return baza * swiezosc * H.m * (1 + H.apetyt * trof) * (tempo || 1);
}
window.ofertaZaRybe = ofertaZaRybe;

/* Najlepsza sztuka w wiaderku. To ona sciaga na targ grubszych kupcow. */
function trofeumWiaderka(w) {
  let n = 0;
  for (const r of (w || [])) if ((r.pkt || 0) > n) n = r.pkt;
  return n;
}
window.trofeumWiaderka = trofeumWiaderka;

/* Losowanie handlarza. Rozglos przesuwa pule w strone premiowych, ale
   dziala TYLKO przy trofeum od 40 punktow: bez okazu nikt nie przyjedzie
   z drugiego konca targu, choćbys odrzucil dziesiec ofert. */
function losujHandlarza(rozglos, trofeum) {
  /* Sila rozglosu dobrana POMIAREM, nie na oko: przy 0.55 wiesc po targu
     nie nadazala za psuciem sie towaru i czekanie z trofeum wychodzilo
     na zero, czyli mechanika nie dawala po co ryzykowac. Przy 1.05
     srednia rosnie przez trzy cykle i dopiero potem opada -- jest wiec
     realne optimum do trafienia i realna kara za przetrzymanie. */
  const podbicie = (trofeum >= 40) ? (1 + rozglos * 1.05) : 1;
  const tlumienie = (trofeum >= 40) ? (1 + rozglos * 0.60) : 1;
  let suma = 0; const wagi = [];
  for (const H of HANDLARZE) {
    const w = H.premia ? H.waga * podbicie : H.waga / tlumienie;
    wagi.push(w); suma += w;
  }
  let x = Math.random() * suma;
  for (let i = 0; i < HANDLARZE.length; i++) { x -= wagi[i]; if (x <= 0) return HANDLARZE[i]; }
  return HANDLARZE[1];
}

/* Nowa oferta. Rzut kostka +-6 procent na wierzchu wszystkiego, zeby dwie
   wizyty tego samego archetypu nie byly identyczne. */
function nowaOferta() {
  const d = gieldaStan(); if (!d) return null;
  const w = d.wiaderko;
  if (!w.length) { d.gielda.oferta = null; return null; }
  const trof = trofeumWiaderka(w);
  const H = losujHandlarza(d.gielda.rozglos || 0, trof);
  /* Handlarz paczek: zero qryb na stole, zawsze paczka albo kupon.
     Osobna sciezka calkowicie, bo tu nie ma "cwiartki pigulki" do policzenia
     na sztuke -- albo dostajesz cala paczke za caly polow, albo nic
     nie zmienia sie w wiaderku i dostajesz tylko kupon. */
  if (H.paczka) {
    d.gielda.oferta = (trof >= 40)
      ? { h: H.id, typ: 'paczka', paczka: H.paczka, trofeum: trof }
      : { h: H.id, typ: 'kupon', rabat: H.rabat, trofeum: trof };
    return d.gielda.oferta;
  }
  const jitter = 0.94 + Math.random() * 0.12;
  const pozycje = w.map(r => Math.max(1, Math.round(ofertaZaRybe(r, H, d.gielda.swiezosc, mnoznikTempa(d.gielda.polow)) * jitter)));
  let suma = 0; for (const p of pozycje) suma += p;
  d.gielda.oferta = { h: H.id, typ: 'qryby', pozycje: pozycje, suma: suma, trofeum: trof };
  return d.gielda.oferta;
}
window.nowaOferta = nowaOferta;

/* Handlarz stoi przy wiaderku i widzi, co sie w nim zmienilo. Gdy w trakcie
   jego wizyty dojdzie albo zniknie ryba, przelicza WLASNA oferte tym samym
   apetytem, zamiast oddawac miejsce nowemu handlarzowi. Bez tego lista
   pozycji rozjechalaby sie z lista ryb i panel pokazywalby ceny nie tych
   sztuk, co trzeba. */
function przeliczOferte() {
  const d = gieldaStan(); if (!d || !d.gielda.oferta) return;
  const o = d.gielda.oferta;
  let H = null; for (const h of HANDLARZE) if (h.id === o.h) H = h;
  if (!H || !d.wiaderko.length) { d.gielda.oferta = null; return; }
  if (H.paczka) {
    /* Trofeum mogl zniknac (gracz wymienil albo wypuscil rybe), wiec
       przeliczamy TYP oferty od nowa, nie tylko kwote. */
    const trof = trofeumWiaderka(d.wiaderko);
    o.trofeum = trof;
    if (trof >= 40) { o.typ = 'paczka'; o.paczka = H.paczka; delete o.rabat; }
    else { o.typ = 'kupon'; o.rabat = H.rabat; delete o.paczka; }
    return;
  }
  const poz = d.wiaderko.map(r => Math.max(1, Math.round(ofertaZaRybe(r, H, d.gielda.swiezosc, mnoznikTempa(d.gielda.polow)))));
  let s = 0; for (const x of poz) s += x;
  o.pozycje = poz; o.suma = s; o.trofeum = trofeumWiaderka(d.wiaderko);
}
window.przeliczOferte = przeliczOferte;

/* ============================================================
   SREDNIA RYNKOWA.
   Liczona tak jak rekord spolecznosci: z FAKTYCZNYCH transakcji, nie
   z cennika. Cennik jest tylko ziarnem -- dopoki gatunek nie ma ani
   jednej sprzedazy, srednia rowna sie cenie katalogowej za kilogram.
   Kazda sprzedaz dosypuje sie do sredniej biegnacej, w zlotowkach za
   kilogram, zeby porownywac ryby roznej wielkosci.

   UWAGA NA PRZYSZLOSC: to jest srednia LOKALNA, z transakcji tego gracza.
   Zeby byla naprawde spoleczna, potrzebna jest tabela po stronie Chmury,
   tak samo jak przy rekordach swiata. Ksztalt danych jest juz na to
   przygotowany (slug -> {n, suma}), wiec podpiecie synchronizacji nie
   wymaga przebudowy niczego powyzej.
   ============================================================ */
/* NAPRAWA (IX 2026): fallback liczony teraz z tej samej STAWKA_TIER co
   wartoscRyby, zamiast z usunietego CENNIK. Nie probuje odtworzyc
   typowej wagi gatunku (to wymagaloby symulacji rozkladu dlugosci/kondycji
   w locie, kosztowne i niepotrzebne tutaj) -- to tylko ZIARNO poczatkowe,
   szybko przebijane przez prawdziwe transakcje (patrz wazenie 5:n ponizej).
   Mnoznik jakosci przy typowym, przyzwoitym polowie (10 pkt) daje sensowny
   punkt startowy bez zgadywania wagi. */
function sredniaRynkowa(slug) {
  const d = gieldaStan();
  const klasa = (window.KLASA && KLASA[slug]) || 1;
  const bazowa = (STAWKA_TIER[klasa] || STAWKA_TIER[1]) * mnoznikXScore(10);
  if (!d) return bazowa;
  const s = d.gielda.sprzedaze[slug];
  if (!s || !s.n) return bazowa;
  /* Ziarno wazone jak piec transakcji, zeby jedna dziwna sprzedaz nie
     wywracala sredniej do gory nogami. */
  return (bazowa * 5 + s.suma) / (5 + s.n);
}
window.sredniaRynkowa = sredniaRynkowa;

function zapiszSprzedaz(r, kwota) {
  const d = gieldaStan(); if (!d) return;
  const kg = Math.max(0.001, (r.waga || 0) / 1000);
  const zaKg = kwota / kg;
  const s = d.gielda.sprzedaze[r.gat] || (d.gielda.sprzedaze[r.gat] = { n: 0, suma: 0 });
  s.n++; s.suma += zaKg;
  if (s.n > 40) { s.suma = s.suma * 40 / s.n; s.n = 40; }   /* okno biegnace */
}

/* ============================================================
   WIADERKO.
   Pasmo 7 nigdy tu nie trafia: mityczne nie maja ceny rynkowej, wiec
   place od razu i nie zajmuja miejsca (patrz hak w karcie polowu).
   ============================================================ */
window.Wiaderko = {
  max: WIADERKO_MAX,
  lista() { const d = gieldaStan(); return d ? d.wiaderko : []; },
  ile() { return this.lista().length; },
  pelne() { return this.ile() >= WIADERKO_MAX; },
  dodaj(gat, cm, waga, pkt, plec) {
    const d = gieldaStan(); if (!d) return false;
    if (d.wiaderko.length >= WIADERKO_MAX) return false;
    /* PLEC ZAPAMIETANA RAZEM Z RYBA. Potrzebna przy wypuszczeniu:
       ryba wraca do populacji jako TA SAMA sztuka, wiec musi oddac
       swoja plec, a nie losowa. Stare zapisy nie maja tego pola --
       `wyrzuc` radzi sobie z ich brakiem. */
    d.wiaderko.push({ gat: gat, cm: cm, waga: waga, pkt: pkt,
                      plec: (plec === 'm' || plec === 'f') ? plec : null });
    /* Swieza ryba odrobine odswieza cale wiaderko, ale nigdy ponad 1. */
    d.gielda.swiezosc = Math.min(1, (d.gielda.swiezosc || 1) + 0.05);
    /* Tempo polowu: ile sztuk w TYM oknie oczekiwania. Zerowane przy kazdej
       decyzji (sprzedaz/odrzucenie), nie przy pustym wiaderku -- wypuszczenie
       ryby na wymiane nie oznacza nowego okna. */
    d.gielda.polow = (d.gielda.polow || 0) + 1;
    /* Pierwsza ryba uruchamia zegar handlarzy. */
    if (!d.gielda.nastepny && !d.gielda.oferta) d.gielda.nastepny = Date.now() + CYKL_HANDLARZA * 1000;
    przeliczOferte();
    Zapis.zapisz();
    /* Stan wiaderka NARAZ, nie suma wrzuconych ryb: zadanie na dziesiec
       sztuk wymaga dziesieciu w srodku jednoczesnie. */
    if (typeof Zadania !== 'undefined') Zadania.zdarzenie('wiadro', d.wiaderko.length);
    return true;
  },
  wyrzuc(i) {
    const d = gieldaStan(); if (!d) return;
    /* ============================================================

    const losujKlucz = () => {
      let r = Math.random() * sumaWag;
      for (let i = 0; i < klucze.length; i++) { r -= wagi[i]; if (r <= 0) return klucze[i]; }
      return klucze[klucze.length - 1];
    };
    /* Kilka podejsc: gatunek moze wypasc zbyt trudny na swoj termin. */
    for (let proba = 0; proba < 160; proba++) {
      const gk = losujKlucz();
      const P = POZIOMY[Math.floor(Math.random() * POZIOMY.length)];
      const pasmo = Math.min(6, Math.max(1, (window.KLASA && KLASA[gk]) || 1));
      const lawic = LAWIC_PASMA[pasmo];
      if (!lawic) continue;

      const pr = probkaPunktow(gk, PROBKA);
      const pkty = pr.map(x => x.pkt).sort((a, b) => a - b);
      /* Prog: percentyl trudnosci, ale NIGDY ponizej PROG_MIN. */
      const zPct = pkty[Math.min(PROBKA - 1, Math.floor(PROBKA * P.pct))];
      const prog = Math.max(PROG_MIN, zPct);
      /* Szansa trafienia MIERZONA z probki -- po podniesieniu progu do 35
         nie da sie jej juz odczytac z percentyla. */
      const pas = pr.filter(x => x.pkt >= prog);
      const pProg = pas.length / PROBKA;
      if (pProg <= 0) continue;              /* gatunek nie dobija do 35 pkt */

      const pGat = 1 / (window.rzadkoscGatunku ? rzadkoscGatunku(gk) : 1);
      /* Oczekiwana liczba pasujacych sztuk w calym terminie. */
      const oczek = lawic * (window.POP ? POP.max : 25) * pGat * pProg;
      const szansa = 1 - Math.exp(-oczek);
      /* Wazenie zamiast twardego progu -- patrz komentarz przy
         WYKLADNIK_SZANSY. Im mniejsza szansa, tym rzadziej takie zlecenie
         w ogole zostanie zaproponowane. */
      if (Math.random() > Math.pow(szansa, WYKLADNIK_SZANSY)) continue;

      /* Typowa sztuka SPELNIAJACA prog -- ona wyznacza wartosc rynkowa. */
      const wzor = pas[Math.floor(pas.length / 2)];
      const wart = (typeof wartoscRyby === 'function')
        ? wartoscRyby({ gat: gk, waga: wzor.waga, pkt: wzor.pkt }) : 0;

      const trudnosc = Math.min(TRUDNOSC_MAX, 1 / szansa);
      /* SUFIT NA CZLON WARTOSCI (IX 2026, zgloszenie Andrzeja "i nagroda
         w milionach..."). `wart` to wartosc rynkowa okazu, a ta po
         przepisaniu wyceny rosnie z pierwiastkiem rzadkosci -- dla gatunku
         1 na 71 mln wychodzi ponad 8 mln za sztuke. Pomnozone przez poziom
         i trudnosc dawalo zlecenia na 130 mln qryb przy koncie gracza
         rzedu tysiecy. Czlon wartosci nie moze przebic czlonu czasu wiecej
         niz dwukrotnie: rzadkosc ma PODNOSIC stawke, a nie ja definiowac. */
      const zaCzas = lawic * PREMIA_LAWICY;
      const zaOkaz = Math.min(wart * UDZIAL_WARTOSCI, zaCzas * 2);
      const stawka = Math.round((zaCzas + zaOkaz) * P.mnoznik * trudnosc);
      const kaucja = Math.round(stawka * KAUCJA_UDZIAL);
      return { gat: gk, prog: prog, lawic: lawic, zostalo: lawic,
               stawka: stawka, kaucja: kaucja, gwiazdki: P.gwiazdki,
               /* Szansa w DZIESIATYCH procenta: przy zaokragleniu do pelnych
                  procent zlecenia ponizej 0,5% pokazywaly "0%", a kazdy
                  rachunek na tej liczbie (test bilansu, UI) wychodzil falszywie
                  ujemny. Kaucja liczy sie z wartosci niezaokraglonej. */
               szansa: Math.round(szansa * 1000) / 10, przyjete: false };
    }
    return null;
  }

  /* Propozycja czeka, az gracz zdecyduje. Jedna naraz. */
  function zaproponuj() {
    const D = d(); if (!D) return null;
    if (D.zlecenie || D.zlecenieOferta) return null;
    const z = zbudujZlecenie();
    if (!z) return null;
    D.zlecenieOferta = z;
    Zapis.zapisz();
    return z;
  }

  function przyjmij() {
    const D = d(); if (!D || !D.zlecenieOferta) return false;
    const z = D.zlecenieOferta;
    if ((D.monety || 0) < z.kaucja) return false;
    D.monety -= z.kaucja;
    z.przyjete = true;
    D.zlecenie = z; D.zlecenieOferta = null;
    Zapis.zapisz();
    return true;
  }

  function odrzuc() {
    const D = d(); if (!D) return false;
    D.zlecenieOferta = null;
    ustawCooldown(COOLDOWN_ODMOWA);
    Zapis.zapisz();
    return true;
  }

  /* Wolane przy KAZDEJ wymianie lawicy. Zerowy termin = kaucja przepada. */
  function lawicaMinela() {
    const D = d(); if (!D || !D.zlecenie) return null;
    const z = D.zlecenie;
    z.zostalo--;
    if (z.zostalo <= 0) {
      D.zlecenie = null;
      ustawCooldown(COOLDOWN_KONIEC);
      Zapis.zapisz();
      return { co: 'przepadlo', kaucja: z.kaucja, gat: z.gat };
    }
    Zapis.zapisz();
    return { co: 'tyka', zostalo: z.zostalo };
  }

  /* Wolane po kazdym zlowieniu. Ryba musi trafic w gatunek I w prog. */
  function zlowiono(gk, pkt) {
    const D = d(); if (!D || !D.zlecenie) return null;
    const z = D.zlecenie;
    if (z.gat !== gk || pkt < z.prog) return null;
    const wyplata = z.stawka + z.kaucja;      /* stawka plus zwrot kaucji */
    D.monety = (D.monety || 0) + wyplata;
    D.zlecenie = null;
    ustawCooldown(COOLDOWN_KONIEC);
    Zapis.zapisz();
    return { co: 'wykonane', stawka: z.stawka, kaucja: z.kaucja, wyplata: wyplata, gat: gk };
  }

  function aktywne() { const D = d(); return D ? (D.zlecenie || null) : null; }
  function oferta()  { const D = d(); return D ? (D.zlecenieOferta || null) : null; }

  return { zaproponuj, przyjmij, odrzuc, lawicaMinela, zlowiono, aktywne, oferta,
           zbudujZlecenie, KAUCJA_UDZIAL, LAWIC_PASMA, PROG_MIN,
           COOLDOWN_ODMOWA, COOLDOWN_KONIEC };
})();
window.Zlecenia = Zlecenia;

/* ============================================================
   UI ZLECEN. Dwa elementy, oba celowo poza panelem:
     #zlecenieOkno  propozycja z kaucja, pytanie z dwoma wyjsciami
     #zlecPasek     stale przypomnienie, czego szukasz i ile zostalo
   Pasek stoi na wierzchu sceny, bo cala mechanika stoi na tym, ze gracz
   PAMIETA, czego szuka -- gdyby trzeba bylo otwierac panel, zeby to
   sprawdzic, zlecenie przestaloby kierowac lowieniem.
   ============================================================ */
(function uiZlecen() {
  const okno = document.getElementById('zlecenieOkno');
  const tekst = document.getElementById('zlecTekst');
  const pasek = document.getElementById('zlecPasek');
  if (!okno || !pasek) return;

  function liczba(n) { return (n || 0).toLocaleString('pl-PL'); }

  function pokazOferte() {
    const z = Zlecenia.oferta();
    if (!z) { okno.classList.remove('on'); return; }
    const G2 = GATUNKI[z.gat];
    const gw = '\u2605'.repeat(z.gwiazdki) + '\u2606'.repeat(3 - z.gwiazdki);
    tekst.innerHTML =
      '<b>' + (G2 ? G2.nazwa : z.gat) + '</b><br>' +
      gw + '<br>' +
      'min. ' + z.prog + ' pkt<br>' +
      'termin: ' + z.lawic + ' ławic<br>' +
      'nagroda: <b>' + liczba(z.stawka) + '</b> qryb<br>' +
      /* Szansa MUSI byc widoczna: przy kaucji 30% zlecenie ponizej 23,1%
         szansy jest zlym interesem i gracz ma miec z czego to odczytac. */
      'szansa: <b>' + liczba(z.szansa).replace('.', ',') + '%</b>' +
      (z.szansa < 23.1 ? ' <span class="zle">ryzyko</span>' : '') +
      '<span class="kauc">KAUCJA ' + liczba(z.kaucja) +
      ' &mdash; przepada, jeśli nie zdążysz</span>';
    okno.classList.add('on');
  }
  function schowajOferte() { okno.classList.remove('on'); }

  function odswiezPowiadZlecenia() {
    const czeka = !!Zlecenia.oferta();
    const master = document.getElementById('masterJob');
    const mini = document.getElementById('zleceniaPowiad');
    const kafel = document.getElementById('zleceniaTablica');
    if (master) master.classList.toggle('on', czeka);
    if (mini) mini.classList.toggle('on', czeka);
    if (kafel) kafel.classList.toggle('ma-oferte', czeka);
    return czeka;
  }

  const tablicaBtn = document.getElementById('zleceniaTablica');
  if (tablicaBtn) {
    tablicaBtn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      if (window.zamknijMasterMenu) window.zamknijMasterMenu();
      if (!Zlecenia.oferta()) {
        schowajOferte();
        if (typeof Ruch !== 'undefined') Ruch.powiedz('BRAK NOWYCH OGŁOSZEŃ', false);
        return;
      }
      setTimeout(() => pokazOferte(), 0);
    });
  }

  document.getElementById('zlecTak').addEventListener('click', () => {
    const z = Zlecenia.oferta();
    if (!z) { schowajOferte(); return; }
    if (!Zlecenia.przyjmij()) {
      if (typeof Ruch !== 'undefined') Ruch.powiedz('ZA MAŁO NA KAUCJĘ', true);
      return;
    }
    schowajOferte(); odswiezPasek(); odswiezPowiadZlecenia();
    if (typeof Ruch !== 'undefined') Ruch.powiedz('ZLECENIE PRZYJĘTE', false);
  });
  document.getElementById('zlecNie').addEventListener('click', () => {
    Zlecenia.odrzuc(); schowajOferte(); odswiezPowiadZlecenia();
  });

  function odswiezPasek() {
    const z = Zlecenia.aktywne();
    if (!z) { pasek.classList.remove('on'); return; }
    const G2 = GATUNKI[z.gat];
    const malo = z.zostalo <= 5 ? ' malo' : '';
    /* Druga linia z kwotami (IX 2026, prosba Andrzeja: "zeby bylo widac
       jaka nagroda i ile kaucji, zeby nie zapominac"). Osobny wiersz,
       nie doklejenie do pierwszego: przy nazwie gatunku, progu i terminie
       jedna linia juz i tak siega krawedzi telefonu, a dwie kwoty
       wypchnelyby ja poza kadr. Kaucja na czerwono, bo to jedyna z tych
       liczb, ktora gracz TRACI, gdy nie zdazy. */
    pasek.innerHTML = 'ZLECENIE: ' + (G2 ? G2.nazwa : z.gat) + ' \u00B7 ' + z.prog +
      '+ PKT \u00B7 <span class="' + (malo ? 'malo' : '') + '">' + z.zostalo + ' ŁAWIC</span>' +
      '<span class="kwoty">NAGRODA ' + liczba(z.stawka) +
      ' \u00B7 KAUCJA <span class="malo">' + liczba(z.kaucja) + '</span></span>';
    pasek.classList.add('on');
  }
  window.__odswiezPasekZlecen = odswiezPasek;
  window.__pokazOferteZlecenia = pokazOferte;

  /* Odswiezanie co sekunde: pasek musi nadazac za licznikiem lawic,
     ktory tyka poza tym modulem. Sekunda wystarcza -- lawica zmienia sie
     najszybciej co kilkanascie sekund. */
  setInterval(() => {
    odswiezPasek();
    odswiezPowiadZlecenia();
  }, 1000);
  odswiezPasek();
  odswiezPowiadZlecenia();

  /* ============================================================
     KIEDY PRZYCHODZI PROPOZYCJA.
     DWIE POPRAWKI PO DRUGIM ZGLOSZENIU ("przerzucilem 200 lawic i 6 minut
     nie ma zlecenia"):
     1. PIERWSZE ZLECENIE JEST GWARANTOWANE. Mechanika, ktorej gracz nigdy
        nie zobaczyl, nie istnieje -- a przy 8% na ryba trafienie zalezalo
        od szczescia przez pierwsze kilkanascie minut. Teraz po trzeciej
        zlowionej rybie propozycja przychodzi NA PEWNO, raz na zapis
        (znacznik `zlecPierwsze` w zapisie). Dopiero potem wchodzi losowanie.
     2. DWA TORY WYZWALANIA: zlowione ryby ORAZ wymiany lawicy. Andrzej
        przerzucil 200 lawic i nie dostal nic, bo po naprawie terminu
        przeniolem wyzwalacz w calosci na zlowienia -- czyli z jednej
        skrajnosci w druga. Lawica zostaje jako DRUGI tor (sama nie moze
        byc terminem, patrz komentarz na gorze pliku, ale jako zaproszenie
        dziala dobrze: gracz, ktory szuka, ma dostawac propozycje czesciej).
     Szansa podniesiona z 8% do 25% na zdarzenie. Zlecenie i tak jest jedno
     naraz, wiec czesciej znaczy tylko "krocej czekasz na PIERWSZA decyzje",
     nie "wiecej zlecen w tle". */
  const SZANSA = 0.25;
  const RYB_NA_PIERWSZE = 3;
  let ostatnieZlowien = -1, ostatnieLawic = -1;

  function sprobujZaproponowac(przyrost, pewne) {
    if (Zlecenia.aktywne() || Zlecenia.oferta()) return;
    if (!pewne) {
      /* Szansa liczona na KAZDE zdarzenie z przyrostu, zeby przeoczony tik
         (karta otwarta, telefon w kieszeni) nie gubil propozycji. */
      if (Math.random() > 1 - Math.pow(1 - SZANSA, Math.max(1, przyrost))) return;
    }
    if (Zlecenia.zaproponuj()) odswiezPowiadZlecenia();
  }

  setInterval(() => {
    if (typeof Zapis === 'undefined') return;
    const D = Zapis.dane(); const st = D && D.stat;
    if (!st) return;

    const nz0 = st.zlowien || 0, nl0 = st.dobaOdswiezen || 0;

    /* Cooldown po odmowie albo po zakonczonym zleceniu: odliczamy go
       Z TYCH SAMYCH dwoch torow, na ktorych stoi wyzwalacz, i dopiero
       potem cokolwiek proponujemy. */
    if ((D.zlecCooldown || 0) > 0) {
      if (ostatnieZlowien < 0) { ostatnieZlowien = nz0; ostatnieLawic = nl0; return; }
      let ubylo = 0;
      if (nz0 !== ostatnieZlowien) { ubylo += Math.max(1, nz0 - ostatnieZlowien); ostatnieZlowien = nz0; }
      if (nl0 !== ostatnieLawic)  { ubylo += Math.max(1, nl0 - ostatnieLawic);  ostatnieLawic = nl0; }
      if (ubylo > 0) {
        D.zlecCooldown = Math.max(0, (D.zlecCooldown || 0) - ubylo);
        Zapis.zapisz();
      }
      return;
    }

    /* Gwarantowane pierwsze zlecenie w zyciu zapisu. */
    if (!D.zlecPierwsze && (st.zlowien || 0) >= RYB_NA_PIERWSZE
        && !Zlecenia.aktywne() && !Zlecenia.oferta()) {
      if (Zlecenia.zaproponuj()) {
        D.zlecPierwsze = 1; Zapis.zapisz(); pokazOferte();
      }
      return;
    }

    const nz = st.zlowien || 0;
    const nl = st.dobaOdswiezen || 0;
    if (ostatnieZlowien < 0) { ostatnieZlowien = nz; ostatnieLawic = nl; return; }
    let przyrost = 0;
    if (nz !== ostatnieZlowien) { przyrost += Math.max(1, nz - ostatnieZlowien); ostatnieZlowien = nz; }
    if (nl !== ostatnieLawic)  { przyrost += Math.max(1, nl - ostatnieLawic);  ostatnieLawic = nl; }
    if (przyrost > 0) sprobujZaproponowac(przyrost, false);
  }, 700);
})();
</script>

<script>/* ============================================================
   PRODUCT STAGE 2 — RYBA MA HISTORIE.
   TYLKO interpretacja istniejacych danych:
     - aktualna populacja gatunku,
     - udzial w calym jeziorze ("1 na N ryb"),
     - ostatni znany publiczny odlow z kroniki serwera.

   Nie zmienia spawnu, X-Score, ceny, populacji ani rekordow.
   Pospolite gatunki milcza — narracja pojawia sie tylko wtedy, gdy
   informacja ma emocjonalna wartosc.
   ============================================================ */
const RzadkoscNarracja = (() => {
  const WL = !!(window.Features && Features.is('rarityStory'));
  const FORCE = /(?:\?|&)rarity=1(?:&|$)/.test(location.search);

  function liczba(n) {
    return Math.max(0, Math.round(Number(n) || 0)).toLocaleString('pl-PL');
  }

  function wiekTekst(kiedy) {
    const t = new Date(kiedy).getTime();
    if (!isFinite(t)) return '';
    const ms = Math.max(0, Date.now() - t);
    const min = Math.floor(ms / 60000);
    if (min < 60) return min <= 1 ? 'PRZED CHWILĄ' : min + ' MIN TEMU';
    const h = Math.floor(min / 60);
    if (h < 24) return h === 1 ? '1 GODZ. TEMU' : h + ' GODZ. TEMU';
    const d = Math.floor(h / 24);
    if (d < 30) return d === 1 ? 'WCZORAJ' : d + ' DNI TEMU';
    const mies = Math.floor(d / 30);
    return mies === 1 ? '1 MIES. TEMU' : mies + ' MIES. TEMU';
  }

  function ostatniOdlow(gk) {
    try {
      if (!window.Eko || !Eko.Serwer || !Eko.Serwer.kronikaWspolna) return null;
      const k = Eko.Serwer.kronikaWspolna() || [];
      return k.find(x => x && x.gat === gk && x.typ === 'rzadka-zlowiona') || null;
    } catch (e) { return null; }
  }

  function surowe(gk) {
    if (!WL || !gk || !window.Eko) return null;
    let pop = 0, suma = 0;
    try {
      pop = Math.max(0, Number(Eko.populacja(gk)) || 0);
      suma = Math.max(0, Number(Eko.sumaPopulacji()) || 0);
    } catch (e) { return null; }

    const jedenNa = pop > 0 ? Math.max(1, Math.round(suma / pop)) : Infinity;
    const kron = ostatniOdlow(gk);

    /* Prog narracji:
       - <=100 sztuk: konkretna liczba zaczyna miec znaczenie sama w sobie,
       - 1 na >=500 ryb: gatunek jest na tyle rzadki w realnej populacji,
         ze gracz poczuje roznice,
       - FORCE tylko do wizualnego testu na telefonie. */
    const wazna = FORCE || pop <= 100 || jedenNa >= 500;
    if (!wazna) return null;

    let poziom = 1;
    if (pop <= 10 || jedenNa >= 10000) poziom = 3;
    else if (pop <= 50 || jedenNa >= 2500) poziom = 2;

    const linie = [];
    if (pop <= 100) {
      linie.push((pop <= 10 ? 'W JEZIORZE ZOSTAŁO ' : 'W JEZIORZE: ') + liczba(pop) + ' SZT.');
    }
    if (isFinite(jedenNa) && jedenNa >= 2) {
      linie.push('1 NA ' + liczba(jedenNa) + ' RYB W JEZIORZE');
    }
    if (kron && kron.kiedy) {
      const w = wiekTekst(kron.kiedy);
      if (w) linie.push('OSTATNIO ZABRANA: ' + w);
    }

    /* Maksymalnie dwie informacje na karcie. Priorytet:
       populacja -> ostatni odlow -> stosunek 1:N. */
    let out = [];
    if (pop <= 100) {
      out.push(linie[0]);
      const last = kron && kron.kiedy ? 'OSTATNIO ZABRANA: ' + wiekTekst(kron.kiedy) : '';
      if (last && !/:\s*$/.test(last)) out.push(last);
      else if (linie[1]) out.push(linie[1]);
    } else {
      if (linie[0]) out.push(linie[0]);
      const last = kron && kron.kiedy ? 'OSTATNIO ZABRANA: ' + wiekTekst(kron.kiedy) : '';
      if (last && !/:\s*$/.test(last)) out.push(last);
    }
    out = out.filter(Boolean).slice(0, 2);
    if (!out.length) return null;

    return { gat:gk, pop, suma, jedenNa, poziom, linie:out, maKronike:!!kron };
  }

  function dla(gk) { return surowe(gk); }

  function odswiezDlaKarty(gk) {
    if (!WL || !gk || !window.Card || !Card.open || !Card.data || Card.data.klucz !== gk) return;
    const przed = JSON.stringify(Card.historia || null);
    Card.historia = dla(gk);
    const po = JSON.stringify(Card.historia || null);
    if (przed !== po) {
      if (window.CardRaster) CardRaster.reset();
    }
  }

  function przygotujKarte(gk) {
    if (!WL || !gk || !window.Card) return;
    Card.historia = dla(gk);
    Card.historiaTelemetry = false;

    if (Card.historia && window.Telemetry) {
      try {
        Telemetry.event('rarity_story_shown', {
          species:gk,
          population:Card.historia.pop,
          one_in:Card.historia.jedenNa,
          level:Card.historia.poziom
        });
        Card.historiaTelemetry = true;
      } catch (e) {}
    }

    /* Kronika jest tylko dodatkiem. Najpierw karta pokazuje dane lokalne/
       zsynchronizowana populacje; publiczny odlow dochodzi asynchronicznie. */
    try {
      if (Eko.Serwer && Eko.Serwer.dostepny && Eko.Serwer.dostepny()) {
        Promise.resolve(Eko.Serwer.odswiezKronike(100)).then(() => {
          if (!Card.open || !Card.data || Card.data.klucz !== gk) return;
          const bylo = !!Card.historia;
          odswiezDlaKarty(gk);
          if (!bylo && Card.historia && window.Telemetry && !Card.historiaTelemetry) {
            Telemetry.event('rarity_story_shown', {
              species:gk,
              population:Card.historia.pop,
              one_in:Card.historia.jedenNa,
              level:Card.historia.poziom
            });
            Card.historiaTelemetry = true;
          }
        }).catch(() => {});
      }
    } catch (e) {}
  }

  return { dla, przygotujKarte, odswiezDlaKarty };
})();
window.RzadkoscNarracja = RzadkoscNarracja;

/* ============================================================
   PRODUCT STAGE 4 — SHARE CARD.
   PNG powstaje lokalnie na urzadzeniu. Nic nie jest uploadowane.
   ============================================================ */
const ShareCatch = (() => {
  const WL = !!(window.Features && Features.is('shareCard'));
  const btn = document.getElementById('shareCatch');
  const W = 1080, H = 1350;
  let busy = false;

  function roundRect(ctx,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }
  function fitText(ctx,txt,max,start,min){
    let s=start;
    while(s>min){ctx.font='900 '+s+'px monospace';if(ctx.measureText(txt).width<=max)break;s-=2;}
    return s;
  }
  function popInfo(gk){
    let pop=0,suma=0;
    try{pop=Math.max(0,Number(Eko.populacja(gk))||0);suma=Math.max(0,Number(Eko.sumaPopulacji())||0);}catch(e){}
    return {pop,suma,jedenNa:pop>0&&suma>0?Math.max(1,Math.round(suma/pop)):0};
  }
  function dane(){
    if(!window.Card||!Card.open||!Card.data)return null;
    const D=Card.data,gk=D.klucz||(D.fish&&D.fish.gat)||'';
    if(!gk||!window.GATUNKI||!GATUNKI[gk])return null;
    let pkt=0;try{pkt=XScore.punkty(gk,GATUNKI[gk],D.dl,D.waga);}catch(e){}
    const p=popInfo(gk);
    return {
      gk,nazwa:String(D.gatunek||GATUNKI[gk].nazwa||gk).toUpperCase(),
      cm:Number(D.dl)||0,waga:Number(D.waga)||0,pkt:Number(pkt)||0,
      tier:Number(D.pasmo||D.tier)||1,plec:Card.plec||'',historia:Card.historia||null,
      pop:p.pop,suma:p.suma,jedenNa:p.jedenNa,GS:GATUNKI[gk]
    };
  }
  function gradientTier(ctx,tier){
    const pal={
      1:['#15301C','#31583A'],
      2:['#15312E','#3E625B'],
      3:['#192B48','#405A82'],
      4:['#241B43','#594A82'],
      5:['#3A2813','#8B6828'],
      6:['#3B1F13','#9B5427'],
      7:['#32173E','#874E9D']
    };
    const p=pal[Math.max(1,Math.min(7,tier))]||pal[1],g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,p[0]);g.addColorStop(1,p[1]);return g;
  }
  function drawFish(ctx,d){
    const GS=d.GS;if(!GS||!GS.img||!GS.meta)return;
    const F=GS.meta,box={x:115,y:300,w:850,h:475};
    const sc=Math.min(box.w/F.w,box.h/F.h)*.88,fw=F.w*sc,fh=F.h*sc;
    ctx.save();ctx.globalAlpha=.98;ctx.imageSmoothingEnabled=false;
    ctx.drawImage(GS.img,0,0,F.w,F.h,box.x+(box.w-fw)/2,box.y+(box.h-fh)/2,fw,fh);
    ctx.restore();
  }
  function linia(ctx,label,value,x,y,w){
    ctx.textAlign='left';ctx.fillStyle='rgba(244,230,194,.52)';ctx.font='800 23px monospace';ctx.fillText(label,x,y);
    let fs=36;ctx.fillStyle='#F4E6C2';ctx.font='900 '+fs+'px monospace';
    while(fs>24&&ctx.measureText(value).width>w){fs-=2;ctx.font='900 '+fs+'px monospace';}
    ctx.fillText(value,x,y+43);
  }
  async function canvas(){
    const d=dane();if(!d)throw new Error('brak karty');
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
    c.fillStyle=gradientTier(c,d.tier);c.fillRect(0,0,W,H);

    const water=c.createLinearGradient(0,270,0,820);
    water.addColorStop(0,'rgba(104,177,187,.18)');water.addColorStop(1,'rgba(24,58,77,.07)');
    c.fillStyle=water;c.fillRect(55,260,W-110,575);

    const supportStyle=(window.Monetization&&Monetization.style)?Monetization.style():null;
    c.strokeStyle=supportStyle?supportStyle.frame:'rgba(244,198,61,.54)';
    c.lineWidth=supportStyle?6:4;roundRect(c,42,42,W-84,H-84,26);c.stroke();
    c.strokeStyle=supportStyle?supportStyle.accent:'rgba(244,230,194,.12)';
    c.globalAlpha=supportStyle?.30:1;c.lineWidth=1;roundRect(c,58,58,W-116,H-116,20);c.stroke();c.globalAlpha=1;

    c.textAlign='center';c.fillStyle='rgba(244,230,194,.68)';c.font='800 25px monospace';
    c.fillText('QRyby · ZŁOWIONY OKAZ',W/2,112);

    const fs=fitText(c,d.nazwa,880,62,34);
    c.fillStyle='#F4E6C2';c.font='900 '+fs+'px monospace';c.fillText(d.nazwa,W/2,200);

    if(d.plec==='m'||d.plec==='f'){
      c.fillStyle='rgba(244,230,194,.58)';c.font='800 24px monospace';
      c.fillText(d.plec==='m'?'SAMIEC':'SAMICA',W/2,242);
    }

    drawFish(c,d);

    c.fillStyle='rgba(8,7,16,.30)';roundRect(c,90,800,W-180,330,22);c.fill();
    c.strokeStyle='rgba(244,230,194,.12)';c.lineWidth=2;roundRect(c,90,800,W-180,330,22);c.stroke();

    linia(c,'DŁUGOŚĆ',(d.cm/100).toFixed(2).replace('.',',')+' M',135,865,300);
    linia(c,'WAGA',(d.waga/1000).toFixed(2).replace('.',',')+' KG',575,865,320);
    linia(c,'X-SCORE',String(d.pkt)+' PKT',135,985,300);
    linia(c,'W JEZIORZE',d.pop.toLocaleString('pl-PL')+' SZT.',575,985,320);

    let context='';
    if(d.historia&&d.historia.linie&&d.historia.linie[0])context=d.historia.linie[0];
    else if(d.jedenNa>1)context='1 NA '+d.jedenNa.toLocaleString('pl-PL')+' RYB W JEZIORZE';

    if(context){
      c.fillStyle='rgba(244,198,61,.82)';c.font='900 25px monospace';c.textAlign='center';c.fillText(context,W/2,1188);
    }

    c.fillStyle='rgba(244,230,194,.48)';c.font='700 20px monospace';
    c.fillText('Nie z generatora. Z żyjącego wspólnego jeziora.',W/2,1250);
    c.fillStyle='rgba(244,198,61,.72)';c.font='900 25px monospace';c.fillText('QRYBY',W/2,1295);
    if(supportStyle){
      c.textAlign='right';c.fillStyle=supportStyle.accent;c.font='900 17px monospace';
      c.fillText('◆ '+supportStyle.label,W-78,1295);
    }

    return {cv,d};
  }
  function toBlob(cv){return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('png')),'image/png'));}
  function filename(d){return 'QRyby_'+String(d.gk||'ryba').replace(/[^a-z0-9_-]/gi,'_').slice(0,32)+'_'+Math.round(d.pkt||0)+'pkt.png';}

  async function fallback(blob,d){
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename(d);document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),12000);
    try{if(window.Ruch)Ruch.powiedz('KARTA ZAPISANA · MOŻESZ JĄ UDOSTĘPNIĆ',false);}catch(e){}
    try{if(window.Telemetry)Telemetry.event('share_fallback_saved',{species:d.gk,score:d.pkt});}catch(e){}
  }

  async function share(){
    if(!WL||busy)return;
    if(window.Progression&&!Progression.dostep('share')){Progression.blocked('share');return;}
    const d0=dane();if(!d0)return;
    busy=true;document.body.classList.add('share-catch-busy');
    try{
      if(window.Telemetry)Telemetry.event('share_invoked',{species:d0.gk,score:d0.pkt});
      const pack=await canvas(),blob=await toBlob(pack.cv);
      if(window.Telemetry)Telemetry.event('share_created',{species:pack.d.gk,score:pack.d.pkt});
      const file=new File([blob],filename(pack.d),{type:'image/png'});
      if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
        try{
          await navigator.share({files:[file],title:'QRyby — '+pack.d.nazwa,text:pack.d.nazwa+' · '+pack.d.pkt+' pkt'});
          if(window.Telemetry)Telemetry.event('share_completed',{species:pack.d.gk,score:pack.d.pkt});
        }catch(e){
          if(e&&(e.name==='AbortError'||e.name==='NotAllowedError')){
            if(window.Telemetry)Telemetry.event('share_cancelled',{species:pack.d.gk});
          }else await fallback(blob,pack.d);
        }
      }else await fallback(blob,pack.d);
    }catch(e){
      try{if(window.Ruch)Ruch.powiedz('NIE UDAŁO SIĘ UTWORZYĆ KARTY',true);}catch(_){}
      try{if(window.Telemetry)Telemetry.event('share_error',{msg:String(e&&e.message||e).slice(0,80)});}catch(_){}
    }finally{
      busy=false;document.body.classList.remove('share-catch-busy');
    }
  }

  function update(){
    if(!WL||!btn)return;
    const karta=!!(window.Card&&Card.open&&Card.data&&Card.t>=.82&&!Card.ciagniemy&&!Card.decyzja);
    let onboarding=false;try{onboarding=!!(window.Onboarding&&Onboarding.aktywny&&Onboarding.aktywny());}catch(e){}
    const progOK=!window.Progression||Progression.dostep('share');
    document.body.classList.toggle('share-catch-ready',karta&&!onboarding&&!busy&&progOK);
  }

  if(btn)btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();share();});
  if(WL)setInterval(update,180);

  return {share,canvas,update};
})();
window.ShareCatch=ShareCatch;



/* ============================================================
   PRODUCT STAGE 7 — RETURN DIGEST.
   "Co wydarzylo sie, gdy Cie nie bylo?"

   - zero nagrody za logowanie,
   - zero sztucznego FOMO,
   - maksymalnie 3 realne wydarzenia,
   - jesli nic waznego sie nie wydarzylo: cisza.

   Snapshot poprzedniej sesji jest lokalny, ale porownanie robi sie
   z aktualnym, wspolnym stanem Eko.Serwer oraz eko_kronika.
   ============================================================ */
const ReturnDigest = (() => {
  const WL = !!(window.Features && Features.is('returnDigest'));
  const TEST = /(?:\?|&)returndigest=1(?:&|$)/.test(location.search);
  const KEY = 'qryby.return_digest.v1';
  const el = document.getElementById('returnDigest');
  let payload = null;
  let pokazane = false;
  let gotowe = false;

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  function load(){
    try{
      const x=JSON.parse(localStorage.getItem(KEY)||'null');
      return x&&x.v===1&&x.pop&&typeof x.pop==='object'?x:null;
    }catch(e){return null;}
  }

  function save(x){
    if(TEST) return;
    try{localStorage.setItem(KEY,JSON.stringify(x));}catch(e){}
  }

  function snapshot(){
    const pop={};
    try{
      for(const r of Eko.podsumowanie()){
        pop[r.gat]={
          n:Number(r.n)||0,m:Number(r.m)||0,f:Number(r.f)||0,
          max:Number(r.max)||0,wymarly:!!r.wymarly
        };
      }
    }catch(e){}
    return pop;
  }

  function nowState(){
    return {v:1,last_seen:Date.now(),pop:snapshot()};
  }

  function ts(x){
    const n=new Date(x).getTime();
    return isFinite(n)?n:0;
  }

  function ago(t){
    if(!t) return '';
    const ms=Math.max(0,Date.now()-t);
    const min=Math.floor(ms/60000);
    if(min<60) return min<=1?'przed chwilą':min+' min temu';
    const h=Math.floor(min/60);
    if(h<24) return h===1?'1 godz. temu':h+' godz. temu';
    const d=Math.floor(h/24);
    return d===1?'wczoraj':d+' dni temu';
  }

  function nazwa(gk){
    try{return (GATUNKI[gk]&&GATUNKI[gk].nazwa)||String(gk||'').toUpperCase();}
    catch(e){return String(gk||'').toUpperCase();}
  }

  function evt(type,gat,text,sub,importance,when){
    return {
      type:String(type||''),
      gat:String(gat||''),
      text:String(text||''),
      sub:String(sub||''),
      importance:Number(importance)||1,
      when:Number(when)||0
    };
  }

  function zDiff(prev,cur){
    const out=[],all=new Set([...Object.keys(prev||{}),...Object.keys(cur||{})]);
    for(const gk of all){
      const a=prev&&prev[gk],b=cur&&cur[gk];
      if(!a||!b) continue;

      if(a.n>0 && b.n===0){
        out.push(evt('extinct',gk,nazwa(gk)+' wyginął','0 szt. w jeziorze',100,Date.now()));
        continue;
      }
      if((a.n===0||a.wymarly) && b.n>0 && !b.wymarly){
        out.push(evt('reborn',gk,nazwa(gk)+' wrócił do jeziora',
          b.n.toLocaleString('pl-PL')+' szt.',98,Date.now()));
        continue;
      }

      const delta=b.n-a.n;
      const pct=a.n>0?Math.abs(delta)/a.n:0;

      if(delta>=Math.max(10,Math.ceil(a.n*.12))){
        out.push(evt('birth',gk,
          'Populacja '+nazwa(gk)+' wzrosła',
          '+'+delta.toLocaleString('pl-PL')+' · teraz '+b.n.toLocaleString('pl-PL'),
          pct>=.25?82:68,Date.now()));
      }

      if(delta<=-Math.max(3,Math.ceil(a.n*.10))){
        out.push(evt('drop',gk,
          'Populacja '+nazwa(gk)+' spadła',
          delta.toLocaleString('pl-PL')+' · zostało '+b.n.toLocaleString('pl-PL'),
          b.n<=10?95:(pct>=.25?84:70),Date.now()));
      }

      if(a.m>0&&a.f>0&&b.n>0&&(b.m===0||b.f===0)){
        out.push(evt('pair',gk,
          nazwa(gk)+' stracił zdolną do tarła parę',
          '♂ '+b.m+' · ♀ '+b.f,92,Date.now()));
      }
    }
    return out;
  }

  function zKroniki(lastSeen){
    let k=[];const out=[];
    try{k=Eko.Serwer.kronikaWspolna()||[];}catch(e){}
    for(const x of k){
      const when=ts(x.kiedy);
      if(!when||when<=lastSeen) continue;

      if(x.typ==='narybek'){
        out.push(evt('birth',x.gat,
          'Urodziło się '+(Number(x.n)||0).toLocaleString('pl-PL')+' młodych '+nazwa(x.gat),
          x.nick?'dzięki '+String(x.nick).slice(0,16):'',78,when));
      }else if(x.typ==='rzadka-zlowiona'){
        out.push(evt('catch',x.gat,
          (x.nick?String(x.nick).slice(0,16)+' zabrał ':'Zabrano ')+nazwa(x.gat),
          'zostało '+(Number(x.n)||0).toLocaleString('pl-PL')+' szt.',90,when));
      }else if(x.typ==='korekta-admin'){
        /* Korekty administracyjne nie sa "historia swiata" dla gracza. */
        continue;
      }
    }
    return out;
  }

  function dedupe(list){
    const seen=new Set(),out=[];
    for(const x of list.sort((a,b)=>(b.importance-a.importance)||(b.when-a.when))){
      const k=x.type+'|'+x.gat;
      if(seen.has(k)) continue;
      seen.add(k);out.push(x);
    }
    return out.slice(0,3);
  }

  function testPayload(){
    return {
      absence_ms:18*3600000,
      events:[
        evt('birth','ploc','Urodziło się 418 młodych płoci','nowe pokolenie',78,Date.now()-3*3600000),
        evt('drop','lin','Populacja Lina spadła o 18%','zostało 43 szt.',84,Date.now()-5*3600000),
        evt('catch','smokosz','Ktoś zabrał Smokosza','została 1 szt.',95,Date.now()-8*3600000)
      ]
    };
  }

  async function przygotuj(){
    if(!WL||!el||gotowe) return payload;
    gotowe=true;

    if(TEST){
      payload=testPayload();
      return payload;
    }

    const prev=load();

    /* Pierwsza sesja: tylko tworzymy punkt odniesienia. */
    if(!prev){
      save(nowState());
      payload=null;
      return null;
    }

    const absence=Math.max(0,Date.now()-(Number(prev.last_seen)||Date.now()));

    /* Szybkie przeladowanie strony nie jest "powrotem". */
    if(absence<30*60*1000){
      payload=null;
      return null;
    }

    try{
      if(window.Eko&&Eko.Serwer&&Eko.Serwer.dostepny&&Eko.Serwer.dostepny()){
        await Eko.Serwer.pobierz();
        await Eko.Serwer.odswiezKronike(100);
      }
    }catch(e){}

    const cur=snapshot();
    const events=dedupe(
      zDiff(prev.pop||{},cur).concat(zKroniki(Number(prev.last_seen)||0))
    );

    payload=events.length?{absence_ms:absence,events}:null;

    try{
      if(window.Telemetry) Telemetry.event('return_digest_checked',{
        absence_minutes:Math.round(absence/60000),
        event_count:events.length
      });
    }catch(e){}

    return payload;
  }

  function absenceText(ms){
    const h=Math.floor(ms/3600000);
    if(h<24) return h<=1?'po krótkiej przerwie':'po '+h+' godz.';
    const d=Math.floor(h/24);
    return d===1?'po 1 dniu':'po '+d+' dniach';
  }

  function render(){
    if(!payload||!payload.events.length||!el) return false;

    const ico={birth:'🐟',drop:'↓',catch:'🎣',extinct:'○',reborn:'↟',pair:'♡'};
    let h='<div class="rd-kicker">WSPÓLNE JEZIORO</div>'
      +'<h3>Co wydarzyło się, gdy Cię nie było?</h3>'
      +'<div class="rd-time">'+esc(absenceText(payload.absence_ms))+'</div>';

    for(const x of payload.events){
      h+='<div class="rd-row '+esc(x.type)+'">'
        +'<span class="rd-ico">'+(ico[x.type]||'·')+'</span>'
        +'<span class="rd-txt">'+esc(x.text)
        +(x.sub||x.when?'<span class="rd-sub">'+esc(x.sub)
          +(x.when?' · '+esc(ago(x.when)):'')+'</span>':'')
        +'</span></div>';
    }

    h+='<div class="rd-actions">'
      +'<button type="button" data-rd="close">WRÓĆ DO ŁOWIENIA</button>'
      +'<button class="rd-open" type="button" data-rd="eko">ZOBACZ JEZIORO</button>'
      +'</div>';

    el.innerHTML=h;
    el.classList.add('on');
    el.setAttribute('aria-hidden','false');
    document.body.classList.add('return-digest-open');
    pokazane=true;

    try{
      if(window.Telemetry) Telemetry.event('return_digest_shown',{
        event_count:payload.events.length,
        absence_minutes:Math.round(payload.absence_ms/60000),
        types:payload.events.map(x=>x.type).join(',')
      });
    }catch(e){}

    return true;
  }

  function close(action){
    if(!el) return;
    el.classList.remove('on');
    el.setAttribute('aria-hidden','true');
    document.body.classList.remove('return-digest-open');

    try{
      if(window.Telemetry) Telemetry.event('return_digest_dismissed',{
        action:action||'close',
        event_count:payload&&payload.events?payload.events.length:0
      });
    }catch(e){}

    /* Dopiero po przeczytaniu/odrzuceniu zapisujemy nowy baseline.
       Dzięki temu sam refresh nie "pożera" historii. */
    save(nowState());
    pokazane=false;
  }

  function maybeShow(){
    if(!WL||pokazane||!payload||!payload.events.length) return false;
    let onb=false;
    try{onb=!!(window.Onboarding&&Onboarding.aktywny&&Onboarding.aktywny());}catch(e){}
    let gate=false;
    try{gate=!!(window.Progression&&!Progression.dostep('worldDigest'));}catch(e){}
    if(onb||gate) return false;
    return render();
  }

  if(el){
    el.addEventListener('click',e=>{
      const b=e.target.closest('button[data-rd]');
      if(!b) return;
      e.preventDefault();e.stopPropagation();
      if(b.dataset.rd==='eko'){
        close('ecosystem');
        setTimeout(()=>{
          const x=document.getElementById('ekosystem');
          if(x) x.click();
        },40);
      }else close('close');
    });
  }

  /* Snapshot sesji: zapisujemy przy prawdziwym opuszczeniu/ukryciu strony.
     To NIE jest nagroda i niczego nie mutuje na serwerze. */
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden' && !TEST) save(nowState());
  });
  window.addEventListener('pagehide',()=>{ if(!TEST) save(nowState()); });

  if(WL){
    setTimeout(()=>{
      przygotuj().then(()=>{
        setTimeout(maybeShow,900);
      }).catch(()=>{});
    },1200);
  }

  return {
    przygotuj,maybeShow,render,close,
    dane:()=>payload,
    test:()=>{payload=testPayload();gotowe=true;return maybeShow();}
  };
})();
window.ReturnDigest=ReturnDigest;

/* ============================================================
   PRODUCT STAGE 3 — WORLD PULSE.
   Porownuje AUTORYTATYWNY stan wspolnego jeziora z ostatnim stanem,
   ktory ten gracz faktycznie zobaczyl. Do tego doklada publiczna kronike.

   Nie zapisuje nowej historii na serwerze i nie zmienia populacji.
   Pierwsze uruchomienie tylko tworzy punkt odniesienia.
   ============================================================ */
const WorldPulse = (() => {
  const WL = !!(window.Features && Features.is('worldDigest'));
  const TEST = /(?:\?|&)worldtest=1(?:&|$)/.test(location.search);
  const KEY = 'qryby.worldpulse.v1';
  let digest = [];
  let baseline = null;
  let gotowy = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }
  function nazwa(gk) {
    try { return (GATUNKI[gk] && GATUNKI[gk].nazwa) || String(gk || '').toUpperCase(); }
    catch (e) { return String(gk || '').toUpperCase(); }
  }
  function load() {
    try {
      const x = JSON.parse(localStorage.getItem(KEY) || 'null');
      return x && x.v === 1 && x.pop && typeof x.pop === 'object' ? x : null;
    } catch (e) { return null; }
  }
  function save(x) {
    try { localStorage.setItem(KEY, JSON.stringify(x)); } catch (e) {}
  }
  function snapshot() {
    const map = {};
    try {
      for (const r of Eko.podsumowanie()) {
        map[r.gat] = {
          n:Number(r.n)||0, m:Number(r.m)||0, f:Number(r.f)||0,
          max:Number(r.max)||0, wymarly:!!r.wymarly
        };
      }
    } catch (e) {}
    return map;
  }
  function ts(x) {
    const t = new Date(x).getTime();
    return isFinite(t) ? t : 0;
  }
  function ago(t) {
    if (!t) return '';
    const ms = Math.max(0, Date.now() - t);
    const h = Math.floor(ms / 3600000);
    if (h < 1) return 'przed chwilą';
    if (h < 24) return h + ' godz. temu';
    const d = Math.floor(h / 24);
    return d === 1 ? 'wczoraj' : d + ' dni temu';
  }

  function event(type, gk, text, when, importance, sub) {
    return { type, gat:gk || '', text:String(text||''), when:Number(when)||0,
             importance:Number(importance)||1, sub:String(sub||'') };
  }

  function kronikaOd(lastSeen) {
    const out = [];
    let k = [];
    try { k = Eko.Serwer.kronikaWspolna() || []; } catch (e) {}
    for (const x of k) {
      const kiedy = ts(x.kiedy);
      if (!kiedy || kiedy <= lastSeen) continue;
      if (x.typ === 'narybek') {
        out.push(event(
          'birth', x.gat,
          '+' + (Number(x.n)||0).toLocaleString('pl-PL') + ' młodych ' + nazwa(x.gat),
          kiedy, 75,
          x.nick ? 'dzięki ' + String(x.nick).slice(0,16) : ''
        ));
      } else if (x.typ === 'rzadka-zlowiona') {
        out.push(event(
          'catch', x.gat,
          (x.nick ? String(x.nick).slice(0,16) + ' zabrał ' : 'Zabrano ') + nazwa(x.gat),
          kiedy, 88,
          'zostało ' + (Number(x.n)||0).toLocaleString('pl-PL') + ' szt.'
        ));
      }
    }
    return out;
  }

  function diff(prev, cur) {
    const out = [];
    const all = new Set([...Object.keys(prev || {}), ...Object.keys(cur || {})]);
    for (const gk of all) {
      const a = prev && prev[gk] ? prev[gk] : null;
      const b = cur && cur[gk] ? cur[gk] : null;
      if (!a || !b) continue;

      if (a.n > 0 && b.n === 0) {
        out.push(event('extinct', gk, nazwa(gk) + ' wyginął w tym jeziorze', Date.now(), 100));
        continue;
      }
      if ((a.n === 0 || a.wymarly) && b.n > 0 && !b.wymarly) {
        out.push(event('reborn', gk, nazwa(gk) + ' wrócił do jeziora', Date.now(), 98,
                       b.n.toLocaleString('pl-PL') + ' szt.'));
        continue;
      }

      const spadek = a.n - b.n;
      const proc = a.n > 0 ? spadek / a.n : 0;
      const historyczna = b.max > 0 ? b.n / b.max : 1;

      /* Pokazujemy tylko realny trend, nie kazde -1. */
      if (spadek >= Math.max(3, Math.ceil(a.n * .10)) &&
          (proc >= .10 || historyczna <= .45)) {
        out.push(event(
          'drop', gk,
          'Populacja ' + nazwa(gk) + ' spadła o ' + Math.round(proc * 100) + '%',
          Date.now(), historyczna <= .15 ? 94 : 72,
          b.n.toLocaleString('pl-PL') + ' szt. w jeziorze'
        ));
      }

      if (a.m > 0 && a.f > 0 && b.n > 0 && (b.m === 0 || b.f === 0)) {
        out.push(event(
          'pair', gk,
          nazwa(gk) + ' stracił zdolną do tarła parę',
          Date.now(), 92,
          '♂ ' + b.m + ' · ♀ ' + b.f
        ));
      }
    }
    return out;
  }

  function dedupe(list) {
    const seen = new Set(), out = [];
    for (const x of list.sort((a,b) => (b.importance-a.importance) || (b.when-a.when))) {
      /* narodziny z kroniki wygrywaja nad samym wzrostem populacji;
         dla tego samego gatunku+typu pokazujemy tylko najmocniejszy wpis. */
      const k = x.type + '|' + x.gat;
      if (seen.has(k)) continue;
      seen.add(k); out.push(x);
    }
    return out.slice(0,3);
  }

  function fake(cur) {
    const keys = Object.keys(cur || {});
    const g1 = cur.smokosz ? 'smokosz' : (keys[0] || '');
    const g2 = cur.zolw_blotny ? 'zolw_blotny' : (keys[1] || g1);
    const g3 = keys.find(k => k !== g1 && k !== g2) || g1;
    return [
      event('birth',g3,'+214 młodych ' + nazwa(g3),Date.now()-3600000,75,'nowe pokolenie'),
      event('drop',g2,'Populacja ' + nazwa(g2) + ' spadła o 18%',Date.now()-7200000,72,'5 szt. w jeziorze'),
      event('catch',g1,'Ktoś zabrał ' + nazwa(g1),Date.now()-10800000,88,'została ostatnia sztuka')
    ];
  }

  async function odswiez() {
    if (!WL || !window.Eko || !Eko.Serwer) return [];
    if (window.Progression && !Progression.dostep('worldDigest')) {
      digest=[]; gotowy=true; return digest;
    }
    try {
      if (Eko.Serwer.dostepny()) {
        await Eko.Serwer.pobierz();
        await Eko.Serwer.odswiezKronike(100);
      }
    } catch (e) {}

    const cur = snapshot();
    baseline = load();

    if (TEST) {
      digest = fake(cur);
      gotowy = true;
      return digest;
    }

    if (!baseline) {
      /* Zero wymyslonej historii przy pierwszym kontakcie. */
      baseline = { v:1, seen_at:Date.now(), pop:cur };
      save(baseline);
      digest = [];
      gotowy = true;
      return digest;
    }

    const events = diff(baseline.pop || {}, cur)
      .concat(kronikaOd(Number(baseline.seen_at)||0));

    digest = dedupe(events);
    gotowy = true;
    return digest;
  }

  function html() {
    const pid = 'eko' + 'WorldPulse';
    if (window.Progression && !Progression.dostep('worldDigest')) {
      return '<div id="' + pid + '"><div class="prog-lock-line">POZIOM 10 · odblokuje „co zmieniło się od ostatniej wizyty”</div></div>';
    }
    if (!WL || !gotowy || !digest.length) return '<div id="' + pid + '"></div>';
    let h = '<div id="' + pid + '"><div class="wp-card">'
      + '<div class="wp-head"><span>OD OSTATNIEJ WIZYTY</span><i>WSPÓLNE JEZIORO</i></div>';
    const ico = { birth:'🐟', catch:'🎣', extinct:'○', reborn:'↟', drop:'↓', pair:'♡' };
    for (const x of digest) {
      h += '<div class="wp-row ' + esc(x.type) + '">'
        + '<span class="wp-ico">' + (ico[x.type] || '·') + '</span>'
        + '<span class="wp-txt">' + esc(x.text)
        + (x.sub ? '<span class="wp-sub">' + esc(x.sub) + (x.when ? ' · ' + esc(ago(x.when)) : '') + '</span>' : '')
        + '</span></div>';
    }
    h += '</div></div>';
    return h;
  }

  function potwierdz() {
    if (!WL || TEST) return;
    const cur = snapshot();
    baseline = { v:1, seen_at:Date.now(), pop:cur };
    save(baseline);
    digest = [];
  }

  function telemetryShown() {
    if (!digest.length || !window.Telemetry) return;
    try {
      Telemetry.event('world_digest_shown', {
        event_count:digest.length,
        extinct:digest.filter(x=>x.type==='extinct').length,
        births:digest.filter(x=>x.type==='birth').length,
        rare_catches:digest.filter(x=>x.type==='catch').length
      });
    } catch (e) {}
  }

  /* Przygotowujemy bufor w tle, ale NIE oznaczamy go jako przeczytany. */
  if (WL) setTimeout(() => { odswiez().catch(()=>{}); }, 900);

  return { odswiez, html, potwierdz, telemetryShown, lista:()=>digest.slice(), gotowy:()=>gotowy };
})();
window.WorldPulse = WorldPulse;

</script>
